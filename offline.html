<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5bbfa0">
  <title>Offline · Runae</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root { --jade:#5bbfa0; --jade-deep:#3f8f76; --gold:#c9a84c; --cream:#faf8f5; --ink:#2c3a35; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100dvh; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 18%, rgba(91,191,160,0.18), transparent 60%),
        var(--cream);
      -webkit-font-smoothing: antialiased;
    }
    .card { text-align: center; max-width: 360px; }
    .mark {
      width: 88px; height: 88px; margin: 0 auto 22px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 24px;
      background: linear-gradient(140deg, #6fcfb0, #4aa98c);
      box-shadow: 0 10px 30px rgba(63,143,118,0.28);
      color: var(--gold);
      font-family: "Songti SC","STSong","Noto Serif SC",serif;
      font-size: 52px; font-weight: 700; line-height: 1;
    }
    h1 { font-size: 22px; margin: 0 0 10px; letter-spacing: .2px; }
    p { font-size: 15px; line-height: 1.6; color: #5a6a63; margin: 0 0 26px; }
    button {
      appearance: none; border: 0; cursor: pointer;
      padding: 13px 30px; border-radius: 999px;
      font-size: 15px; font-weight: 600; color: #fff;
      background: linear-gradient(135deg, var(--jade), var(--jade-deep));
      box-shadow: 0 6px 18px rgba(63,143,118,0.30);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    button:active { transform: translateY(1px); box-shadow: 0 3px 10px rgba(63,143,118,0.30); }
    .hint { margin-top: 18px; font-size: 12.5px; color: #9aa8a2; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">缘</div>
    <h1>You're offline</h1>
    <p>The stars are still there — we just can't reach them right now. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <div class="hint">Runae · Eastern Astrology &amp; Self-Discovery</div>
  </main>
</body>
</html>
