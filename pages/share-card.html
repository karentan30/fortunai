<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  /* ── cosmos ── */
  --void-0:#08040f;--void:#0f0820;--indigo:#1a1035;--indigo-2:#231545;
  /* ── gold ── */
  --gold-hi:#f4e6b6;--gold:#dcc082;--gold-deep:#9a7530;--gold-soft:#e8d49c;
  --gold-line:rgba(220,192,130,.26);--gold-line-2:rgba(220,192,130,.48);--gold-glow:rgba(220,192,130,.4);
  /* ── violet accent ── */
  --star:#d3b6ff;--star-soft:#b492ea;--violet-line:rgba(176,120,255,.28);--violet-line-2:rgba(176,120,255,.48);--violet-glow:rgba(176,120,255,.5);
  /* ── text ── */
  --text-cream:#efeafa;--text-mute:#b0a6cf;--text-faint:#867ba6;--text-ghost:#5f5680;
  /* ── hair ── */
  --hair:rgba(206,190,255,.09);--hair-2:rgba(206,190,255,.16);
  --shadow-card:0 30px 60px -30px rgba(0,0,0,.9);--shadow-lift:0 20px 40px -24px rgba(0,0,0,.78);
  --serif:"Noto Serif SC",serif;--lat:"Cormorant Garamond",serif;
}

html,body{
  background:var(--void-0);
  font-family:var(--serif);
  color:var(--text-cream);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-height:100vh;
}

/* ── cosmos starfield background ── */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(135% 80% at 50% -8%,#3a2070 0%,#1e1040 38%,#100a20 72%,var(--void-0) 100%)
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.7;
  background-image:
    radial-gradient(circle,rgba(236,223,255,.65) 1px,transparent 1px),
    radial-gradient(circle,rgba(244,230,182,.35) 1px,transparent 1px),
    radial-gradient(circle,rgba(211,182,255,.4) 1px,transparent 1px);
  background-size:130px 130px,90px 90px,170px 170px;
  background-position:18px 22px,65px 44px,32px 85px
}

/* ── layout shell ── */
body{
  display:flex;flex-direction:column;align-items:center;
  padding:32px 16px calc(48px + env(safe-area-inset-bottom,0px));
  position:relative;z-index:1;
}

/* ─────────── SHARE CARD (3:4) ─────────── */
.card-wrap{width:100%;max-width:360px;position:relative}

.card{
  position:relative;width:100%;
  aspect-ratio:3/4;height:auto;
  background:linear-gradient(180deg,var(--indigo-2) 0%,var(--indigo) 55%,var(--void) 100%);
  border-radius:22px;overflow:hidden;
  border:1px solid var(--gold-line-2);
  box-shadow:var(--shadow-card),0 0 0 1px rgba(220,192,130,.06),inset 0 1px 0 rgba(220,192,130,.12);
  padding:28px 24px 24px;
  display:flex;flex-direction:column;
}

/* subtle starfield inside the card */
.card::before{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:
    radial-gradient(circle,rgba(236,223,255,.6) 1px,transparent 1px),
    radial-gradient(circle,rgba(244,230,182,.3) 1px,transparent 1px);
  background-size:90px 90px,65px 65px;
  background-position:12px 16px,44px 34px;
}

/* gold corner ornaments */
.card-corner{position:absolute;width:44px;height:44px;pointer-events:none;z-index:1}
.card-corner-tl{top:14px;left:14px;border-top:1px solid rgba(220,192,130,.45);border-left:1px solid rgba(220,192,130,.45)}
.card-corner-br{bottom:14px;right:14px;border-bottom:1px solid rgba(220,192,130,.45);border-right:1px solid rgba(220,192,130,.45)}

/* inner content sits above pseudo layers */
.card > *:not(.card-corner){position:relative;z-index:2}

/* element seal top-right */
.card-seal{
  position:absolute;top:18px;right:18px;z-index:3;
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,var(--indigo-2),var(--void));
  border:1px solid var(--gold-line-2);
  color:var(--gold-soft);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;
  box-shadow:0 0 12px var(--gold-glow),inset 0 1px 0 rgba(220,192,130,.15);
  font-family:var(--serif);font-weight:500;
}

/* ── header ── */
.card-header{display:flex;flex-direction:column;gap:0}
.card-brand{display:flex;align-items:center;gap:8px}
.brand-mark{
  font-size:16px;color:var(--gold-soft);
  text-shadow:0 0 8px var(--gold-glow);
}
.brand-name{
  font-family:var(--serif);font-size:15px;font-weight:500;
  letter-spacing:.36em;color:var(--gold-soft);
}
.brand-en{
  font-family:var(--lat);font-style:italic;
  font-size:10px;letter-spacing:.28em;
  color:rgba(220,192,130,.5);margin-top:3px;
}

/* hairline */
.hairline{
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-line-2),transparent);
  margin:13px 0 0;
}

/* ── who ── */
.card-for{
  font-size:10px;letter-spacing:.18em;
  color:var(--text-faint);margin-top:10px;
  font-family:var(--lat);
}
.card-for b{color:var(--gold-soft);font-style:normal;font-family:var(--serif);font-weight:400}

/* ── main highlight ── */
.card-body{
  flex:1;display:flex;flex-direction:column;
  justify-content:center;text-align:center;
  padding:8px 0 4px;
}
.mg-label{
  font-family:var(--lat);font-style:italic;
  font-size:10px;letter-spacing:.32em;
  color:rgba(220,192,130,.6);margin-bottom:8px;
}
.mg-title{
  font-family:var(--serif);font-size:22px;font-weight:400;
  letter-spacing:.18em;line-height:1.35;
  color:var(--text-cream);
  text-shadow:0 2px 20px rgba(176,120,255,.2);
}
.mg-title .em{
  color:var(--gold-soft);
  text-shadow:0 0 16px var(--gold-glow);
}
.mg-divider{
  width:36px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-line-2),transparent);
  margin:12px auto;
}
.mg-sub{
  font-size:11px;letter-spacing:.04em;
  color:var(--text-mute);line-height:1.85;
  padding:0 4px;
}

/* ── score chips ── */
.chips{display:flex;justify-content:center;gap:8px;margin-top:14px}
.chip{
  flex:1;max-width:96px;
  background:linear-gradient(180deg,rgba(35,21,69,.9),rgba(26,16,53,.95));
  border:1px solid var(--hair-2);
  border-radius:12px;
  padding:9px 4px 8px;text-align:center;
  box-shadow:inset 0 1px 0 rgba(220,192,130,.07);
  transition:border-color .2s;
}
.chip-val{
  font-family:var(--lat);font-size:22px;font-weight:500;
  color:var(--gold-soft);line-height:1;
}
.chip-val small{font-size:11px;color:var(--star-soft)}
.chip-label{
  font-size:8.5px;letter-spacing:.1em;
  color:var(--text-ghost);margin-top:4px;
  font-family:var(--lat);
}

/* ── footer: invite + qr ── */
.card-footer{
  display:flex;align-items:center;gap:12px;
  margin-top:12px;padding-top:12px;
  border-top:1px solid var(--gold-line);
}
.qr-box{
  width:64px;height:64px;flex-shrink:0;
  border-radius:8px;
  background:#fff;
  border:1px solid rgba(220,192,130,.2);
  padding:4px;
  box-shadow:0 0 10px rgba(220,192,130,.12),0 2px 6px rgba(0,0,0,.3);
}
.qr-box img,.qr-box svg,.qr-box canvas{
  width:100%!important;height:100%!important;display:block;border-radius:3px;
  image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;
}
.foot-txt{flex:1;min-width:0}
.foot-invite{
  font-size:9px;letter-spacing:.16em;
  color:var(--text-ghost);font-family:var(--lat);
}
.foot-code{
  font-family:var(--lat);font-size:18px;
  letter-spacing:.12em;color:var(--gold-soft);
  font-weight:400;margin-top:2px;
  text-shadow:0 0 10px var(--gold-glow);
}
.foot-cta{
  font-size:9.5px;letter-spacing:.04em;
  color:var(--text-faint);margin-top:3px;
  line-height:1.5;
}
.foot-cta b{color:var(--gold-soft);font-weight:500}

/* ── watermark ── */
.card-mark{
  text-align:center;
  font-size:8.5px;letter-spacing:.14em;
  color:rgba(134,123,166,.6);
  margin-top:10px;line-height:1.6;
  font-family:var(--lat);
}
.card-mark .slogan{
  color:rgba(220,192,130,.4);font-style:italic;
  letter-spacing:.22em;
}

/* ─────────── controls (not captured) ─────────── */
.controls{width:100%;max-width:360px;margin-top:24px}

.btn{
  display:block;width:100%;padding:16px 0;border:none;
  border-radius:50px;
  font-family:var(--serif);font-size:14px;letter-spacing:.2em;cursor:pointer;
  background:linear-gradient(135deg,var(--gold-deep),var(--gold),var(--gold-hi));
  color:#100820;font-weight:700;
  box-shadow:0 6px 24px var(--gold-glow),0 2px 6px rgba(0,0,0,.4);
  transition:transform .15s,box-shadow .15s,opacity .15s;
  position:relative;overflow:hidden;
}
.btn::after{
  content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
  transform:skewX(-18deg);animation:btnSheen 3.8s ease-in-out infinite;
}
@keyframes btnSheen{0%,70%{left:-60%}86%,100%{left:130%}}
.btn:active{transform:translateY(1px);box-shadow:0 3px 12px var(--gold-glow)}
.btn[disabled]{opacity:.55;cursor:progress}
.btn[disabled]::after{display:none}

.hint{
  text-align:center;font-size:11px;letter-spacing:.06em;
  color:var(--text-ghost);margin-top:12px;min-height:16px;
  transition:opacity .3s,color .3s;
}
.hint.show{color:var(--gold-soft)}

/* ── responsive ── */
@media(max-width:375px){
  .card{padding:22px 18px 20px}
  .mg-title{font-size:20px}
  .chips{gap:5px}
  .chip-val{font-size:19px}
}
</style>

<body>

<div class="card-wrap">
  <!-- ===== CAPTURED CARD ===== -->
  <div class="card" id="card">
    <!-- corner ornaments -->
    <div class="card-corner card-corner-tl"></div>
    <div class="card-corner card-corner-br"></div>

    <div class="card-seal" id="seal">火</div>

    <div class="card-header">
      <div class="card-brand">
        <span class="brand-mark">☯</span>
        <span class="brand-name">善缘</span>
      </div>
      <div class="brand-en">ShenYuan · Destiny Reading</div>
    </div>

    <div class="hairline"></div>

    <div class="card-for">为 <b id="who">有缘人</b> 揭示的命理亮点</div>

    <div class="card-body">
      <div class="mg-label" id="mgLabel">命 格</div>
      <div class="mg-title" id="mgTitle">玉韫珠辉<br><span class="em">待时而发</span></div>
      <div class="mg-divider"></div>
      <div class="mg-sub" id="mgSub">金水藏辉，静水流深。<br>今岁运势渐启，宜守正待时，逢缘则发。</div>

      <div class="chips" id="chips">
        <div class="chip"><div class="chip-val" id="c1v">72<small>分</small></div><div class="chip-label" id="c1l">今年财运</div></div>
        <div class="chip"><div class="chip-val" id="c2v">87</div><div class="chip-label" id="c2l">正缘兼容</div></div>
        <div class="chip"><div class="chip-val" id="c3v">吉</div><div class="chip-label" id="c3l">流年综述</div></div>
      </div>
    </div>

    <div class="card-footer">
      <div class="qr-box" id="qrBox"><img id="qrImg" alt="邀请二维码"></div>
      <div class="foot-txt">
        <div class="foot-invite">邀请码 · Invite Code</div>
        <div class="foot-code" id="refCode">SY·8888</div>
        <div class="foot-cta">扫码测你的命理 · <b>新缘礼遇</b></div>
      </div>
    </div>

    <div class="card-mark">
      善缘 ShenYuan · 命理内容仅供参考<br>
      <span class="slogan">你求什么 · 自有天机</span>
    </div>
  </div>
  <!-- ===== /CAPTURED CARD ===== -->
</div>

<div class="controls">
  <button class="btn" id="saveBtn" onclick="exportCard()">保 存 分 享 图</button>
  <div class="hint" id="hint">生成后长按图片即可保存 / 分享</div>
</div>

<script>
/* ---------- data injection via URL params ---------- */
(function(){
  var p = new URLSearchParams(location.search);
  var set = function(id, v){ if(v!=null){ var el=document.getElementById(id); if(el) el.textContent=v; } };

  set('who', p.get('name'));
  // highlight: "命格标题" — support "|" to split two lines, "·" kept as-is
  var hl = p.get('highlight');
  if(hl){
    var parts = hl.split('|');
    document.getElementById('mgTitle').innerHTML =
      parts.length>1 ? (parts[0]+'<br><span class="em">'+parts[1]+'</span>')
                     : ('<span class="em">'+parts[0]+'</span>');
  }
  set('mgLabel', p.get('label'));
  set('mgSub', p.get('sub'));

  // three chips: score / love / year  (val + optional label via *_l)
  var chip = function(vid,lid, pv, pl, unit){
    var v=p.get(pv);
    if(v!=null){ document.getElementById(vid).innerHTML = v + (unit?'<small>'+unit+'</small>':''); }
    var l=p.get(pl); if(l!=null) document.getElementById(lid).textContent=l;
  };
  chip('c1v','c1l','score','score_l','分');
  chip('c2v','c2l','love','love_l');
  chip('c3v','c3l','year','year_l');

  var refCode = p.get('ref') || 'SY8888';
  set('refCode', refCode);
  var seal=p.get('seal'); if(seal!=null) document.getElementById('seal').textContent=seal;

  // ---- REAL QR: encodes the invite link so scanning opens the referral page ----
  buildRealQR(document.getElementById('qrBox'), refCode);
})();

// Build a genuinely-scannable QR encoding the full invite URL. Rendered fully
// client-side to a same-origin data-URL, so html2canvas never taints the export.
function buildRealQR(box, ref){
  var origin = location.origin && location.origin !== 'null'
             ? location.origin
             : 'https://runae.app';   // fallback for file:// / null origin
  var url = origin + '/pages/invite.html?ref=' + encodeURIComponent(ref);
  var qimg = document.getElementById('qrImg');
  try {
    // 1) Render QR into an offscreen holder at high native res.
    var holder=document.createElement('div');
    new QRCode(holder, {
      text: url,
      width: 300,
      height: 300,
      colorDark: '#1f6f5b',      // jade-deep, on-brand yet high-contrast
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H  // 30% error correction — robust to scaling/compression
    });
    var src = holder.querySelector('canvas');
    // qrcodejs draws with NO quiet zone; QR spec needs a ~4-module white margin to
    // stay scannable after downscaling. Re-composite onto a padded white canvas so
    // both phones and the exported PNG can decode it.
    var qr=src.width;                       // 300
    var quiet=Math.round(qr/25*4);          // ~4 modules of margin
    var out=document.createElement('canvas');
    out.width=out.height=qr+quiet*2;
    var octx=out.getContext('2d');
    octx.imageSmoothingEnabled=false;
    octx.fillStyle='#ffffff'; octx.fillRect(0,0,out.width,out.height);
    octx.drawImage(src, quiet, quiet);
    var dataURL = out.toDataURL('image/png');   // same-origin data-URL → no CORS taint
    // Assign to a pre-existing <img> in the markup (html2canvas reliably clones &
    // re-fetches declared <img> srcs) AND set it as the box background-image as a
    // belt-and-suspenders fallback — one of the two always survives export.
    qimg.src = dataURL;
    box.style.backgroundImage = 'url("'+dataURL+'")';
    box.style.backgroundSize = 'calc(100% - 8px) calc(100% - 8px)';
    box.style.backgroundPosition = 'center';
    box.style.backgroundRepeat = 'no-repeat';
    box.setAttribute('data-qr-url', url);
  } catch(e){
    // If the QR lib fails to load, degrade gracefully to a scannable image API.
    if(qimg){ qimg.crossOrigin='anonymous'; qimg.src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&qzone=2&color=1f6f5b&data='+encodeURIComponent(url); }
    box.setAttribute('data-qr-url', url);
    console.warn('QRCode lib unavailable, fell back to image API', e);
  }
}

/* ---------- export via html2canvas ---------- */
// Wait for web fonts so we never capture a fallback-font (unstyled) frame.
function fontsReady(){
  if(document.fonts && document.fonts.ready){
    return Promise.race([
      document.fonts.ready,
      new Promise(function(r){ setTimeout(r, 2500); }) // hard cap so we never hang
    ]);
  }
  return Promise.resolve();
}

function exportCard(){
  var btn=document.getElementById('saveBtn'), hint=document.getElementById('hint');
  if(btn.disabled) return;
  btn.disabled=true; var old=btn.textContent; btn.textContent='生成中…';
  hint.textContent='正在生成高清分享图…'; hint.className='hint show';

  // Pin the card to a fixed 360px design width during capture so EVERY device
  // exports an identical, pixel-clean 3:4 image with nothing clipped — regardless
  // of the phone's actual screen width. Restored immediately after.
  var wrap=document.querySelector('.card-wrap');
  var savedW=wrap.style.width, savedMax=wrap.style.maxWidth;
  wrap.style.width='360px'; wrap.style.maxWidth='360px';

  var restore=function(){ wrap.style.width=savedW; wrap.style.maxWidth=savedMax; };

  fontsReady().then(function(){
    // let layout settle at the pinned width before capturing
    return new Promise(function(r){ setTimeout(r, 60); });
  }).then(function(){
    return html2canvas(document.getElementById('card'), {
      scale: Math.max(2, Math.min(3, window.devicePixelRatio || 2)), // crisp for 小红书
      backgroundColor: '#ffffff',   // solid bg — iOS Safari mishandles null
      useCORS:true,
      allowTaint:false,
      logging:false,
      imageTimeout: 4000
    });
  }).then(function(canvas){
    var url = canvas.toDataURL('image/png');
    var ref=(document.getElementById('refCode').textContent||'shenyuan').replace(/[^\w]/g,'');
    var a=document.createElement('a');
    a.download='善缘战报_'+ref+'.png';
    a.href=url; document.body.appendChild(a); a.click(); a.remove();
    hint.textContent='已生成！长按图片可保存 / 分享到小红书·朋友圈';
    hint.className='hint show';
  }).catch(function(e){
    hint.textContent='生成失败，请重试'; hint.className='hint';
    console.error(e);
  }).finally(function(){
    restore();
    btn.disabled=false; btn.textContent=old;
  });
}
</script>
