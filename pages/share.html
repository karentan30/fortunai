<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  /* ── cosmos ── */
  --void-0:#08040f;--void:#0f0820;--indigo:#1a1035;--indigo-2:#231545;
  /* ── gold ── */
  --gold-hi:#f4e6b6;--gold:#dcc082;--gold-deep:#9a7530;--gold-soft:#e8d49c;
  --gold-line:rgba(220,192,130,.26);--gold-line-2:rgba(220,192,130,.48);--gold-glow:rgba(220,192,130,.4);
  /* ── violet accent ── */
  --star:#d3b6ff;--star-soft:#b492ea;--violet-line:rgba(176,120,255,.28);--violet-line-2:rgba(176,120,255,.48);--violet-glow:rgba(176,120,255,.5);
  /* ── text ── */
  --text-cream:#efeafa;--text-mute:#b0a6cf;--text-faint:#867ba6;--text-ghost:#5f5680;
  /* ── hair ── */
  --hair:rgba(206,190,255,.09);--hair-2:rgba(206,190,255,.16);
  --shadow-card:0 30px 60px -30px rgba(0,0,0,.9);--shadow-lift:0 20px 40px -24px rgba(0,0,0,.78);
  --serif:"Noto Serif SC",serif;--lat:"Cormorant Garamond",serif;

  /* backward compat jade colours – used only by SVG radar */
  --jade-main:#5bbfa0;--jade-mid:#8dd9bf;--jade-deep:#3d9e82;--jade-bright:#c8f0e0;
}

html,body{
  background:var(--void-0);
  font-family:var(--serif);
  color:var(--text-cream);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  min-height:100%;
}

body{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:0 0 env(safe-area-inset-bottom,24px);
}

/* ── cosmos background ── */
body::before{
  content:'';
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(135% 80% at 50% -8%,#3a2070 0%,#1e1040 38%,#100a20 72%,var(--void-0) 100%)
}
body::after{
  content:'';
  position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.7;
  background-image:
    radial-gradient(circle,rgba(236,223,255,.65) 1px,transparent 1px),
    radial-gradient(circle,rgba(244,230,182,.35) 1px,transparent 1px),
    radial-gradient(circle,rgba(211,182,255,.4) 1px,transparent 1px);
  background-size:130px 130px,90px 90px,170px 170px;
  background-position:18px 22px,65px 44px,32px 85px
}

/* ── Page header ── */
.page-header{
  width:100%;max-width:480px;
  display:flex;align-items:center;justify-content:space-between;
  padding:clamp(16px,5vw,28px) 20px 12px;
  position:relative;z-index:2;
}

.back-btn{
  background:none;border:none;
  font-family:var(--lat);font-style:italic;
  font-size:14px;color:rgba(220,192,130,.7);
  letter-spacing:.08em;cursor:pointer;padding:6px 0;
  transition:color .2s;
}
.back-btn:active{color:var(--gold)}

.header-label{
  font-family:var(--lat);
  font-size:10px;letter-spacing:.36em;
  color:var(--text-ghost);text-transform:uppercase;
}

/* ── Card wrapper ── */
.card-wrap{
  width:100%;max-width:400px;
  padding:0 16px;
  position:relative;z-index:1;
  animation:rpFadeUp .7s .1s ease both;
}

/* ── THE SHARE CARD ── */
.share-card{
  width:100%;
  border-radius:22px;
  overflow:hidden;
  position:relative;
  background:linear-gradient(180deg,var(--indigo-2),var(--indigo));
  border:1px solid var(--gold-line);
  box-shadow:var(--shadow-card),0 0 0 1px var(--hair);
}

/* Gold shimmer top accent */
.share-card::after{
  content:'';
  position:absolute;top:0;left:10%;right:10%;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-line-2),var(--gold-hi),var(--gold-line-2),transparent);
}

/* Inner violet glow */
.share-card::before{
  content:'';
  position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(176,120,255,.12) 0%,transparent 55%),
    radial-gradient(ellipse at 100% 100%,rgba(220,192,130,.06) 0%,transparent 45%);
}

.card-body{
  position:relative;z-index:1;
  padding:32px 24px 28px;
  display:flex;flex-direction:column;align-items:center;
}

/* ── Card logo ── */
.card-logo{
  font-family:var(--lat);font-style:italic;
  font-size:10px;letter-spacing:.42em;
  color:rgba(220,192,130,.5);
  margin-bottom:24px;
}

/* ── Cosmos orb (replaces jade clasp) ── */
.card-orb{
  position:relative;
  width:72px;height:72px;
  border-radius:50%;
  background:
    radial-gradient(circle at 33% 26%,rgba(255,255,255,.18) 0%,rgba(255,255,255,.04) 12%,transparent 22%),
    radial-gradient(ellipse at 50% 50%,var(--star-soft) 0%,#6a3cb0 38%,#2e1060 70%,var(--void) 100%);
  box-shadow:
    0 0 0 1px var(--violet-line-2),
    0 8px 32px rgba(130,60,255,.45),
    0 2px 10px rgba(0,0,0,.5),
    inset 0 -4px 14px rgba(0,0,0,.4);
  margin-bottom:20px;flex-shrink:0;
  animation:orbBreathe 4s ease-in-out infinite;
}
.card-orb::after{
  content:'✦';
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:20px;color:var(--gold-soft);
  text-shadow:0 0 12px var(--gold-glow);
  animation:orbGlyph 6s linear infinite;
}
@keyframes orbBreathe{
  0%,100%{box-shadow:0 0 0 1px var(--violet-line-2),0 8px 32px rgba(130,60,255,.45),0 2px 10px rgba(0,0,0,.5),inset 0 -4px 14px rgba(0,0,0,.4)}
  50%{box-shadow:0 0 0 1px var(--violet-line-2),0 12px 44px rgba(150,80,255,.65),0 3px 16px rgba(0,0,0,.4),inset 0 -4px 14px rgba(0,0,0,.4)}
}
@keyframes orbGlyph{
  0%{transform:translate(-50%,-50%) rotate(0deg) scale(1);opacity:.8}
  50%{transform:translate(-50%,-50%) rotate(180deg) scale(1.12);opacity:1}
  100%{transform:translate(-50%,-50%) rotate(360deg) scale(1);opacity:.8}
}

/* ── Name + birth ── */
.card-name{
  font-family:var(--serif);
  font-size:22px;font-weight:300;
  letter-spacing:.22em;
  color:var(--text-cream);
  margin-bottom:6px;
  text-shadow:0 2px 18px rgba(176,120,255,.2);
}
.card-birth{
  font-family:var(--lat);font-style:italic;
  font-size:12px;letter-spacing:.18em;
  color:rgba(220,192,130,.6);
  margin-bottom:26px;
}

/* ── Gold divider ── */
.card-divider{
  width:100%;display:flex;align-items:center;gap:12px;
  margin-bottom:22px;
}
.card-divider::before,.card-divider::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-line-2));
}
.card-divider::after{
  background:linear-gradient(90deg,var(--gold-line-2),transparent);
}
.card-divider span{
  font-family:var(--lat);font-style:italic;
  font-size:10px;letter-spacing:.28em;
  color:rgba(220,192,130,.5);white-space:nowrap;
}

/* ── Five element radar ── */
.radar-wrap{
  width:160px;height:160px;
  margin-bottom:22px;
  position:relative;flex-shrink:0;
}
.radar-label{
  position:absolute;
  font-family:var(--serif);
  font-size:11px;letter-spacing:.06em;
  color:var(--text-mute);white-space:nowrap;
}
.radar-label.top   {top:-20px;left:50%;transform:translateX(-50%)}
.radar-label.tr    {top:20%;right:-24px}
.radar-label.br    {bottom:20%;right:-24px}
.radar-label.bl    {bottom:20%;left:-24px}
.radar-label.tl    {top:20%;left:-24px}

/* ── Insight rows ── */
.insights{
  width:100%;
  display:flex;flex-direction:column;gap:10px;
  margin-bottom:22px;
}
.insight-row{display:flex;align-items:flex-start;gap:12px}
.insight-icon{
  width:32px;height:32px;border-radius:50%;
  background:rgba(176,120,255,.1);
  border:1px solid var(--violet-line);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  font-family:var(--serif);font-size:13px;
  color:var(--star-soft);font-weight:300;
}
.insight-text{flex:1;padding-top:2px}
.insight-label{
  font-family:var(--lat);
  font-size:9px;letter-spacing:.22em;
  color:var(--gold);margin-bottom:3px;opacity:.75;text-transform:uppercase;
}
.insight-value{
  font-size:12px;color:var(--text-mute);
  letter-spacing:.04em;line-height:1.6;
}

/* ── Fate score ── */
.fate-score-wrap{
  width:100%;padding:14px 0;
  border-top:1px solid var(--gold-line);
  border-bottom:1px solid var(--gold-line);
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:22px;
}
.fate-score-label{
  font-family:var(--lat);font-size:10px;
  letter-spacing:.2em;color:var(--text-faint);
}
.fate-score-bar{
  flex:1;margin:0 14px;height:3px;
  background:var(--hair);border-radius:2px;overflow:hidden;
}
.fate-score-fill{
  height:100%;border-radius:2px;
  background:linear-gradient(90deg,var(--star-soft),var(--gold-soft));
  width:var(--pct,78%);
  box-shadow:0 0 6px var(--violet-glow);
}
.fate-score-num{
  font-family:var(--lat);font-size:22px;
  color:var(--gold-hi);font-weight:300;line-height:1;
}
.fate-score-unit{
  font-family:var(--lat);font-size:9px;
  color:rgba(220,192,130,.45);
  display:block;text-align:right;letter-spacing:.05em;
}

/* ── Fortune phrase ── */
.fortune-phrase{
  width:100%;text-align:center;
  font-family:var(--serif);
  font-size:13px;letter-spacing:.18em;
  color:var(--text-mute);line-height:1.9;font-weight:300;
  margin-bottom:24px;padding:0 4px;
  border-left:2px solid var(--gold-line-2);
  padding-left:16px;text-align:left;
}
.fortune-phrase em{
  font-style:normal;color:var(--gold-soft);
}

/* ── Card footer ── */
.card-footer{
  width:100%;
  display:flex;align-items:center;justify-content:space-between;
  padding-top:16px;
  border-top:1px solid var(--hair);
}
.card-footer-brand{
  font-family:var(--lat);font-style:italic;
  font-size:10px;letter-spacing:.28em;
  color:rgba(220,192,130,.4);
}
.card-footer-qr{
  width:32px;height:32px;
  border:1px solid var(--gold-line);border-radius:5px;
  display:flex;align-items:center;justify-content:center;padding:4px;
}
.qr-dots{
  width:100%;height:100%;
  display:grid;grid-template-columns:repeat(5,1fr);gap:1px;
}
.qr-dots span{border-radius:.5px;background:rgba(220,192,130,.35)}

/* ── Action buttons ── */
.actions{
  width:100%;max-width:400px;
  padding:20px 16px 32px;
  display:flex;flex-direction:column;gap:10px;
  position:relative;z-index:1;
  animation:rpFadeUp .7s .35s ease both;
}

.btn-share{
  width:100%;padding:15px 0;
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--gold-deep) 0%,var(--gold) 40%,var(--gold-hi) 65%,var(--gold) 100%);
  border:none;border-radius:50px;
  color:#100820;
  font-family:var(--serif);font-size:14px;font-weight:700;
  letter-spacing:.22em;cursor:pointer;
  transition:transform .2s,box-shadow .2s;
  box-shadow:0 6px 22px var(--gold-glow);
}
.btn-share::after{
  content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);
  transform:skewX(-18deg);
  animation:shareSheen 3.6s ease-in-out infinite;
}
@keyframes shareSheen{0%,72%{left:-60%}88%,100%{left:130%}}
.btn-share:active{transform:scale(0.97)}

.btn-copy{
  width:100%;padding:14px 0;
  background:rgba(176,120,255,.07);
  border:1px solid var(--violet-line-2);
  border-radius:50px;
  color:var(--star-soft);
  font-family:var(--serif);font-size:13px;
  letter-spacing:.18em;cursor:pointer;
  transition:transform .2s,background .2s;
}
.btn-copy:active{transform:scale(0.97);background:rgba(176,120,255,.14)}

.share-hint{
  text-align:center;font-family:var(--lat);
  font-size:10px;color:var(--text-ghost);
  letter-spacing:.1em;margin-top:2px;
}

/* ── Disclaimer ── */
.share-disclaimer{
  text-align:center;font-size:10px;color:var(--text-ghost);
  opacity:.6;padding:0 24px 20px;line-height:1.8;
  max-width:400px;position:relative;z-index:1;
}

/* ── Animations ── */
@keyframes rpFadeUp{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:none}
}

/* ── theme-toggle (external common.js) ── */
.theme-toggle{
  position:fixed;top:14px;right:14px;
  z-index:999;
  background:rgba(26,16,53,.7);
  border:1px solid var(--violet-line);
  border-radius:50%;width:36px;height:36px;
  font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:border-color .2s;
}
.theme-toggle:hover{border-color:var(--gold-line)}

/* ── Mobile safety ── */
@media(max-width:400px){
  .card-body{padding:28px 18px 22px}
  .card-name{font-size:20px}
  .radar-wrap{width:144px;height:144px}
  .radar-wrap svg{width:144px;height:144px}
}
</style>

</div>

<div class="card-wrap">
  <div class="share-card">
    <div class="card-body">

      <div class="card-logo">善缘 · SHENYUAN</div>

      <div class="card-orb"></div>

      <div class="card-divider"><span>五行命盘</span></div>

      <!-- Pentagon radar -->
      <div class="radar-wrap">

          <defs>
            <radialGradient id="rg1" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="rgba(176,120,255,0.22)"/>

          </defs>
          <!-- Grid lines at 20/40/60/80/100% -->
          <polygon points="0,-19.6 12.5,-4 5.9,8.1 -3.9,5.4 -14.3,-4.6" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
          <polygon points="0,-39.2 25,-8.1 11.8,16.2 -7.8,10.7 -28.5,-9.3" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
          <polygon points="0,-58.8 37.5,-12.1 17.6,24.2 -11.7,16.1 -42.8,-13.9" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
          <polygon points="0,-78.4 50,-16.1 23.5,32.3 -15.6,21.5 -57,-18.5" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
          <!-- Full outline -->
          <polygon points="0,-98 62.5,-20.2 29.4,40.4 -19.5,26.9 -71.3,-23.1" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="0.5"/>

      <div class="insights">

      <!-- Card footer -->

<script>
// Read params from URL (name, birth, fate, luck, love, score, phrase)
(function(){
  var p = new URLSearchParams(location.search);
  var set = function(id, val) { if (val && document.getElementById(id)) document.getElementById(id).textContent = val; };
  set('cardName', p.get('name'));
  set('cardBirth', p.get('birth'));
  set('cardFate', p.get('fate'));
  set('cardLuck', p.get('luck'));
  set('cardLove', p.get('love'));
  set('cardScore', p.get('score'));
  if (p.get('score')) {
    var fill = document.querySelector('.fate-score-fill');
    if (fill) fill.style.setProperty('--pct', p.get('score') + '%');
  }
  if (p.get('phrase') && document.getElementById('cardPhrase')) {
    document.getElementById('cardPhrase').innerHTML = p.get('phrase');
  }
})();

function shareCard() {
  var url = location.href;
  if (navigator.share) {
    navigator.share({ title: '我的善缘命盘', text: '刚算了命盘，八字居然准得可怕…', url: url });
  } else {
    copyLink();
  }
}

function copyLink() {
  var btn = document.querySelector('.btn-copy');
  navigator.clipboard.writeText(location.href).then(function() {
    btn.textContent = '✓ 已复制';
    setTimeout(function(){ btn.textContent = '复制链接'; }, 2000);
  }).catch(function() {
    btn.textContent = '请手动复制地址栏';
    setTimeout(function(){ btn.textContent = '复制链接'; }, 2500);
  });
}
</script>


<script>
(function(){var t=localStorage.getItem('sy_theme');if(t==='light'){document.documentElement.classList.add('light-mode');var b=document.getElementById('themeToggle');if(b)b.textContent='☀️';}})();
function toggleTheme(){var e=document.documentElement;var b=document.getElementById('themeToggle');e.classList.toggle('light-mode');var l=e.classList.contains('light-mode');if(b)b.textContent=l?'☀️':'🌙';localStorage.setItem('sy_theme',l?'light':'dark');}
</script>
