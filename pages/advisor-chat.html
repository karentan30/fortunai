<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Runae 顾问 · 会记得你</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F0E7;--card:#FFFFFF;--card-2:#FAF7F0;
    --ink:#26221C;--ink-2:#6A6357;--ink-3:#A39B8C;
    --gold:#A9803A;--gold-soft:#C3A05A;--gold-wash:#EFE7D4;
    --jade:#2D7A62;--jade-deep:#1C4A3A;--jade-soft:#7DDFC0;--jade-wash:#E3EDE8;
    --line:rgba(38,34,28,.10);--line-2:rgba(38,34,28,.16);
    --sans:'Inter',-apple-system,system-ui,sans-serif;--serif:'Cormorant Garamond','Noto Serif SC',serif;
    --rl:20px;--r:14px;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--paper);font-family:var(--sans);color:var(--ink);line-height:1.5;font-feature-settings:"tnum";min-height:100vh;display:flex;flex-direction:column}
  .wrap{max-width:430px;width:100%;margin:0 auto;padding:0 24px;flex:1;display:flex;flex-direction:column;min-height:0}
  svg.ic{width:18px;height:18px;stroke:var(--ink-3);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

  /* 顶栏 —— 复用 report-v2 的 .bar 风格 */
  .bar{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 12px;flex-shrink:0}
  .nav-back{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-3);cursor:pointer;font-weight:500}
  .step{font-size:11px;color:var(--ink-3);letter-spacing:.1em;font-weight:600}

  /* 顾问名片头 */
  .ahero{display:flex;align-items:center;gap:12px;padding:6px 2px 14px;flex-shrink:0}
  .ahero .orb{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#E8C87E,#B98A3E 60%,#8a6224);flex-shrink:0;box-shadow:0 6px 18px -8px rgba(169,128,58,.6),inset 0 1px 2px rgba(255,255,255,.4)}
  .ahero .meta .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .ahero .meta h1{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.15;letter-spacing:-.01em;margin-top:2px}
  .ahero .meta .sub{font-size:11px;color:var(--ink-3);margin-top:2px}

  /* 聊天区 */
  .chat{flex:1;overflow-y:auto;padding:6px 0 12px;display:flex;flex-direction:column;gap:14px;min-height:0;-webkit-overflow-scrolling:touch}
  .msg{max-width:88%;font-size:14.5px;line-height:1.72;word-break:break-word}
  .msg.ai{align-self:flex-start}
  .msg.user{align-self:flex-end}
  .msg .role{font-size:10px;letter-spacing:.12em;color:var(--gold);font-weight:600;margin-bottom:5px;display:flex;align-items:center;gap:5px}
  .msg .role::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--jade);box-shadow:0 0 6px var(--jade-soft)}
  .bubble{padding:13px 16px;border-radius:16px;white-space:pre-wrap}
  .msg.ai .bubble{background:var(--card);border:1px solid var(--line);border-top-left-radius:5px;color:var(--ink)}
  .msg.user .bubble{background:var(--jade-deep);color:#fff;border-top-right-radius:5px;box-shadow:0 8px 20px -14px rgba(28,74,58,.7)}
  .msg.ai .bubble strong{color:var(--jade-deep)}

  /* 思考中 */
  .typing{display:inline-flex;gap:5px;align-items:center;padding:4px 2px}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--gold-soft);animation:bounce 1.2s infinite ease-in-out}
  .typing span:nth-child(2){animation-delay:.18s}
  .typing span:nth-child(3){animation-delay:.36s}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-5px);opacity:1}}

  /* 付费卡 —— 复用 report-v2 的 .adv 玉底金字 */
  .adv{background:var(--jade-deep);border:1px solid rgba(195,160,90,.20);border-radius:var(--rl);padding:22px 20px;margin:4px 0 8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07);align-self:stretch}
  .adv .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);font-weight:600}
  .adv h4{font-family:var(--serif);font-size:20px;font-weight:600;margin:8px 0 4px;color:#fff}
  .adv ul{list-style:none;margin:12px 0}
  .adv li{font-size:12.5px;color:rgba(255,255,255,.86);padding:5px 0 5px 20px;position:relative}
  .adv li::before{content:'◆';position:absolute;left:2px;top:5px;color:var(--gold-soft);font-size:7px;line-height:2.1}
  .adv .sbtn{width:100%;background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#fff;border:none;border-radius:var(--r);padding:15px;font-size:14.5px;font-weight:600;margin-top:10px;cursor:pointer}
  .adv .price{text-align:center;font-size:11px;color:rgba(255,255,255,.6);margin-top:10px}

  /* 输入区 */
  .inbar{flex-shrink:0;padding:10px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(244,240,231,0),var(--paper) 22%)}
  .inrow{display:flex;gap:9px;align-items:flex-end;background:var(--card);border:1px solid var(--line-2);border-radius:22px;padding:6px 6px 6px 16px}
  .inrow textarea{flex:1;border:none;outline:none;background:transparent;resize:none;font-family:var(--sans);font-size:15px;color:var(--ink);line-height:1.5;max-height:120px;padding:8px 0}
  .inrow textarea::placeholder{color:var(--ink-3)}
  .sendbtn{width:38px;height:38px;border-radius:50%;border:none;background:var(--jade-deep);color:#fff;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .sendbtn:disabled{opacity:.4;cursor:default}
  .sendbtn svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .quota{text-align:center;font-size:10.5px;color:var(--ink-3);margin-top:8px;letter-spacing:.02em}
  .quota b{color:var(--gold)}
  .disclaimer{text-align:center;font-size:9.5px;color:var(--ink-3);opacity:.75;margin-top:5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="nav-back" onclick="history.length>1?history.back():location.href='pick.html'"><svg class="ic" style="width:15px;height:15px"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>返回</div>
    <div class="step">Runae 顾问</div>
  </div>

  <div class="ahero">
    <div class="orb"></div>
    <div class="meta">
      <div class="k">Runae 顾问 · 会记得你</div>
      <h1>Rún · 你的命理顾问</h1>
      <div class="sub">读你的盘，陪你追问 · AI 生成，仅供参考</div>
    </div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="inbar">
    <div class="inrow">
      <textarea id="input" rows="1" placeholder="问问 Rún 你的运势、事业、感情…"></textarea>
      <button class="sendbtn" id="sendBtn" onclick="send()" aria-label="发送">
        <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="quota" id="quota"></div>
    <div class="disclaimer">AI 生成内容 · 用于自我探索与娱乐参考，不构成医学 / 法律 / 投资建议</div>
  </div>
</div>

<script>
/* ── 状态 ── */
var P={}; try{ P=JSON.parse(localStorage.getItem('runae_profile')||'{}'); }catch(e){}
var LANG=(function(){ var l=(localStorage.getItem('runae_lang')||navigator.language||'zh').toLowerCase();
  if(l.indexOf('ko')===0)return'ko'; if(l.indexOf('en')===0)return'en'; return'zh'; })();
var msgs=[];                 // 发给后端的对话历史（含隐藏的盘上下文）
var sending=false;
var isMember=false, isUnlimited=false, freeRemaining=null, gated=false;

var _sessionId=localStorage.getItem('sy_session_id');
if(!_sessionId){
  _sessionId=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2));
  localStorage.setItem('sy_session_id',_sessionId);
}

/* ── 把用户的盘拼成一段隐藏上下文，作为第一条 user 消息注入 ── */
function buildProfileContext(){
  if(!P||!P.bdate) return '';
  var g = P.gender==='male'?'男':(P.gender==='female'?'女':(P.gender||''));
  var cal = P.cal==='lunar'?'农历':'阳历';
  var parts=[];
  parts.push('出生日期：'+P.bdate+'（'+cal+'）');
  if(P.btime) parts.push('出生时间：'+P.btime);
  if(P.bcity) parts.push('出生地：'+P.bcity);
  if(g) parts.push('性别：'+g);
  if(P.aspects&&P.aspects.length) parts.push('关注方向：'+P.aspects.join('、'));
  return '【我的命盘信息，请记住并据此为我解读，不要再重复追问这些】\n'+parts.join('\n');
}

/* ── 首屏问候 + 隐藏盘上下文 ── */
function greet(){
  var ctx=buildProfileContext();
  if(ctx){
    // 盘作为隐藏的首条 user 消息（不显示在气泡里），让顾问一开口就"记得你"
    msgs.push({role:'user',content:ctx});
    var g=P.gender==='male'?'男':(P.gender==='female'?'女':'');
    var line='我已经拿到你的盘了'+(P.bdate?('（'+P.bdate+(g?' · '+g:'')+'）'):'')+'。\n无论是事业、感情、财运还是最近的困惑，随时问我——我会照着你的盘来说。';
    addMsg(line,'ai');
    msgs.push({role:'assistant',content:line});
  }else{
    var line2='我是 Rún——一个读古老体系的 AI，帮你看清你自己的规律。\n先来读读你的柱子：你出生年月日是？知道大概几点更好。男生还是女生？';
    addMsg(line2,'ai');
    msgs.push({role:'assistant',content:line2});
  }
}

/* ── 配额 ── */
function loadQuota(){
  fetch('/api/chat/quota',{headers:{'Authorization':'Bearer '+(localStorage.getItem('sy_token')||''),'X-Session-Id':_sessionId}})
    .then(function(r){return r.json();})
    .then(function(d){
      isUnlimited = d.tier==='unlimited';
      isMember = d.isMember || isUnlimited;
      freeRemaining = (typeof d.remaining==='number') ? d.remaining : null;
      if(isUnlimited && freeRemaining===-1) freeRemaining=null;
      updateQuota();
    }).catch(function(){ updateQuota(); });
}
function updateQuota(){
  var el=document.getElementById('quota');
  if(!el)return;
  if(isUnlimited){ el.innerHTML='年会员 · <b>无限畅聊</b>，Rún 记得你的盘'; return; }
  if(freeRemaining===null){ el.textContent=''; return; }
  if(freeRemaining<=0){ el.innerHTML='今日畅聊已用完 · <b>升级年会员</b>无限畅聊'; return; }
  el.innerHTML='今日还可畅聊 <b>'+freeRemaining+'</b> 句';
}

/* ── 渲染 ── */
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');}
function addMsg(text,role){
  var chat=document.getElementById('chat');
  var div=document.createElement('div');
  div.className='msg '+role;
  if(role==='ai'){ div.innerHTML='<div class="role">Rún · AI 生成</div><div class="bubble">'+md(text)+'</div>'; }
  else{ div.innerHTML='<div class="bubble"></div>'; div.querySelector('.bubble').textContent=text; }
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
}
function showTyping(){
  var chat=document.getElementById('chat');
  var div=document.createElement('div');
  div.className='msg ai'; div.id='typing';
  div.innerHTML='<div class="role">Rún · 思考中</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  chat.appendChild(div); chat.scrollTop=chat.scrollHeight;
}
function clearTyping(){ var t=document.getElementById('typing'); if(t)t.remove(); }

/* ── 付费墙 ── */
function addPaywall(){
  if(gated)return; gated=true;
  var input=document.getElementById('input'); input.disabled=true; input.placeholder='升级会员后继续和 Rún 深聊';
  document.getElementById('sendBtn').disabled=true;
  var chat=document.getElementById('chat');
  var div=document.createElement('div');
  div.className='adv';
  div.innerHTML='<div class="k">Runae 顾问 · 会记得你</div>'+
    '<h4>不止一次追问<br>是一个懂你的命理顾问</h4>'+
    '<ul><li>无限畅聊，随时追问深聊</li>'+
    '<li>Rún 记得你的盘与历史，越用越懂你</li>'+
    '<li>每日运势与流年动态，天天更新</li>'+
    '<li>全部完整报告解锁 · 中西命理交叉印证</li></ul>'+
    '<button class="sbtn" onclick="goCheckout(\'member_monthly\')">订阅 Runae 顾问 · $9.9 / 月</button>'+
    '<div class="price">或明天再来还有额度</div>';
  chat.appendChild(div); chat.scrollTop=chat.scrollHeight;
}

/* ── 发送 ── */
function send(){
  var input=document.getElementById('input');
  var text=input.value.trim();
  if(!text||sending)return;
  if(gated){ return; }
  if(!isMember && freeRemaining!==null && freeRemaining<=0){ addPaywall(); return; }

  sending=true;
  document.getElementById('sendBtn').disabled=true;
  addMsg(text,'user');
  msgs.push({role:'user',content:text});
  input.value=''; autoGrow();
  showTyping();

  var send10 = msgs.length>12 ? msgs.slice(msgs.length-12) : msgs; // 保留隐藏盘上下文靠前，尾部12条
  fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-Session-Id':_sessionId,'Authorization':'Bearer '+(localStorage.getItem('sy_token')||'')},
    body:JSON.stringify({messages:send10,lang:LANG})
  }).then(function(r){return r.json();}).then(function(d){
    clearTyping(); sending=false; document.getElementById('sendBtn').disabled=false;
    if(d.limited || d.needMember){
      freeRemaining=0; updateQuota();
      if(d.answer){ addMsg(d.answer,'ai'); }
      addPaywall();
      return;
    }
    if(d.answer){
      addMsg(d.answer,'ai');
      msgs.push({role:'assistant',content:d.answer});
      if(!isMember && freeRemaining!==null){ freeRemaining=Math.max(0,freeRemaining-1); updateQuota(); if(freeRemaining<=0) addPaywall(); }
    }else{
      addMsg('星轨暂时模糊，请稍后再问。','ai');
    }
  }).catch(function(){
    clearTyping(); sending=false; document.getElementById('sendBtn').disabled=false;
    addMsg('星轨暂时模糊，请稍后再问。','ai');
  });
}

/* ── 交互 ── */
var _input=document.getElementById('input');
function autoGrow(){ _input.style.height='auto'; _input.style.height=Math.min(_input.scrollHeight,120)+'px'; }
_input.addEventListener('input',autoGrow);
_input.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); }
});

/* ── 付费下单（复用 report-v2 的 goCheckout） ── */
window.goCheckout=function(product){
  fetch('/api/create-checkout',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({product:product,token:localStorage.getItem('sy_token')||'',
      successUrl:location.origin+'/pages/advisor-chat.html?paid=1',cancelUrl:location.href})})
   .then(function(r){return r.json();}).then(function(d){
     if(d.url){ location.href=d.url; }
     else if(d.channel==='cn'){ alert('国内用户请用微信 / 支付宝支付（接入中）'); }
     else { alert('跳转支付失败，请重试'); }
   }).catch(function(){ alert('网络异常，请重试'); });
};

/* ── 启动 ── */
loadQuota();
greet();
</script>
<script src="/assets/js/common.js"></script>
<script>if(window.SY&&SY.initMembership)SY.initMembership();</script>
</body>
</html>
