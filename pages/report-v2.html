<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Runae · 你的报告</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#060e0d;--card:#0f1b17;--card-2:#0b1512;
    --ink:#f0ebe0;--ink-2:rgba(240,235,224,.70);--ink-3:rgba(240,235,224,.42);
    --gold:#dcc082;--gold-soft:#e8d49c;--gold-wash:rgba(220,192,130,.14);
    --jade:#4fbfa0;--jade-deep:#0e2b24;--jade-soft:#7DDFC0;--jade-wash:rgba(79,191,160,.12);
    --line:rgba(240,235,224,.10);--line-2:rgba(240,235,224,.17);
    --sans:'Inter',-apple-system,system-ui,sans-serif;--serif:'Cormorant Garamond','Noto Serif SC',serif;
    --rl:20px;--r:14px;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color-scheme:dark}body{background:var(--paper);font-family:var(--sans);color:var(--ink);line-height:1.5;font-feature-settings:"tnum";min-height:100vh}
  .wrap{max-width:430px;margin:0 auto;padding:0 24px 40px;min-height:100vh}
  svg.ic{width:18px;height:18px;stroke:var(--ink-3);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 12px}
  .nav-back{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-3);cursor:pointer;font-weight:500}
  .step{font-size:11px;color:var(--ink-3);letter-spacing:.1em;font-weight:600}
  .rhero{text-align:center;padding:16px 4px 4px}
  .rhero .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .rhero .dv{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);margin:14px auto}
  .rhero h2{font-family:var(--serif);font-size:29px;font-weight:600;line-height:1.24;letter-spacing:-.01em;margin:0 6px}
  .chart{background:var(--jade-deep);border:1px solid rgba(195,160,90,.20);border-radius:var(--rl);padding:22px 20px;margin:18px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
  .pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
  .pil .c{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.15;background:linear-gradient(160deg,#E8C87E,#B98A3E);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.18))}
  .pil .l{font-size:10px;color:rgba(255,255,255,.62);margin-top:7px;letter-spacing:.08em}
  .read{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);padding:20px;margin-bottom:14px}
  .read h3{font-size:14px;font-weight:600;margin-bottom:10px;letter-spacing:.01em}
  .read p{font-size:15px;color:var(--ink-2);line-height:1.75;white-space:pre-wrap}
  .blur{filter:blur(5px);opacity:.55;user-select:none;pointer-events:none}
  .wall{background:var(--card);border:1px solid var(--gold-soft);border-radius:var(--rl);padding:24px 20px;text-align:center;margin:16px 0;box-shadow:0 14px 34px -20px rgba(169,128,58,.30)}
  .wall h4{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:5px}
  .wall p{font-size:13px;color:var(--ink-2);margin-bottom:18px}
  .cta{width:100%;background:var(--jade-deep);color:#fff;border:none;border-radius:var(--r);padding:16px;font-size:15px;font-weight:600;font-family:var(--sans);cursor:pointer}
  .cta.gold{background:linear-gradient(135deg,var(--gold-soft),var(--gold))}
  .wall .price{font-size:13px;color:var(--ink-3);margin-top:12px}
  .wall .price b{color:var(--gold);font-size:17px;font-weight:600}
  .expand{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;color:var(--ink-2);padding:14px;border:1px solid var(--gold-wash);border-radius:var(--r);margin-bottom:12px;background:var(--card-2);font-weight:500}
  .adv{background:var(--jade-deep);border:1px solid rgba(195,160,90,.20);border-radius:var(--rl);padding:24px 21px;margin:22px 0 8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
  .adv .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);font-weight:600}
  .adv h4{font-family:var(--serif);font-size:21px;font-weight:600;margin:10px 0 4px;color:#fff}
  .adv ul{list-style:none;margin:14px 0}
  .adv li{font-size:13px;color:rgba(255,255,255,.86);padding:6px 0 6px 20px;position:relative}
  .adv li::before{content:'◆';position:absolute;left:2px;top:6px;color:var(--gold-soft);font-size:7px;line-height:2.1}
  .adv .sbtn{width:100%;background:transparent;color:var(--gold-soft);border:1px solid var(--gold-soft);border-radius:var(--r);padding:15px;font-size:14.5px;font-weight:600;margin-top:10px;cursor:pointer}
  .skel{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);padding:20px;margin-bottom:14px}
  .skel .ln{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line),rgba(255,255,255,.06),var(--line));background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:11px}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .err{text-align:center;color:var(--ink-2);font-size:14px;padding:40px 10px}
  .crossread{background:var(--card-2);border:1px solid var(--gold-soft);border-radius:var(--rl);padding:22px 20px;margin:22px 0 8px;box-shadow:0 10px 30px -22px rgba(169,128,58,.35)}
  .crossread .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .crossread h4{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--ink);margin:9px 0 6px;line-height:1.24}
  .crossread .fr{font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:16px}
  .crossread .cx{display:flex;align-items:flex-start;gap:13px;background:var(--card);border:1px solid var(--gold-wash);border-radius:var(--r);padding:14px 15px;margin-top:10px;cursor:pointer;transition:transform .12s,border-color .15s;text-align:left;width:100%;text-decoration:none}
  .crossread .cx:active{transform:scale(.98)}
  .crossread .cx:hover{border-color:var(--gold-soft)}
  .crossread .cx>svg{width:26px;height:26px;stroke:var(--gold);stroke-width:1.35;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;margin-top:1px}
  .crossread .cx .cn{font-size:14.5px;font-weight:600;color:var(--ink);font-family:var(--serif)}
  .crossread .cx .ch{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-top:3px}
  .crossread .cx .cg{margin-left:auto;align-self:center;stroke:var(--ink-3);width:16px;height:16px;flex-shrink:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><div class="nav-back" id="navback"><svg class="ic" style="width:15px;height:15px"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="backtxt">返回</span></div><div class="step" id="mname">你的报告</div></div>
  <div id="hero"></div>
  <div id="body">
    <div class="skel"><div class="ln" style="width:60%"></div><div class="ln" style="width:100%"></div><div class="ln" style="width:88%"></div></div>
    <div class="skel"><div class="ln" style="width:45%"></div><div class="ln" style="width:96%"></div><div class="ln" style="width:92%"></div><div class="ln" style="width:70%"></div></div>
    <div class="err" id="loadmsg">正在为你排盘…</div>
  </div>
</div>
<script>
  var LANG=(new URLSearchParams(location.search).get('lang'))||localStorage.getItem('runae_lang')||'zh';localStorage.setItem('runae_lang',LANG);var EN=(LANG==='en');
  var T={
    back:EN?'Back':'返回',
    reportTitle:EN?'Your Report':'你的报告',
    loading:EN?'Casting your chart…':'正在为你排盘…',
    retry:EN?'Retry':'重试',
    genFail:EN?'Something went wrong generating your report: ':'报告生成遇到问题：',
    genFailStatus:EN?'Generation failed ':'生成失败 ',
    emptyReport:EN?'Empty report':'报告为空',
    netErr:EN?'Network error, please try again':'网络异常，请重试',
    payFail:EN?'Failed to open checkout, please try again':'跳转支付失败，请重试',
    cnPay:EN?'Mainland users: please pay via WeChat / Alipay (coming soon)':'国内用户请用微信 / 支付宝支付（接入中）',
    deeper:EN?'A Deeper Reading':'更深的推演',
    unlock:EN?'Unlock Full Report':'解锁完整报告',
    unlockSub:EN?'Luck Cycles & Annual Forecast · Year-by-year outlook · Advanced cross-reading':'大运流年 · 逐年预测 · 进阶交叉印证',
    unlockBtn:EN?'Unlock Full Version':'解锁完整版',
    price1:EN?'one-time · or subscribe for better value ↓':'一次性 · 或订阅更划算 ↓',
    techLabel:EN?'▾ Technical chart details (Ten Gods / Hidden Stems / Nayin)':'▾ 命盘技术细节（十神 / 藏干 / 纳音）',
    advK:EN?'Runae Advisor · Remembers You':'Runae 顾问 · 会记得你',
    advH:EN?'More than a report<br>An advisor who actually knows you':'不止一份报告<br>是一个懂你的命理顾问',
    advList:EN?[
      'Your daily horoscope and live annual forecast, refreshed every day',
      'Ask anything, anytime — like having a teacher on call',
      'Eastern & Western astrology plus face and palm reading — the same you, seen from every angle',
      'Remembers your chart and your history — the more you use it, the better it knows you',
      'Book a one-on-one session with a real reader (member discount)'
    ]:[
      '每日运势与流年动态，天天更新',
      'AI 对话随时追问深聊，像身边的老师',
      '中西命理 + 面相手相，交叉印证同一个你',
      '记得你的盘与历史，越用越懂你',
      '可约真人命理师一对一（会员优惠）'
    ],
    advBtn:EN?'Subscribe to Runae Advisor · $9.9 / mo':'订阅 Runae 顾问 · $9.9 / 月',
    comingHead:EN?'This reading is coming soon':'新版报告正在接入',
    comingBody:EN?'This one is almost ready. Want to start with your BaZi in the meantime?':'这个推演的新版报告马上就好。先看看你的八字？',
    seeBazi:EN?'See BaZi Report First':'先看八字报告',
    pillarLabels:EN?['Year','Month','Day','Hour']:['年','月','日','时']
  };
  var P={},M='bazi';
  try{ P=JSON.parse(localStorage.getItem('runae_profile')||'{}'); }catch(e){}
  M=localStorage.getItem('runae_method')||'bazi';
  if(!P.bdate){ location.href='collect.html'+(localStorage.getItem('runae_lang')==='en'?'?lang=en':''); }
  var NAMES=EN
    ?{bazi:'BaZi',hehun:'Compatibility',tarot:'Tarot',astro:'Astrology',daily:'Daily',palm:'Palmistry',face:'Face Reading'}
    :{bazi:'八字命理',hehun:'合婚',tarot:'塔罗',astro:'星座占星',daily:'每日运势',palm:'手相',face:'面相'};
  document.getElementById('mname').textContent=NAMES[M]||T.reportTitle;
  document.documentElement.setAttribute('lang',EN?'en':'zh-CN');
  document.getElementById('backtxt').textContent=T.back;
  document.getElementById('navback').onclick=function(){location.href='pick.html?lang='+LANG;};
  var _lm=document.getElementById('loadmsg'); if(_lm)_lm.textContent=T.loading;

  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
  var HEAD=/^\s*([【✅📜🌟💰❤💼🌿☀🔮⛰✨🙏]|#{1,3}\s|[\uD83C-\uDBFF])/;

  function sections(text){
    var lines=text.split('\n'),secs=[],cur=null;
    lines.forEach(function(raw){
      var l=raw.replace(/\s+$/,''); if(!l.trim())return;
      if(HEAD.test(l)&&l.trim().length<(EN?60:38)){
        cur={t:l.replace(/[\uD800-\uDFFF←-⯿☀-➿️#*【】]/g,'').trim(),b:[]};secs.push(cur);
      }else{ if(!cur){cur={t:'',b:[]};secs.push(cur);} cur.b.push(l.trim()); }
    });
    return secs.filter(function(s){return s.t||s.b.length;});
  }
  function bd(){ var m=(P.bdate||'').split('-');var h=10;if(P.btime){h=parseInt(P.btime.split(':')[0],10);if(isNaN(h))h=10;}
    return {birthYear:+m[0],birthMonth:+m[1],birthDay:+m[2],birthHour:h,gender:P.gender||'female',lang:LANG}; }

  /* ── Cross-Reading (交叉印证) component ── */
  var CROSS_CUR=M;
  var CROSS_META={
    bazi:{glyph:'<path d="M7 6v20M13 6v20M19 6v20M25 6v20"/>',n:{zh:'八字命理',en:'BaZi'},page:'report-v2.html',
      h:{zh:'从出生的四柱看你的先天格局，把此刻的困惑放回一整条人生曲线里。',en:'Your birth chart maps the whole arc — the deep pattern behind what you\'re feeling right now.'}},
    hehun:{glyph:'<circle cx="12" cy="16" r="7.5"/><circle cx="20" cy="16" r="7.5"/>',n:{zh:'合婚',en:'Compatibility'},page:'report-hehun.html',
      h:{zh:'把你和那个人放在一起看，两张盘怎么咬合、哪里需要磨合，一目了然。',en:'Put your chart next to your partner\'s and see exactly where you fit — and where you grind.'}},
    tarot:{glyph:'<rect x="6" y="8" width="12" height="18" rx="2" transform="rotate(-8 12 17)"/><rect x="15" y="6" width="12" height="18" rx="2" transform="rotate(8 21 15)"/>',n:{zh:'塔罗',en:'Tarot'},page:'report-tarot.html',
      h:{zh:'命盘讲长期趋势，塔罗回答此刻那件具体的事——该走还是该留。',en:'Your chart shows the long game; a card answers the one thing weighing on you today.'}},
    astro:{glyph:'<circle cx="16" cy="16" r="6"/><path d="M16 3v3M16 26v3M3 16h3M26 16h3M6.6 6.6l2.1 2.1M23.3 23.3l2.1 2.1M25.4 6.6l-2.1 2.1M8.7 23.3l-2.1 2.1"/>',n:{zh:'星座占星',en:'Astrology'},page:'report-astrology.html',
      h:{zh:'西方星盘从另一套坐标读你的性格与关系，常和东方命理指向同一个答案。',en:'Your Western chart reads the same you through a different lens — and usually lands on the same answer.'}},
    daily:{glyph:'<path d="M24 20a9 9 0 1 1-8-13 7 7 0 0 0 8 13z"/>',n:{zh:'每日运势',en:'Daily Horoscope'},page:'report-daily.html',
      h:{zh:'把大格局落到今天：今天宜什么、忌什么，天天更新。',en:'Brings the big picture down to today — what to lean into, what to avoid, refreshed daily.'}},
    palm:{glyph:'<path d="M11 26v-6M11 20V9a2 2 0 0 1 4 0v7M15 16V7a2 2 0 0 1 4 0v9M19 16v-5a2 2 0 0 1 4 0v9a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-3-5a2 2 0 0 1 3.4-2z"/>',n:{zh:'手相',en:'Palm Reading'},page:'report-palm.html',
      h:{zh:'掌纹记录的是后天的走势，和先天命盘对照着看，更立体。',en:'Your palm tracks how life is actually unfolding — a living counterpart to your birth chart.'}},
    face:{glyph:'<circle cx="16" cy="16" r="11"/><path d="M12 14h.01M20 14h.01M12 20a5 4 0 0 0 8 0"/>',n:{zh:'面相',en:'Face Reading'},page:'report-face.html',
      h:{zh:'五官里的运势密码，和命盘相互印证，看得见的另一层线索。',en:'The story in your features — a visible layer that echoes what your chart already hints at.'}}
  };
  var CROSS_DEFAULT={bazi:['astro','tarot'],hehun:['bazi','tarot'],tarot:['bazi','astro'],astro:['bazi','tarot'],daily:['bazi','astro'],palm:['bazi','face'],face:['bazi','palm']};
  function crossPick(){
    var asp=[];try{asp=(JSON.parse(localStorage.getItem('runae_profile')||'{}').aspects)||[];}catch(e){}
    var out=[];
    function add(list){list.forEach(function(m){if(m!==CROSS_CUR&&out.indexOf(m)<0)out.push(m);});}
    if(asp.indexOf('love')>-1) add(['hehun','tarot','astro']);
    if(asp.indexOf('career')>-1||asp.indexOf('wealth')>-1) add(['bazi','astro','tarot']);
    if(asp.indexOf('health')>-1) add(['bazi','palm','daily']);
    add(CROSS_DEFAULT[CROSS_CUR]||['bazi','astro']);
    return out.slice(0,3);
  }
  function crossReadHTML(){
    var picks=crossPick();if(!picks.length)return '';
    var L=EN?'en':'zh';
    var head=EN?'The same you, seen from every angle':'同一个你，多重印证';
    var fr=EN?'One profile. Every tradition weighs in — and they rarely disagree.':'一份命盘，多种传承一起看——它们很少各说各话。';
    var kk=EN?'Cross-Reading · Runae':'交叉印证 · Runae';
    var chev='<svg class="cg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
    var cards=picks.map(function(m){
      var meta=CROSS_META[m];if(!meta)return '';
      return '<a class="cx" href="'+meta.page+'?lang='+LANG+'"><svg viewBox="0 0 32 32">'+meta.glyph+'</svg>'
        +'<div><div class="cn">'+esc(meta.n[L])+'</div><div class="ch">'+esc(meta.h[L])+'</div></div>'+chev+'</a>';
    }).join('');
    return '<div class="crossread"><div class="k">'+esc(kk)+'</div><h4>'+esc(head)+'</h4><div class="fr">'+esc(fr)+'</div>'+cards+'</div>';
  }

  function renderBazi(d){
    var body=document.getElementById('body'),hero=document.getElementById('hero'),p=d.pillars||{};
    var dm=p.dayMaster||'',el=p.dayMasterElement||'';
    var heroH=EN?('Your Day Master is &laquo;'+esc(dm+el)+'&raquo;'):('你的日主是「'+esc(dm+el)+'」');
    hero.innerHTML='<div class="rhero"><div class="k">BaZi · '+esc(P.bdate||'')+'</div><div class="dv"></div><h2>'+heroH+'</h2></div>';
    var chart='';['year','month','day','hour'].forEach(function(k,i){var q=p[k]||{};chart+='<div class="pil"><div class="c">'+esc(q.gan||'')+'<br>'+esc(q.zhi||'')+'</div><div class="l">'+T.pillarLabels[i]+'</div></div>';});
    var html='<div class="chart"><div class="pillars">'+chart+'</div></div>';
    var parts=(d.reading||'').split(/---LOCKED---/i),free=parts[0]||'',locked=parts[1]||'';
    free=free.replace(/^📜[^\n]*\n/,'').replace(/^公历[^\n]*\n/,'').replace(/^八字：[^\n]*\n/,'');
    sections(free).forEach(function(s){ html+='<div class="read">'+(s.t?'<h3>'+esc(s.t)+'</h3>':'')+'<p>'+md(s.b.join('\n'))+'</p></div>'; });
    if(locked.trim()){ html+='<div class="read"><h3>'+esc(T.deeper)+'</h3><p class="blur">'+md(locked.replace(/^\s+/,'').slice(0,110))+'……</p></div>'; }
    html+='<div class="wall"><h4>'+esc(T.unlock)+'</h4><p>'+esc(T.unlockSub)+'</p><button class="cta gold" onclick="goCheckout(\'bazi_full\')">'+esc(T.unlockBtn)+'</button><div class="price"><b>$9.90</b> '+esc(T.price1)+'</div></div>';
    html+='<div class="expand">'+esc(T.techLabel)+'</div>';
    html+=crossReadHTML();
    var advLis=T.advList.map(function(x){return '<li>'+esc(x)+'</li>';}).join('');
    html+='<div class="adv"><div class="k">'+esc(T.advK)+'</div><h4>'+T.advH+'</h4><ul>'+advLis+'</ul><button class="sbtn" onclick="goCheckout(\'member_monthly\')">'+esc(T.advBtn)+'</button></div>';
    body.innerHTML=html;
  }
  function fail(msg){ document.getElementById('body').innerHTML='<div class="err">'+esc(msg)+'<br><br><button class="cta" style="max-width:200px;margin:14px auto 0" onclick="location.reload()">'+esc(T.retry)+'</button></div>'; }

  window.goCheckout=function(product){
    fetch('/api/create-checkout',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({product:product,token:localStorage.getItem('sy_token')||'',
        successUrl:location.origin+'/pages/report-v2.html?paid=1',cancelUrl:location.href})})
     .then(function(r){return r.json();}).then(function(d){
       if(d.url){ location.href=d.url; }
       else if(d.channel==='cn'){ alert(T.cnPay); }
       else { alert(T.payFail); }
     }).catch(function(){ alert(T.netErr); });
  };

  if(M==='bazi'){
    fetch('/api/bazi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(bd())})
      .then(function(r){ if(!r.ok)throw new Error(T.genFailStatus+r.status); return r.json(); })
      .then(function(d){ if(!d.reading)throw new Error(T.emptyReport); renderBazi(d); })
      .catch(function(e){ fail(T.genFail+e.message); });
  } else {
    document.getElementById('body').innerHTML='<div class="chart" style="text-align:center"><div style="font-family:var(--serif);font-size:20px;margin-bottom:6px;color:#fff">'+esc(NAMES[M]||'')+'</div><div style="font-size:13px;color:rgba(255,255,255,.7)">'+esc(T.comingHead)+'</div></div><div class="read"><p>'+esc(T.comingBody)+'</p></div><button class="cta" onclick="localStorage.setItem(\'runae_method\',\'bazi\');location.reload()">'+esc(T.seeBazi)+'</button>';
  }
</script>
