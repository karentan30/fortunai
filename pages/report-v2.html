<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Runae · 你的报告</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#060e0d;--card:#0f1b17;--card-2:#0b1512;
    --ink:#f0ebe0;--ink-2:rgba(240,235,224,.72);--ink-3:rgba(240,235,224,.44);
    --gold:#dcc082;--gold-soft:#e8d49c;--gold-wash:rgba(220,192,130,.14);
    --jade:#4fbfa0;--jade-deep:#0e2b24;--jade-soft:#7ddfc0;--jade-wash:rgba(79,191,160,.12);
    --line:rgba(240,235,224,.10);--line-2:rgba(240,235,224,.17);
    --wood:#7dcf8f;--fire:#e07a6a;--earth:#d8b56a;--metal:#cfcabb;--water:#6aa8d8;
    --sans:'Inter',-apple-system,system-ui,sans-serif;--serif:'Cormorant Garamond','Noto Serif SC',serif;
    --rl:20px;--r:14px;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color-scheme:dark}
  body{background:var(--paper);font-family:var(--sans);color:var(--ink);line-height:1.5;font-feature-settings:"tnum";min-height:100vh}
  .wrap{max-width:430px;margin:0 auto;padding:0 22px 44px;min-height:100vh}
  svg.ic{width:18px;height:18px;stroke:var(--ink-3);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  /* header */
  .bar{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 4px}
  .nav-back{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-3);cursor:pointer;font-weight:500}
  .step,.doct{font-size:10.5px;color:var(--ink-3);letter-spacing:.12em;text-transform:uppercase;font-weight:600}
  .rhero{text-align:center;padding:20px 4px 6px}
  .rhero .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .rhero .dv{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);margin:13px auto}
  .rhero h2{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.24;letter-spacing:-.01em;margin:0 6px}
  .rhero .ess{font-size:13.5px;color:var(--ink-2);margin-top:12px;line-height:1.7;padding:0 6px}
  /* key insight alert */
  .alert{background:linear-gradient(160deg,rgba(79,191,160,.10),var(--card));border:1px solid var(--jade-soft);border-radius:var(--rl);padding:20px;margin:20px 0;box-shadow:0 14px 34px -22px rgba(79,191,160,.4)}
  .alert .t{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--jade-soft);font-weight:600;display:flex;align-items:center;gap:7px}
  .alert p{font-size:15px;color:var(--ink);line-height:1.72;margin-top:10px}
  .alert p b{color:var(--jade-soft)}
  /* section label */
  .sec{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;margin:30px 2px 13px}
  /* chart */
  .chart{background:var(--jade-deep);border:1px solid rgba(195,160,90,.22);border-radius:var(--rl);padding:22px 18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
  .pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
  .pil .c{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.15;background:linear-gradient(160deg,#E8C87E,#B98A3E);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.2))}
  .pil .py{font-size:8.5px;color:rgba(255,255,255,.5);margin-top:5px;line-height:1.2}
  .pil .l{font-size:10px;color:rgba(255,255,255,.6);margin-top:5px;letter-spacing:.06em}
  /* five elements bars */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);padding:20px}
  .bar-row{display:flex;align-items:center;gap:11px;margin-bottom:12px}
  .bar-row:last-child{margin-bottom:0}
  .bar-row .nm{font-family:var(--serif);font-size:15px;font-weight:600;width:44px;flex-shrink:0;white-space:nowrap}
  .bar-track{flex:1;height:8px;background:var(--card-2);border-radius:6px;overflow:hidden}
  .bar-fill{height:100%;border-radius:6px;transition:width .5s ease}
  .bar-row .pc{font-size:12px;color:var(--ink-3);width:34px;text-align:right;font-weight:600}
  /* reading section */
  .rd,.read{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);padding:20px;margin-bottom:12px}
  .rd h3,.read h3{font-size:15px;font-weight:600;font-family:var(--serif);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .rd p,.read .rbody p{font-size:14.5px;color:var(--ink-2);line-height:1.8;margin-bottom:10px}
  .rd p:last-child,.read .rbody p:last-child{margin-bottom:0}
  .rd p b,.read .rbody strong{color:var(--ink);font-weight:600}
  .rd em,.read .rbody em{color:var(--jade-soft);font-style:normal}
  .rd ul,.read .rbody ul{list-style:none;margin:6px 0}
  .rd li,.read .rbody li{font-size:14px;color:var(--ink-2);line-height:1.7;padding-left:16px;position:relative;margin-bottom:6px}
  .rd li::before,.read .rbody li::before{content:'';position:absolute;left:3px;top:9px;width:4px;height:4px;border-radius:50%;background:var(--gold-soft)}
  .read .rbody .rsub{font-size:12.5px;color:var(--gold-soft);font-weight:600;letter-spacing:.02em;margin:14px 0 7px}
  .blur{filter:blur(5px);opacity:.5;user-select:none;pointer-events:none}
  /* timeline (大运) */
  .tl{position:relative;padding-left:4px}
  .tl .row{display:flex;gap:14px;padding:2px 0 16px;position:relative}
  .tl .row:last-child{padding-bottom:0}
  .tl .yr{font-family:var(--serif);font-size:13px;color:var(--gold-soft);font-weight:600;width:66px;flex-shrink:0;padding-top:1px}
  .tl .dot{position:absolute;left:60px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--jade);box-shadow:0 0 0 3px var(--jade-wash)}
  .tl .dot.on{background:var(--gold-soft);box-shadow:0 0 0 3px var(--gold-wash)}
  .tl .bd{border-left:1px solid var(--line);padding-left:20px;margin-left:0;flex:1}
  .tl .bd .h{font-size:14px;font-weight:600;color:var(--ink)}
  .tl .bd .d{font-size:13px;color:var(--ink-2);margin-top:3px;line-height:1.6}
  /* tips */
  .tip{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:10px}
  .tip .e{font-family:var(--serif);color:var(--gold-soft);font-size:17px;font-weight:600;flex-shrink:0;width:22px;text-align:center}
  .tip .x{font-size:13.5px;color:var(--ink-2);line-height:1.65}.tip .x b{color:var(--ink)}
  /* wall + adv */
  .wall{background:var(--card);border:1px solid var(--gold-soft);border-radius:var(--rl);padding:24px 20px;text-align:center;margin:18px 0;box-shadow:0 14px 34px -20px rgba(169,128,58,.3)}
  .wall h4{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:5px}
  .wall p{font-size:13px;color:var(--ink-2);margin-bottom:16px}
  .cta{width:100%;background:var(--jade-deep);color:#fff;border:none;border-radius:var(--r);padding:15px;font-size:15px;font-weight:600;font-family:var(--sans);cursor:pointer}
  .cta.gold{background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#2a1f0c;font-weight:700}
  .wall .price{font-size:13px;color:var(--ink-3);margin-top:11px}.wall .price b{color:var(--gold);font-size:17px}
  .wall .walllist{list-style:none;text-align:left;margin:4px auto 16px;max-width:240px}
  .wall .walllist li{font-size:13px;color:var(--ink-2);padding:4px 0;letter-spacing:.02em}
  .adv{background:var(--jade-deep);border:1px solid rgba(195,160,90,.2);border-radius:var(--rl);padding:22px 20px;margin-top:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
  .adv .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);font-weight:600}
  .adv h4{font-family:var(--serif);font-size:20px;color:#fff;margin:9px 0 12px;line-height:1.24}
  .adv ul{list-style:none;margin:14px 0}
  .adv li{font-size:13px;color:rgba(255,255,255,.86);padding:6px 0 6px 20px;position:relative}
  .adv li::before{content:'◆';position:absolute;left:2px;top:6px;color:var(--gold-soft);font-size:7px;line-height:2.1}
  .adv .sbtn{width:100%;background:transparent;color:var(--gold-soft);border:1px solid var(--gold-soft);border-radius:var(--r);padding:14px;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px}
  .expand{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;color:var(--ink-2);padding:14px;border:1px solid var(--gold-wash);border-radius:var(--r);margin:14px 0 4px;background:var(--card-2);font-weight:500}
  .foot{margin-top:34px;border-top:1px solid var(--line);padding-top:20px;text-align:center}
  .foot .d{font-size:11px;color:var(--ink-3);line-height:1.7}
  .foot .sig{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--ink-3);margin-top:12px;letter-spacing:.05em}
  /* skeleton / error */
  .skel{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);padding:20px;margin-bottom:14px}
  .skel .ln,.chskel .ln,.csk{background:linear-gradient(90deg,var(--line),rgba(255,255,255,.06),var(--line));background-size:200% 100%;animation:sh 1.3s infinite}
  .skel .ln,.chskel .ln{height:12px;border-radius:6px;margin-bottom:11px}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .err{text-align:center;color:var(--ink-2);font-size:14px;padding:40px 10px}
  /* per-chapter streaming states */
  .read.streaming .rbody p:last-child::after{content:'▍';color:var(--jade-soft);animation:ccr .9s steps(2) infinite;margin-left:1px}
  @keyframes ccr{0%,49%{opacity:1}50%,100%{opacity:0}}
  .chspin{width:13px;height:13px;border:2px solid var(--line-2);border-top-color:var(--jade-soft);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0}
  @keyframes spin{to{transform:rotate(360deg)}}
  .chip{font-size:10px;letter-spacing:.1em;color:var(--ink-3);font-weight:600;margin-left:auto;text-transform:uppercase}
  .cherr{font-size:13px;color:var(--ink-2);line-height:1.7}
  .cherr button{background:none;border:1px solid var(--line-2);border-radius:8px;color:var(--gold-soft);font-size:12px;padding:5px 12px;margin-left:8px;cursor:pointer;font-family:inherit}
  .chart.skel-chart .csk{height:26px;border-radius:8px}
  .card.skel-el .csk{height:8px;border-radius:6px;margin-bottom:12px}
  .card.skel-el .csk:last-child{margin-bottom:0}
  /* cross-reading */
  .crossread{background:var(--card-2);border:1px solid var(--gold-soft);border-radius:var(--rl);padding:22px 20px;margin:22px 0 8px;box-shadow:0 10px 30px -22px rgba(169,128,58,.35)}
  .crossread .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .crossread h4{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--ink);margin:9px 0 6px;line-height:1.24}
  .crossread .fr{font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:16px}
  .crossread .cx{display:flex;align-items:flex-start;gap:13px;background:var(--card);border:1px solid var(--gold-wash);border-radius:var(--r);padding:14px 15px;margin-top:10px;cursor:pointer;transition:transform .12s,border-color .15s;text-align:left;width:100%;text-decoration:none}
  .crossread .cx:active{transform:scale(.98)}
  .crossread .cx:hover{border-color:var(--gold-soft)}
  .crossread .cx>svg{width:26px;height:26px;stroke:var(--gold);stroke-width:1.35;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;margin-top:1px}
  .crossread .cx .cn{font-size:14.5px;font-weight:600;color:var(--ink);font-family:var(--serif)}
  .crossread .cx .ch{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-top:3px}
  .crossread .cx .cg{margin-left:auto;align-self:center;stroke:var(--ink-3);width:16px;height:16px;flex-shrink:0}
  /* lucky charms 带货 */
  .charms{background:var(--card-2);border:1px solid var(--gold-soft);border-radius:var(--rl);padding:20px 18px;margin:6px 0 8px;box-shadow:0 10px 30px -22px rgba(169,128,58,.35)}
  .charms-k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .charms-sub{font-size:12px;color:var(--ink-3);line-height:1.5;margin:7px 0 14px}
  .charm{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--gold-wash);border-radius:var(--r);padding:12px 13px;margin-top:10px;text-decoration:none;transition:transform .12s,border-color .15s}
  .charm:active{transform:scale(.98)}.charm:hover{border-color:var(--gold-soft)}
  .charm-ic{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
  .charm-bd{flex:1;min-width:0}
  .charm-nm{font-size:14.5px;font-weight:600;color:var(--ink);font-family:var(--serif)}
  .charm-wy{font-size:12px;color:var(--ink-2);line-height:1.5;margin-top:2px}.charm-wy b{color:var(--gold-soft);font-weight:600}
  .charm-go{display:flex;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--gold-soft);flex-shrink:0;white-space:nowrap}
  .charm-go svg{width:13px;height:13px}
</style>
</head>

  // 章节列表（与后端 BAZI_CHAPTERS 同步；free 章渐进流式，付费章显付费墙）

  /* ════════════════════════════════════════════════════
     人生运势曲线 (Life Luck Curve) — deterministic SVG
     Each 大运 (10yr cycle) scored 0–100 from its stem-element vs
     用神/喜忌 (favorable / unfavorable elements), adjusted by 旺衰.
     ════════════════════════════════════════════════════ */
  var GAN2EL_C={'甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水'};
  // 五行相生 next / 相克
  var SHENG={'木':'火','火':'土','土':'金','金':'水','水':'木'};   // A 生 B
  var KE={'木':'土','火':'金','土':'水','金':'木','水':'火'};       // A 克 B
  function generatorOf(el){ for(var k in SHENG){ if(SHENG[k]===el) return k; } return ''; } // 生 el 的那一行(母)

  // Determine favorable(喜用) & unfavorable(忌) element SETS deterministically.
  function favorSets(chart){
    var dmEl=chart.dayMasterElement||GAN2EL_C[chart.dayMaster]||'';
    var yong=[]; (chart.yongshen||'').split(/[·,]/).filter(Boolean).forEach(function(g){ var e=GAN2EL_C[g]||g; if(e&&yong.indexOf(e)<0)yong.push(e); });
    // 喜神：生日主(母) + 同类(比劫) if weak；耗泄(食伤/财/官杀) if strong
    var weak=/弱/.test(chart.wangShuai||'');
    var strong=/强|旺/.test(chart.wangShuai||'');
    var xi=[];
    if(dmEl){
      if(weak){ // 身弱喜印(生我)与比劫(同我)
        var mo=generatorOf(dmEl); if(mo)xi.push(mo); xi.push(dmEl);
      } else if(strong){ // 身强喜食伤(我生)、财(我克)、官杀(克我)
        if(SHENG[dmEl])xi.push(SHENG[dmEl]); if(KE[dmEl])xi.push(KE[dmEl]);
        for(var k in KE){ if(KE[k]===dmEl)xi.push(k); } // 克我者=官杀
      }
    }
    // 忌神：身弱→耗泄我的(食伤/财/官杀方向)；身强→再生助我的(印/比劫方向)。用神永远优先，忌只作用于非用神行。
    var ji=[];
    if(dmEl){

    ji=ji.filter(function(e){ return yong.indexOf(e)<0 && xi.indexOf(e)<0; });

  function luckCurveHTML(chart){
    if(!chart||!Array.isArray(chart.dayun)||chart.dayun.length<2) return '';
    var fs=favorSets(chart);
    var by=+((P.bdate||'').split('-')[0])||0;
    var age=by?((new Date().getFullYear())-by):-1;
    var pts=chart.dayun.map(function(d){
      var startY=by?(by+(d.startAge||0)):null;
      var on=(age>=0&&d.startAge!=null&&age>=d.startAge&&age<=(d.endAge!=null?d.endAge:999));
      return { gz:d.ganZhi||'', s:luckScore(d,fs), startAge:d.startAge||0, startY:startY, on:on };
    });
    // ── geometry ──
    var W=386, H=210, padL=8, padR=8, padT=26, padB=34;
    var innerW=W-padL-padR, innerH=H-padT-padB;
    var n=pts.length;
    var xAt=function(i){ return padL + innerW*(n===1?0.5:(i/(n-1))); };
    var yAt=function(v){ return padT + innerH*(1-(v-20)/78); }; // 20..98 → bottom..top
    // Catmull-Rom → cubic bezier smooth path
    function smooth(getX,getY){
      var d='M'+getX(0).toFixed(1)+','+getY(0).toFixed(1);
      for(var i=0;i<n-1;i++){
        var x0=getX(Math.max(0,i-1)),y0=getY(Math.max(0,i-1));
        var x1=getX(i),y1=getY(i);
        var x2=getX(i+1),y2=getY(i+1);
        var x3=getX(Math.min(n-1,i+2)),y3=getY(Math.min(n-1,i+2));
        var c1x=x1+(x2-x0)/6, c1y=y1+(y2-y0)/6;
        var c2x=x2-(x3-x1)/6, c2y=y2-(y3-y1)/6;
        d+='C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+x2.toFixed(1)+','+y2.toFixed(1);
      }
      return d;
    }
    var gx=function(i){return xAt(i);}, gy=function(i){return yAt(pts[i].s);};
    var line=smooth(gx,gy);
    var area=line+' L'+xAt(n-1).toFixed(1)+','+(padT+innerH).toFixed(1)+' L'+xAt(0).toFixed(1)+','+(padT+innerH).toFixed(1)+' Z';
    // gridlines (high / mid / low)
    var grid='';
    [ {v:88,lab:T.curveHigh},{v:55,lab:''},{v:36,lab:T.curveLow} ].forEach(function(g){
      var y=yAt(g.v);
      grid+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="rgba(240,235,224,.07)" stroke-width="1"'+(g.v===55?' stroke-dasharray="2 4"':'')+'/>';
      if(g.lab) grid+='<text x="'+(W-padR)+'" y="'+(y-4).toFixed(1)+'" fill="rgba(240,235,224,.3)" font-size="8.5" text-anchor="end" letter-spacing=".08em">'+esc(g.lab)+'</text>';
    });
    // node dots + gz labels + year axis
    var dots='',labels='',axis='';
    pts.forEach(function(p,i){
      var x=xAt(i),y=yAt(p.s);
      // gz label above node (alternate up/down handled by y already; place above line)
      var ly=y-11; if(ly<padT-2)ly=y+16;
      labels+='<text x="'+x.toFixed(1)+'" y="'+ly.toFixed(1)+'" fill="'+(p.on?'#f0e6c8':'rgba(240,235,224,.5)')+'" font-size="10" text-anchor="middle" font-family="var(--serif)" font-weight="600">'+esc(p.gz)+'</text>';
      // node
      if(p.on){
        dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="9" fill="rgba(220,192,130,.18)"><animate attributeName="r" values="7;11;7" dur="2.4s" repeatCount="indefinite"/></circle>';
        dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="5" fill="url(#lcGold)" stroke="#0f1b17" stroke-width="1.5"/>';
      } else {
        dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="3.4" fill="#0f1b17" stroke="url(#lcStroke)" stroke-width="1.6"/>';
      }
      // year / age axis
      var axLab=p.startY?(''+p.startY):(p.startAge+'');
      axis+='<text x="'+x.toFixed(1)+'" y="'+(H-13)+'" fill="rgba(240,235,224,.4)" font-size="8.5" text-anchor="middle">'+esc(axLab)+'</text>';
      if(i===0){ axis+='<text x="'+x.toFixed(1)+'" y="'+(H-3)+'" fill="rgba(240,235,224,.28)" font-size="7.5" text-anchor="middle">'+(EN?'age '+p.startAge:p.startAge+'岁')+'</text>'; }
    });
    // current marker text
    var cur=pts.filter(function(p){return p.on;})[0];
    var curTag = cur?('<text x="'+xAt(pts.indexOf(cur)).toFixed(1)+'" y="'+(yAt(cur.s)-19).toFixed(1)+'" fill="#e8d49c" font-size="8.5" text-anchor="middle" letter-spacing=".1em" font-weight="700">'+esc((EN?'':'· ')+T.curveNow.toUpperCase())+'</text>'):'';
    var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block" role="img" aria-label="'+esc(T.secCurve)+'">'
      +'<defs>'
      +'<linearGradient id="lcArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(79,191,160,.30)"/><stop offset="1" stop-color="rgba(79,191,160,0)"/></linearGradient>'
      +'<linearGradient id="lcStroke" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4fbfa0"/><stop offset=".55" stop-color="#7ddfc0"/><stop offset="1" stop-color="#e8d49c"/></linearGradient>'
      +'<radialGradient id="lcGold" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#f2e4b8"/><stop offset="1" stop-color="#dcc082"/></radialGradient>'
      +'</defs>'
      +grid
      +'<path d="'+area+'" fill="url(#lcArea)"/>'
      +'<path d="'+line+'" fill="none" stroke="url(#lcStroke)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'
      +labels+dots+curTag+axis
      +'</svg>';
    return '<div class="chart" style="padding:18px 14px 8px"><div style="font-size:12.5px;color:var(--ink-2);line-height:1.6;margin:0 4px 6px">'+esc(T.curveHint)+'</div>'+svg+'</div>';

  function paintChapter(id){

    if(!c) return;
    var tmp=document.createElement('div'); tmp.innerHTML=readCard(c);
    el.parentNode.replaceChild(tmp.firstChild,el);

  function ensureCard(id){
    if(document.getElementById('card-'+id)) return;
    var c=null; for(var i=0;i<READ_CHAPTERS.length;i++){ if(READ_CHAPTERS[i].id===id){c=READ_CHAPTERS[i];break;} }
    if(!c) return;

  // SSE fetch for one chapter (20s/章 timeout · accumulating chunks)
  window.loadChapter=function(id){
    if(_st[id]!=='idle'&&_st[id]!=='error') return;
    ensureCard(id);
    _st[id]='loading'; paintChapter(id);
    var ctrl=new AbortController();
    var to=setTimeout(function(){ ctrl.abort(); },20000);
    fetch('/api/bazi/chapter',{method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,
      body:JSON.stringify(Object.assign(bd(),{chapterId:id,token:localStorage.getItem('sy_token')||''}))})
    .then(function(res){
      clearTimeout(to);
      if(!res.ok||!res.body) throw new Error('stream failed');
      var reader=res.body.getReader(),dec=new TextDecoder('utf-8'),buf='';
      _st[id]='streaming'; paintChapter(id);
      function read(){
        reader.read().then(function(r){
          if(r.done){ if(_st[id]==='streaming'){ _st[id]='done'; paintChapter(id); afterChapter(id); } return; }
          buf+=dec.decode(r.value,{stream:true});
          var lines=buf.split('\n'); buf=lines.pop();
          var evErr=null;
          lines.forEach(function(line){
            if(line.indexOf('data: ')!==0) return;
            try{
              var ev=JSON.parse(line.slice(6));
              if(ev.type==='chunk'){ _txt[id]=stripLead(id,(_txt[id]||'')+ev.content); _st[id]='streaming'; paintChapter(id); }
              else if(ev.type==='done'){ _st[id]='done'; paintChapter(id); afterChapter(id); }
              else if(ev.type==='locked'){ _st[id]='locked'; paintChapter(id); afterChapter(id); }
              else if(ev.type==='error'){ evErr=ev.message||'error'; }
            }catch(e){}
          });
          // 服务端 error 事件：旧写法在 try 里 throw，被同一个 catch 吞掉，
          // 章节会停在 streaming 然后按 done 渲染成空/半截。这里显式处理。
          if(evErr){ clearTimeout(to); _st[id]='error'; paintChapter(id); afterChapter(id); return; }
          if(_st[id]==='streaming') read();
        }).catch(function(){ clearTimeout(to); if(_st[id]!=='done'&&_st[id]!=='locked'){ _st[id]='error'; paintChapter(id); afterChapter(id); } });
      }
      read();
    }).catch(function(){ clearTimeout(to); _st[id]='error'; paintChapter(id); afterChapter(id); });
  };

      + '<div id="charms-slot"></div>'
      + '<div id="paywall-slot"></div>'
      + '<div class="expand">'+esc(T.techLabel)+'</div>'
      + '<div id="tail"></div>'
      + '<div class="foot"><div class="d">'+esc(T.footDisc)+'</div><div class="sig">'+esc(T.footSig)+'</div></div>';
    body.innerHTML=html;
    // scaffold the free reading chapter (streamed text)
    ensureCard('year');
    // 1) grab deterministic chart via /bazi/stream meta, then abort
    fetchChartMeta();
    // 2) start streaming the reading chapter in parallel
    loadChapter('year');
  }

  function fillDeterministic(chart,pillars){
    var np=normPillars(chart,pillars);
    renderHero(np);
    // pillars
    var cc=document.getElementById('chartcard'); if(cc){ cc.innerHTML=pillarsHTML(np); cc.classList.remove('skel-chart'); }
    // insight
    var isl=document.getElementById('insight-slot'); if(isl&&chart){ isl.innerHTML=insightHTML(chart); }
    // elements
    var esl=document.getElementById('elements-slot'); if(esl){ var eh=elementsHTML(chart); if(eh) esl.innerHTML=eh; }
    // life luck curve (above the timeline)
    try{ var ch=luckCurveHTML(chart); if(ch){ document.getElementById('curve-slot').innerHTML=ch; document.getElementById('curve-sec').style.display=''; } }catch(e){}
    // timeline
    var th=timelineHTML(chart);
    if(th){ document.getElementById('timeline-slot').innerHTML=th; document.getElementById('luck-sec').style.display=''; }
    // remedy
    var rh=remedyHTML(chart);
    if(rh){ document.getElementById('remedy-slot').innerHTML=rh; document.getElementById('remedy-sec').style.display=''; }
    // lucky charms 带货 (after 开运锦囊)
    try{ var cm=charmsHTML(chart); if(cm){ document.getElementById('charms-slot').innerHTML=cm; } }catch(e){}
  }

  // /bazi/stream: read first `meta` (chart/pillars + tier), abort — don't burn LLM tokens
  function fetchChartMeta(){
    var ctrl=new AbortController(), got=false;
    var to=setTimeout(function(){ ctrl.abort(); },12000);
    fetch('/api/bazi/stream',{method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,
      body:JSON.stringify(Object.assign(bd(),{mode:'truth',question:EN?'Please analyze my chart':'请全面分析我的命盘',token:localStorage.getItem('sy_token')||''}))})
    .then(function(res){
      if(!res.ok||!res.body) throw new Error('meta failed');
      var reader=res.body.getReader(),dec=new TextDecoder('utf-8'),buf='';
      function read(){
        reader.read().then(function(r){
          if(r.done||got) return;
          buf+=dec.decode(r.value,{stream:true});
          var lines=buf.split('\n'); buf=lines.pop();
          lines.forEach(function(line){
            if(line.indexOf('data: ')!==0||got) return;
            try{
              var ev=JSON.parse(line.slice(6));
              if(ev.type==='meta'){
                got=true; clearTimeout(to);
                if(ev.tier==='full'||ev.tier==='paid'||ev.locked===false){ _hasFull=true; try{ resumePaidIfLate(); }catch(e){} }
                CHART=ev.chart||null;
                try{ fillDeterministic(ev.chart||null,ev.pillars||null); }catch(e){}
                ctrl.abort();
              }
            }catch(e){}
          });
          if(!got) read();
        }).catch(function(){ metaFail(); });
      }
      read();
    }).catch(function(){ metaFail(); });

    // 命盘 meta 拿不到（网络/超时/后端 5xx）：旧写法只 clearTimeout 什么都不说，
    // hero 空着、命盘和五行永远停在骨架屏。现在给可点的重试。
    function metaFail(){
      if(got) return;
      clearTimeout(to);
      var cc=document.getElementById('chartcard');
      if(cc){ cc.classList.remove('skel-chart');
        cc.innerHTML='<div class="err">'+esc(T.chartErr)+'<br><br><button class="cta" style="max-width:180px;margin:12px auto 0" onclick="fetchChartMeta()">'+esc(T.retry)+'</button></div>'; }
      var esl=document.getElementById('elements-slot'); if(esl) esl.innerHTML='';
    }
  }

  function fail(msg){ document.getElementById('body').innerHTML='<div class="err">'+esc(msg)+'<br><br><button class="cta" style="max-width:200px;margin:14px auto 0" onclick="location.reload()">'+esc(T.retry)+'</button></div>'; }

  window.goCheckout=function(product){
    fetch('/api/create-checkout',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({product:product,token:localStorage.getItem('sy_token')||'',
        successUrl:location.origin+'/pages/report-v2.html?paid=1',cancelUrl:location.href})})
     .then(function(r){return r.json();}).then(function(d){
       if(d.url){ location.href=d.url; }
       else if(d.channel==='cn'){ alert(T.cnPay); }
       else { alert(T.payFail); }
     }).catch(function(){ alert(T.netErr); });
  };

  if(_noProfile){
    /* 已跳采集页，不再发请求 */
  } else if(M==='bazi'){
    startProgressive();
  } else {
    document.getElementById('body').innerHTML='<div class="chart" style="text-align:center"><div style="font-family:var(--serif);font-size:20px;margin-bottom:6px;color:#fff">'+esc(NAMES[M]||'')+'</div><div style="font-size:13px;color:rgba(255,255,255,.7)">'+esc(T.comingHead)+'</div></div><div class="read"><p>'+esc(T.comingBody)+'</p></div><button class="cta" onclick="localStorage.setItem(\'runae_method\',\'bazi\');location.reload()">'+esc(T.seeBazi)+'</button>';
  }
</script>
<script src="/pages/report-export.js" defer></script>
</body>
