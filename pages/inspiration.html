.back-btn{position:fixed;top:16px;left:16px;z-index:99;background:none;border:none;font-family:'Noto Serif SC',serif;font-size:13px;color:var(--gold);letter-spacing:0.06em;cursor:pointer;padding:4px 0}
.shimmer-text{background:linear-gradient(90deg,var(--gold-deep),var(--gold),var(--gold-light),var(--gold),var(--gold-deep));background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gold-shimmer 3s linear infinite}

.header{padding:50px 20px 10px;text-align:center;animation:fadeUp 0.7s ease both}

.header-zh{font-size:18px;letter-spacing:0.18em;font-weight:500;color:var(--ink)}
.header-line{height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,0.3),transparent);width:80px;margin:8px auto 0}

.inspiration-card::after{content:'';position:absolute;inset:0;

.card-inner{position:relative;z-index:1;width:100%}

.card-deco span:nth-child(2){animation-delay:0.4s}

.archive-toggle:active{transform:scale(0.97)}
.archive-toggle:hover{border-color:rgba(201,168,76,0.2);color:var(--ink-mid)}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;max-width:360px;width:90%;padding:12px 16px;border-radius:8px;font-size:12px;letter-spacing:0.06em;text-align:center;cursor:pointer;

</style>

// ── Helpers ──
function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function getToday() {
  var now = new Date();
  var y = now.getFullYear();
  var m = now.getMonth() + 1;
  var d = now.getDate();
  var wd = ['日','一','二','三','四','五','六'][now.getDay()];
  var idx = (y * 365 + m * 31 + d) % QUOTES.length;
  return {year: y, month: m, day: d, weekday: wd, idx: idx, raw: now};
}

function dateStr(d) {
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}

// ── Get / save seen state ──
function getSeenDates() {
  var raw = localStorage.getItem('sy_inspire_seen');
  try { return raw ? JSON.parse(raw) : []; } catch(e) { return []; }
}

  var today = dateStr(new Date());
  if (dates.indexOf(today) === -1) {
    dates.push(today);
    localStorage.setItem('sy_inspire_seen', JSON.stringify(dates));
  }
}

function isTodaySeen() {
  return getSeenDates().indexOf(dateStr(new Date())) !== -1;
}

// ── Lunar date approximation ──
function getLunarDate() {
  var now = new Date();
  var y = now.getFullYear();
  var m = now.getMonth() + 1;
  var d = now.getDate();
  // Simple lookup table for 2025-2027 new moon offsets (days from Jan 1)
  var lunarNewYear = {
    2025: {month:1, day:29, animal:'蛇'},
    2026: {month:2, day:17, animal:'马'},
    2027: {month:2, day:6, animal:'羊'}
  };
  var ln = lunarNewYear[y] || lunarNewYear[2026];
  // Rough approximation
  var ref = new Date(y, ln.month - 1, ln.day);
  var diff = Math.round((now - ref) / 86400000);
  var lm = 1;
  var ld = diff + 1;
  // 29-30 day lunar months (rough)
  var monthDays = [29,30,29,30,29,30,29,30,29,30,29,29];
  for (var i = 0; i < monthDays.length; i++) {
    if (ld <= monthDays[i]) { lm = i + 1; break; }
    ld -= monthDays[i];
  }
  if (ld < 1 || ld > 30) { ld = diff + 1; lm = 1; }
  return {month: lm, day: ld, animal: ln.animal};
}

// ── Render ──
function renderDate() {
  var t = getToday();
  var mons = ['一','二','三','四','五','六','七','八','九','十','十一','十二'];
  document.getElementById('dateDisplay').textContent = t.year + '年' + mons[t.month-1] + '月' + t.day + '日 · 星期' + t.weekday;
  var lunar = getLunarDate();
  document.getElementById('lunarDisplay').textContent = '农历' + (lunar.month === 1 ? '正' : lunar.month === 12 ? '腊' : mons[lunar.month-1]) + '月' + lunar.day + '日 · ' + lunar.animal + '年';
}

function renderQuote() {
  var t = getToday();
  var q = QUOTES[t.idx];
  document.getElementById('quoteCN').textContent = '「' + q.cn + '」';
  document.getElementById('quoteEN').textContent = '—— ' + q.en + ' ——';
  document.getElementById('quoteSource').textContent = '— ' + q.src + ' —';
}

function renderSeenBadge() {
  var badge = document.getElementById('seenBadge');
  var label = document.getElementById('seenLabel');
  if (isTodaySeen()) {
    badge.classList.add('seen-today');
    label.textContent = '今日已阅 · 灵感入心';
  } else {
    badge.classList.remove('seen-today');
    label.textContent = '今日还未查看';
  }
}

// Zodiac guidance
var selectedZodiac = null;

function renderZodiacSelector() {
  var container = document.getElementById('zodiacSelector');
  var html = '';
  for (var i = 0; i < ZODIAC_SIGNS.length; i++) {
    var s = ZODIAC_SIGNS[i];
    html += '<span class="zodiac-tag" data-sign="' + s + '" onclick="selectZodiac(\'' + s + '\')">' + s + '</span>';
  }
  container.innerHTML = html;
  // Restore last selection
  var saved = localStorage.getItem('sy_inspire_zodiac');
  if (saved && ZODIAC_SIGNS.indexOf(saved) !== -1) {
    selectZodiac(saved);
  }
}

function selectZodiac(sign) {
  selectedZodiac = sign;
  localStorage.setItem('sy_inspire_zodiac', sign);
  // Update active state
  var tags = document.querySelectorAll('.zodiac-tag');
  for (var i = 0; i < tags.length; i++) {
    tags[i].classList.toggle('active', tags[i].getAttribute('data-sign') === sign);
  }
  // Show guidance — deterministic by zodiac + day
  var t = getToday();
  var guidance = ZODIAC_GUIDANCE[sign] || ZODIAC_GUIDANCE['default'];
  var idx = (t.year + t.month + t.day + sign.length) % guidance.length;
  document.getElementById('zodiacReading').innerHTML = '✦ ' + guidance[idx];
  markSeen();
  renderSeenBadge();
}

// ── Share ──
function shareInspiration() {
  var t = getToday();
  var q = QUOTES[t.idx];
  var text = '【善缘·每日灵感】\n' + t.year + '年' + t.month + '月' + t.day + '日\n\n' +
    '「' + q.cn + '」\n' + q.en + '\n' +
    '— ' + q.src + ' —\n\n' +
    (selectedZodiac ? '✦ ' + selectedZodiac + '指引：' + (document.getElementById('zodiacReading').textContent || '') + '\n\n' : '') +
    '—— 善缘 ShenYuan';
  if (navigator.share) {
    navigator.share({title:'善缘·每日灵感', text:text}).catch(function(){});
  } else {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      showToast('已复制灵感文字，快去分享吧');
    } catch(e) {
      showToast('分享内容已生成');
    }
    document.body.removeChild(ta);
  }
}

function saveAsCard() {
  showToast('📸 截图保存 · 长按卡片区域，选择"保存图片"或截图即可保存为卡片');
}

function goHome() {
  window.location.href = '/';
}

function showToast(msg) {
  var t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = msg;
  t.onclick = function(){ t.style.opacity = '0'; setTimeout(function(){ t.remove(); }, 300); };
  document.body.appendChild(t);
  if (t._timer) clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.style.opacity = '0'; setTimeout(function(){ t.remove(); }, 300); }, 3500);
}

// ── Init ──
renderDate();
renderQuote();
renderSeenBadge();
renderZodiacSelector();
</script>
