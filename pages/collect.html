<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Runae · Begin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#060e0d;--card:#0f1b17;--card-2:#0b1512;
    --ink:#f0ebe0;--ink-2:rgba(240,235,224,.70);--ink-3:rgba(240,235,224,.42);
    --gold:#dcc082;--gold-soft:#e8d49c;--gold-wash:rgba(220,192,130,.14);
    --jade:#4fbfa0;--jade-deep:#0e2b24;--jade-soft:#7DDFC0;--jade-wash:rgba(79,191,160,.12);
    --line:rgba(240,235,224,.10);--line-2:rgba(240,235,224,.17);
    --sans:'Inter',-apple-system,system-ui,sans-serif;--serif:'Cormorant Garamond','Noto Serif SC',serif;
    --rl:20px;--r:14px;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color-scheme:dark}body{background:var(--paper);font-family:var(--sans);color:var(--ink);line-height:1.5;font-feature-settings:"tnum";min-height:100vh}
  .wrap{max-width:430px;margin:0 auto;padding:0 24px 40px;min-height:100vh}
  svg.ic{width:18px;height:18px;stroke:var(--ink-3);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 12px}
  .brand{font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:.01em}
  .brand .dot{color:var(--jade)}
  .step{font-size:11px;color:var(--ink-3);letter-spacing:.1em;font-weight:600}
  .stepper{display:flex;align-items:center;gap:7px;margin:2px 2px 22px}
  .stepper i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
  .stepper i.on{background:var(--jade)}
  .stepper .ln{flex:1;height:1px;background:var(--line-2)}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:12px}
  h1.t{font-family:var(--serif);font-size:37px;font-weight:600;line-height:1.12;letter-spacing:-.012em}
  .sub{font-size:14px;color:var(--ink-2);margin-top:12px;line-height:1.65}
  .sec{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;margin:28px 2px 13px}
  .field{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;align-items:center;gap:13px;margin-bottom:10px;transition:border-color .15s}
  .field:focus-within{border-color:var(--jade)}
  .field .fcol{flex:1;min-width:0}
  .field .lab{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.02em}
  .field input,.field select{border:none;background:transparent;font-family:var(--sans);font-size:15px;color:var(--ink);font-weight:500;width:100%;margin-top:2px;outline:none}
  .field input::placeholder{color:var(--ink-3);font-weight:400}
  .field .opt{font-size:11px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
  .dsel{display:flex;gap:7px}.dsel select{flex:1;min-width:0;font-size:15px;padding:1px 0}
  .cal-toggle{display:flex;gap:2px;background:var(--jade-wash);border-radius:9px;padding:2px;flex-shrink:0}
  .cal-toggle span{font-size:11px;padding:5px 10px;border-radius:7px;color:var(--ink-3);cursor:pointer;font-weight:500}
  .cal-toggle span.on{background:#fff;color:var(--jade);font-weight:600}
  .row2{display:flex;gap:10px}.row2>*{flex:1}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 12px;text-align:center;cursor:pointer;transition:border-color .15s;position:relative}
  .tile.done{border-color:var(--jade)}
  .tile .plus{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;margin:0 auto 9px}
  .tile.done .plus{border-color:var(--jade);background:var(--jade-wash)}
  .tile .n{font-size:13px;font-weight:600}
  .tile .h{font-size:12px;color:var(--ink-3);margin-top:3px}
  .tile.done .h{color:var(--jade)}
  .tile input[type=file]{display:none}
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip{padding:10px 17px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer;user-select:none}
  .chip.on{background:var(--jade);color:#fff;border-color:var(--jade);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
  .cta{width:100%;background:var(--jade-deep);color:#fff;border:none;border-radius:var(--r);padding:17px;font-size:15.5px;font-weight:600;font-family:var(--sans);letter-spacing:.01em;box-shadow:0 14px 30px -16px rgba(28,74,58,.55);cursor:pointer;margin-top:28px}
  .cta:disabled{opacity:.4;box-shadow:none;cursor:not-allowed}
  .hint{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--ink-3);margin-top:14px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 6-8 11-8 11s-8-5-8-11a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="2.6"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 20v-1.5a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4V20"/><circle cx="12" cy="8" r="3.6"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M22 18a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3l1.6-2.4h6.8L17 7h3a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="3.4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></symbol>
</defs></svg>

<div class="wrap">
  <div class="bar"><div class="brand">Runae<span class="dot">.</span></div><div class="step">1 / 3</div></div>
  <div class="stepper"><i class="on"></i><span class="ln"></span><i></i><span class="ln"></span><i></i></div>
  <div class="eyebrow" id="eyebrow">你的命盘起点</div>
  <h1 class="t" id="title">先告诉我<br>你是谁</h1>
  <p class="sub" id="sub">八字 · 塔罗 · 星座 · 面相 · 手相，想算什么都行。填一次，以后回来直接看，不用重填。</p>

  <div class="sec" id="secBirth">出生信息</div>
  <div class="field">
    <svg class="ic"><use href="#i-cal"/></svg>
    <div class="fcol"><div class="lab" id="labDate">出生日期</div><div class="dsel"><select id="byear"></select><select id="bmonth"></select><select id="bday"></select></div></div>
    <div class="cal-toggle"><span class="on" data-cal="solar" id="calSolar">阳历</span><span data-cal="lunar" id="calLunar">农历</span></div>
  </div>
  <div class="field">
    <svg class="ic"><use href="#i-clock"/></svg>
    <div class="fcol"><div class="lab" id="labTime">出生时间</div><input id="btime" type="time" placeholder="不确定可跳过"></div>
    <span class="opt" id="optTime">可选</span>
  </div>
  <div class="field">
    <svg class="ic"><use href="#i-pin"/></svg>
    <div class="fcol"><div class="lab" id="labCity">出生地</div><input id="bcity" type="text" placeholder="城市，如 上海"></div>
    <span class="opt" id="optCity">可选</span>
  </div>
  <div class="field">
    <svg class="ic"><use href="#i-user"/></svg>
    <div class="fcol"><div class="lab" id="labGender">性别</div>
      <select id="gender"><option value="female" id="gFemale">女</option><option value="male" id="gMale">男</option></select>
    </div>
  </div>

  <div class="sec" id="secPhoto">加了更准 · 可选</div>
  <div class="tiles">
    <label class="tile" id="tilePalm"><div class="plus"><svg class="ic" style="stroke:var(--ink-2)"><use href="#i-plus"/></svg></div><div class="n" id="palmN">手相照</div><div class="h" id="palmH">解锁手相推演</div><input type="file" accept="image/*" data-photo="palm"></label>
    <label class="tile" id="tileFace"><div class="plus"><svg class="ic" style="stroke:var(--ink-2)"><use href="#i-cam"/></svg></div><div class="n" id="faceN">面相照</div><div class="h" id="faceH">解锁面相推演</div><input type="file" accept="image/*" data-photo="face"></label>
  </div>

  <div class="sec" id="secAspect">你最想看哪方面</div>
  <div class="chips" id="aspects">
    <span class="chip on" data-a="career">事业</span>
    <span class="chip on" data-a="love">爱情</span>
    <span class="chip" data-a="wealth">财运</span>
    <span class="chip" data-a="health">健康</span>
  </div>

  <button class="cta" id="next">下一步 · 选择推演</button>
  <div class="hint"><svg class="ic" style="width:14px;height:14px"><use href="#i-shield"/></svg><span id="hintTxt">信息仅用于生成你的报告</span></div>
</div>

<script>
  // ===== 统一语言检测 =====
  var LANG=(new URLSearchParams(location.search).get('lang'))||localStorage.getItem('runae_lang')||'zh';localStorage.setItem('runae_lang',LANG);var EN=(LANG==='en');

  // ===== 文案字典 =====
  var T={
    zh:{
      docTitle:'Runae · 开始你的推演',
      htmlLang:'zh-CN',
      eyebrow:'你的命盘起点',
      title:'先告诉我<br>你是谁',
      sub:'八字 · 塔罗 · 星座 · 面相 · 手相，想算什么都行。填一次，以后回来直接看，不用重填。',
      secBirth:'出生信息',
      labDate:'出生日期', calSolar:'阳历', calLunar:'农历', yearPh:'年', monthPh:'月', dayPh:'日',
      labTime:'出生时间', timePh:'不确定可跳过', optTime:'可选',
      labCity:'出生地', cityPh:'城市，如 上海', optCity:'可选',
      labGender:'性别', gFemale:'女', gMale:'男',
      secPhoto:'加了更准 · 可选',
      palmN:'手相照', palmH:'解锁手相推演',
      faceN:'面相照', faceH:'解锁面相推演',
      photoAdded:'已添加',
      secAspect:'你最想看哪方面',
      career:'事业', love:'爱情', wealth:'财运', health:'健康',
      next:'下一步 · 选择推演',
      hint:'信息仅用于生成你的报告',
      alertDate:'请填写出生日期'
    },
    en:{
      docTitle:'Runae · Begin',
      htmlLang:'en',
      eyebrow:'Where your chart begins',
      title:'First, tell me<br>who you are',
      sub:'BaZi · Tarot · Astrology · Face · Palm — read whatever you like. Fill this out once; come back anytime, no need to re-enter.',
      secBirth:'Birth information',
      labDate:'Birth date', calSolar:'Solar', calLunar:'Lunar', yearPh:'Year', monthPh:'Month', dayPh:'Day',
      labTime:'Birth time', timePh:'Skip if unsure', optTime:'Optional',
      labCity:'Birthplace', cityPh:'City, e.g. Shanghai', optCity:'Optional',
      labGender:'Gender', gFemale:'Female', gMale:'Male',
      secPhoto:'Add a photo for a sharper read · Optional',
      palmN:'Palm photo', palmH:'Unlock palm reading',
      faceN:'Face photo', faceH:'Unlock face reading',
      photoAdded:'Added',
      secAspect:'What matters most to you',
      career:'Career', love:'Love', wealth:'Wealth', health:'Health',
      next:'Next · Choose a reading',
      hint:'Only used to create your reading',
      alertDate:'Please enter your birth date'
    }
  };
  var t=T[LANG]||T.zh;

  // ===== 应用文案 =====
  document.documentElement.lang=t.htmlLang;
  document.title=t.docTitle;
  document.getElementById('eyebrow').textContent=t.eyebrow;
  document.getElementById('title').innerHTML=t.title;
  document.getElementById('sub').textContent=t.sub;
  document.getElementById('secBirth').textContent=t.secBirth;
  document.getElementById('labDate').textContent=t.labDate;
  document.getElementById('calSolar').textContent=t.calSolar;
  document.getElementById('calLunar').textContent=t.calLunar;
  document.getElementById('labTime').textContent=t.labTime;
  document.getElementById('btime').placeholder=t.timePh;
  document.getElementById('optTime').textContent=t.optTime;
  document.getElementById('labCity').textContent=t.labCity;
  document.getElementById('bcity').placeholder=t.cityPh;
  document.getElementById('optCity').textContent=t.optCity;
  document.getElementById('labGender').textContent=t.labGender;
  document.getElementById('gFemale').textContent=t.gFemale;
  document.getElementById('gMale').textContent=t.gMale;
  document.getElementById('secPhoto').textContent=t.secPhoto;
  document.getElementById('palmN').textContent=t.palmN;
  document.getElementById('palmH').textContent=t.palmH;
  document.getElementById('faceN').textContent=t.faceN;
  document.getElementById('faceH').textContent=t.faceH;
  document.getElementById('secAspect').textContent=t.secAspect;
  (function(){ var m={career:t.career,love:t.love,wealth:t.wealth,health:t.health};
    document.querySelectorAll('#aspects .chip').forEach(function(c){ if(m[c.dataset.a]) c.textContent=m[c.dataset.a]; }); })();
  document.getElementById('next').textContent=t.next;
  document.getElementById('hintTxt').textContent=t.hint;

  // 载入已有 profile（回访免重填）
  var P = {};
  try { P = JSON.parse(localStorage.getItem('runae_profile')||'{}'); } catch(e){}
  (function(){
    var ys=document.getElementById('byear'),ms=document.getElementById('bmonth'),ds=document.getElementById('bday');
    var MON_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function opt(s,v,l){var o=document.createElement('option');o.value=v;o.textContent=l;s.appendChild(o);}
    opt(ys,'',t.yearPh); var ny=new Date().getFullYear(); for(var y=ny;y>=1920;y--)opt(ys,y,y);
    opt(ms,'',t.monthPh); for(var mo=1;mo<=12;mo++)opt(ms,mo,EN?MON_EN[mo-1]:(mo+'月'));
    opt(ds,'',t.dayPh); for(var d=1;d<=31;d++)opt(ds,d,EN?String(d):(d+'日'));
    if(P.bdate){var pp=P.bdate.split('-');if(pp.length===3){ys.value=+pp[0];ms.value=+pp[1];ds.value=+pp[2];}}
  })();
  if(P.btime) document.getElementById('btime').value = P.btime;
  if(P.bcity) document.getElementById('bcity').value = P.bcity;
  if(P.gender) document.getElementById('gender').value = P.gender;
  if(P.cal){ document.querySelectorAll('.cal-toggle span').forEach(function(s){ s.classList.toggle('on', s.dataset.cal===P.cal); }); }

  // 阳历/农历
  document.querySelectorAll('.cal-toggle span').forEach(function(s){
    s.onclick=function(){ document.querySelectorAll('.cal-toggle span').forEach(function(x){x.classList.remove('on');}); s.classList.add('on'); };
  });
  // 方向多选
  document.querySelectorAll('#aspects .chip').forEach(function(c){
    c.onclick=function(){ c.classList.toggle('on'); };
  });
  // 照片（仅标记已选，真实上传在后端流程接）
  var photos={};
  document.querySelectorAll('input[type=file]').forEach(function(inp){
    inp.onchange=function(){
      var k=inp.dataset.photo; if(inp.files&&inp.files[0]){ photos[k]=inp.files[0].name; inp.closest('.tile').classList.add('done'); inp.closest('.tile').querySelector('.h').textContent=t.photoAdded; }
    };
  });

  document.getElementById('next').onclick=function(){
    var _y=document.getElementById('byear').value,_m=document.getElementById('bmonth').value,_d=document.getElementById('bday').value;
    if(!_y||!_m||!_d){ alert(t.alertDate); return; }
    var bdate=_y+'-'+('0'+_m).slice(-2)+'-'+('0'+_d).slice(-2);
    var aspects=[]; document.querySelectorAll('#aspects .chip.on').forEach(function(c){ aspects.push(c.dataset.a); });
    var cal=document.querySelector('.cal-toggle span.on').dataset.cal;
    var prof={
      bdate:bdate, btime:document.getElementById('btime').value||'',
      bcity:document.getElementById('bcity').value||'', gender:document.getElementById('gender').value,
      cal:cal, aspects:aspects, hasPalm:!!photos.palm, hasFace:!!photos.face,
      ts:Date.now()
    };
    localStorage.setItem('runae_profile', JSON.stringify(prof));
    location.href='pick.html?lang='+LANG;
  };
</script>
</body>
</html>
