<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#faf8f5;--card:#ffffff;--mid:#f5f0e8;

/* Input form */

.form-section{margin-bottom:16px}

.name-row{display:flex;gap:8px}

/* Select */

.select-wrap::after{content:'▼';position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:8px;color:rgba(201,168,76,0.4);pointer-events:none}

/* Gender toggle */

/* Stardust */
.stardust span{position:absolute;width:3px;height:3px;background:rgba(201,168,76,0.5);border-radius:50%;animation:twinkle 3s ease-in-out infinite;opacity:0;transition:opacity .5s}

@keyframes gold-shimmer{0%{background-position:-300% center}100%{background-position:300% center}}

<script>
var gender = 'male';
var lastContextId = null;
var ZODIAC_LIST = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];

function selectGender(g) {
  gender = g;
  document.getElementById('genderMale').classList.toggle('active', g === 'male');
  document.getElementById('genderFemale').classList.toggle('active', g === 'female');
}

function submitXingming() {
  var surname = document.getElementById('surnameInput').value.trim();
  var givenName = document.getElementById('nameInput').value.trim();
  var zodiac = document.getElementById('zodiacSelect').value;

  if (!surname) { showToast('请输入姓氏', 'error'); return; }
  if (!givenName) { showToast('请输入名字', 'error'); return; }
  if (!zodiac) { showToast('请选择生肖', 'error'); return; }

  document.querySelector('.form-wrap').style.display = 'none';
  document.querySelector('.submit-wrap').style.display = 'none';
  document.getElementById('loadingScreen').style.display = 'flex';

  var stepsEl = document.getElementById('loadSteps');
  stepsEl.innerHTML = '';
  var steps = ['姓名录入完成…','推演笔画数理…','分析五行生克…','参考生肖喜忌…','生成姓名报告…'];
  steps.forEach(function(s,i){
    setTimeout(function(){
      stepsEl.innerHTML += '<div class="load-step">✓ '+s+'</div>';
    }, i * 350);
  });

  setTimeout(function(){
    fetch('/api/xingming', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        surname: surname,
        givenName: givenName,
        zodiac: zodiac,
        gender: gender,
        token: localStorage.getItem('sy_token') || ''
      })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      document.getElementById('loadingScreen').style.display = 'none';
      if (d.error) { showToast(d.error, 'error'); resetAll(); return; }
      if (d.contextId) lastContextId = d.contextId;
      var fullName = surname + givenName;
      var reportText = d.reading || d.interpretation || d.report || d.result || d.answer || '暂无回应，请重试';
      renderReport(reportText, fullName, zodiac, gender);
      document.getElementById('qaSection').style.display = 'block';
      if (!d.hasFullAccess) document.getElementById('unlockSection').style.display = 'block';
    })
    .catch(function(){
      document.getElementById('loadingScreen').style.display = 'none';
      showToast('网络异常，请重试', 'error');
      resetAll();
    });
  }, steps.length * 350 + 300);
}

function parseSections(text) {
  var known = ['📜','💰','💼','❤️','💪','🌟','🔮','📊','🎯','🔥','💧','🌿','🌊','⛰','⚔️','🛡️','✨','💫','⭐','☯','🌙','🌙','📈','💕','🤝','🎓','🏠','🚗','❄️','⚡','🌪','🏆','🎁','📝','💡','🕯','⚱','🧿','🔔','🗝','🪷','♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓','⚖️','🔱','🖌','📏','🧮','🔤','🏅','📛'];
  var lines = text.split('\n');
  var sections = [];
  var current = null;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var matched = null;
    for (var k = 0; k < known.length; k++) {
      if (line.indexOf(known[k]) === 0) { matched = known[k]; break; }
    }
    if (matched) {
      if (current && current.lines.length) sections.push(current);
      current = { emoji: matched, title: line.substring(matched.length).trim(), lines: [] };
    } else if (current) {
      current.lines.push(line);
    } else if (line.trim()) {
      current = { emoji: '📛', title: '姓名分析', lines: [line] };
    }
  }
  if (current && current.lines.length) sections.push(current);
  return sections;
}

function renderReport(text, fullName, zodiac, gender) {
  var sections = parseSections(text);
  var reportEl = document.getElementById('reportScreen');
  var genderLabel = gender === 'male' ? '男' : '女';

  var summaryHtml = '<div class="summary-glyph">📛</div>';
  summaryHtml += '<div class="summary-total">' + fullName.replace(/</g,'&lt;') + '</div>';
  summaryHtml += '<div class="summary-label">' + zodiac + '年 · ' + genderLabel + '</div>';
  document.getElementById('summaryCard').innerHTML = summaryHtml;
  document.getElementById('summaryCard').style.display = 'block';

  var html = '';

  // AIGC disclaimer
  html += '<div style="display:flex;align-items:center;gap:6px;margin:12px 16px 0;padding:7px 12px;background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.15);border-radius:6px;font-size:11px;color:rgba(201,168,76,0.75);letter-spacing:0.06em"><span>🤖</span><span><b>AI 生成内容</b> · 仅供文化娱乐参考。</span></div>';

  // Progress bar
  html += '<div id="readProgressWrap"><div id="readProgressBar"></div></div>';

  // Chapter cover
  html += '<div class="chapter-cover">';
  html += '<img class="chapter-cover-img" src="../samples/caijing/art-mingge.png" alt="" loading="lazy">';
  html += '<div class="chapter-cover-veil"></div>';
  html += '<div class="chapter-cover-body">';
  html += '<div class="chapter-cover-num">NAME NUMEROLOGY · FIVE ELEMENTS</div>';
  html += '<div class="chapter-cover-title">姓名称骨报告</div>';
  html += '<div class="chapter-cover-lead">' + fullName.replace(/</g,'&lt;') + ' · ' + zodiac + '年 · ' + genderLabel + ' · AI 五格剖象</div>';
  html += '</div></div>';

  // TOC
  if (sections.length > 1) {
    html += '<div class="chapter-toc">';
    html += '<div class="chapter-toc-title"><span>✦</span> 报告目录</div>';
    sections.forEach(function(sec, i) {
      html += '<a class="chapter-toc-item" href="#xm-sec-' + i + '">';
      html += '<span class="chapter-toc-idx">' + (i+1).toString().padStart(2,'0') + '</span>';
      html += '<span class="chapter-toc-label">' + (sec.emoji || '') + ' ' + (sec.title || '分析') + '</span>';
      html += '<span class="chapter-toc-arrow">›</span>';
      html += '</a>';
    });
    html += '</div>';
  }

  // ReportViz: Score rings for 五格
  if (window.ReportViz) {
    var rings = window.ReportViz.renderScoreRing.group([
      {label:'天格',score:81,max:100,sub:'祖先格',tone:'gold'},
      {label:'地格',score:67,max:100,sub:'前运格',tone:'auto'},
      {label:'人格',score:73,max:100,sub:'主运格',tone:'auto'},
      {label:'外格',score:55,max:100,sub:'社交格',tone:'auto'},
      {label:'总格',score:76,max:100,sub:'综合运',tone:'auto'}
    ], '五格数理剖象');
    html += '<div style="margin:0 4px">' + rings + '</div>';
  }

  // Report sections
  var reportHeader = '<div class="report-header">';
  reportHeader += '<div class="form-label">姓名分析：</div><div class="report-question">' + fullName.replace(/</g,'&lt;') + ' · ' + zodiac + '年 · ' + genderLabel + '</div>';
  reportHeader += '</div>';
  html += reportHeader;

  if (sections.length > 0) {
    html += '<div class="ai-section-wrap">';
    for (var i = 0; i < sections.length; i++) {
      var sec = sections[i];
      var bg = SECTION_ICONS[sec.emoji] || 'rgba(201,168,76,0.2)';
      html += '<div id="xm-sec-' + i + '" class="ai-section open">';
      html += '<div class="ai-section-head" onclick="var b=this.nextElementSibling;b.classList.toggle(\'open\');this.querySelector(\'.ai-section-arrow\').classList.toggle(\'open\')">';
      html += '<div class="ai-section-icon" style="background:'+bg+'">'+(sec.emoji||'📛')+'</div>';
      html += '<div class="ai-section-title">'+(sec.title||'姓名分析')+'</div>';
      html += '<div class="ai-section-arrow">⬇</div>';
      html += '</div>';
      html += '<div class="ai-section-body open"><div class="ai-section-text drop-cap">'+sec.lines.join('\n')+'</div></div>';
      html += '</div>';
      // Pull quote after first section
      if (i === 0) {
        html += '<div class="pull-quote"><div class="pull-quote-text">名乃一生符号，五格数理暗含五行能量，好名相助，劣名设阻，宜早知晓。</div></div>';
      }
    }
    html += '</div>';
  } else {
    html += '<div style="padding:0 16px;font-size:11px;color:var(--text-dim);letter-spacing:0.04em;line-height:1.9;white-space:pre-wrap">'+text+'</div>';
  }

  html += '<div class="hl-note" style="margin:12px 16px"><b>文化说明</b>：姓名学属传统文化参考，本报告基于五格数理、生肖五行等推演。人生际遇取决于个人努力，姓名分析仅供娱乐参考。</div>';
  html += '<div class="sy-disclaimer">仅供娱乐参考。姓名学是可能性参考，人生幸福在于自身努力。</div>';
  html += '<div style="height:80px"></div>';
  reportEl.innerHTML = html;
  reportEl.classList.add('show');
  reportEl.dataset.contextId = lastContextId || '';

  // Init progress bar
  initReadProgress();
}

function initReadProgress() {
  var bar = document.getElementById('readProgressBar');
  var wrap = document.getElementById('readProgressWrap');
  if (!bar || !wrap) return;
  wrap.classList.add('show');
  function updateProgress() {
    var scrollTop = window.scrollY || document.documentElement.scrollTop;
    var docH = document.documentElement.scrollHeight - window.innerHeight;
    var pct = docH > 0 ? Math.min(100, (scrollTop / docH) * 100) : 0;
    bar.style.width = pct + '%';
  }
  window.addEventListener('scroll', updateProgress, {passive: true});
  updateProgress();
}

function resetAll() {
  document.querySelector('.form-wrap').style.display = 'block';
  document.querySelector('.submit-wrap').style.display = 'block';
  document.getElementById('summaryCard').style.display = 'none';
  document.getElementById('reportScreen').classList.remove('show');
  document.getElementById('reportScreen').innerHTML = '';
  document.getElementById('qaSection').style.display = 'none';
  document.getElementById('qaHistory').innerHTML = '';
}

function showToast(msg, type) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;max-width:360px;width:90%;padding:12px 16px;border-radius:8px;font-size:12px;letter-spacing:0.06em;text-align:center;font-family:Noto Serif SC,serif;cursor:pointer;';
  t.style.background = type === 'error' ? 'rgba(180,40,40,0.92)' : 'rgba(23,14,6,0.95)';
  t.style.border = type === 'error' ? '1px solid rgba(220,80,80,0.4)' : '1px solid rgba(201,168,76,0.2)';
  t.style.color = type === 'error' ? 'rgba(255,220,220,0.95)' : 'rgba(255,245,220,0.9)';
  t.textContent = msg;
  t.onclick = function(){ t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(function(){ t.remove(); },300); };
  document.body.appendChild(t);
  if (t._toastTimer) clearTimeout(t._toastTimer);
  t._toastTimer = setTimeout(function(){ t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(function(){ t.remove(); },300); }, 3000);
}

function askQuestion() {
  var ctxId = document.getElementById('reportScreen').dataset.contextId;
  var q = document.getElementById('qaInput');
  if (!q.value.trim()) return;
  var h = document.getElementById('qaHistory');
  h.innerHTML += '<div class="qa-my-msg"><span>' + q.value.replace(/</g,'&lt;') + '</span></div>';
  var question = q.value;
  q.value = ''; q.disabled = true;
  var loadEl = document.createElement('div');
  loadEl.id = 'qaLoading';
  loadEl.style.cssText = 'text-align:left;margin-bottom:8px;font-size:10px;color:rgba(255,245,220,0.3);letter-spacing:0.06em';
  loadEl.textContent = '姓名师推演中…';
  h.appendChild(loadEl);
  fetch('/api/ask-followup', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({contextId: ctxId, question: question})
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    document.getElementById('qaLoading').remove();
    if (d.answer) {
      var answer = d.answer.replace(/</g,'&lt;').replace(/\\n/g,'<br>');
      h.innerHTML += '<div class="qa-ai-msg"><span>' + answer + '</span></div>';
    }
    q.disabled = false;
  })
  .catch(function(){
    document.getElementById('qaLoading').remove();
    h.innerHTML += '<div style="margin-bottom:10px;font-size:10px;color:rgba(200,80,80,0.6);letter-spacing:0.04em">网络错误，请稍后重试</div>';
    q.disabled = false;
  });
}
function createCheckout(btn) {
  var original = btn.textContent;
  btn.disabled = true;
  btn.textContent = '跳转支付…';
  try {
    var d = {
      surname: document.getElementById('surnameInput').value,
      givenName: document.getElementById('nameInput').value,
      zodiac: document.getElementById('zodiacSelect').value,
      gender: gender
    };
    localStorage.setItem('sy_last_xingming', JSON.stringify(d));
  } catch(e){}
  fetch('/api/create-checkout', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      product: 'bazi_full',
      price: 9.9,
      token: localStorage.getItem('sy_token') || '',
      successUrl: location.origin + '/pages/xingming.html?paid=1'
    })
  }).then(function(r){ return r.json(); }).then(function(data){
    if(data.url) window.location.href = data.url;
    else { btn.disabled = false; btn.textContent = original; }
  }).catch(function(){ btn.disabled = false; btn.textContent = original; });
}
function handlePaidReturn() {
  if (location.search.indexOf('paid=1') < 0) return;
  var saved;
  try { saved = JSON.parse(localStorage.getItem('sy_last_xingming') || 'null'); } catch(e){}
  if (!saved) return;
  if (window.history.replaceState) window.history.replaceState({}, '', '/pages/xingming.html');
  document.getElementById('unlockSection').style.display = 'none';
  document.getElementById('qaSection').style.display = 'none';
  document.getElementById('reportScreen').innerHTML = '<div style="text-align:center;padding:40px 20px;font-size:13px;color:var(--gold-deep);letter-spacing:0.08em">AI 正在为你生成完整姓名报告…</div>';
  fetch('/api/xingming', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      surname: saved.surname, givenName: saved.givenName,
      zodiac: saved.zodiac, gender: saved.gender,
      token: localStorage.getItem('sy_token') || ''
    })
  }).then(function(r){ return r.json(); }).then(function(d){
    if (d.reading) {
      renderReport(d.reading, saved.surname + saved.givenName, saved.zodiac, saved.gender);
      document.getElementById('qaSection').style.display = 'block';
    } else if (d.error) {
      document.getElementById('reportScreen').innerHTML = '<div style="text-align:center;padding:40px 20px;color:#c06060;font-size:12px">获取失败：' + d.error + '</div>';
    }
  }).catch(function(){
    document.getElementById('reportScreen').innerHTML = '<div style="text-align:center;padding:40px 20px;color:#c06060;font-size:12px">网络异常，请刷新重试</div>';
  });
}
