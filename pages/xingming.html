<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#faf8f5;--card:#ffffff;--mid:#f5f0e8;
  --gold:#b8944a;--gold-light:#d4b06a;--gold-deep:#8a7020;
  --jade:#5bbfa0;--jade-mid:#8dd9bf;--jade-deep:#3d9e82;
  --ink:rgba(40,35,30,0.92);--sub:rgba(80,70,55,0.7);}
.dark-mode{--bg:#faf8f5;--card:#ffffff;--mid:#1f1408;
  --gold:#c9a84c;--gold-light:#e8d08a;--gold-deep:#8a6420;
  --jade:#5bbfa0;--jade-mid:#8dd9bf;--jade-deep:#3d9e82;
  --ink:rgba(40,35,30,0.92);--sub:rgba(80,70,55,0.7);}
html,body{background:var(--bg);font-family:'Noto Serif SC',serif;color:var(--text);-webkit-font-smoothing:antialiased}
body{max-width:390px;margin:0 auto;min-height:100vh;overflow-y:auto;padding-bottom:120px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,0.10) 0%,transparent 55%);pointer-events:none;z-index:0}

.back-btn{position:fixed;top:16px;left:16px;z-index:99;background:none;border:none;font-family:'Noto Serif SC',serif;font-size:13px;color:rgba(201,168,76,0.65);cursor:pointer;padding:4px 0}

/* Header */
.header{position:relative;z-index:1;text-align:center;padding:44px 20px 16px}
.header-title{font-size:20px;font-weight:400;letter-spacing:.22em;margin-bottom:6px}
.header-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11px;letter-spacing:.26em;color:rgba(201,168,76,0.55);margin-bottom:14px}
.gold-line{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto}

/* Input form */
.form-wrap{position:relative;z-index:1;padding:8px 16px 8px}
.form-section{margin-bottom:16px}
.form-label{font-size:10px;letter-spacing:.2em;color:rgba(201,168,76,0.5);margin-bottom:8px}
.form-box{background:var(--card);border:1px solid rgba(201,168,76,0.15);border-radius:8px;padding:12px 14px}
.form-input{width:100%;background:none;border:none;outline:none;font-family:'Noto Serif SC',serif;font-size:13px;color:rgba(255,245,220,0.82);letter-spacing:.04em;line-height:1.8}
.form-input::placeholder{color:rgba(255,245,220,0.2)}
.name-row{display:flex;gap:8px}
.name-row .form-box{flex:1}
.name-row .form-box:first-child{flex:0 0 80px}

/* Select */
.form-select{width:100%;background:var(--card);border:1px solid rgba(201,168,76,0.15);border-radius:8px;padding:12px 14px;font-family:'Noto Serif SC',serif;font-size:13px;color:rgba(255,245,220,0.82);letter-spacing:.04em;outline:none;appearance:none;-webkit-appearance:none;cursor:pointer}
.form-select option{background:#170e06;color:rgba(255,245,220,0.82)}
.select-wrap{position:relative}
.select-wrap::after{content:'▼';position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:8px;color:rgba(201,168,76,0.4);pointer-events:none}

/* Gender toggle */
.gender-row{display:flex;gap:8px}
.gender-btn{flex:1;padding:12px 0;border:1px solid rgba(201,168,76,0.15);border-radius:8px;background:var(--card);font-family:'Noto Serif SC',serif;font-size:13px;letter-spacing:.08em;color:rgba(80,70,55,0.7);cursor:pointer;transition:all .2s;text-align:center}
.gender-btn.active{border-color:var(--gold);background:rgba(201,168,76,0.1);color:var(--gold-light)}

/* Submit */
.submit-wrap{position:relative;z-index:1;padding:4px 16px 12px}
.btn-submit{width:100%;padding:15px 0;background:linear-gradient(90deg,#8a6420,#c9a84c,#e8d08a,#c9a84c,#8a6420);background-size:300% auto;border:none;border-radius:4px;color:rgba(14,10,4,.95);font-family:'Noto Serif SC',serif;font-size:14px;font-weight:500;letter-spacing:.22em;cursor:pointer;animation:gold-shimmer 3s linear infinite;box-shadow:0 4px 20px rgba(201,168,76,0.25)}
.btn-submit:active{transform:scale(0.97)}

/* Loading */
.loading-screen{position:relative;z-index:1;display:none;flex-direction:column;align-items:center;padding:60px 20px;gap:16px}
.load-glyph{font-size:48px;color:rgba(201,168,76,0.3);font-weight:300;animation:load-breathe 2s ease-in-out infinite}
.load-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:rgba(201,168,76,0.45);letter-spacing:0.18em}
.load-steps{display:flex;flex-direction:column;gap:5px}

/* Report */
.report-header{padding:12px 16px 8px}
.report-header .form-label{margin-bottom:6px}
.report-question{background:var(--card2);border:1px solid rgba(201,168,76,.1);border-radius:6px;padding:10px 12px;font-size:11px;color:var(--text);letter-spacing:0.04em;margin-bottom:10px}
.ai-section-wrap{display:flex;flex-direction:column;gap:8px;padding:0 16px}
.ai-section{background:var(--card);border:1px solid rgba(201,168,76,.12);border-radius:10px;overflow:hidden}
.ai-section.open{border-color:rgba(201,168,76,.28)}
.ai-section-head{display:flex;align-items:center;padding:12px 14px;gap:10px;cursor:pointer}
.ai-section-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.ai-section-title{font-size:13px;letter-spacing:.08em;flex:1;color:var(--gold-light)}
.ai-section-arrow{font-size:10px;color:rgba(255,245,220,0.25);transition:transform 0.25s}
.ai-section-body{padding:0 14px 14px;display:none}
.ai-section-body.open{display:block}
.ai-section-text{font-size:11px;color:var(--text-dim);letter-spacing:0.04em;line-height:1.9;white-space:pre-wrap}

/* Name analysis summary */
.summary-card{padding:16px;margin:0 16px 12px;background:var(--card);border:1px solid rgba(201,168,76,0.15);border-radius:10px;text-align:center}
.summary-glyph{font-size:36px;color:var(--gold);margin-bottom:6px}
.summary-total{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--gold);letter-spacing:0.04em}
.summary-label{font-size:10px;color:var(--sub-text);letter-spacing:0.1em;margin-top:4px}
.stroke-detail{display:flex;justify-content:center;gap:20px;margin-top:12px;padding-top:12px;border-top:1px solid rgba(201,168,76,0.1)}
.stroke-item{text-align:center}
.stroke-num{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--gold-light)}
.stroke-name{font-size:9px;color:var(--sub-text);margin-top:2px}

/* QA section */
.qa-section{position:relative;z-index:1;display:none;padding:16px 0 80px}
.qa-label{font-size:10px;color:rgba(201,168,76,0.5);letter-spacing:0.2em;margin-bottom:10px;padding:0 16px}
.qa-row{display:flex;gap:8px;padding:0 16px}
.qa-input{flex:1;background:var(--card);border:1px solid rgba(201,168,76,.15);border-radius:6px;padding:10px 12px;font-family:Noto Serif SC,serif;font-size:12px;color:var(--text);outline:none}
.qa-input:focus{border-color:rgba(201,168,76,.3)}
.qa-btn{padding:10px 16px;background:linear-gradient(135deg,var(--gold-deep),var(--gold));border:none;border-radius:6px;color:#0e0a04;font-family:Noto Serif SC,serif;font-size:12px;letter-spacing:0.1em;cursor:pointer;white-space:nowrap}
.qa-btn:active{transform:scale(0.97)}
.qa-btn:disabled{opacity:0.4;cursor:default}
.qa-history{padding:12px 16px 0}
.qa-my-msg{text-align:right;margin-bottom:8px}
.qa-my-msg span{display:inline-block;background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.15);border-radius:6px;padding:8px 12px;font-size:11px;color:var(--text)}
.qa-ai-msg{margin-bottom:10px}
.qa-ai-msg span{display:inline-block;background:var(--card);border:1px solid rgba(201,168,76,0.1);border-radius:6px;padding:8px 12px;font-size:11px;color:var(--text-dim);line-height:1.8}

/* Stardust */
.stardust span{position:absolute;width:3px;height:3px;background:rgba(201,168,76,0.5);border-radius:50%;animation:twinkle 3s ease-in-out infinite;opacity:0;transition:opacity .5s}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes gold-shimmer{0%{background-position:-300% center}100%{background-position:300% center}}
@keyframes load-breathe{0%,100%{opacity:0.3;transform:scale(1)}50%{opacity:0.7;transform:scale(1.05)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
@keyframes step-fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.sy-disclaimer{font-size:10px;color:rgba(201,168,76,0.4);text-align:center;letter-spacing:0.06em;padding:10px 20px}
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

</head>
<body>
<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题" style="z-index:999">🌙</button>

<div class="stardust" id="stardust"></div>

<button class="back-btn" onclick="history.back()">‹ 返回</button>

<div class="header page-enter page-enter-d1">
  <div class="header-title">姓名称骨</div>
  <div class="header-sub">NAME NUMEROLOGY · FIVE ELEMENTS ANALYSIS</div>
  <div class="gold-line"></div>
</div>

<!-- Input form -->
<div class="form-wrap page-enter page-enter-d2">
  <div class="form-section">
    <div class="form-label">姓名</div>
    <div class="name-row">
      <div class="form-box">
        <input class="form-input" id="surnameInput" type="text" placeholder="姓" maxlength="2">
      </div>
      <div class="form-box">
        <input class="form-input" id="nameInput" type="text" placeholder="名字" maxlength="6">
      </div>
    </div>
  </div>

  <div class="form-section">
    <div class="form-label">生肖</div>
    <div class="select-wrap">
      <select class="form-select" id="zodiacSelect">
        <option value="">请选择生肖</option>
        <option value="鼠">鼠</option>
        <option value="牛">牛</option>
        <option value="虎">虎</option>
        <option value="兔">兔</option>
        <option value="龙">龙</option>
        <option value="蛇">蛇</option>
        <option value="马">马</option>
        <option value="羊">羊</option>
        <option value="猴">猴</option>
        <option value="鸡">鸡</option>
        <option value="狗">狗</option>
        <option value="猪">猪</option>
      </select>
    </div>
  </div>

  <div class="form-section">
    <div class="form-label">性别</div>
    <div class="gender-row">
      <button class="gender-btn active" id="genderMale" onclick="selectGender('male')">男</button>
      <button class="gender-btn" id="genderFemale" onclick="selectGender('female')">女</button>
    </div>
  </div>
</div>

<!-- Submit -->
<div class="submit-wrap page-enter page-enter-d3">
  <button class="btn-submit" id="submitBtn" onclick="submitXingming()">AI测算 · 姓名吉凶</button>
</div>

<!-- Summary card (shown after submission) -->
<div class="summary-card" id="summaryCard" style="display:none"></div>

<!-- Loading -->
<div class="loading-screen" id="loadingScreen">
  <div class="load-glyph">名</div>
  <div class="load-text">笔划推演，五行生克…</div>
  <div class="load-steps" id="loadSteps"></div>
</div>

<!-- Report -->
<div class="report-screen" id="reportScreen"></div>

<!-- QA -->
<div id="unlockSection" style="display:none;text-align:center;padding:20px 16px 28px;border-top:1px solid rgba(201,168,76,0.12);margin-top:20px">
  <div style="font-size:32px;margin-bottom:8px">🔒</div>
  <div style="font-size:14px;color:var(--gold-deep);letter-spacing:0.08em;font-weight:500;margin-bottom:4px">完整姓名报告已锁定</div>
  <div style="font-size:11px;color:var(--sub);margin-bottom:16px;line-height:1.6">解锁后可查看升级改名建议、完整五格数理<br>和资深姓名师一对一建议</div>
  <button class="btn-submit" onclick="createCheckout(this)" style="max-width:260px;margin:0 auto">解锁完整报告 · $9.90</button>
</div>

<div id="qaSection">
  <div class="qa-label">追问姓名</div>
  <div class="qa-row">
    <input id="qaInput" type="text" placeholder="输入追问…例如：这个名字吉利吗？" class="qa-input">
    <button onclick="askQuestion()" class="qa-btn">追问</button>
  </div>
  <div class="qa-history" id="qaHistory"></div>
</div>

<script>
var gender = 'male';
var lastContextId = null;
var ZODIAC_LIST = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];

function selectGender(g) {
  gender = g;
  document.getElementById('genderMale').classList.toggle('active', g === 'male');
  document.getElementById('genderFemale').classList.toggle('active', g === 'female');
}

function submitXingming() {
  var surname = document.getElementById('surnameInput').value.trim();
  var givenName = document.getElementById('nameInput').value.trim();
  var zodiac = document.getElementById('zodiacSelect').value;

  if (!surname) { showToast('请输入姓氏', 'error'); return; }
  if (!givenName) { showToast('请输入名字', 'error'); return; }
  if (!zodiac) { showToast('请选择生肖', 'error'); return; }

  document.querySelector('.form-wrap').style.display = 'none';
  document.querySelector('.submit-wrap').style.display = 'none';
  document.getElementById('loadingScreen').style.display = 'flex';

  var stepsEl = document.getElementById('loadSteps');
  stepsEl.innerHTML = '';
  var steps = ['姓名录入完成…','推演笔画数理…','分析五行生克…','参考生肖喜忌…','生成姓名报告…'];
  steps.forEach(function(s,i){
    setTimeout(function(){
      stepsEl.innerHTML += '<div class="load-step">✓ '+s+'</div>';
    }, i * 350);
  });

  setTimeout(function(){
    fetch('/api/xingming', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        surname: surname,
        givenName: givenName,
        zodiac: zodiac,
        gender: gender,
        token: localStorage.getItem('sy_token') || ''
      })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      document.getElementById('loadingScreen').style.display = 'none';
      if (d.error) { showToast(d.error, 'error'); resetAll(); return; }
      if (d.contextId) lastContextId = d.contextId;
      var fullName = surname + givenName;
      var reportText = d.reading || d.interpretation || d.report || d.result || d.answer || '暂无回应，请重试';
      renderReport(reportText, fullName, zodiac, gender);
      document.getElementById('qaSection').style.display = 'block';
      if (!d.hasFullAccess) document.getElementById('unlockSection').style.display = 'block';
    })
    .catch(function(){
      document.getElementById('loadingScreen').style.display = 'none';
      showToast('网络异常，请重试', 'error');
      resetAll();
    });
  }, steps.length * 350 + 300);
}

function parseSections(text) {
  var known = ['📜','💰','💼','❤️','💪','🌟','🔮','📊','🎯','🔥','💧','🌿','🌊','⛰','⚔️','🛡️','✨','💫','⭐','☯','🌙','🌙','📈','💕','🤝','🎓','🏠','🚗','❄️','⚡','🌪','🏆','🎁','📝','💡','🕯','⚱','🧿','🔔','🗝','🪷','♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓','⚖️','🔱','🖌','📏','🧮','🔤','🏅','📛'];
  var lines = text.split('\n');
  var sections = [];
  var current = null;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var matched = null;
    for (var k = 0; k < known.length; k++) {
      if (line.indexOf(known[k]) === 0) { matched = known[k]; break; }
    }
    if (matched) {
      if (current && current.lines.length) sections.push(current);
      current = { emoji: matched, title: line.substring(matched.length).trim(), lines: [] };
    } else if (current) {
      current.lines.push(line);
    } else if (line.trim()) {
      current = { emoji: '📛', title: '姓名分析', lines: [line] };
    }
  }
  if (current && current.lines.length) sections.push(current);
  return sections;
}

var SECTION_ICONS = {
  '📛':'rgba(201,168,76,0.25)','📜':'rgba(201,168,76,0.3)','💰':'rgba(201,168,76,0.3)','💼':'rgba(74,143,160,0.3)',
  '❤️':'rgba(201,96,106,0.3)','🌟':'rgba(201,168,76,0.3)','🔮':'rgba(141,103,191,0.3)','💪':'rgba(91,191,160,0.3)',
  '🔥':'rgba(201,80,40,0.3)','💧':'rgba(74,159,212,0.3)','🌿':'rgba(91,191,160,0.3)','📈':'rgba(74,191,130,0.3)',
  '💡':'rgba(201,180,60,0.3)','📝':'rgba(160,160,160,0.3)','🎯':'rgba(201,130,40,0.3)','🏆':'rgba(201,168,76,0.3)',
  '🖌':'rgba(201,140,100,0.3)','📏':'rgba(160,160,160,0.3)','🧮':'rgba(140,180,100,0.3)','🔤':'rgba(100,160,180,0.3)',
  '🏅':'rgba(201,168,76,0.3)','☯':'rgba(160,160,160,0.3)','⚖️':'rgba(160,140,100,0.3)'
};

function renderReport(text, fullName, zodiac, gender) {
  var sections = parseSections(text);
  var reportEl = document.getElementById('reportScreen');
  var genderLabel = gender === 'male' ? '男' : '女';

  var summaryHtml = '<div class="summary-glyph">📛</div>';
  summaryHtml += '<div class="summary-total">' + fullName.replace(/</g,'&lt;') + '</div>';
  summaryHtml += '<div class="summary-label">' + zodiac + '年 · ' + genderLabel + '</div>';
  document.getElementById('summaryCard').innerHTML = summaryHtml;
  document.getElementById('summaryCard').style.display = 'block';

  var html = '<div class="report-header">';
  html += '<div class="form-label">姓名分析：</div><div class="report-question">' + fullName.replace(/</g,'&lt;') + ' · ' + zodiac + '年 · ' + genderLabel + '</div>';
  html += '</div>';

  if (sections.length > 0) {
    html += '<div class="ai-section-wrap">';
    for (var i = 0; i < sections.length; i++) {
      var sec = sections[i];
      var bg = SECTION_ICONS[sec.emoji] || 'rgba(201,168,76,0.2)';
      html += '<div class="ai-section open">';
      html += '<div class="ai-section-head" onclick="var b=this.nextElementSibling;b.classList.toggle(\'open\');this.querySelector(\'.ai-section-arrow\').classList.toggle(\'open\')">';
      html += '<div class="ai-section-icon" style="background:'+bg+'">'+(sec.emoji||'📛')+'</div>';
      html += '<div class="ai-section-title">'+(sec.title||'姓名分析')+'</div>';
      html += '<div class="ai-section-arrow">⬇</div>';
      html += '</div>';
      html += '<div class="ai-section-body open"><div class="ai-section-text">'+sec.lines.join('\n')+'</div></div>';
      html += '</div>';
    }
    html += '</div>';
  } else {
    html += '<div style="padding:0 16px;font-size:11px;color:var(--text-dim);letter-spacing:0.04em;line-height:1.9;white-space:pre-wrap">'+text+'</div>';
  }

  html += '<div class="sy-disclaimer">仅供娱乐参考。姓名学是可能性参考，人生幸福在于自身努力。</div>';
  html += '<div style="height:80px"></div>';
  reportEl.innerHTML = html;
  reportEl.classList.add('show');
  reportEl.dataset.contextId = lastContextId || '';
}

function resetAll() {
  document.querySelector('.form-wrap').style.display = 'block';
  document.querySelector('.submit-wrap').style.display = 'block';
  document.getElementById('summaryCard').style.display = 'none';
  document.getElementById('reportScreen').classList.remove('show');
  document.getElementById('reportScreen').innerHTML = '';
  document.getElementById('qaSection').style.display = 'none';
  document.getElementById('qaHistory').innerHTML = '';
}

function showToast(msg, type) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;max-width:360px;width:90%;padding:12px 16px;border-radius:8px;font-size:12px;letter-spacing:0.06em;text-align:center;font-family:Noto Serif SC,serif;cursor:pointer;';
  t.style.background = type === 'error' ? 'rgba(180,40,40,0.92)' : 'rgba(23,14,6,0.95)';
  t.style.border = type === 'error' ? '1px solid rgba(220,80,80,0.4)' : '1px solid rgba(201,168,76,0.2)';
  t.style.color = type === 'error' ? 'rgba(255,220,220,0.95)' : 'rgba(255,245,220,0.9)';
  t.textContent = msg;
  t.onclick = function(){ t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(function(){ t.remove(); },300); };
  document.body.appendChild(t);
  if (t._toastTimer) clearTimeout(t._toastTimer);
  t._toastTimer = setTimeout(function(){ t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(function(){ t.remove(); },300); }, 3000);
}

function askQuestion() {
  var ctxId = document.getElementById('reportScreen').dataset.contextId;
  var q = document.getElementById('qaInput');
  if (!q.value.trim()) return;
  var h = document.getElementById('qaHistory');
  h.innerHTML += '<div class="qa-my-msg"><span>' + q.value.replace(/</g,'&lt;') + '</span></div>';
  var question = q.value;
  q.value = ''; q.disabled = true;
  var loadEl = document.createElement('div');
  loadEl.id = 'qaLoading';
  loadEl.style.cssText = 'text-align:left;margin-bottom:8px;font-size:10px;color:rgba(255,245,220,0.3);letter-spacing:0.06em';
  loadEl.textContent = '姓名师推演中…';
  h.appendChild(loadEl);
  fetch('/api/ask-followup', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({contextId: ctxId, question: question})
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    document.getElementById('qaLoading').remove();
    if (d.answer) {
      var answer = d.answer.replace(/</g,'&lt;').replace(/\\n/g,'<br>');
      h.innerHTML += '<div class="qa-ai-msg"><span>' + answer + '</span></div>';
    }
    q.disabled = false;
  })
  .catch(function(){
    document.getElementById('qaLoading').remove();
    h.innerHTML += '<div style="margin-bottom:10px;font-size:10px;color:rgba(200,80,80,0.6);letter-spacing:0.04em">网络错误，请稍后重试</div>';
    q.disabled = false;
  });
}
function createCheckout(btn) {
  var original = btn.textContent;
  btn.disabled = true;
  btn.textContent = '跳转支付…';
  try {
    var d = {
      surname: document.getElementById('surnameInput').value,
      givenName: document.getElementById('nameInput').value,
      zodiac: document.getElementById('zodiacSelect').value,
      gender: gender
    };
    localStorage.setItem('sy_last_xingming', JSON.stringify(d));
  } catch(e){}
  fetch('/api/create-checkout', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      product: 'bazi_full',
      price: 9.9,
      token: localStorage.getItem('sy_token') || '',
      successUrl: location.origin + '/pages/xingming.html?paid=1'
    })
  }).then(function(r){ return r.json(); }).then(function(data){
    if(data.url) window.location.href = data.url;
    else { btn.disabled = false; btn.textContent = original; }
  }).catch(function(){ btn.disabled = false; btn.textContent = original; });
}
function handlePaidReturn() {
  if (location.search.indexOf('paid=1') < 0) return;
  var saved;
  try { saved = JSON.parse(localStorage.getItem('sy_last_xingming') || 'null'); } catch(e){}
  if (!saved) return;
  if (window.history.replaceState) window.history.replaceState({}, '', '/pages/xingming.html');
  document.getElementById('unlockSection').style.display = 'none';
  document.getElementById('qaSection').style.display = 'none';
  document.getElementById('reportScreen').innerHTML = '<div style="text-align:center;padding:40px 20px;font-size:13px;color:var(--gold-deep);letter-spacing:0.08em">AI 正在为你生成完整姓名报告…</div>';
  fetch('/api/xingming', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      surname: saved.surname, givenName: saved.givenName,
      zodiac: saved.zodiac, gender: saved.gender,
      token: localStorage.getItem('sy_token') || ''
    })
  }).then(function(r){ return r.json(); }).then(function(d){
    if (d.reading) {
      renderReport(d.reading, saved.surname + saved.givenName, saved.zodiac, saved.gender);
      document.getElementById('qaSection').style.display = 'block';
    } else if (d.error) {
      document.getElementById('reportScreen').innerHTML = '<div style="text-align:center;padding:40px 20px;color:#c06060;font-size:12px">获取失败：' + d.error + '</div>';
    }
  }).catch(function(){
    document.getElementById('reportScreen').innerHTML = '<div style="text-align:center;padding:40px 20px;color:#c06060;font-size:12px">网络异常，请刷新重试</div>';
  });
}
</script>
