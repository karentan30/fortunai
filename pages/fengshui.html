<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0e0a04">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>善缘 · 风水评测</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0e0a04; --card: #170e06; --mid: #1f1408;
  --gold: #c9a84c; --gold-light: #e8d08a; --gold-deep: #8a6420;
  --jade: #5bbfa0; --jade-mid: #8dd9bf;
  --amber: #c9820a; --amber-light: #e8b86a;
  --ink-text: rgba(255,245,220,0.85);
  --sub-text: rgba(255,245,220,0.58);
}
html, body { background: var(--bg); font-family: 'Noto Serif SC', serif; color: var(--ink-text); -webkit-font-smoothing: antialiased; }
body { max-width: 390px; margin: 0 auto; min-height: 100vh; overflow-y: auto; padding-bottom: 120px; }
body::before { content:''; position:fixed; inset:0; background:radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.1) 0%, transparent 50%); pointer-events:none; z-index:0; }

.back-btn { position:fixed; top:16px; left:16px; z-index:99; background:none; border:none; font-family:'Noto Serif SC',serif; font-size:13px; color:rgba(201,168,76,0.6); cursor:pointer; padding:4px 0; }

/* ── Input screen ── */
.input-screen { position:relative; z-index:1; }

.header { text-align:center; padding:44px 20px 20px; }
.header-title { font-size:20px; font-weight:400; letter-spacing:0.22em; margin-bottom:5px; }
.header-sub { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:11px; letter-spacing:0.26em; color:rgba(201,168,76,0.45); margin-bottom:14px; }
.gold-line { width:60px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:0 auto; }

.form-section { padding:14px 16px; }
.form-label { font-size:10px; letter-spacing:0.18em; color:rgba(201,168,76,0.5); margin-bottom:10px; }
.field-group { background:var(--card); border:1px solid rgba(201,168,76,0.12); border-radius:8px; overflow:hidden; }
.field-row { display:flex; align-items:center; padding:0 14px; border-bottom:1px solid rgba(201,168,76,0.08); }
.field-row:last-child { border-bottom:none; }
.field-label { font-size:11px; color:var(--sub-text); letter-spacing:0.06em; min-width:64px; flex-shrink:0; }
.field-input, .field-select, .field-textarea { flex:1; background:none; border:none; outline:none; font-family:'Noto Serif SC',serif; font-size:13px; color:var(--ink-text); padding:12px 8px; letter-spacing:0.04em; -webkit-appearance:none; }
.field-select option { background:var(--card); color:var(--ink-text); }
.field-input::placeholder, .field-textarea::placeholder { color:rgba(255,245,220,0.18); }
.field-textarea { resize:none; min-height:60px; line-height:1.7; }

.required-star { color:rgba(220,100,80,0.7); margin-left:2px; font-size:12px; }

.submit-section { padding:16px 16px 20px; }
.btn-gen { width:100%; padding:15px 0; background:linear-gradient(135deg,var(--gold-deep),var(--gold),var(--gold-light),var(--gold)); border:none; border-radius:4px; color:rgba(14,10,4,0.95); font-family:'Noto Serif SC',serif; font-size:14px; font-weight:500; letter-spacing:0.22em; cursor:pointer; box-shadow:0 4px 20px rgba(201,168,76,0.3); }
.btn-gen:disabled { opacity:0.4; cursor:default; }

/* ── Report screen ── */
.report-screen { position:relative; z-index:1; display:none; }
.report-screen.show { display:block; }

/* Chart header */
.chart-header { padding:20px 16px 0; }
.name-row { display:flex; align-items:baseline; gap:12px; margin-bottom:4px; }
.report-name { font-size:22px; letter-spacing:0.14em; }
.report-tag { font-size:10px; color:var(--gold); border:1px solid rgba(201,168,76,0.3); padding:3px 8px; border-radius:2px; letter-spacing:0.1em; }
.birth-info { font-size:10px; color:var(--sub-text); letter-spacing:0.06em; margin-bottom:14px; }
.divider { height:1px; background:linear-gradient(90deg,transparent,rgba(201,168,76,0.2),transparent); margin:0 16px 14px; }

/* AI Report section cards */
.fortune-wrap { padding:0 16px; }
.ai-section { background:var(--card); border:1px solid rgba(201,168,76,0.1); border-radius:10px; margin-bottom:10px; overflow:hidden; }
.ai-section-head { display:flex; align-items:center; padding:12px 14px; gap:10px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.ai-section-icon { font-size:20px; flex-shrink:0; }
.ai-section-title { font-size:13px; letter-spacing:0.08em; flex:1; }
.ai-section-arrow { font-size:10px; color:rgba(255,245,220,0.25); transition:transform 0.25s; }
.ai-section-body { padding:0 14px 14px; display:none; }
.ai-section-body.open { display:block; }
.ai-section-text { font-size:11px; color:var(--sub-text); letter-spacing:0.04em; line-height:1.9; white-space:pre-wrap; }
.ai-plain-text { padding:0 16px 14px; font-size:11px; color:var(--sub-text); letter-spacing:0.04em; line-height:1.9; white-space:pre-wrap; }

/* Loading */
.loading-screen { position:relative; z-index:1; display:none; flex-direction:column; align-items:center; padding:80px 20px; gap:20px; }
.loading-screen.show { display:flex; }
.load-glyph { font-size:60px; color:rgba(201,168,76,0.3); font-weight:300; animation:load-breathe 2s ease-in-out infinite; }
@keyframes load-breathe { 0%,100%{opacity:0.3;transform:scale(1)} 50%{opacity:0.7;transform:scale(1.05)} }
.load-text { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:14px; color:rgba(201,168,76,0.5); letter-spacing:0.18em; }
.load-steps { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
.load-step { font-size:10px; color:rgba(255,245,220,0.3); letter-spacing:0.08em; animation:step-fade 0.5s ease-out both; }

/* Error screen */
.error-screen { position:relative; z-index:1; display:none; text-align:center; padding:60px 20px; }
.error-screen.show { display:block; }
.error-icon { font-size:48px; margin-bottom:16px; }
.error-text { font-size:13px; color:var(--sub-text); letter-spacing:0.04em; margin-bottom:20px; line-height:1.8; }
.btn-retry { padding:12px 32px; background:linear-gradient(135deg,var(--gold-deep),var(--gold),var(--gold-light),var(--gold)); border:none; border-radius:4px; color:rgba(14,10,4,0.95); font-family:'Noto Serif SC',serif; font-size:13px; font-weight:500; letter-spacing:0.16em; cursor:pointer; box-shadow:0 4px 16px rgba(201,168,76,0.25); }

/* Button active states */
.back-btn:active{transform:scale(0.97)}
.btn-gen:active:not(:disabled){transform:scale(0.97)}
.btn-retry:active{transform:scale(0.97)}

/* Animations */
@keyframes gold-shimmer{0%{background-position:-300% center}100%{background-position:300% center}}
.btn-gen,.btn-retry{
  background:linear-gradient(90deg,#8a6420,#c9a84c,#e8d08a,#c9a84c,#8a6420) !important;
  background-size:300% auto !important;
  animation:gold-shimmer 3s linear infinite !important;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.page-enter{animation:fadeUp .8s ease both}
.page-enter-d1{animation-delay:.1s}.page-enter-d2{animation-delay:.2s}
.page-enter-d3{animation-delay:.3s}.page-enter-d4{animation-delay:.4s}
.page-enter-d5{animation-delay:.5s}.page-enter-d6{animation-delay:.6s}

/* Stardust */
.stardust{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.stardust span{position:absolute;width:3px;height:3px;background:rgba(201,168,76,0.6);border-radius:50%;animation:twinkle 3s ease-in-out infinite;opacity:0;transition:opacity .5s}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.bottom-gradient{position:fixed;bottom:0;left:0;right:0;height:100px;background:linear-gradient(to top,rgba(14,10,4,1) 0%,rgba(14,10,4,.8) 30%,transparent 100%);pointer-events:none;z-index:998}
</style>
</head>
<body>
<div class="stardust" id="stardust"></div>
<div class="bottom-gradient"></div>

<button class="back-btn" onclick="history.back()">← 返回</button>

<!-- Input screen -->
<div class="input-screen" id="inputScreen">
  <div class="header page-enter page-enter-d1">
    <div class="header-title">善缘 · 风水评测</div>
    <div class="header-sub">FENG SHUI · HARMONIZE YOUR SPACE</div>
    <div class="gold-line"></div>
  </div>

  <div class="form-section">
    <div class="form-label">房屋信息</div>
    <div class="field-group">
      <div class="field-row">
        <span class="field-label">朝向<span class="required-star">*</span></span>
        <select class="field-select" id="facing">
          <option value="">请选择</option>
          <option value="东">东</option>
          <option value="南">南</option>
          <option value="西">西</option>
          <option value="北">北</option>
          <option value="东南">东南</option>
          <option value="西南">西南</option>
          <option value="东北">东北</option>
          <option value="西北">西北</option>
        </select>
      </div>
      <div class="field-row">
        <span class="field-label">楼层</span>
        <input class="field-input" type="number" id="floor" placeholder="如 5" min="1" max="999">
      </div>
      <div class="field-row">
        <span class="field-label">户型</span>
        <select class="field-select" id="layout">
          <option value="">请选择</option>
          <option value="一室">一室</option>
          <option value="两室">两室</option>
          <option value="三室">三室</option>
          <option value="四室+">四室+</option>
          <option value="别墅">别墅</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="field-row">
        <span class="field-label">居住人数</span>
        <input class="field-input" type="number" id="residents" placeholder="如 3" min="1" max="50">
      </div>
      <div class="field-row">
        <span class="field-label">地址</span>
        <input class="field-input" type="text" id="address" placeholder="小区名或路段">
      </div>
    </div>
  </div>

  <div class="form-section">
    <div class="form-label">你想了解什么</div>
    <div class="field-group">
      <div class="field-row">
        <textarea class="field-textarea" id="question" placeholder="如：财运如何提升、卧室怎么布局…"></textarea>
      </div>
    </div>
  </div>

  <div class="submit-section">
    <button class="btn-gen" id="submitBtn" onclick="generateReport()">评测风水</button>
  </div>

  <div style="text-align:center;font-size:9px;color:rgba(255,245,220,0.2);padding:0 24px 20px;letter-spacing:0.06em;position:relative;z-index:1">
    本平台采用正统玄空飞星风水算法·已服务 12,846 位用户·评测结果仅供参考
  </div>
</div>

<!-- Loading screen -->
<div class="loading-screen" id="loadingScreen">
  <div class="load-glyph">宅</div>
  <div class="load-text">堪舆推演中，请稍候…</div>
  <div class="load-steps" id="loadSteps"></div>
</div>

<!-- Error screen -->
<div class="error-screen" id="errorScreen">
  <div class="error-icon">🏮</div>
  <div class="error-text" id="errorText">网络异常，请稍后重试</div>
  <button class="btn-retry" onclick="retry()">重新评测</button>
</div>

<!-- Report screen -->
<div class="report-screen" id="reportScreen">
  <!-- Populated by JS -->
</div>

<script>
function showToast(msg, type) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;max-width:360px;width:90%;padding:12px 16px;border-radius:8px;font-size:12px;letter-spacing:0.06em;text-align:center;font-family:Noto Serif SC,serif;cursor:pointer;';
  t.style.background = type === 'error' ? 'rgba(180,40,40,0.92)' : 'rgba(23,14,6,0.95)';
  t.style.border = type === 'error' ? '1px solid rgba(220,80,80,0.4)' : '1px solid rgba(201,168,76,0.2)';
  t.style.color = type === 'error' ? 'rgba(255,220,220,0.95)' : 'rgba(255,245,220,0.9)';
  t.textContent = msg;
  t.onclick = function(){ t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(function(){ t.remove(); },300); };
  document.body.appendChild(t);
  if (t._toastTimer) clearTimeout(t._toastTimer);
  t._toastTimer = setTimeout(function(){ t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(function(){ t.remove(); },300); }, 3000);
}

var lastPayload = null;

function generateReport() {
  var facing = document.getElementById('facing').value;
  if (!facing) { showToast('请选择房屋朝向', 'error'); return; }

  var payload = {
    facing: facing,
    floor: document.getElementById('floor').value || '',
    layout: document.getElementById('layout').value || '',
    residents: document.getElementById('residents').value || '',
    address: document.getElementById('address').value || '',
    question: document.getElementById('question').value || ''
  };
  lastPayload = payload;

  document.getElementById('inputScreen').style.display = 'none';
  document.getElementById('loadingScreen').classList.add('show');
  document.getElementById('errorScreen').classList.remove('show');
  document.getElementById('reportScreen').classList.remove('show');

  var steps = ['读取房屋信息…','排算坐山朝向…','推演玄空飞星…','分析五行生克…','生成风水报告…'];
  var stepsEl = document.getElementById('loadSteps');
  stepsEl.innerHTML = '';
  steps.forEach(function(s, i) {
    setTimeout(function(){
      stepsEl.innerHTML += '<div class="load-step">✓ '+s+'</div>';
    }, i * 350);
  });

  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '评算中…';

  var loadingDuration = steps.length * 350 + 400;
  var apiCalled = false;

  fetch('/api/fengshui', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(function(r) {
    if (!r.ok) throw new Error('API error: ' + r.status);
    return r.json();
  }).then(function(data) {
    apiCalled = true;
    document.getElementById('loadingScreen').classList.remove('show');
    btn.disabled = false;
    btn.textContent = '评测风水';
    if (data && (data.report || data.text || data.content)) {
      showReport(data.report || data.text || data.content);
    } else {
      showToast('返回数据异常，请重试', 'error');
      document.getElementById('inputScreen').style.display = 'block';
    }
  }).catch(function(err) {
    apiCalled = true;
    document.getElementById('loadingScreen').classList.remove('show');
    btn.disabled = false;
    btn.textContent = '评测风水';
    showError(err.message || '网络异常，请稍后重试');
  });

  // Fallback: if API takes too long but steps finished, show error
  setTimeout(function(){
    if (!apiCalled) {
      document.getElementById('loadingScreen').classList.remove('show');
      btn.disabled = false;
      btn.textContent = '评测风水';
      showError('请求超时，请稍后重试');
    }
  }, 15000);
}

function showError(msg) {
  document.getElementById('errorText').textContent = msg;
  document.getElementById('errorScreen').classList.add('show');
}

function retry() {
  document.getElementById('errorScreen').classList.remove('show');
  if (lastPayload) {
    document.getElementById('loadingScreen').classList.add('show');
    generateReport();
  } else {
    document.getElementById('inputScreen').style.display = 'block';
  }
}

function showReport(text) {
  var reportEl = document.getElementById('reportScreen');
  var sections = parseAISections(text);
  var html = '';

  // Header
  html += '<div class="chart-header page-enter">';
  html += '<div class="name-row"><div class="report-name">风水评测</div><div class="report-tag">AI 堪舆分析</div></div>';
  html += '<div class="birth-info">朝向：' + (lastPayload ? lastPayload.facing : '') + (lastPayload && lastPayload.layout ? ' · ' + lastPayload.layout : '') + '</div>';
  html += '<div class="divider"></div></div>';

  if (sections.length > 0) {
    html += '<div class="fortune-wrap">';
    for (var i = 0; i < sections.length; i++) {
      var sec = sections[i];
      html += '<div class="ai-section page-enter" style="animation-delay:'+(i*0.08)+'s">';
      html += '<div class="ai-section-head" onclick="var b=this.nextElementSibling;b.classList.toggle(\'open\');var a=this.querySelector(\'.ai-section-arrow\');a.classList.toggle(\'open\')">';
      html += '<div class="ai-section-icon">'+sec.emoji+'</div>';
      html += '<div class="ai-section-title">'+(sec.title||'风水分析')+'</div>';
      html += '<div class="ai-section-arrow">⬇</div>';
      html += '</div>';
      html += '<div class="ai-section-body"><div class="ai-section-text">'+sec.lines.join('\n')+'</div></div>';
      html += '</div>';
    }
    html += '</div>';
  } else {
    html += '<div class="ai-plain-text page-enter">'+text+'</div>';
  }

  html += '<div style="height:40px"></div>';

  reportEl.innerHTML = html;
  reportEl.classList.add('show');
}

function parseAISections(text) {
  var known = ['🏠','🧭','🛏️','💰','❤️','🏃','🪴','📐','🎯','📜','💼','💕','🌟','🔮','📊','🔥','💧','🌿','🌊','⛰','⚔️','✨','💫','⭐','☯','🌙','☀️','📈','🤝','🎓','💡','🕯','⚱','🧿','🔔','🗝','🪷','♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓'];
  var lines = text.split('\n');
  var sections = [];
  var current = null;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var matched = null;
    for (var k = 0; k < known.length; k++) {
      if (line.indexOf(known[k]) === 0) { matched = known[k]; break; }
    }
    if (matched) {
      if (current && current.lines.length) sections.push(current);
      current = { emoji: matched, title: line.substring(matched.length).trim(), lines: [] };
    } else if (current) {
      current.lines.push(line);
    } else if (line.trim()) {
      current = { emoji: '🏠', title: '风水分析', lines: [line] };
    }
  }
  if (current && current.lines.length) sections.push(current);
  return sections;
}
</script>

<script>
(function(){
  var c = document.getElementById('stardust');
  if (!c) return;
  for (var i = 0; i < 30; i++) {
    var s = document.createElement('span');
    s.style.cssText = 'left:'+(Math.random()*100)+'%;top:'+(Math.random()*100)+'%;width:'+(1.5+Math.random()*2.5)+'px;height:'+(1.5+Math.random()*2.5)+'px;--dur:'+(2+Math.random()*4)+'s;animation-delay:'+(Math.random()*5)+'s';
    c.appendChild(s);
  }
  setTimeout(function(){ c.querySelectorAll('span').forEach(function(s){ s.style.opacity = '1'; }); }, 100);
})();</script>

<div style="text-align:center;padding:24px 20px 40px;position:relative;z-index:1">
  <div style="width:40px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 12px"></div>
  <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11px;color:rgba(201,168,76,0.35);letter-spacing:0.3em">宅吉人安 · 风生水起</div>
</div>

</body>
</html>
