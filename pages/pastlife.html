<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e0820">
<meta name="description" content="善缘 · 前世回溯 · AI灵性分析，仅供娱乐参考">
<title>善缘 · 前世回溯</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#faf8f5;--card:#ffffff;--mid:#f5f0e8;
  --gold:#b8944a;--gold-light:#d4b06a;--gold-deep:#8a7020;
  --jade:#5bbfa0;--jade-mid:#8dd9bf;--jade-deep:#3d9e82;
  --ink:rgba(40,35,30,0.92);--sub:rgba(80,70,55,0.7);}
.dark-mode{--bg:#faf8f5;--card:#ffffff;--mid:#1f1408;
  --gold:#c9a84c;--gold-light:#e8d08a;--gold-deep:#8a6420;
  --jade:#5bbfa0;--jade-mid:#8dd9bf;--jade-deep:#3d9e82;
  --ink:rgba(40,35,30,0.92);--sub:rgba(80,70,55,0.7);}
html,body{background:var(--bg);font-family:'Noto Serif SC',serif;color:var(--ink);-webkit-font-smoothing:antialiased}
body{max-width:390px;margin:0 auto;min-height:100vh;padding-bottom:120px;overflow-y:auto}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(155,111,212,0.12) 0%,transparent 55%);pointer-events:none;z-index:0}
.back-btn{position:fixed;top:16px;left:16px;z-index:99;background:none;border:none;color:rgba(155,111,212,0.6);font-size:13px;cursor:pointer;font-family:'Noto Serif SC',serif;padding:4px 0}
.input-screen{position:relative;z-index:1}
.header{text-align:center;padding:44px 20px 20px}
.header-icon{font-size:56px;margin-bottom:8px}
.header-title{font-size:20px;font-weight:400;letter-spacing:0.22em;margin-bottom:4px}
.header-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11px;letter-spacing:0.26em;color:rgba(155,111,212,0.45);margin-bottom:14px}
.gold-line{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto}
.form-section{padding:14px 16px}
.form-label{font-size:10px;letter-spacing:0.18em;color:rgba(201,168,76,0.5);margin-bottom:10px}
.field-group{background:var(--card);border:1px solid rgba(201,168,76,0.12);border-radius:8px;overflow:hidden}
.field-row{display:flex;align-items:center;padding:0 14px;border-bottom:1px solid rgba(201,168,76,0.08)}
.field-row:last-child{border-bottom:none}
.field-label{font-size:11px;color:var(--sub);letter-spacing:0.06em;min-width:64px;flex-shrink:0}
.field-input,.field-select{flex:1;background:none;border:none;outline:none;font-family:'Noto Serif SC',serif;font-size:13px;color:var(--ink);padding:12px 8px;letter-spacing:0.04em;-webkit-appearance:none}
.field-select option{background:var(--card);color:var(--ink)}
.gender-row{display:flex;gap:8px;padding:0 16px;margin-bottom:12px}
.gender-opt{flex:1;background:var(--card);border:1px solid rgba(201,168,76,0.12);border-radius:6px;padding:10px 0;text-align:center;font-size:13px;color:var(--sub);letter-spacing:0.12em;cursor:pointer;transition:all 0.2s}
.gender-opt.selected{border-color:var(--purple);background:rgba(155,111,212,0.12);color:var(--purple-mid)}
.btn-gen{width:100%;padding:15px 0;background:linear-gradient(135deg,#6b3fa0,#9b6fd4,#c4a0f0);border:none;border-radius:4px;color:rgba(14,8,32,0.95);font-family:'Noto Serif SC',serif;font-size:14px;letter-spacing:0.22em;cursor:pointer;box-shadow:0 4px 20px rgba(155,111,212,0.3)}
.loading-screen{display:none;text-align:center;padding:60px 20px;position:relative;z-index:1}
.loading-screen.show{display:block}
.loading-ring{width:48px;height:48px;border:2px solid rgba(155,111,212,0.15);border-top-color:var(--purple);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:12px;color:var(--sub);letter-spacing:0.1em}
.result-screen{display:none;position:relative;z-index:1;padding:0 16px}
.result-screen.show{display:block}
.pastlife-card{background:var(--card);border:1px solid rgba(155,111,212,0.2);border-radius:12px;padding:24px 20px;text-align:center;margin-bottom:16px;box-shadow:0 8px 32px rgba(0,0,0,0.3);position:relative;overflow:hidden}
.pastlife-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--purple),var(--gold),transparent)}
.pl-icon{font-size:48px;margin-bottom:12px}
.pl-era{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold-light);margin-bottom:4px}
.pl-title{font-size:12px;color:var(--sub);margin-bottom:12px;letter-spacing:0.1em}
.pl-desc{font-size:12px;color:var(--ink);line-height:1.9;letter-spacing:0.05em;text-align:left}
.report-content{background:var(--card);border:1px solid rgba(201,168,76,0.08);border-radius:8px;padding:18px;margin-bottom:12px}
.report-content h1,.report-content h2,.report-content h3{font-size:13px;color:var(--gold);margin:12px 0 6px;font-weight:400;letter-spacing:0.1em}
.report-content p{font-size:11.5px;line-height:2;color:var(--ink);margin-bottom:8px}
.report-content strong{color:var(--purple-mid)}
.report-content em{color:var(--sub);font-style:normal}
.share-bar{display:flex;gap:8px;margin:12px 0 16px}
.share-btn{flex:1;padding:10px 0;border:0.5px solid rgba(201,168,76,0.12);border-radius:6px;background:var(--card);color:var(--ink);font-family:'Noto Serif SC',serif;font-size:10px;letter-spacing:0.1em;cursor:pointer;text-align:center}
/* ══ 精装阅读增量升级 ══ */
#readProgressWrap{position:fixed;top:0;left:0;right:0;height:3px;z-index:1200;background:rgba(0,0,0,0.25);opacity:0;transition:opacity .3s;pointer-events:none}
#readProgressWrap.show{opacity:1}
#readProgressBar{height:100%;width:0;background:linear-gradient(90deg,#8a6420,#c9a84c,#e8d08a);box-shadow:0 0 8px rgba(201,168,76,0.5);transition:width .12s ease-out}
#readProgressChapter{position:fixed;top:8px;right:12px;z-index:1200;font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:0.12em;color:rgba(232,208,138,0.85);background:rgba(10,8,4,0.72);border:1px solid rgba(201,168,76,0.22);border-radius:20px;padding:3px 11px;opacity:0;transition:opacity .3s;pointer-events:none;backdrop-filter:blur(6px)}
#readProgressChapter.show{opacity:1}
.chapter-cover{position:relative;margin:20px 4px 10px;border-radius:14px;overflow:hidden;min-height:168px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 8px 30px rgba(0,0,0,0.4);animation:fadeUp 0.6s ease both;background:#141018}
.chapter-cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.62;filter:saturate(0.92)}
.chapter-cover-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,6,3,0.35) 0%,rgba(8,6,3,0.55) 45%,rgba(8,6,3,0.9) 100%)}
.chapter-cover-body{position:relative;padding:18px 18px 16px}
.chapter-cover-num{font-family:'Cormorant Garamond','Noto Serif SC',serif;font-size:12px;letter-spacing:0.32em;color:rgba(232,208,138,0.82);margin-bottom:5px}
.chapter-cover-num::before{content:'';display:inline-block;width:22px;height:1px;background:linear-gradient(90deg,rgba(201,168,76,0.7),transparent);vertical-align:middle;margin-right:8px}
.chapter-cover-title{font-family:'Noto Serif SC',serif;font-size:21px;font-weight:600;letter-spacing:0.06em;color:#f3e6c0;line-height:1.25;text-shadow:0 2px 12px rgba(0,0,0,0.6)}
.chapter-cover-lead{font-size:12px;line-height:1.7;letter-spacing:0.03em;color:rgba(235,225,195,0.72);margin-top:7px;max-width:92%}
.drop-cap::first-letter{float:left;font-family:'Noto Serif SC',Georgia,serif;font-size:3.4em;line-height:0.82;font-weight:700;color:#e8d08a;margin:0.04em 0.12em 0 0;text-shadow:0 2px 10px rgba(201,168,76,0.28)}
.pull-quote{position:relative;margin:16px 10px;padding:6px 4px 6px 20px;text-align:center}
.pull-quote::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,transparent,rgba(201,168,76,0.7),transparent);border-radius:2px}
.pull-quote-text{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:500;line-height:1.75;letter-spacing:0.04em;color:#e8d08a;text-shadow:0 1px 8px rgba(201,168,76,0.18)}
.pull-quote-mark{font-family:'Cormorant Garamond',serif;font-size:26px;color:rgba(201,168,76,0.4);line-height:0}
.hl-note{margin:12px 0;padding:13px 15px;background:linear-gradient(135deg,rgba(201,168,76,0.1),rgba(201,168,76,0.03));border:1px solid rgba(201,168,76,0.34);border-left:3px solid #c9a84c;border-radius:10px;font-size:12.5px;line-height:1.9;letter-spacing:0.03em;color:rgba(235,225,195,0.92);box-shadow:0 2px 14px rgba(201,168,76,0.06)}
.hl-note b,.hl-note strong{color:#e8d08a}
.chapter-toc{margin:14px 4px 6px;padding:16px 16px 12px;background:linear-gradient(160deg,rgba(18,14,8,0.9),rgba(10,8,4,0.95));border:1px solid rgba(201,168,76,0.22);border-radius:14px;animation:fadeUp 0.5s ease both}
.chapter-toc-title{font-size:12px;letter-spacing:0.2em;color:rgba(201,168,76,0.7);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.chapter-toc-item{display:flex;align-items:baseline;gap:10px;padding:8px 2px;border-bottom:1px dotted rgba(201,168,76,0.14);text-decoration:none;transition:all .2s}
.chapter-toc-item:last-child{border-bottom:none}
.chapter-toc-idx{font-family:'Cormorant Garamond',serif;font-size:13px;color:rgba(201,168,76,0.6);min-width:26px}
.chapter-toc-label{flex:1;font-size:13px;letter-spacing:0.04em;color:rgba(232,220,190,0.9)}
.chapter-toc-arrow{font-size:12px;color:rgba(201,168,76,0.45)}
#floatTocBtn{position:fixed;right:16px;bottom:96px;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#8a6420,#c9a84c);border:none;color:rgba(14,10,4,0.95);font-size:18px;cursor:pointer;z-index:1100;box-shadow:0 4px 16px rgba(201,168,76,0.4);display:none;align-items:center;justify-content:center}
#floatTocBtn.show{display:flex}
#floatTocPanel{display:none;position:fixed;right:16px;bottom:150px;z-index:1100;background:rgba(14,11,6,0.97);border:1px solid rgba(201,168,76,0.4);border-radius:12px;padding:14px;max-height:56vh;overflow-y:auto;width:min(230px,calc(100vw - 32px));box-shadow:0 10px 30px rgba(0,0,0,0.6);backdrop-filter:blur(8px)}
#floatTocPanel.show{display:block;animation:fadeUp 0.25s ease both}
#floatTocPanel .ft-title{font-size:12px;letter-spacing:0.16em;color:rgba(201,168,76,0.75);margin-bottom:10px}
#floatTocPanel a{display:flex;gap:8px;color:rgba(232,220,190,0.85);text-decoration:none;padding:7px 0;font-size:12.5px;border-bottom:1px solid rgba(201,168,76,0.08);line-height:1.4}
#floatTocPanel a:last-child{border-bottom:none}
#floatTocPanel a .ft-idx{color:rgba(201,168,76,0.55);font-family:'Cormorant Garamond',serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>
<link rel="stylesheet" href="/assets/css/common.css">
</head>
<body>
<div id="readProgressWrap"><div id="readProgressBar"></div></div>
<div id="readProgressChapter"></div>
<button id="floatTocBtn" onclick="toggleFloatToc()">☰</button>
<div id="floatTocPanel"><div class="ft-title">章节目录</div><div id="floatTocLinks"></div></div>
<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题" style="z-index:999">🌙</button>

<div class="input-screen" id="inputScreen">
  <button class="back-btn" onclick="history.back()">← 返回</button>
  <div class="header">
    <div class="header-icon">🌀</div>
    <div class="header-title">前世回溯</div>
    <div class="header-sub">Past Life Regression</div>
    <div class="gold-line"></div>
  </div>
  <div class="form-section">
    <div class="form-label">出生信息</div>
    <div class="field-group">
      <div class="field-row"><span class="field-label">年</span><input class="field-input" id="birthYear" type="number" placeholder="1991"></div>
      <div class="field-row"><span class="field-label">月</span><input class="field-input" id="birthMonth" type="number" placeholder="10"></div>
      <div class="field-row"><span class="field-label">日</span><input class="field-input" id="birthDay" type="number" placeholder="6"></div>
      <div class="field-row"><span class="field-label">时</span><select class="field-select" id="birthHour"><option value="">不详</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option></select></div>
    </div>
    <div class="form-label" style="margin-top:12px">性别</div>
    <div class="gender-row" id="genderRow">
      <div class="gender-opt selected" onclick="selectGender(this,'female')">女</div>
      <div class="gender-opt" onclick="selectGender(this,'male')">男</div>
    </div>
    <div class="form-label" style="margin-top:12px">出生地</div>
    <div class="field-group">
      <div class="field-row"><span class="field-label">城市</span><input class="field-input" id="birthPlace" placeholder="如 长春"></div>
    </div>
    <div style="padding:16px 0">
      <button class="btn-gen" onclick="generate()">🌀 回溯前世</button>
    </div>
  </div>
</div>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-ring"></div>
  <div class="loading-text" id="loadingText">正在打开时空之门...</div>
</div>

<div class="result-screen" id="resultScreen">
  <button class="back-btn" onclick="resetPage()">← 重新回溯</button>
  <div class="pastlife-card" id="summaryCard"></div>
  <div class="report-content" id="reportContent"></div>
  <div class="share-bar">
    <button class="share-btn" onclick="shareTwitter()">🐦 Twitter</button>
    <button class="share-btn" onclick="shareCopy()">📋 复制</button>
  </div>
  <div style="text-align:center;padding:8px 0 24px;font-size:9px;color:rgba(155,111,212,0.25);letter-spacing:0.08em">* AI生成故事，仅供娱乐</div>
</div>

<script>
var gender = 'female';
function selectGender(el, g){gender=g;document.querySelectorAll('.gender-opt').forEach(function(e){e.classList.remove('selected')});el.classList.add('selected')}

function generate() {
  var y = document.getElementById('birthYear').value;
  if (!y) { showToast('请至少提供出生年份','error'); return; }
  document.getElementById('inputScreen').style.display = 'none';
  document.getElementById('loadingScreen').classList.add('show');
  var steps = ['连接宇宙能量...','读取因果线...','回溯时空...','还原前世记忆...','整合今世关联...'];
  var i = 0;
  var tmr = setInterval(function() {
    document.getElementById('loadingText').textContent = steps[i % steps.length];
    i++;
  }, 3000);
  fetch('/api/pastlife', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      birthYear: parseInt(y)||null,
      birthMonth: parseInt(document.getElementById('birthMonth').value)||null,
      birthDay: parseInt(document.getElementById('birthDay').value)||null,
      birthHour: parseInt(document.getElementById('birthHour').value)||null,
      gender: gender,
      birthPlace: document.getElementById('birthPlace').value || ''
    })
  }).then(function(r){return r.json()}).then(function(d){
    clearInterval(tmr);
    document.getElementById('loadingScreen').classList.remove('show');
    document.getElementById('resultScreen').classList.add('show');
    if (d.error) { showToast(d.error,'error'); resetPage(); return; }
    renderResult(d);
  }).catch(function(){
    clearInterval(tmr);
    document.getElementById('loadingScreen').classList.remove('show');
    showToast('AI暂时不可用','error');
    resetPage();
  });
}

function renderResult(d) {
  var r = d.reading || '';
  var lines = r.split('\n').filter(function(l){return l.trim()});
  var summary = lines[0] || '前世记忆已解锁';
  document.getElementById('summaryCard').innerHTML =
    '<div class="pl-icon">🔮</div>' +
    '<div class="pl-era">' + summary.slice(0,40) + '</div>' +
    '<div class="pl-title">前世身份已确认</div>' +
    '<div class="pl-desc">' + (r.slice(0,200)) + '...</div>';

  // Split content into sections by headings
  var sections = [];
  var cur = { title: '前世总览', lines: [] };
  lines.forEach(function(l) {
    var stripped = l.replace(/^#+\s*/, '').replace(/^\*+\s*/, '').trim();
    if (/^#{1,3}\s|^\*\*[^*]+\*\*$/.test(l) && l.trim().length < 40) {
      if (cur.lines.length) sections.push(cur);
      cur = { title: stripped, lines: [] };
    } else {
      cur.lines.push(stripped);
    }
  });
  if (cur.lines.length) sections.push(cur);

  var ARTS = ['pastlife', 'spirit', 'astrology', 'pastlife', 'spirit'];
  var ORDINAL = ['一','二','三','四','五','六','七','八'];
  var AIGC_DISCLAIMER = '<div style="text-align:center;padding:16px 0 24px;font-size:10px;color:rgba(155,111,212,0.3);letter-spacing:0.08em">🤖 AI生成故事，仅供娱乐与自我探索</div>';
  var chEl = document.getElementById('readProgressChapter');

  var html = '';
  // TOC
  if (sections.length > 1) {
    html += '<div class="chapter-toc"><div class="chapter-toc-title"><span>📖</span> 前世回溯目录 · 共 ' + sections.length + ' 章</div>';
    sections.forEach(function(s, i) {
      html += '<a class="chapter-toc-item" href="#pl-chap-' + i + '"><span class="chapter-toc-idx">' + (ORDINAL[i] || (i+1)) + '</span><span class="chapter-toc-label">' + s.title + '</span><span class="chapter-toc-arrow">›</span></a>';
    });
    html += '</div>';
  }

  // Float TOC links
  var ftLinks = document.getElementById('floatTocLinks');
  if (ftLinks) {
    ftLinks.innerHTML = '';
    sections.forEach(function(s, i) {
      ftLinks.innerHTML += '<a href="#pl-chap-' + i + '"><span class="ft-idx">' + (ORDINAL[i] || (i+1)) + '</span>' + s.title + '</a>';
    });
    var btn = document.getElementById('floatTocBtn');
    if (btn && sections.length > 1) btn.classList.add('show');
  }

  sections.forEach(function(s, i) {
    // Chapter cover
    html += '<div class="chapter-cover" id="pl-chap-' + i + '" data-chap="' + s.title + '">';
    html += '<img class="chapter-cover-img" loading="lazy" src="/samples/caijing/art-' + (ARTS[i] || 'spirit') + '.png" alt="" onerror="this.style.display=\'none\'">';
    html += '<div class="chapter-cover-veil"></div>';
    html += '<div class="chapter-cover-body"><div class="chapter-cover-num">' + (ORDINAL[i] || (i+1)) + '</div><div class="chapter-cover-title">' + s.title + '</div></div></div>';

    // Section content card
    var bodyText = s.lines.join('\n');
    html += '<div class="report-content" style="padding:16px 18px">';
    // First section gets drop-cap
    if (i === 0) {
      html += '<p class="drop-cap">' + bodyText + '</p>';
    } else {
      // Add highlight note for key sentences
      var paragraphs = bodyText.split('\n').filter(Boolean);
      var hlDone = false;
      paragraphs.forEach(function(p, pi) {
        if (!hlDone && p.length > 30 && pi > 0) {
          html += '<div class="hl-note">' + p + '</div>';
          hlDone = true;
        } else {
          html += '<p style="margin-bottom:8px;line-height:1.9;font-size:12.5px">' + p + '</p>';
        }
      });
    }
    // Pull quote from last paragraph if available
    if (s.lines.length > 2) {
      var lastLine = s.lines[s.lines.length - 1];
      if (lastLine && lastLine.length > 15 && lastLine.length < 60) {
        html += '<div class="pull-quote"><span class="pull-quote-mark">"</span><div class="pull-quote-text">' + lastLine + '</div></div>';
      }
    }
    html += '</div>';
  });

  // Add ReportViz scroll card if available (narrative atmosphere)
  if (window.ReportViz) {
    var scrollHtml = window.ReportViz.renderScrollCard({
      title: '前世启示',
      number: '命运回响',
      level: '天机已启',
      levelTone: 'neutral',
      poem: ['轮回往复因果链', '今世前世皆有源', '此身来处有深意', '归去来兮自从容'],
      reading: '前世回溯是一面镜子，照见今世性格根源与灵魂课题。所有经历，皆是灵魂成长的印记。'
    });
    html += scrollHtml;
  }

  html += AIGC_DISCLAIMER;
  document.getElementById('reportContent').innerHTML = html;

  // Update chapter display on scroll
  var chapters = document.querySelectorAll('.chapter-cover[data-chap]');
  if (chapters.length && chEl) {
    document.addEventListener('scroll', function() {
      var cur = '';
      chapters.forEach(function(el) {
        if (el.getBoundingClientRect().top < 120) cur = el.getAttribute('data-chap');
      });
      if (cur) { chEl.textContent = cur; chEl.classList.add('show'); }
      else { chEl.classList.remove('show'); }
    }, {passive:true});
  }
}

function showToast(msg,type){var t=document.createElement('div');t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;max-width:360px;width:90%;padding:12px 16px;border-radius:8px;font-size:12px;text-align:center;cursor:pointer;';t.style.background=type==='error'?'rgba(180,40,40,0.92)':'rgba(23,14,6,0.95)';t.style.border='1px solid '+(type==='error'?'rgba(220,80,80,0.4)':'rgba(201,168,76,0.2)');t.style.color='rgba(255,245,220,0.9)';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transition='opacity 0.3s';setTimeout(function(){t.remove();},300);},3000);}
</script>

  if(bar) {
    document.addEventListener('scroll', function(){
      var h = document.documentElement.scrollHeight - window.innerHeight;
      var pct = h > 0 ? (window.scrollY / h * 100) : 0;
      bar.style.width = Math.min(100, pct) + '%';
      if(pct > 2) { wrap.classList.add('show'); } else { wrap.classList.remove('show'); }
    }, {passive:true});
  }
  // 浮动目录切换
  window.toggleFloatToc = function(){
    var p = document.getElementById('floatTocPanel');
    if(p) p.classList.toggle('show');
  };
  document.addEventListener('click', function(e){
    var panel = document.getElementById('floatTocPanel');
    var btn = document.getElementById('floatTocBtn');
    if(panel && panel.classList.contains('show') && !panel.contains(e.target) && e.target !== btn) {
      panel.classList.remove('show');
    }
  });
})();
