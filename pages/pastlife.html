<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0e0820">
<meta name="description" content="善缘 · 前世回溯 · AI灵性分析，仅供娱乐参考">
<title>善缘 · 前世回溯</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#faf8f5;--card:#ffffff;--mid:#f5f0e8;
  --gold:#b8944a;--gold-light:#d4b06a;--gold-deep:#8a7020;
  --jade:#5bbfa0;--jade-mid:#8dd9bf;--jade-deep:#3d9e82;
  --ink:rgba(40,35,30,0.92);--sub:rgba(80,70,55,0.7);}
.dark-mode{--bg:#faf8f5;--card:#ffffff;--mid:#1f1408;
  --gold:#c9a84c;--gold-light:#e8d08a;--gold-deep:#8a6420;
  --jade:#5bbfa0;--jade-mid:#8dd9bf;--jade-deep:#3d9e82;
  --ink:rgba(40,35,30,0.92);--sub:rgba(80,70,55,0.7);}
html,body{background:var(--bg);font-family:'Noto Serif SC',serif;color:var(--ink);-webkit-font-smoothing:antialiased}
body{max-width:390px;margin:0 auto;min-height:100vh;padding-bottom:120px;overflow-y:auto}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(155,111,212,0.12) 0%,transparent 55%);pointer-events:none;z-index:0}
.back-btn{position:fixed;top:16px;left:16px;z-index:99;background:none;border:none;color:rgba(155,111,212,0.6);font-size:13px;cursor:pointer;font-family:'Noto Serif SC',serif;padding:4px 0}
.input-screen{position:relative;z-index:1}
.header{text-align:center;padding:44px 20px 20px}
.header-icon{font-size:56px;margin-bottom:8px}
.header-title{font-size:20px;font-weight:400;letter-spacing:0.22em;margin-bottom:4px}
.header-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11px;letter-spacing:0.26em;color:rgba(155,111,212,0.45);margin-bottom:14px}
.gold-line{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto}
.form-section{padding:14px 16px}
.form-label{font-size:10px;letter-spacing:0.18em;color:rgba(201,168,76,0.5);margin-bottom:10px}
.field-group{background:var(--card);border:1px solid rgba(201,168,76,0.12);border-radius:8px;overflow:hidden}
.field-row{display:flex;align-items:center;padding:0 14px;border-bottom:1px solid rgba(201,168,76,0.08)}
.field-row:last-child{border-bottom:none}
.field-label{font-size:11px;color:var(--sub);letter-spacing:0.06em;min-width:64px;flex-shrink:0}
.field-input,.field-select{flex:1;background:none;border:none;outline:none;font-family:'Noto Serif SC',serif;font-size:13px;color:var(--ink);padding:12px 8px;letter-spacing:0.04em;-webkit-appearance:none}
.field-select option{background:var(--card);color:var(--ink)}
.gender-row{display:flex;gap:8px;padding:0 16px;margin-bottom:12px}
.gender-opt{flex:1;background:var(--card);border:1px solid rgba(201,168,76,0.12);border-radius:6px;padding:10px 0;text-align:center;font-size:13px;color:var(--sub);letter-spacing:0.12em;cursor:pointer;transition:all 0.2s}
.gender-opt.selected{border-color:var(--purple);background:rgba(155,111,212,0.12);color:var(--purple-mid)}
.btn-gen{width:100%;padding:15px 0;background:linear-gradient(135deg,#6b3fa0,#9b6fd4,#c4a0f0);border:none;border-radius:4px;color:rgba(14,8,32,0.95);font-family:'Noto Serif SC',serif;font-size:14px;letter-spacing:0.22em;cursor:pointer;box-shadow:0 4px 20px rgba(155,111,212,0.3)}
.loading-screen{display:none;text-align:center;padding:60px 20px;position:relative;z-index:1}
.loading-screen.show{display:block}
.loading-ring{width:48px;height:48px;border:2px solid rgba(155,111,212,0.15);border-top-color:var(--purple);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:12px;color:var(--sub);letter-spacing:0.1em}
.result-screen{display:none;position:relative;z-index:1;padding:0 16px}
.result-screen.show{display:block}
.pastlife-card{background:var(--card);border:1px solid rgba(155,111,212,0.2);border-radius:12px;padding:24px 20px;text-align:center;margin-bottom:16px;box-shadow:0 8px 32px rgba(0,0,0,0.3);position:relative;overflow:hidden}
.pastlife-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--purple),var(--gold),transparent)}
.pl-icon{font-size:48px;margin-bottom:12px}
.pl-era{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--gold-light);margin-bottom:4px}
.pl-title{font-size:12px;color:var(--sub);margin-bottom:12px;letter-spacing:0.1em}
.pl-desc{font-size:12px;color:var(--ink);line-height:1.9;letter-spacing:0.05em;text-align:left}
.report-content{background:var(--card);border:1px solid rgba(201,168,76,0.08);border-radius:8px;padding:18px;margin-bottom:12px}
.report-content h1,.report-content h2,.report-content h3{font-size:13px;color:var(--gold);margin:12px 0 6px;font-weight:400;letter-spacing:0.1em}
.report-content p{font-size:11.5px;line-height:2;color:var(--ink);margin-bottom:8px}
.report-content strong{color:var(--purple-mid)}
.report-content em{color:var(--sub);font-style:normal}
.share-bar{display:flex;gap:8px;margin:12px 0 16px}
.share-btn{flex:1;padding:10px 0;border:0.5px solid rgba(201,168,76,0.12);border-radius:6px;background:var(--card);color:var(--ink);font-family:'Noto Serif SC',serif;font-size:10px;letter-spacing:0.1em;cursor:pointer;text-align:center}
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题" style="z-index:999">🌙</button>

<div class="input-screen" id="inputScreen">
  <button class="back-btn" onclick="history.back()">← 返回</button>
  <div class="header">
    <div class="header-icon">🌀</div>
    <div class="header-title">前世回溯</div>
    <div class="header-sub">Past Life Regression</div>
    <div class="gold-line"></div>
  </div>
  <div class="form-section">
    <div class="form-label">出生信息</div>
    <div class="field-group">
      <div class="field-row"><span class="field-label">年</span><input class="field-input" id="birthYear" type="number" placeholder="1991"></div>
      <div class="field-row"><span class="field-label">月</span><input class="field-input" id="birthMonth" type="number" placeholder="10"></div>
      <div class="field-row"><span class="field-label">日</span><input class="field-input" id="birthDay" type="number" placeholder="6"></div>
      <div class="field-row"><span class="field-label">时</span><select class="field-select" id="birthHour"><option value="">不详</option><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option></select></div>
    </div>
    <div class="form-label" style="margin-top:12px">性别</div>
    <div class="gender-row" id="genderRow">
      <div class="gender-opt selected" onclick="selectGender(this,'female')">女</div>
      <div class="gender-opt" onclick="selectGender(this,'male')">男</div>
    </div>
    <div class="form-label" style="margin-top:12px">出生地</div>
    <div class="field-group">
      <div class="field-row"><span class="field-label">城市</span><input class="field-input" id="birthPlace" placeholder="如 长春"></div>
    </div>
    <div style="padding:16px 0">
      <button class="btn-gen" onclick="generate()">🌀 回溯前世</button>
    </div>
  </div>
</div>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-ring"></div>
  <div class="loading-text" id="loadingText">正在打开时空之门...</div>
</div>

<div class="result-screen" id="resultScreen">
  <button class="back-btn" onclick="resetPage()">← 重新回溯</button>
  <div class="pastlife-card" id="summaryCard"></div>
  <div class="report-content" id="reportContent"></div>
  <div class="share-bar">
    <button class="share-btn" onclick="shareTwitter()">🐦 Twitter</button>
    <button class="share-btn" onclick="shareCopy()">📋 复制</button>
  </div>
  <div style="text-align:center;padding:8px 0 24px;font-size:9px;color:rgba(155,111,212,0.25);letter-spacing:0.08em">* AI生成故事，仅供娱乐</div>
</div>

<script>
var gender = 'female';
function selectGender(el, g){gender=g;document.querySelectorAll('.gender-opt').forEach(function(e){e.classList.remove('selected')});el.classList.add('selected')}

function generate() {
  var y = document.getElementById('birthYear').value;
  if (!y) { showToast('请至少提供出生年份','error'); return; }
  document.getElementById('inputScreen').style.display = 'none';
  document.getElementById('loadingScreen').classList.add('show');
  var steps = ['连接宇宙能量...','读取因果线...','回溯时空...','还原前世记忆...','整合今世关联...'];
  var i = 0;
  var tmr = setInterval(function() {
    document.getElementById('loadingText').textContent = steps[i % steps.length];
    i++;
  }, 3000);
  fetch('/api/pastlife', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      birthYear: parseInt(y)||null,
      birthMonth: parseInt(document.getElementById('birthMonth').value)||null,
      birthDay: parseInt(document.getElementById('birthDay').value)||null,
      birthHour: parseInt(document.getElementById('birthHour').value)||null,
      gender: gender,
      birthPlace: document.getElementById('birthPlace').value || ''
    })
  }).then(function(r){return r.json()}).then(function(d){
    clearInterval(tmr);
    document.getElementById('loadingScreen').classList.remove('show');
    document.getElementById('resultScreen').classList.add('show');
    if (d.error) { showToast(d.error,'error'); resetPage(); return; }
    renderResult(d);
  }).catch(function(){
    clearInterval(tmr);
    document.getElementById('loadingScreen').classList.remove('show');
    showToast('AI暂时不可用','error');
    resetPage();
  });
}

function renderResult(d) {
  var r = d.reading || '';
  // Extract first line as summary
  var lines = r.split('\n').filter(function(l){return l.trim()});
  var summary = lines[0] || '前世记忆已解锁';
  document.getElementById('summaryCard').innerHTML =
    '<div class="pl-icon">🔮</div>' +
    '<div class="pl-era">' + summary.slice(0,40) + '</div>' +
    '<div class="pl-title">前世身份已确认</div>' +
    '<div class="pl-desc">' + r.slice(0,200) + '...</div>';
  document.getElementById('reportContent').innerHTML = r;
}

function shareTwitter() { window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent('我回溯了我的前世！来看看你的前世是什么 🔮')); }
function shareCopy() { navigator.clipboard.writeText('我在善缘回溯了前世，太神奇了！来看看你的前世：shenyuan.mylumee.cn').then(function(){showToast('已复制','');}); }
function resetPage() { document.getElementById('inputScreen').style.display='block';document.getElementById('resultScreen').classList.remove('show');document.getElementById('loadingScreen').classList.remove('show'); }
function showToast(msg,type){var t=document.createElement('div');t.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;max-width:360px;width:90%;padding:12px 16px;border-radius:8px;font-size:12px;text-align:center;cursor:pointer;';t.style.background=type==='error'?'rgba(180,40,40,0.92)':'rgba(23,14,6,0.95)';t.style.border='1px solid '+(type==='error'?'rgba(220,80,80,0.4)':'rgba(201,168,76,0.2)');t.style.color='rgba(255,245,220,0.9)';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transition='opacity 0.3s';setTimeout(function(){t.remove();},300);},3000);}
</script>

<script>
(function(){var t=localStorage.getItem('sy_theme');if(t==='dark'){document.documentElement.classList.add('dark-mode');var b=document.getElementById('themeToggle');if(b)b.textContent='🌙';}})();
function toggleTheme(){var e=document.documentElement;var b=document.getElementById('themeToggle');e.classList.toggle('dark-mode');var l=e.classList.contains('dark-mode');if(b)b.textContent=l?'🌙':'🌙';localStorage.setItem('sy_theme',l?'dark':'dark');}
</script>
</body>
</html>
