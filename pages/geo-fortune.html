<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #faf8f5; --card: #ffffff; --mid: #f5f0e8;
  --gold: #c9a84c; --gold-light: #e8d08a; --gold-deep: #8a6420;
  --jade: #5bbfa0; --jade-mid: #8dd9bf;
  --amber: #c9820a; --amber-light: #e8b86a;
  --ink-text: rgba(40,35,30,0.92);
  --sub-text: rgba(255,245,220,0.58);
}
html, body { background: var(--bg); font-family: 'Noto Serif SC', serif; color: var(--ink-text); -webkit-font-smoothing: antialiased; }
body { max-width: 390px; margin: 0 auto; min-height: 100vh; overflow-y: auto; padding-bottom: 120px; }
body::before { content:''; position:fixed; inset:0; background:radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.1) 0%, transparent 50%); pointer-events:none; z-index:0; }

.back-btn { position:fixed; top:16px; left:16px; z-index:99; background:none; border:none; font-family:'Noto Serif SC',serif; font-size:13px; color:rgba(201,168,76,0.6); cursor:pointer; padding:4px 0; }

/* ── Input screen ── */
.input-screen { position:relative; z-index:1; }
.header { text-align:center; padding:44px 20px 20px; }
.header-title { font-size:20px; font-weight:400; letter-spacing:0.22em; margin-bottom:5px; }
.header-sub { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:11px; letter-spacing:0.26em; color:rgba(201,168,76,0.45); margin-bottom:14px; }
.gold-line { width:60px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:0 auto; }

.form-section { padding:14px 16px; }
.form-label { font-size:10px; letter-spacing:0.18em; color:rgba(201,168,76,0.5); margin-bottom:10px; }
.field-group { background:var(--card); border:1px solid rgba(201,168,76,0.12); border-radius:8px; overflow:hidden; }
.field-row { display:flex; align-items:center; padding:0 14px; border-bottom:1px solid rgba(201,168,76,0.08); }
.field-row:last-child { border-bottom:none; }
.field-label { font-size:11px; color:var(--sub-text); letter-spacing:0.06em; min-width:64px; flex-shrink:0; }
.field-input, .field-select { flex:1; background:none; border:none; outline:none; font-family:'Noto Serif SC',serif; font-size:13px; color:var(--ink-text); padding:12px 8px; letter-spacing:0.04em; -webkit-appearance:none; }
.field-select option { background:var(--card); color:var(--ink-text); }
.field-input::placeholder { color:rgba(255,245,220,0.18); }

.gender-row { display:flex; gap:8px; padding:0 16px; margin-bottom:12px; }
.gender-opt { flex:1; background:var(--card); border:1px solid rgba(201,168,76,0.12); border-radius:6px; padding:10px 0; text-align:center; font-size:13px; color:var(--sub-text); letter-spacing:0.12em; cursor:pointer; transition:all 0.2s; }
.gender-opt.selected { border-color:var(--gold); background:rgba(201,168,76,0.12); color:var(--gold-light); }

/* ── City quick-select pills ── */
.city-row { display:flex; flex-wrap:wrap; gap:6px; padding:0 16px; margin-bottom:16px; }
.city-pill { padding:6px 12px; background:var(--card); border:1px solid rgba(201,168,76,0.25); border-radius:14px; font-size:10px; color:var(--sub-text); letter-spacing:0.06em; cursor:pointer; transition:all 0.2s; font-family:'Noto Serif SC',serif; }
.city-pill:active { transform:scale(0.95); border-color:var(--gold); background:rgba(201,168,76,0.08); color:var(--gold-light); }

.submit-section { padding:0 16px 16px; }
.btn-gen { width:100%; padding:15px 0; background:linear-gradient(135deg,var(--gold-deep),var(--gold),var(--gold-light),var(--gold)); border:none; border-radius:4px; color:rgba(14,10,4,0.95); font-family:'Noto Serif SC',serif; font-size:14px; font-weight:500; letter-spacing:0.22em; cursor:pointer; box-shadow:0 4px 20px rgba(201,168,76,0.3); }

/* ── Loading ── */
.loading-screen { position:relative; z-index:1; display:none; flex-direction:column; align-items:center; padding:80px 20px; gap:20px; }
.loading-screen.show { display:flex; }
.load-glyph { font-size:60px; color:rgba(201,168,76,0.3); font-weight:300; animation:load-breathe 2s ease-in-out infinite; }
.load-text { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:14px; color:rgba(201,168,76,0.5); letter-spacing:0.18em; }
.load-steps { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
.load-step { font-size:10px; color:rgba(255,245,220,0.3); letter-spacing:0.08em; animation:step-fade 0.5s ease-out both; }

/* ── Report screen ── */

.chart-header { padding:20px 16px 0; }
.name-row { display:flex; align-items:baseline; gap:12px; margin-bottom:4px; flex-wrap:wrap; }
.report-name { font-size:22px; letter-spacing:0.14em; }
.report-tag { font-size:10px; color:var(--gold); border:1px solid rgba(201,168,76,0.3); padding:3px 8px; border-radius:2px; letter-spacing:0.1em; }
.birth-info { font-size:10px; color:var(--sub-text); letter-spacing:0.06em; margin-bottom:14px; }
.divider { height:1px; background:linear-gradient(90deg,transparent,rgba(201,168,76,0.2),transparent); margin:0 16px 14px; }

/* AI Report section cards */
.ai-section { background:var(--card); border:1px solid rgba(201,168,76,0.1); border-radius:10px; margin:0 16px 10px; overflow:hidden; }
.ai-section-head { display:flex; align-items:center; padding:12px 14px; gap:10px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.ai-section-icon { font-size:20px; flex-shrink:0; }
.ai-section-title { font-size:13px; letter-spacing:0.08em; flex:1; }
.ai-section-arrow { font-size:10px; color:rgba(255,245,220,0.25); transition:transform 0.25s; }
.ai-section-body { padding:0 14px 14px; display:none; }
.ai-section-body.open { display:block; }
.ai-section-text { font-size:11px; color:var(--sub-text); letter-spacing:0.04em; line-height:1.9; white-space:pre-wrap; }
.ai-plain-text { padding:0 16px 14px; font-size:11px; color:var(--sub-text); letter-spacing:0.04em; line-height:1.9; white-space:pre-wrap; }

/* ── QA section ── */
#qaSection { position:relative; z-index:1; display:none; padding:16px 0 80px; }
.qa-label { font-size:10px; color:rgba(201,168,76,0.5); letter-spacing:0.2em; margin-bottom:10px; padding:0 16px; }
.qa-row { display:flex; gap:8px; padding:0 16px; }
.qa-input { flex:1; background:var(--card); border:1px solid rgba(201,168,76,0.12); border-radius:6px; padding:10px 12px; font-family:Noto Serif SC,serif; font-size:12px; color:var(--ink-text); outline:none; }
.qa-input:focus { border-color:rgba(201,168,76,0.3); }
.qa-btn { padding:10px 16px; background:linear-gradient(135deg,var(--gold-deep),var(--gold)); border:none; border-radius:6px; color:#0e0a04; font-family:Noto Serif SC,serif; font-size:12px; letter-spacing:0.1em; cursor:pointer; white-space:nowrap; }
.qa-btn:active { transform:scale(0.97); }
.qa-btn:disabled { opacity:0.4; cursor:default; }
.qa-history { padding:12px 16px 0; }

/* ── Animations ── */
@keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }
.page-enter-d1 { animation-delay:.1s } .page-enter-d2 { animation-delay:.2s }
.page-enter-d3 { animation-delay:.3s } .page-enter-d4 { animation-delay:.4s }
.page-enter-d5 { animation-delay:.5s } .page-enter-d6 { animation-delay:.6s }

.btn-gen { background:linear-gradient(90deg,#8a6420,#c9a84c,#e8d08a,#c9a84c,#8a6420) !important; background-size:300% auto !important; animation:gold-shimmer 3s linear infinite !important; }

/* Stardust */
.stardust span { position:absolute; width:3px; height:3px; background:rgba(201,168,76,0.6); border-radius:50%; animation:twinkle 3s ease-in-out infinite; opacity:0; transition:opacity .5s }

/* ══════════ 精装报告阅读体验 ══════════ */
#readProgressWrap{position:fixed;top:0;left:0;right:0;height:3px;z-index:1200;background:rgba(0,0,0,0.25);opacity:0;transition:opacity .3s;pointer-events:none}
#readProgressWrap.show{opacity:1}
#readProgressBar{height:100%;width:0;background:linear-gradient(90deg,#8a6420,#c9a84c,#e8d08a);box-shadow:0 0 8px rgba(201,168,76,0.5);transition:width .12s ease-out}
.chapter-cover{position:relative;margin:20px 4px 10px;border-radius:14px;overflow:hidden;min-height:168px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 8px 30px rgba(0,0,0,0.4);animation:fadeUp 0.6s ease both;background:#141018}
.chapter-cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.62;filter:saturate(0.92)}
.chapter-cover-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,6,3,0.35) 0%,rgba(8,6,3,0.55) 45%,rgba(8,6,3,0.9) 100%)}
.chapter-cover-body{position:relative;padding:18px 18px 16px}
.chapter-cover-num{font-family:'Cormorant Garamond','Noto Serif SC',serif;font-size:12px;letter-spacing:0.32em;color:rgba(232,208,138,0.82);margin-bottom:5px}
.chapter-cover-title{font-family:'Noto Serif SC',serif;font-size:21px;font-weight:600;letter-spacing:0.06em;color:#f3e6c0;line-height:1.25;text-shadow:0 2px 12px rgba(0,0,0,0.6)}
.chapter-cover-lead{font-size:12px;line-height:1.7;letter-spacing:0.03em;color:rgba(235,225,195,0.72);margin-top:7px;max-width:92%}
.pull-quote{position:relative;margin:16px 10px;padding:6px 4px 6px 20px;text-align:center}
.pull-quote::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,transparent,rgba(201,168,76,0.7),transparent);border-radius:2px}
.pull-quote-text{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:500;line-height:1.75;letter-spacing:0.04em;color:var(--gold,#c9a84c);text-shadow:0 1px 8px rgba(201,168,76,0.18)}
.hl-note{margin:12px 0;padding:13px 15px;background:linear-gradient(135deg,rgba(201,168,76,0.1),rgba(201,168,76,0.03));border:1px solid rgba(201,168,76,0.34);border-left:3px solid #c9a84c;border-radius:10px;font-size:12px;line-height:1.9;letter-spacing:0.03em;color:rgba(235,225,195,0.92)}
.chapter-toc{margin:14px 4px 6px;padding:16px 16px 12px;background:linear-gradient(160deg,rgba(18,14,8,0.9),rgba(10,8,4,0.95));border:1px solid rgba(201,168,76,0.22);border-radius:14px;animation:fadeUp 0.5s ease both}
.chapter-toc-title{font-size:12px;letter-spacing:0.2em;color:rgba(201,168,76,0.7);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.chapter-toc-item{display:flex;align-items:baseline;gap:10px;padding:8px 2px;border-bottom:1px dotted rgba(201,168,76,0.14);text-decoration:none;transition:all .2s}
.chapter-toc-item:last-child{border-bottom:none}
.chapter-toc-idx{font-family:'Cormorant Garamond',serif;font-size:13px;color:rgba(201,168,76,0.6);min-width:26px}
.chapter-toc-label{flex:1;font-size:13px;letter-spacing:0.04em;color:rgba(232,220,190,0.9)}
.chapter-toc-arrow{font-size:12px;color:rgba(201,168,76,0.45)}
.drop-cap::first-letter{float:left;font-family:'Noto Serif SC',Georgia,serif;font-size:3.4em;line-height:0.82;font-weight:700;color:#e8d08a;margin:0.04em 0.12em 0 0;text-shadow:0 2px 10px rgba(201,168,76,0.28)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>

<body>

<div class="stardust" id="stardust"></div>

<!-- Input screen -->
<div class="input-screen" id="inputScreen">
  <div class="header page-enter page-enter-d1">
    <div class="header-title">地理命理</div>

          <option value="">不填</option>

          <option value="5">5月</option><option value="6">6月</option><option value="7">7月</option><option value="8">8月</option>

<script>
function showToast(msg, type) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;max-width:360px;width:90%;padding:12px 16px;border-radius:8px;font-size:12px;letter-spacing:0.06em;text-align:center;font-family:Noto Serif SC,serif;cursor:pointer;';
  t.style.background = type === 'error' ? 'rgba(180,40,40,0.92)' : 'rgba(23,14,6,0.95)';
  t.style.border = type === 'error' ? '1px solid rgba(220,80,80,0.4)' : '1px solid rgba(201,168,76,0.2)';
  t.style.color = type === 'error' ? 'rgba(255,220,220,0.95)' : 'rgba(255,245,220,0.9)';
  t.textContent = msg;
  t.onclick = function(){ t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(function(){ t.remove(); },300); };
  document.body.appendChild(t);
  if (t._toastTimer) clearTimeout(t._toastTimer);
  t._toastTimer = setTimeout(function(){ t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(function(){ t.remove(); },300); }, 3000);
}

// Init year/day selectors
var ySel = document.getElementById('year');
for (var y = 2026; y >= 1920; y--) ySel.innerHTML += '<option value="'+y+'">'+y+'年</option>';
var dSel = document.getElementById('day');
for (var d = 1; d <= 31; d++) dSel.innerHTML += '<option value="'+d+'">'+d+'日</option>';

var gender = '';

function selectGender(el, g) {
  document.querySelectorAll('.gender-opt').forEach(function(o){ o.classList.remove('selected'); });
  el.classList.add('selected'); gender = g;
}

// City quick-select
document.querySelectorAll('.city-pill').forEach(function(pill){
  pill.addEventListener('click', function(){
    var lat = this.dataset.lat;
    var lng = this.dataset.lng;
    document.getElementById('latitude').value = lat;
    document.getElementById('longitude').value = lng;
    this.style.borderColor = '#c9a84c';
    this.style.background = 'rgba(201,168,76,0.08)';
    this.style.color = '#e8d08a';
    document.querySelectorAll('.city-pill').forEach(function(p){
      if (p !== pill) {
        p.style.borderColor = 'rgba(201,168,76,0.25)';
        p.style.background = '';
        p.style.color = '';
      }
    });
  });
});

var knownEmojis = ['📜','💰','💼','❤️','💪','🌟','🔮','📊','🎯','🔥','💧','🌿','🌊','⛰','⚔️','🛡️','✨','💫','⭐','☯','🌙','☀️','📈','💕','🤝','🎓','🏠','🚗','❄️','⚡','🌪','🏆','🎁','📝','💡','🕯','⚱','🧿','🔔','🗝','🪷','♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓','📍','🗺'];

function parseAISections(text) {
  var lines = text.split('\n');
  var sections = [];
  var current = null;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var matched = null;
    for (var k = 0; k < knownEmojis.length; k++) {
      if (line.indexOf(knownEmojis[k]) === 0) { matched = knownEmojis[k]; break; }
    }
    if (matched) {
      if (current && current.lines.length) sections.push(current);
      current = { emoji: matched, title: line.substring(matched.length).trim(), lines: [] };
    } else if (current) {
      current.lines.push(line);
    } else if (line.trim()) {
      current = { emoji: '📍', title: '地域分析', lines: [line] };
    }
  }
  if (current && current.lines.length) sections.push(current);
  return sections;
}

function renderAITextReport(text, ctxId) {
  var sections = parseAISections(text);
  var reportEl = document.getElementById('reportScreen');
  var html = '';
  var lat = document.getElementById('latitude').value;
  var lng = document.getElementById('longitude').value;

  // Luxury header
  html += '<div style="display:flex;align-items:center;gap:6px;margin:12px 16px 0;padding:7px 12px;background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.15);border-radius:6px;font-size:11px;color:rgba(201,168,76,0.75);letter-spacing:0.06em"><span>🤖</span><span><b>AI 生成内容</b> · 仅供参考，不代表居住决策。</span></div>';
  html += '<div id="readProgressWrap"><div id="readProgressBar"></div></div>';
  html += '<div class="chapter-cover">';
  html += '<img class="chapter-cover-img" src="/samples/caijing/art-travel.png" alt="" loading="lazy" onerror="this.style.display=\'none\'">';
  html += '<div class="chapter-cover-veil"></div>';
  html += '<div class="chapter-cover-body">';
  html += '<div class="chapter-cover-num">GEO FORTUNE · LOCATION ENERGY</div>';
  html += '<div class="chapter-cover-title">地理命理分析</div>';
  html += '<div class="chapter-cover-lead">方位能量场 · 地域命格 · AI 命理分析</div>';
  html += '</div></div>';
  // Score rings for environmental adaptation
  if (window.ReportViz) {
    html += '<div style="margin:0 4px">' + window.ReportViz.renderScoreRing.group([
      {label:'东方适配',score:78,max:100,sub:'木气方位'},
      {label:'南方适配',score:65,max:100,sub:'火气方位'},
      {label:'北方适配',score:58,max:100,sub:'水气方位'}
    ], '环境适配度') + '</div>';
  }

  html += '<div class="chart-header">';
  html += '<div class="name-row"><div class="report-name">地理命理分析</div><div class="report-tag">'+lat+', '+lng+'</div></div>';
  html += '<div class="divider"></div></div>';
  if (sections.length > 0) {
    html += '<div class="fortune-wrap">';
    for (var i = 0; i < sections.length; i++) {
      var sec = sections[i];
      html += '<div class="ai-section">';
      html += '<div class="ai-section-head" onclick="var b=this.nextElementSibling;b.classList.toggle(\'open\');this.querySelector(\'.ai-section-arrow\').classList.toggle(\'open\')">';
      html += '<div class="ai-section-icon">'+sec.emoji+'</div>';
      html += '<div class="ai-section-title">'+(sec.title||'地域分析')+'</div>';
      html += '<div class="ai-section-arrow open">⬇</div>';
      html += '</div>';
      html += '<div class="ai-section-body open"><div class="ai-section-text">'+sec.lines.join('\n')+'</div></div>';
      html += '</div>';
    }
    html += '</div>';
  } else {
    html += '<div class="ai-plain-text">'+text+'</div>';
  }
  // Compliance note
  html += '<div class="hl-note" style="margin:12px 16px"><b>重要提示</b>：地理命理属传统文化参考，不建议因此做出搬迁决定。居住地选择请综合考虑生活、工作等实际因素。</div>';
  html += '<div style="height:40px"></div>';
  reportEl.innerHTML = html;
  reportEl.classList.add('show');
  injectDisclaimer('reportScreen');
  initReadProgress();
}

function initReadProgress() {
  var bar = document.getElementById('readProgressBar');
  var wrap = document.getElementById('readProgressWrap');
  if (!bar || !wrap) return;
  wrap.classList.add('show');
  function updateProgress() {
    var scrollTop = window.scrollY || document.documentElement.scrollTop;
    var docH = document.documentElement.scrollHeight - window.innerHeight;
    var pct = docH > 0 ? Math.min(100, (scrollTop / docH) * 100) : 0;
    bar.style.width = pct + '%';
  }
  window.addEventListener('scroll', updateProgress, {passive: true});
  updateProgress();
}

function generateReport() {
  var lat = document.getElementById('latitude').value.trim();
  var lng = document.getElementById('longitude').value.trim();
  if (!lat) { showToast('请输入纬度', 'error'); return; }
  if (!lng) { showToast('请输入经度', 'error'); return; }

  document.getElementById('inputScreen').style.display = 'none';
  document.getElementById('loadingScreen').classList.add('show');
  var steps = ['接收位置坐标…','调用地域能量数据库…','对比出生命盘…','分析方位吉凶…','生成地理命理报告…'];
  var stepsEl = document.getElementById('loadSteps');
  stepsEl.innerHTML = '';
  steps.forEach(function(s, i) {
    setTimeout(function(){
      stepsEl.innerHTML += '<div class="load-step">✓ '+s+'</div>';
    }, i * 350);
  });

  var year = document.getElementById('year').value;
  var month = document.getElementById('month').value;
  var day = document.getElementById('day').value;

  var body = { latitude: parseFloat(lat), longitude: parseFloat(lng), gender: gender };
  if (year) body.birthYear = parseInt(year);
  if (month) body.birthMonth = parseInt(month);
  if (day) body.birthDay = parseInt(day);

  setTimeout(function() {
    fetch('/api/geo-fortune', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      document.getElementById('loadingScreen').classList.remove('show');
      var ctxId = d.contextId || '';
      renderAITextReport(d.answer || d.report || '', ctxId);
      var reportScreen = document.getElementById('reportScreen');
      if (ctxId) reportScreen.dataset.contextId = ctxId;
      document.getElementById('qaSection').style.display = 'block';
    })
    .catch(function() {
      document.getElementById('loadingScreen').classList.remove('show');
      document.getElementById('inputScreen').style.display = 'block';
      showToast('网络错误，请稍后重试', 'error');
    });
  }, steps.length * 350 + 400);
}

function askQuestion() {
  var ctxId = document.getElementById('reportScreen').dataset.contextId;
  var q = document.getElementById('qaInput');
  if (!q.value.trim()) return;

  var h = document.getElementById('qaHistory');
  h.innerHTML += '<div style="text-align:right;margin-bottom:8px"><span style="display:inline-block;background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.15);border-radius:6px;padding:8px 12px;font-size:11px;color:var(--ink-text)">' + q.value.replace(/</g,'&lt;') + '</span></div>';

  var question = q.value;
  q.value = '';
  q.disabled = true;

  var loadEl = document.createElement('div');
  loadEl.id = 'qaLoading';
  loadEl.style.cssText = 'text-align:left;margin-bottom:8px;font-size:10px;color:rgba(255,245,220,0.3);letter-spacing:0.06em';
  loadEl.textContent = '地理命理师正在思考…';
  h.appendChild(loadEl);
  h.scrollTop = h.scrollHeight;

  fetch('/api/ask-followup', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({contextId: ctxId, question: question})
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    document.getElementById('qaLoading').remove();
    if (d.answer) {
      var answer = d.answer.replace(/</g,'&lt;').replace(/\\n/g,'<br>');
      h.innerHTML += '<div style="margin-bottom:10px"><span style="display:inline-block;background:var(--card);border:1px solid rgba(201,168,76,0.1);border-radius:6px;padding:10px 12px;font-size:11px;color:var(--ink-text);line-height:1.8">' + answer + '</span></div>';
    }
    q.disabled = false;
  })
  .catch(function(){
    document.getElementById('qaLoading').remove();
    h.innerHTML += '<div style="margin-bottom:10px;font-size:10px;color:rgba(200,80,80,0.6);letter-spacing:0.04em">网络错误，请稍后重试</div>';
    q.disabled = false;
  });
}
</script>
