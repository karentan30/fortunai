<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>自己合盘 · 相生</title><link rel="stylesheet" href="/assets/css/friends-hepan-v4.css"><script src="/assets/js/friends-cross-border.js" defer></script><script src="/assets/js/vendor/qrcode.js" defer></script><script src="/assets/js/friends-hepan-pay.js" defer></script><script src="/assets/js/friends-hepan-report.js" defer></script><script src="/assets/js/friends-birth-prefill.js" defer></script><script src="/assets/js/friends-hepan-self.js" defer></script></head>
<body class="hv4"><div class="wrap">
<header class="hv-head"><a class="brand" href="/pages/friends-connect.html">相生</a><a class="back" href="/pages/friends-compatibility.html">← 合盘</a></header>
<section id="entry">
<p class="eyebrow">自 己 合 盘</p>
<p class="title">看看你和 TA</p>
<div class="private"><span>仅 自 己 可 见</span></div>
<p class="note c">对方不会收到通知，也不会进推荐池。TA 的生辰只算不存。</p>
<div class="counter" id="counter" hidden><span>今日还可合<b id="remaining">3</b>次</span></div>
<p class="err" id="login-note" role="alert" hidden>请先<a href="/pages/friends-compatibility.html">登录相生账号</a>，再回来自己合盘。</p>
<form id="self-form" novalidate>
<h2 class="hv-h">合 盘 目 的</h2>
<div class="two" id="purpose"><button type="button" class="opt" data-v="romance" aria-pressed="true">找对象</button><button type="button" class="opt" data-v="buddy" aria-pressed="false">找搭子</button></div>
<h2 class="hv-h">两 个 人</h2>
<div class="frame" data-side="me">
 <div class="who-f"><b>你</b><span>只用来排盘</span></div>
 <div class="fl"><div class="lb"><span>出生日期</span><span class="seg" data-k="calendar"><button type="button" data-v="solar" aria-pressed="true">公历</button><button type="button" data-v="lunar" aria-pressed="false">农历</button></span></div>
 <div class="row3"><input class="in" data-k="year" inputmode="numeric" maxlength="4" placeholder="年" aria-label="你的出生年" autocomplete="off"><select class="in" data-k="month" aria-label="你的出生月"></select><select class="in" data-k="day" aria-label="你的出生日"></select></div></div>
 <div class="mini"><div class="fl"><div class="lb"><span>时辰</span></div><select class="in" data-k="hour" aria-label="你的出生时辰"></select></div>
 <div class="fl"><div class="lb"><span>性别</span></div><select class="in" data-k="gender" aria-label="你的性别"><option value="">选择</option><option value="female">女</option><option value="male">男</option></select></div></div>
</div>
<p class="and">与</p>
<div class="frame" data-side="ta">
 <div class="who-f"><b>TA</b><span>只算不存，不建档</span></div>
 <div class="fl"><div class="lb"><span>怎么称呼 TA</span><small>只你自己看得到</small></div><input class="in" id="ta-nickname" maxlength="12" placeholder="12 个字以内" autocomplete="off"></div>
 <div class="fl"><div class="lb"><span>出生日期</span><span class="seg" data-k="calendar"><button type="button" data-v="solar" aria-pressed="true">公历</button><button type="button" data-v="lunar" aria-pressed="false">农历</button></span></div>
 <div class="row3"><input class="in" data-k="year" inputmode="numeric" maxlength="4" placeholder="年" aria-label="TA 的出生年" autocomplete="off"><select class="in" data-k="month" aria-label="TA 的出生月"></select><select class="in" data-k="day" aria-label="TA 的出生日"></select></div></div>
 <div class="mini"><div class="fl"><div class="lb"><span>时辰</span></div><select class="in" data-k="hour" aria-label="TA 的出生时辰"></select></div>
 <div class="fl"><div class="lb"><span>性别</span></div><select class="in" data-k="gender" aria-label="TA 的性别"><option value="">选择</option><option value="male">男</option><option value="female">女</option></select></div></div>
 <p class="note">不知道 TA 的时辰也能合，报告标注「有限参考」。</p>
</div>
<h2 class="hv-h">开 始 前 请 确 认</h2>
<label class="chk first"><input type="checkbox" id="c-informed"><span class="box"></span><span class="t"><span class="req">必选</span>我已告知对方，并获得 TA 的同意</span></label>
<label class="chk"><input type="checkbox" id="c-self"><span class="box"></span><span class="t"><span class="req">必选</span>结果只供我本人参考，不用来骚扰、为难或歧视任何人</span></label>
<label class="chk"><input type="checkbox" id="c-adult"><span class="box"></span><span class="t"><span class="req">必选</span>对方已满 18 岁</span></label>
<button class="btn-p sp" id="start" type="submit" disabled>开始合盘</button>
<p class="hint" id="start-hint">三项都勾选后可开始</p>
<p class="err" id="form-error" role="alert"></p>
</form>
<section id="saved-area" hidden><h2 class="hv-h">已 保 存</h2><ul class="saved-list" id="saved-list"></ul></section>
</section>
<section id="result" hidden aria-live="polite"></section>
<p class="foot" id="page-foot">传统文化参考，不预测关系结果</p>
</div></body></html>
