<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Runae · 塔罗解读</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#060e0d;--card:#0f1b17;--card-2:#0b1512;
    --ink:#f0ebe0;--ink-2:rgba(240,235,224,.70);--ink-3:rgba(240,235,224,.42);
    --gold:#dcc082;--gold-soft:#e8d49c;--gold-wash:rgba(220,192,130,.14);
    --jade:#4fbfa0;--jade-deep:#0e2b24;--jade-soft:#7DDFC0;--jade-wash:rgba(79,191,160,.12);
    --line:rgba(240,235,224,.10);--line-2:rgba(240,235,224,.17);
    --sans:'Inter',-apple-system,system-ui,sans-serif;--serif:'Cormorant Garamond','Noto Serif SC',serif;
    --rl:20px;--r:14px;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{color-scheme:dark}body{background:var(--paper);font-family:var(--sans);color:var(--ink);line-height:1.5;font-feature-settings:"tnum";min-height:100vh}
  .wrap{max-width:430px;margin:0 auto;padding:0 24px 40px;min-height:100vh}
  svg.ic{width:18px;height:18px;stroke:var(--ink-3);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 12px}
  .nav-back{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-3);cursor:pointer;font-weight:500}
  .step{font-size:11px;color:var(--ink-3);letter-spacing:.1em;font-weight:600}
  .rhero{text-align:center;padding:16px 4px 4px}
  .rhero .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .rhero .dv{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);margin:14px auto}
  .rhero h2{font-family:var(--serif);font-size:29px;font-weight:600;line-height:1.24;letter-spacing:-.01em;margin:0 6px}
  .chart{background:var(--jade-deep);border:1px solid rgba(195,160,90,.20);border-radius:var(--rl);padding:22px 20px;margin:18px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
  .pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
  .pil .c{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.15;background:linear-gradient(160deg,#E8C87E,#B98A3E);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.18))}
  .pil .l{font-size:10px;color:rgba(255,255,255,.62);margin-top:7px;letter-spacing:.08em}
  .read{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);padding:20px;margin-bottom:14px}
  .read h3{font-size:14px;font-weight:600;margin-bottom:10px;letter-spacing:.01em}
  .read p{font-size:15px;color:var(--ink-2);line-height:1.75;white-space:pre-wrap}
  .blur{filter:blur(5px);opacity:.55;user-select:none;pointer-events:none}
  .wall{background:var(--card);border:1px solid var(--gold-soft);border-radius:var(--rl);padding:24px 20px;text-align:center;margin:16px 0;box-shadow:0 14px 34px -20px rgba(169,128,58,.30)}
  .wall h4{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:5px}
  .wall p{font-size:13px;color:var(--ink-2);margin-bottom:18px}
  .cta{width:100%;background:var(--jade-deep);color:#fff;border:none;border-radius:var(--r);padding:16px;font-size:15px;font-weight:600;font-family:var(--sans);cursor:pointer}
  .cta.gold{background:linear-gradient(135deg,var(--gold-soft),var(--gold))}
  .cta:disabled{opacity:.5;cursor:default}
  .wall .price{font-size:13px;color:var(--ink-3);margin-top:12px}
  .wall .price b{color:var(--gold);font-size:17px;font-weight:600}
  .expand{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;color:var(--ink-2);padding:14px;border:1px solid var(--gold-wash);border-radius:var(--r);margin-bottom:12px;background:var(--card-2);font-weight:500}
  .adv{background:var(--jade-deep);border:1px solid rgba(195,160,90,.20);border-radius:var(--rl);padding:24px 21px;margin:22px 0 8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
  .adv .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);font-weight:600}
  .adv h4{font-family:var(--serif);font-size:21px;font-weight:600;margin:10px 0 4px;color:#fff}
  .adv ul{list-style:none;margin:14px 0}
  .adv li{font-size:13px;color:rgba(255,255,255,.86);padding:6px 0 6px 20px;position:relative}
  .adv li::before{content:'◆';position:absolute;left:2px;top:6px;color:var(--gold-soft);font-size:7px;line-height:2.1}
  .adv .sbtn{width:100%;background:transparent;color:var(--gold-soft);border:1px solid var(--gold-soft);border-radius:var(--r);padding:15px;font-size:14.5px;font-weight:600;margin-top:10px;cursor:pointer}
  .skel{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);padding:20px;margin-bottom:14px}
  .skel .ln{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line),rgba(255,255,255,.06),var(--line));background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:11px}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .err{text-align:center;color:var(--ink-2);font-size:14px;padding:40px 10px}

  /* ── tarot-specific ── */
  .q-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:6px 0 10px}
  .q-box{background:var(--card);border:1px solid var(--gold-soft);border-radius:var(--r);padding:14px 16px;box-shadow:0 10px 26px -20px rgba(169,128,58,.3)}
  .q-input{width:100%;background:none;border:none;outline:none;font-family:var(--serif);font-size:17px;color:var(--ink);line-height:1.6;resize:none;min-height:46px}
  .q-input::placeholder{color:var(--ink-3)}
  .q-chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
  .q-chip{font-size:12.5px;color:var(--ink-2);background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;font-weight:500;transition:all .16s}
  .q-chip:active,.q-chip.on{color:var(--gold);border-color:var(--gold-soft);background:var(--gold-wash)}
  .q-counter{font-size:10.5px;color:var(--ink-3);text-align:right;margin-top:8px;letter-spacing:.04em}
  .cards3{display:flex;gap:10px;justify-content:center;margin:6px 0 2px}
  .tcard{flex:1;max-width:112px;display:flex;flex-direction:column;align-items:center}
  .tcard .face{width:100%;aspect-ratio:5/9;border-radius:12px;background:linear-gradient(160deg,#215845,#123528 60%,#0d271d);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 20px 40px -22px rgba(0,0,0,.6),inset 0 0 0 1px rgba(195,160,90,.28);animation:reveal .55s ease both}
  .tcard:nth-child(1) .face{animation-delay:.05s}
  .tcard:nth-child(2) .face{animation-delay:.22s}
  .tcard:nth-child(3) .face{animation-delay:.39s}
  @keyframes reveal{from{opacity:0;transform:rotateY(82deg) translateY(14px)}to{opacity:1;transform:none}}
  .tcard .face::after{content:'';position:absolute;inset:5px;border:1px solid rgba(195,160,90,.5);border-radius:8px;pointer-events:none}
  .tcard .glyph{font-family:var(--serif);font-size:30px;font-weight:600;background:linear-gradient(160deg,#E8C87E,#B98A3E);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .tcard .rn{font-family:var(--serif);font-size:12px;color:var(--gold-soft);letter-spacing:.16em;margin-top:2px}
  .tcard .nm{font-size:11px;color:var(--gold-soft);text-align:center;margin-top:8px;letter-spacing:.04em;line-height:1.4}
  .tcard .pos{font-size:10px;color:var(--ink-3);text-align:center;margin-top:5px;letter-spacing:.08em}
  .reverse{transform:rotate(180deg)}
  .redraw{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--ink-2);padding:13px;border:1px solid var(--line);border-radius:var(--r);margin:4px 0 14px;background:var(--card-2);font-weight:500;cursor:pointer}
  .crossread{background:var(--card-2);border:1px solid var(--gold-soft);border-radius:var(--rl);padding:22px 20px;margin:22px 0 8px;box-shadow:0 10px 30px -22px rgba(169,128,58,.35)}
  .crossread .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .crossread h4{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--ink);margin:9px 0 6px;line-height:1.24}
  .crossread .fr{font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:16px}
  .crossread .cx{display:flex;align-items:flex-start;gap:13px;background:var(--card);border:1px solid var(--gold-wash);border-radius:var(--r);padding:14px 15px;margin-top:10px;cursor:pointer;transition:transform .12s,border-color .15s;text-align:left;width:100%;text-decoration:none}
  .crossread .cx:active{transform:scale(.98)}
  .crossread .cx:hover{border-color:var(--gold-soft)}
  .crossread .cx>svg{width:26px;height:26px;stroke:var(--gold);stroke-width:1.35;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;margin-top:1px}
  .crossread .cx .cn{font-size:14.5px;font-weight:600;color:var(--ink);font-family:var(--serif)}
  .crossread .cx .ch{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-top:3px}
  .crossread .cx .cg{margin-left:auto;align-self:center;stroke:var(--ink-3);width:16px;height:16px;flex-shrink:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><div class="nav-back" onclick="location.href='pick.html?lang='+LANG"><svg class="ic" style="width:15px;height:15px"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="tBack"></span></div><div class="step" id="tStep"></div></div>

  <!-- STEP 1 · ask + draw -->
  <div id="ask">
    <div class="rhero"><div class="k" id="tHeroK"></div><div class="dv"></div><h2 id="tHeroH"></h2></div>
    <div class="q-label" id="tQLabel"></div>
    <div class="q-box"><textarea rows="2" class="q-input" id="question" maxlength="120" oninput="qCount()"></textarea></div>
    <div class="q-chips" id="qChips"></div>
    <div class="q-counter" id="qCounter">0 / 120</div>
    <button class="cta gold" id="drawBtn" style="margin-top:16px" onclick="draw()"></button>
  </div>

  <!-- STEP 2 · cards + reading -->
  <div id="stage" style="display:none">
    <div id="hero"></div>
    <div class="chart"><div class="cards3" id="cards3"></div></div>
    <div class="redraw" id="redraw" onclick="reset()"><svg class="ic" style="width:14px;height:14px"><path d="M4 12a8 8 0 0 1 14-5m0 0V4m0 3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="tRedraw"></span></div>
    <div id="body"></div>
  </div>
</div>

<script>
  var LANG=(new URLSearchParams(location.search).get('lang'))||localStorage.getItem('runae_lang')||'zh';localStorage.setItem('runae_lang',LANG);var EN=(LANG==='en');
  var P={}; try{ P=JSON.parse(localStorage.getItem('runae_profile')||'{}'); }catch(e){}

  // 建议问题：优先用 runae_profile.aspects
  var ASPECT_Q= EN ? {
    career:'How will my career unfold next?', love:'Will this relationship lead somewhere?',
    wealth:'What does my near-term financial luck look like?', health:'What should I watch for in my mind and body?'
  } : {
    career:'我的事业接下来会如何？', love:'这段感情会有结果吗？',
    wealth:'我近期的财运走势怎么样？', health:'我的身心状态需要注意什么？'
  };
  var ASPECT_TOPIC={ career:'wealth', love:'love', wealth:'wealth', health:'health' };
  var DEFAULT_CHIPS= EN ? [
    {q:'How will my career unfold next?',t:'wealth'},
    {q:'Will this relationship lead somewhere?',t:'love'},
    {q:'What does my near-term financial luck look like?',t:'wealth'},
    {q:'Should I hold on to this or let it go?',t:'decision'}
  ] : [
    {q:'我的事业接下来会如何？',t:'wealth'},
    {q:'这段感情会有结果吗？',t:'love'},
    {q:'我近期的财运走势怎么样？',t:'wealth'},
    {q:'这件事该坚持还是放手？',t:'decision'}
  ];
  var currentTopic='love';
  (function(){
    var aspects=(P.aspects||[]).filter(function(a){return ASPECT_Q[a];});
    var chips=[];
    aspects.forEach(function(a){ chips.push({q:ASPECT_Q[a],t:ASPECT_TOPIC[a]}); });
    DEFAULT_CHIPS.forEach(function(c){ if(chips.length<4 && !chips.some(function(x){return x.q===c.q;})) chips.push(c); });
    var box=document.getElementById('qChips');
    chips.slice(0,5).forEach(function(c){
      var el=document.createElement('span'); el.className='q-chip'; el.textContent=c.q;
      el.onclick=function(){ document.getElementById('question').value=c.q; currentTopic=c.t; qCount();
        document.querySelectorAll('.q-chip').forEach(function(x){x.classList.remove('on')}); el.classList.add('on'); };
      box.appendChild(el);
    });
    if(aspects[0]) currentTopic=ASPECT_TOPIC[aspects[0]]||'love';
  })();
  function qCount(){ var v=document.getElementById('question').value; document.getElementById('qCounter').textContent=v.length+' / 120'; }

  // 大阿卡纳 22 张——name 必须匹配后端 _VALID_TAROT_CARDS（禁用旧版 tarot.html 的别名如 皇后/隐者/魔术师）
  var DECK=[
    {name:'愚者',en:'The Fool',rn:'0',glyph:'零'},{name:'魔法师',en:'The Magician',rn:'I',glyph:'一'},{name:'女祭司',en:'The High Priestess',rn:'II',glyph:'二'},
    {name:'女皇',en:'The Empress',rn:'III',glyph:'三'},{name:'皇帝',en:'The Emperor',rn:'IV',glyph:'四'},{name:'教皇',en:'The Hierophant',rn:'V',glyph:'五'},
    {name:'恋人',en:'The Lovers',rn:'VI',glyph:'六'},{name:'战车',en:'The Chariot',rn:'VII',glyph:'七'},{name:'力量',en:'Strength',rn:'VIII',glyph:'八'},
    {name:'隐士',en:'The Hermit',rn:'IX',glyph:'九'},{name:'命运之轮',en:'Wheel of Fortune',rn:'X',glyph:'十'},{name:'正义',en:'Justice',rn:'XI',glyph:'义'},
    {name:'倒吊人',en:'The Hanged Man',rn:'XII',glyph:'吊'},{name:'死神',en:'Death',rn:'XIII',glyph:'变'},{name:'节制',en:'Temperance',rn:'XIV',glyph:'融'},
    {name:'恶魔',en:'The Devil',rn:'XV',glyph:'缚'},{name:'塔',en:'The Tower',rn:'XVI',glyph:'崩'},{name:'星星',en:'The Star',rn:'XVII',glyph:'星'},
    {name:'月亮',en:'The Moon',rn:'XVIII',glyph:'月'},{name:'太阳',en:'The Sun',rn:'XIX',glyph:'日'},{name:'审判',en:'Judgement',rn:'XX',glyph:'醒'},
    {name:'世界',en:'The World',rn:'XXI',glyph:'圆'}
  ];
  var POS= EN ? ['Past · Root','Present · Core','Future · Direction'] : ['过去 · 根源','现在 · 核心','未来 · 走向'];
  var drawn=[];

  // ── 静态 UI 文案填充（中英） ──
  var T = EN ? {
    back:'Back', step:'Tarot Reading', heroK:'Tarot · Rider–Waite', heroH:'Draw three cards<br>See past · present · future',
    qLabel:'Hold your question in mind', placeholder:'e.g. How will my career unfold next?',
    draw:'Hold your question · Draw', drawEmpty:'Write down your question first', redraw:'New question · Draw again',
    youAsk:'Tarot · You asked', arranging:'The cards are finding their places…',
    reversed:' Reversed', timeout:'This is taking too long — please try again.', retry:'Retry',
    netErr:'Network error — please refresh and try again.', redrawBtn:'Draw again', genFail:'Something went wrong'
  } : {
    back:'返回', step:'塔罗解读', heroK:'Tarot · 韦特体系', heroH:'抽三张牌<br>看清过去 · 现在 · 未来',
    qLabel:'把问题放在心上', placeholder:'例：我的事业接下来会如何？',
    draw:'默念问题 · 抽牌', drawEmpty:'请先写下你的问题', redraw:'换个问题 · 重新抽牌',
    youAsk:'Tarot · 你问', arranging:'牌正在为你排列…',
    reversed:' 逆位', timeout:'生成超时，请重试', retry:'重试',
    netErr:'网络异常，请刷新重试', redrawBtn:'重新抽牌', genFail:'生成失败'
  };
  document.documentElement.lang = EN ? 'en' : 'zh-CN';
  document.getElementById('tBack').textContent = T.back;
  document.getElementById('tStep').textContent = T.step;
  document.getElementById('tHeroK').textContent = T.heroK;
  document.getElementById('tHeroH').innerHTML = T.heroH;
  document.getElementById('tQLabel').textContent = T.qLabel;
  document.getElementById('question').placeholder = T.placeholder;
  document.getElementById('drawBtn').textContent = T.draw;
  document.getElementById('tRedraw').textContent = T.redraw;

  /* -- Cross-Reading (交叉印证) component -- */
  var CROSS_CUR='tarot';
  var CROSS_META={
    bazi:{glyph:'<path d="M7 6v20M13 6v20M19 6v20M25 6v20"/>',n:{zh:'八字命理',en:'BaZi'},page:'report-v2.html',
      h:{zh:'从出生的四柱看你的先天格局，把此刻的困惑放回一整条人生曲线里。',en:'Your birth chart maps the whole arc — the deep pattern behind what you\'re feeling right now.'}},
    hehun:{glyph:'<circle cx="12" cy="16" r="7.5"/><circle cx="20" cy="16" r="7.5"/>',n:{zh:'合婚',en:'Compatibility'},page:'report-hehun.html',
      h:{zh:'把你和那个人放在一起看，两张盘怎么咬合、哪里需要磨合，一目了然。',en:'Put your chart next to your partner\'s and see exactly where you fit — and where you grind.'}},
    tarot:{glyph:'<rect x="6" y="8" width="12" height="18" rx="2" transform="rotate(-8 12 17)"/><rect x="15" y="6" width="12" height="18" rx="2" transform="rotate(8 21 15)"/>',n:{zh:'塔罗',en:'Tarot'},page:'report-tarot.html',
      h:{zh:'命盘讲长期趋势，塔罗回答此刻那件具体的事——该走还是该留。',en:'Your chart shows the long game; a card answers the one thing weighing on you today.'}},
    astro:{glyph:'<circle cx="16" cy="16" r="6"/><path d="M16 3v3M16 26v3M3 16h3M26 16h3M6.6 6.6l2.1 2.1M23.3 23.3l2.1 2.1M25.4 6.6l-2.1 2.1M8.7 23.3l-2.1 2.1"/>',n:{zh:'星座占星',en:'Astrology'},page:'report-astrology.html',
      h:{zh:'西方星盘从另一套坐标读你的性格与关系，常和东方命理指向同一个答案。',en:'Your Western chart reads the same you through a different lens — and usually lands on the same answer.'}},
    daily:{glyph:'<path d="M24 20a9 9 0 1 1-8-13 7 7 0 0 0 8 13z"/>',n:{zh:'每日运势',en:'Daily Horoscope'},page:'report-daily.html',
      h:{zh:'把大格局落到今天：今天宜什么、忌什么，天天更新。',en:'Brings the big picture down to today — what to lean into, what to avoid, refreshed daily.'}},
    palm:{glyph:'<path d="M11 26v-6M11 20V9a2 2 0 0 1 4 0v7M15 16V7a2 2 0 0 1 4 0v9M19 16v-5a2 2 0 0 1 4 0v9a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-3-5a2 2 0 0 1 3.4-2z"/>',n:{zh:'手相',en:'Palm Reading'},page:'report-palm.html',
      h:{zh:'掌纹记录的是后天的走势，和先天命盘对照着看，更立体。',en:'Your palm tracks how life is actually unfolding — a living counterpart to your birth chart.'}},
    face:{glyph:'<circle cx="16" cy="16" r="11"/><path d="M12 14h.01M20 14h.01M12 20a5 4 0 0 0 8 0"/>',n:{zh:'面相',en:'Face Reading'},page:'report-face.html',
      h:{zh:'五官里的运势密码，和命盘相互印证，看得见的另一层线索。',en:'The story in your features — a visible layer that echoes what your chart already hints at.'}}
  };
  var CROSS_DEFAULT={bazi:['astro','tarot'],hehun:['bazi','tarot'],tarot:['bazi','astro'],astro:['bazi','tarot'],daily:['bazi','astro'],palm:['bazi','face'],face:['bazi','palm']};
  function crossPick(){
    var asp=[];try{asp=(JSON.parse(localStorage.getItem('runae_profile')||'{}').aspects)||[];}catch(e){}
    var out=[];
    function add(list){list.forEach(function(m){if(m!==CROSS_CUR&&out.indexOf(m)<0)out.push(m);});}
    if(asp.indexOf('love')>-1) add(['hehun','tarot','astro']);
    if(asp.indexOf('career')>-1||asp.indexOf('wealth')>-1) add(['bazi','astro','tarot']);
    if(asp.indexOf('health')>-1) add(['bazi','palm','daily']);
    add(CROSS_DEFAULT[CROSS_CUR]||['bazi','astro']);
    return out.slice(0,3);
  }
  function crossReadHTML(){
    var picks=crossPick();if(!picks.length)return '';
    var L=EN?'en':'zh';
    var head=EN?'The same you, seen from every angle':'同一个你，多重印证';
    var fr=EN?'One profile. Every tradition weighs in — and they rarely disagree.':'一份命盘，多种传承一起看——它们很少各说各话。';
    var kk=EN?'Cross-Reading · Runae':'交叉印证 · Runae';
    var chev='<svg class="cg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
    var cards=picks.map(function(m){
      var meta=CROSS_META[m];if(!meta)return '';
      return '<a class="cx" href="'+meta.page+'?lang='+LANG+'"><svg viewBox="0 0 32 32">'+meta.glyph+'</svg>'
        +'<div><div class="cn">'+esc(meta.n[L])+'</div><div class="ch">'+esc(meta.h[L])+'</div></div>'+chev+'</a>';
    }).join('');
    return '<div class="crossread"><div class="k">'+esc(kk)+'</div><h4>'+esc(head)+'</h4><div class="fr">'+esc(fr)+'</div>'+cards+'</div>';
  }
  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
  var HEAD=/^\s*([【✅📜🌟💰❤💼🌿☀🔮⛰✨🙏#]|#{1,3}\s|[一二三四五六七八九十]、|[IVX]+[\.、]|[\uD83C-\uDBFF])/;
  function sections(text){
    var lines=text.split('\n'),secs=[],cur=null;
    lines.forEach(function(raw){
      var l=raw.replace(/\s+$/,''); if(!l.trim())return;
      var t=l.trim();
      if((HEAD.test(l)||/^#{1,4}\s/.test(t))&&t.replace(/^#{1,4}\s*/,'').length<40){
        cur={t:t.replace(/[\uD800-\uDFFF←-⯿☀-➿️#*【】]/g,'').replace(/^#{1,4}\s*/,'').trim(),b:[]};secs.push(cur);
      }else{ if(!cur){cur={t:'',b:[]};secs.push(cur);} cur.b.push(t); }
    });
    return secs.filter(function(s){return s.t||s.b.length;});
  }

  function draw(){
    var q=document.getElementById('question').value.trim();
    if(!q){ document.getElementById('question').focus(); document.getElementById('drawBtn').textContent=T.drawEmpty; setTimeout(function(){document.getElementById('drawBtn').textContent=T.draw;},1400); return; }
    // 洗牌抽三，30% 逆位
    var pool=DECK.slice(); drawn=[];
    for(var i=0;i<3;i++){ var idx=Math.floor(Math.random()*pool.length); var c=pool.splice(idx,1)[0]; drawn.push({card:c,reversed:Math.random()<0.3}); }
    document.getElementById('ask').style.display='none';
    document.getElementById('stage').style.display='block';
    document.getElementById('hero').innerHTML='<div class="rhero"><div class="k">'+T.youAsk+'</div><div class="dv"></div><h2>'+esc(q.length>26?q.slice(0,26)+'…':q)+'</h2></div>';
    var trio=document.getElementById('cards3'); trio.innerHTML='';
    drawn.forEach(function(d,i){
      trio.innerHTML+='<div class="tcard"><div class="face'+(d.reversed?' reverse':'')+'"><div class="glyph">'+d.card.glyph+'</div><div class="rn">'+d.card.rn+'</div><div class="nm">'+esc(EN?(d.card.en||d.card.name):d.card.name)+(d.reversed?T.reversed:'')+'</div></div><div class="pos">'+POS[i]+'</div></div>';
    });
    window.scrollTo({top:0,behavior:'smooth'});
    stream(q);
  }

  function skel(){ return '<div class="skel"><div class="ln" style="width:55%"></div><div class="ln" style="width:100%"></div><div class="ln" style="width:90%"></div><div class="ln" style="width:72%"></div></div><div class="err">'+T.arranging+'</div>'; }

  function renderReading(text,locked){
    var body=document.getElementById('body');
    var free=(text||'').split(/---LOCKED---/i)[0]||'';
    var html='';
    sections(free).forEach(function(s){ html+='<div class="read">'+(s.t?'<h3>'+esc(s.t)+'</h3>':'')+'<p>'+md(s.b.join('\n'))+'</p></div>'; });
    if(!html) html='<div class="read"><p>'+md(free)+'</p></div>';
    if(locked){
      if(EN){
        html+='<div class="read"><h3>Card-by-Card Reading · Future Direction</h3><p class="blur">The past card shows an old attachment starting to loosen. The present card sets starlight on your shoulders. And the future card points to a clear turning point ahead — which card is driving it, what to reach for and what to let go, it\'s all in the full reading……</p></div>';
        html+='<div class="wall"><h4>Unlock the Full Reading</h4><p>Card-by-card reading · Upright & reversed depth · Synthesis · Action advice · A word from your reader</p><button class="cta gold" onclick="goCheckout(\'tarot_3\')">Unlock Full Reading</button><div class="price"><b>$9.90</b> one-time · or subscribe for better value ↓</div></div>';
        html+='<div class="expand">▾ Five-card spread · Five-dimension deep reading ($19)</div>';
      } else {
        html+='<div class="read"><h3>逐牌精读 · 未来走向</h3><p class="blur">过去牌位揭示旧执正在松动，现在牌位星光落肩，未来牌位将迎来一个清晰的节点——把握窗口期，具体到哪一牌位在推动、该怎么抓怎么避，都在完整牌卷里……</p></div>';
        html+='<div class="wall"><h4>解锁完整牌卷</h4><p>逐牌精读 · 正逆位深意 · 综合走向 · 行动建议 · 占卜师悄悄话</p><button class="cta gold" onclick="goCheckout(\'tarot_3\')">解锁完整解读</button><div class="price"><b>$9.90</b> 一次性 · 或订阅更划算 ↓</div></div>';
        html+='<div class="expand">▾ 五芒星牌阵 · 五维深度解读（$19）</div>';
      }
    }
    html+=crossReadHTML();
    if(EN){
      html+='<div class="adv"><div class="k">Runae Advisor · Remembers You</div><h4>More than a single reading<br>an advisor who actually knows you</h4><ul><li>Your daily horoscope and annual forecast, refreshed every day</li><li>Ask deeper questions anytime in chat — like a teacher on call</li><li>Tarot + BaZi + Astrology — the same you, seen from every angle</li><li>Remembers every question you\'ve asked — the more you use it, the better it knows you</li><li>Book a 1-on-1 with a real reader (member discount)</li></ul><button class="sbtn" onclick="goCheckout(\'member_monthly\')">Subscribe to Runae Advisor · $9.9 / mo</button></div>';
    } else {
      html+='<div class="adv"><div class="k">Runae 顾问 · 会记得你</div><h4>不止一次占卜<br>是一个懂你的命理顾问</h4><ul><li>每日运势与流年动态，天天更新</li><li>AI 对话随时追问深聊，像身边的老师</li><li>塔罗 + 八字 + 星座，交叉印证同一个你</li><li>记得你问过的每一个问题，越用越懂你</li><li>可约真人塔罗师一对一（会员优惠）</li></ul><button class="sbtn" onclick="goCheckout(\'member_monthly\')">订阅 Runae 顾问 · $9.9 / 月</button></div>';
    }
    body.innerHTML=html;
  }

  function stream(q){
    var body=document.getElementById('body'); body.innerHTML=skel();
    var token=localStorage.getItem('sy_token')||'';
    var acc='',locked=false,firstChunk=true,done=false;
    var to=setTimeout(function(){ if(!done){ done=true; if(!acc) body.innerHTML='<div class="err">'+T.timeout+'<br><br><button class="cta" style="max-width:200px;margin:14px auto 0" onclick="stream(document.getElementById(\'question\').value.trim()||\''+esc(q).replace(/'/g,"")+'\')">'+T.retry+'</button></div>'; else renderReading(acc,locked); } }, 90000);
    fetch('/api/tarot/stream',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({ lang:LANG, question:q, spread:'three', topic:currentTopic,
        cards:drawn.map(function(d,i){ return {name:d.card.name, reversed:d.reversed, position:POS[i]}; }) })
    }).then(function(res){
      if(!res.ok||!res.body) throw new Error('stream '+res.status);
      var reader=res.body.getReader(),dec=new TextDecoder('utf-8'),buf='';
      function pump(){
        reader.read().then(function(r){
          if(r.done){ clearTimeout(to); done=true; renderReading(acc,locked); return; }
          buf+=dec.decode(r.value,{stream:true});
          var lines=buf.split('\n'); buf=lines.pop();
          lines.forEach(function(line){
            if(!line.startsWith('data: '))return;
            try{ var ev=JSON.parse(line.slice(6));
              if(ev.type==='meta'){ locked=!!ev.locked; }
              else if(ev.type==='chunk'){
                acc+=ev.content;
                if(firstChunk){ firstChunk=false; body.innerHTML='<div class="read"><p id="live"></p></div>'; }
                var live=document.getElementById('live');
                if(live){ var cut=acc.indexOf('---LOCKED---'); live.innerHTML=md((cut>=0?acc.slice(0,cut):acc).trim()); }
              }
              else if(ev.type==='done'){ clearTimeout(to); done=true; renderReading(acc,locked); }
              else if(ev.type==='error'){ clearTimeout(to); done=true; if(!acc) body.innerHTML='<div class="err">'+esc(ev.message||T.genFail)+'<br><br><button class="cta" style="max-width:200px;margin:14px auto 0" onclick="draw()">'+T.redrawBtn+'</button></div>'; else renderReading(acc,locked); }
            }catch(e){}
          });
          pump();
        }).catch(function(){ clearTimeout(to); if(done)return; done=true; if(!acc) body.innerHTML='<div class="err">'+T.netErr+'<br><br><button class="cta" style="max-width:200px;margin:14px auto 0" onclick="draw()">'+T.redrawBtn+'</button></div>'; else renderReading(acc,locked); });
      }
      pump();
    }).catch(function(){ clearTimeout(to); if(done)return; done=true; body.innerHTML='<div class="err">'+T.netErr+'<br><br><button class="cta" style="max-width:200px;margin:14px auto 0" onclick="draw()">'+T.redrawBtn+'</button></div>'; });
  }

  function reset(){
    document.getElementById('stage').style.display='none';
    document.getElementById('body').innerHTML='';
    document.getElementById('ask').style.display='block';
    window.scrollTo({top:0,behavior:'smooth'});
  }

  window.goCheckout=function(product){
    fetch('/api/create-checkout',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({product:product,token:localStorage.getItem('sy_token')||'',
        successUrl:location.origin+'/pages/report-tarot.html?paid=1&lang='+LANG,cancelUrl:location.href})})
     .then(function(r){return r.json();}).then(function(d){
       if(d.url){ location.href=d.url; }
       else if(d.channel==='cn'){ alert(EN?'Please pay via WeChat / Alipay (coming soon).':'国内用户请用微信 / 支付宝支付（接入中）'); }
       else { alert(EN?'Couldn’t open checkout — please try again.':'跳转支付失败，请重试'); }
     }).catch(function(){ alert(EN?'Network error — please try again.':'网络异常，请重试'); });
  };
</script>
