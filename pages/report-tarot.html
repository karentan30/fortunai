<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Runae · 塔罗解读</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F0E7;--card:#FFFFFF;--card-2:#FAF7F0;
    --ink:#26221C;--ink-2:#6A6357;--ink-3:#A39B8C;
    --gold:#A9803A;--gold-soft:#C3A05A;--gold-wash:#EFE7D4;
    --jade:#2D7A62;--jade-deep:#1C4A3A;--jade-soft:#7DDFC0;--jade-wash:#E3EDE8;
    --line:rgba(38,34,28,.10);--line-2:rgba(38,34,28,.16);
    --sans:'Inter',-apple-system,system-ui,sans-serif;--serif:'Cormorant Garamond','Noto Serif SC',serif;
    --rl:20px;--r:14px;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--paper);font-family:var(--sans);color:var(--ink);line-height:1.5;font-feature-settings:"tnum";min-height:100vh}
  .wrap{max-width:430px;margin:0 auto;padding:0 24px 40px;min-height:100vh}
  svg.ic{width:18px;height:18px;stroke:var(--ink-3);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 12px}
  .nav-back{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-3);cursor:pointer;font-weight:500}
  .step{font-size:11px;color:var(--ink-3);letter-spacing:.1em;font-weight:600}
  .rhero{text-align:center;padding:16px 4px 4px}
  .rhero .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .rhero .dv{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);margin:14px auto}
  .rhero h2{font-family:var(--serif);font-size:29px;font-weight:600;line-height:1.24;letter-spacing:-.01em;margin:0 6px}
  .chart{background:var(--jade-deep);border:1px solid rgba(195,160,90,.20);border-radius:var(--rl);padding:22px 20px;margin:18px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
  .pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
  .pil .c{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.15;background:linear-gradient(160deg,#E8C87E,#B98A3E);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.18))}
  .pil .l{font-size:10px;color:rgba(255,255,255,.62);margin-top:7px;letter-spacing:.08em}
  .read{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);padding:20px;margin-bottom:14px}
  .read h3{font-size:14px;font-weight:600;margin-bottom:10px;letter-spacing:.01em}
  .read p{font-size:15px;color:var(--ink-2);line-height:1.75;white-space:pre-wrap}
  .blur{filter:blur(5px);opacity:.55;user-select:none;pointer-events:none}
  .wall{background:var(--card);border:1px solid var(--gold-soft);border-radius:var(--rl);padding:24px 20px;text-align:center;margin:16px 0;box-shadow:0 14px 34px -20px rgba(169,128,58,.30)}
  .wall h4{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:5px}
  .wall p{font-size:13px;color:var(--ink-2);margin-bottom:18px}
  .cta{width:100%;background:var(--jade-deep);color:#fff;border:none;border-radius:var(--r);padding:16px;font-size:15px;font-weight:600;font-family:var(--sans);cursor:pointer}
  .cta.gold{background:linear-gradient(135deg,var(--gold-soft),var(--gold))}
  .cta:disabled{opacity:.5;cursor:default}
  .wall .price{font-size:13px;color:var(--ink-3);margin-top:12px}
  .wall .price b{color:var(--gold);font-size:17px;font-weight:600}
  .expand{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;color:var(--ink-2);padding:14px;border:1px solid var(--gold-wash);border-radius:var(--r);margin-bottom:12px;background:var(--card-2);font-weight:500}
  .adv{background:var(--jade-deep);border:1px solid rgba(195,160,90,.20);border-radius:var(--rl);padding:24px 21px;margin:22px 0 8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
  .adv .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);font-weight:600}
  .adv h4{font-family:var(--serif);font-size:21px;font-weight:600;margin:10px 0 4px;color:#fff}
  .adv ul{list-style:none;margin:14px 0}
  .adv li{font-size:13px;color:rgba(255,255,255,.86);padding:6px 0 6px 20px;position:relative}
  .adv li::before{content:'◆';position:absolute;left:2px;top:6px;color:var(--gold-soft);font-size:7px;line-height:2.1}
  .adv .sbtn{width:100%;background:transparent;color:var(--gold-soft);border:1px solid var(--gold-soft);border-radius:var(--r);padding:15px;font-size:14.5px;font-weight:600;margin-top:10px;cursor:pointer}
  .skel{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);padding:20px;margin-bottom:14px}
  .skel .ln{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line),#efe9de,var(--line));background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:11px}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .err{text-align:center;color:var(--ink-2);font-size:14px;padding:40px 10px}

  /* ── tarot-specific ── */
  .q-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:6px 0 10px}
  .q-box{background:var(--card);border:1px solid var(--gold-soft);border-radius:var(--r);padding:14px 16px;box-shadow:0 10px 26px -20px rgba(169,128,58,.3)}
  .q-input{width:100%;background:none;border:none;outline:none;font-family:var(--serif);font-size:17px;color:var(--ink);line-height:1.6;resize:none;min-height:46px}
  .q-input::placeholder{color:var(--ink-3)}
  .q-chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
  .q-chip{font-size:12.5px;color:var(--ink-2);background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer;font-weight:500;transition:all .16s}
  .q-chip:active,.q-chip.on{color:var(--gold);border-color:var(--gold-soft);background:var(--gold-wash)}
  .q-counter{font-size:10.5px;color:var(--ink-3);text-align:right;margin-top:8px;letter-spacing:.04em}
  .cards3{display:flex;gap:10px;justify-content:center;margin:6px 0 2px}
  .tcard{flex:1;max-width:112px;display:flex;flex-direction:column;align-items:center}
  .tcard .face{width:100%;aspect-ratio:5/9;border-radius:12px;background:linear-gradient(160deg,#215845,#123528 60%,#0d271d);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 20px 40px -22px rgba(0,0,0,.6),inset 0 0 0 1px rgba(195,160,90,.28);animation:reveal .55s ease both}
  .tcard:nth-child(1) .face{animation-delay:.05s}
  .tcard:nth-child(2) .face{animation-delay:.22s}
  .tcard:nth-child(3) .face{animation-delay:.39s}
  @keyframes reveal{from{opacity:0;transform:rotateY(82deg) translateY(14px)}to{opacity:1;transform:none}}
  .tcard .face::after{content:'';position:absolute;inset:5px;border:1px solid rgba(195,160,90,.5);border-radius:8px;pointer-events:none}
  .tcard .glyph{font-family:var(--serif);font-size:30px;font-weight:600;background:linear-gradient(160deg,#E8C87E,#B98A3E);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .tcard .rn{font-family:var(--serif);font-size:12px;color:var(--gold-soft);letter-spacing:.16em;margin-top:2px}
  .tcard .nm{font-size:11px;color:var(--gold-soft);text-align:center;margin-top:8px;letter-spacing:.04em;line-height:1.4}
  .tcard .pos{font-size:10px;color:var(--ink-3);text-align:center;margin-top:5px;letter-spacing:.08em}
  .reverse{transform:rotate(180deg)}
  .redraw{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--ink-2);padding:13px;border:1px solid var(--line);border-radius:var(--r);margin:4px 0 14px;background:var(--card-2);font-weight:500;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><div class="nav-back" onclick="location.href='pick.html'"><svg class="ic" style="width:15px;height:15px"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>返回</div><div class="step">塔罗解读</div></div>

  <!-- STEP 1 · ask + draw -->
  <div id="ask">
    <div class="rhero"><div class="k">Tarot · 韦特体系</div><div class="dv"></div><h2>抽三张牌<br>看清过去 · 现在 · 未来</h2></div>
    <div class="q-label">把问题放在心上</div>
    <div class="q-box"><textarea rows="2" class="q-input" id="question" maxlength="120" placeholder="例：我的事业接下来会如何？" oninput="qCount()"></textarea></div>
    <div class="q-chips" id="qChips"></div>
    <div class="q-counter" id="qCounter">0 / 120</div>
    <button class="cta gold" id="drawBtn" style="margin-top:16px" onclick="draw()">默念问题 · 抽牌</button>
  </div>

  <!-- STEP 2 · cards + reading -->
  <div id="stage" style="display:none">
    <div id="hero"></div>
    <div class="chart"><div class="cards3" id="cards3"></div></div>
    <div class="redraw" id="redraw" onclick="reset()"><svg class="ic" style="width:14px;height:14px"><path d="M4 12a8 8 0 0 1 14-5m0 0V4m0 3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>换个问题 · 重新抽牌</div>
    <div id="body"></div>
  </div>
</div>

<script>
  var P={}; try{ P=JSON.parse(localStorage.getItem('runae_profile')||'{}'); }catch(e){}

  // 建议问题：优先用 runae_profile.aspects
  var ASPECT_Q={
    career:'我的事业接下来会如何？', love:'这段感情会有结果吗？',
    wealth:'我近期的财运走势怎么样？', health:'我的身心状态需要注意什么？'
  };
  var ASPECT_TOPIC={ career:'wealth', love:'love', wealth:'wealth', health:'health' };
  var DEFAULT_CHIPS=[
    {q:'我的事业接下来会如何？',t:'wealth'},
    {q:'这段感情会有结果吗？',t:'love'},
    {q:'我近期的财运走势怎么样？',t:'wealth'},
    {q:'这件事该坚持还是放手？',t:'decision'}
  ];
  var currentTopic='love';
  (function(){
    var aspects=(P.aspects||[]).filter(function(a){return ASPECT_Q[a];});
    var chips=[];
    aspects.forEach(function(a){ chips.push({q:ASPECT_Q[a],t:ASPECT_TOPIC[a]}); });
    DEFAULT_CHIPS.forEach(function(c){ if(chips.length<4 && !chips.some(function(x){return x.q===c.q;})) chips.push(c); });
    var box=document.getElementById('qChips');
    chips.slice(0,5).forEach(function(c){
      var el=document.createElement('span'); el.className='q-chip'; el.textContent=c.q;
      el.onclick=function(){ document.getElementById('question').value=c.q; currentTopic=c.t; qCount();
        document.querySelectorAll('.q-chip').forEach(function(x){x.classList.remove('on')}); el.classList.add('on'); };
      box.appendChild(el);
    });
    if(aspects[0]) currentTopic=ASPECT_TOPIC[aspects[0]]||'love';
  })();
  function qCount(){ var v=document.getElementById('question').value; document.getElementById('qCounter').textContent=v.length+' / 120'; }

  // 大阿卡纳 22 张——name 必须匹配后端 _VALID_TAROT_CARDS（禁用旧版 tarot.html 的别名如 皇后/隐者/魔术师）
  var DECK=[
    {name:'愚者',rn:'0',glyph:'零'},{name:'魔法师',rn:'I',glyph:'一'},{name:'女祭司',rn:'II',glyph:'二'},
    {name:'女皇',rn:'III',glyph:'三'},{name:'皇帝',rn:'IV',glyph:'四'},{name:'教皇',rn:'V',glyph:'五'},
    {name:'恋人',rn:'VI',glyph:'六'},{name:'战车',rn:'VII',glyph:'七'},{name:'力量',rn:'VIII',glyph:'八'},
    {name:'隐士',rn:'IX',glyph:'九'},{name:'命运之轮',rn:'X',glyph:'十'},{name:'正义',rn:'XI',glyph:'义'},
    {name:'倒吊人',rn:'XII',glyph:'吊'},{name:'死神',rn:'XIII',glyph:'变'},{name:'节制',rn:'XIV',glyph:'融'},
    {name:'恶魔',rn:'XV',glyph:'缚'},{name:'塔',rn:'XVI',glyph:'崩'},{name:'星星',rn:'XVII',glyph:'星'},
    {name:'月亮',rn:'XVIII',glyph:'月'},{name:'太阳',rn:'XIX',glyph:'日'},{name:'审判',rn:'XX',glyph:'醒'},
    {name:'世界',rn:'XXI',glyph:'圆'}
  ];
  var POS=['过去 · 根源','现在 · 核心','未来 · 走向'];
  var drawn=[];

  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
  var HEAD=/^\s*([【✅📜🌟💰❤💼🌿☀🔮⛰✨🙏#]|#{1,3}\s|[一二三四五六七八九十]、|[IVX]+[\.、]|[\uD83C-\uDBFF])/;
  function sections(text){
    var lines=text.split('\n'),secs=[],cur=null;
    lines.forEach(function(raw){
      var l=raw.replace(/\s+$/,''); if(!l.trim())return;
      var t=l.trim();
      if((HEAD.test(l)||/^#{1,4}\s/.test(t))&&t.replace(/^#{1,4}\s*/,'').length<40){
        cur={t:t.replace(/[\uD800-\uDFFF←-⯿☀-➿️#*【】]/g,'').replace(/^#{1,4}\s*/,'').trim(),b:[]};secs.push(cur);
      }else{ if(!cur){cur={t:'',b:[]};secs.push(cur);} cur.b.push(t); }
    });
    return secs.filter(function(s){return s.t||s.b.length;});
  }

  function draw(){
    var q=document.getElementById('question').value.trim();
    if(!q){ document.getElementById('question').focus(); document.getElementById('drawBtn').textContent='请先写下你的问题'; setTimeout(function(){document.getElementById('drawBtn').textContent='默念问题 · 抽牌';},1400); return; }
    // 洗牌抽三，30% 逆位
    var pool=DECK.slice(); drawn=[];
    for(var i=0;i<3;i++){ var idx=Math.floor(Math.random()*pool.length); var c=pool.splice(idx,1)[0]; drawn.push({card:c,reversed:Math.random()<0.3}); }
    document.getElementById('ask').style.display='none';
    document.getElementById('stage').style.display='block';
    document.getElementById('hero').innerHTML='<div class="rhero"><div class="k">Tarot · 你问</div><div class="dv"></div><h2>'+esc(q.length>26?q.slice(0,26)+'…':q)+'</h2></div>';
    var trio=document.getElementById('cards3'); trio.innerHTML='';
    drawn.forEach(function(d,i){
      trio.innerHTML+='<div class="tcard"><div class="face'+(d.reversed?' reverse':'')+'"><div class="glyph">'+d.card.glyph+'</div><div class="rn">'+d.card.rn+'</div><div class="nm">'+esc(d.card.name)+(d.reversed?' 逆位':'')+'</div></div><div class="pos">'+POS[i]+'</div></div>';
    });
    window.scrollTo({top:0,behavior:'smooth'});
    stream(q);
  }

  function skel(){ return '<div class="skel"><div class="ln" style="width:55%"></div><div class="ln" style="width:100%"></div><div class="ln" style="width:90%"></div><div class="ln" style="width:72%"></div></div><div class="err">牌正在为你排列…</div>'; }

  function renderReading(text,locked){
    var body=document.getElementById('body');
    var free=(text||'').split(/---LOCKED---/i)[0]||'';
    var html='';
    sections(free).forEach(function(s){ html+='<div class="read">'+(s.t?'<h3>'+esc(s.t)+'</h3>':'')+'<p>'+md(s.b.join('\n'))+'</p></div>'; });
    if(!html) html='<div class="read"><p>'+md(free)+'</p></div>';
    if(locked){
      html+='<div class="read"><h3>逐牌精读 · 未来走向</h3><p class="blur">过去牌位揭示旧执正在松动，现在牌位星光落肩，未来牌位将迎来一个清晰的节点——把握窗口期，具体到哪一牌位在推动、该怎么抓怎么避，都在完整牌卷里……</p></div>';
      html+='<div class="wall"><h4>解锁完整牌卷</h4><p>逐牌精读 · 正逆位深意 · 综合走向 · 行动建议 · 占卜师悄悄话</p><button class="cta gold" onclick="goCheckout(\'tarot_3\')">解锁完整解读</button><div class="price"><b>$9.90</b> 一次性 · 或订阅更划算 ↓</div></div>';
      html+='<div class="expand">▾ 五芒星牌阵 · 五维深度解读（$19）</div>';
    }
    html+='<div class="adv"><div class="k">Runae 顾问 · 会记得你</div><h4>不止一次占卜<br>是一个懂你的命理顾问</h4><ul><li>每日运势与流年动态，天天更新</li><li>AI 对话随时追问深聊，像身边的老师</li><li>塔罗 + 八字 + 星座，交叉印证同一个你</li><li>记得你问过的每一个问题，越用越懂你</li><li>可约真人塔罗师一对一（会员优惠）</li></ul><button class="sbtn" onclick="goCheckout(\'member_monthly\')">订阅 Runae 顾问 · $9.9 / 月</button></div>';
    body.innerHTML=html;
  }

  function stream(q){
    var body=document.getElementById('body'); body.innerHTML=skel();
    var token=localStorage.getItem('sy_token')||'';
    var acc='',locked=false,firstChunk=true,done=false;
    var to=setTimeout(function(){ if(!done){ done=true; if(!acc) body.innerHTML='<div class="err">生成超时，请重试<br><br><button class="cta" style="max-width:200px;margin:14px auto 0" onclick="stream(document.getElementById(\'question\').value.trim()||\''+esc(q).replace(/'/g,"")+'\')">重试</button></div>'; else renderReading(acc,locked); } }, 90000);
    fetch('/api/tarot/stream',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({ lang:'zh', question:q, spread:'three', topic:currentTopic,
        cards:drawn.map(function(d,i){ return {name:d.card.name, reversed:d.reversed, position:POS[i]}; }) })
    }).then(function(res){
      if(!res.ok||!res.body) throw new Error('stream '+res.status);
      var reader=res.body.getReader(),dec=new TextDecoder('utf-8'),buf='';
      function pump(){
        reader.read().then(function(r){
          if(r.done){ clearTimeout(to); done=true; renderReading(acc,locked); return; }
          buf+=dec.decode(r.value,{stream:true});
          var lines=buf.split('\n'); buf=lines.pop();
          lines.forEach(function(line){
            if(!line.startsWith('data: '))return;
            try{ var ev=JSON.parse(line.slice(6));
              if(ev.type==='meta'){ locked=!!ev.locked; }
              else if(ev.type==='chunk'){
                acc+=ev.content;
                if(firstChunk){ firstChunk=false; body.innerHTML='<div class="read"><p id="live"></p></div>'; }
                var live=document.getElementById('live');
                if(live){ var cut=acc.indexOf('---LOCKED---'); live.innerHTML=md((cut>=0?acc.slice(0,cut):acc).trim()); }
              }
              else if(ev.type==='done'){ clearTimeout(to); done=true; renderReading(acc,locked); }
              else if(ev.type==='error'){ clearTimeout(to); done=true; if(!acc) body.innerHTML='<div class="err">'+esc(ev.message||'生成失败')+'<br><br><button class="cta" style="max-width:200px;margin:14px auto 0" onclick="draw()">重新抽牌</button></div>'; else renderReading(acc,locked); }
            }catch(e){}
          });
          pump();
        }).catch(function(){ clearTimeout(to); if(done)return; done=true; if(!acc) body.innerHTML='<div class="err">网络异常，请刷新重试<br><br><button class="cta" style="max-width:200px;margin:14px auto 0" onclick="draw()">重新抽牌</button></div>'; else renderReading(acc,locked); });
      }
      pump();
    }).catch(function(){ clearTimeout(to); if(done)return; done=true; body.innerHTML='<div class="err">网络异常，请刷新重试<br><br><button class="cta" style="max-width:200px;margin:14px auto 0" onclick="draw()">重新抽牌</button></div>'; });
  }

  function reset(){
    document.getElementById('stage').style.display='none';
    document.getElementById('body').innerHTML='';
    document.getElementById('ask').style.display='block';
    window.scrollTo({top:0,behavior:'smooth'});
  }

  window.goCheckout=function(product){
    fetch('/api/create-checkout',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({product:product,token:localStorage.getItem('sy_token')||'',
        successUrl:location.origin+'/pages/report-tarot.html?paid=1',cancelUrl:location.href})})
     .then(function(r){return r.json();}).then(function(d){
       if(d.url){ location.href=d.url; }
       else if(d.channel==='cn'){ alert('国内用户请用微信 / 支付宝支付（接入中）'); }
       else { alert('跳转支付失败，请重试'); }
     }).catch(function(){ alert('网络异常，请重试'); });
  };
</script>
</body>
</html>
