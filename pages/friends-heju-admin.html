<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>相合局运营 · 相生</title><link rel="stylesheet" href="/assets/css/friends-tokens.css"><link rel="stylesheet" href="/assets/css/friends.css"><link rel="stylesheet" href="/assets/css/friends-polish.css"><link rel="stylesheet" href="/assets/css/friends-heju.css"></head>
<body data-heju="admin">
<header class="site-header"><a class="brand" href="/pages/friends-admin.html">相生</a><span class="fine-print">相合局运营</span></header>
<main class="hj-main" id="hj-root">
  <h1>相合局运营</h1>
  <section class="hj-card" id="ha-login"><form id="ha-login-form" novalidate><label class="hj-field"><span>管理凭据</span><input type="password" id="ha-token" autocomplete="off"></label><div class="hj-actions"><button type="submit" class="primary">进入</button></div></form></section>
  <div id="ha-work" hidden>
    <section class="hj-card"><h2>概况</h2><div id="ha-summary"></div><div class="hj-actions"><button type="button" class="secondary" id="ha-run">现在跑一次分组</button><button type="button" class="secondary" id="ha-exit">退出</button></div><p class="hj-hint">每天北京时间凌晨 3 点自动跑一次。这里可以手动补跑。</p></section>
    <section class="hj-card"><h2>合作俱乐部</h2><ul class="hj-list" id="ha-clubs"></ul>
      <form id="ha-club-form" novalidate><label class="hj-field"><span>俱乐部名称</span><input type="text" id="ha-name" maxlength="30" autocomplete="off"></label><label class="hj-field"><span>卡片编号或账号 id</span><input type="text" id="ha-who" autocomplete="off"></label><label class="hj-check" for="ha-off"><input type="checkbox" id="ha-off"><span>停用这个俱乐部</span></label><div class="hj-actions"><button type="submit" class="primary">保存</button></div></form></section>
  </div>
</main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script src="/assets/js/friends-heju-admin.js"></script>
</body>
</html>
