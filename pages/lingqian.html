<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">

<meta name="twitter:title" content="善缘 · 求签问事">
<meta name="twitter:description" content="善缘灵签 — 在线求签，AI解签诗">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#faf8f5;--card:#ffffff;--mid:#f5f0e8;
  --gold:#b8944a;--gold-light:#d4b06a;--gold-deep:#8a7020;
  --jade:#5bbfa0;--jade-mid:#8dd9bf;--jade-deep:#3d9e82;
  --ink:rgba(40,35,30,0.92);--sub:rgba(80,70,55,0.7);}
.dark-mode{--bg:#faf8f5;--card:#ffffff;--mid:#1f1408;
  --gold:#c9a84c;--gold-light:#e8d08a;--gold-deep:#8a6420;
  --jade:#5bbfa0;--jade-mid:#8dd9bf;--jade-deep:#3d9e82;
  --ink:rgba(40,35,30,0.92);--sub:rgba(80,70,55,0.7);}
html,body{background:var(--bg);font-family:'Noto Serif SC',serif;color:var(--text);-webkit-font-smoothing:antialiased}
body{max-width:390px;margin:0 auto;min-height:100vh;overflow-y:auto;padding-bottom:120px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(201,130,10,.15) 0%,transparent 50%);pointer-events:none;z-index:0}

.back-btn{position:fixed;top:16px;left:16px;z-index:99;background:none;border:none;font-family:'Noto Serif SC',serif;font-size:13px;color:rgba(201,130,10,.7);cursor:pointer;padding:4px 0}

/* Header */
.header{position:relative;z-index:1;text-align:center;padding:44px 20px 16px}
.header-title{font-size:20px;font-weight:400;letter-spacing:.22em;margin-bottom:6px}
.header-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11px;letter-spacing:.26em;color:rgba(201,130,10,.5);margin-bottom:14px}
.amber-line{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--amber),transparent);margin:0 auto}

/* Question field */
.q-wrap{position:relative;z-index:1;padding:10px 16px 4px}
.q-label{font-size:10px;letter-spacing:.2em;color:rgba(201,130,10,.45);margin-bottom:6px}
.field-group{background:var(--card);border:1px solid rgba(201,130,10,.12);border-radius:8px;overflow:hidden;margin-bottom:8px}
.field-row{display:flex;align-items:flex-start;padding:0 14px;border-bottom:1px solid rgba(201,130,10,.08)}
.field-row:last-child{border-bottom:none}
.field-label{font-size:11px;color:var(--text-dim);letter-spacing:0.06em;min-width:56px;flex-shrink:0;padding-top:12px}
.field-textarea{flex:1;background:none;border:none;outline:none;font-family:'Noto Serif SC',serif;font-size:13px;color:var(--text);padding:12px 8px;letter-spacing:0.04em;resize:none;min-height:60px;line-height:1.8}
.field-input{flex:1;background:none;border:none;outline:none;font-family:'Noto Serif SC',serif;font-size:13px;color:var(--text);padding:12px 8px;letter-spacing:0.04em}
.field-input::placeholder,.field-textarea::placeholder{color:rgba(240,230,216,.18)}

/* Temple tabs */
.temple-tabs{position:relative;z-index:1;display:flex;gap:6px;padding:6px 16px 4px;overflow-x:auto;scrollbar-width:none}
.temple-tabs::-webkit-scrollbar{display:none}
.ttab{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid rgba(201,130,10,.2);background:transparent;font-family:'Noto Serif SC',serif;font-size:11px;letter-spacing:.06em;color:rgba(240,230,216,.45);cursor:pointer;transition:all .2s}
.ttab.active{background:rgba(201,130,10,.15);border-color:var(--amber);color:var(--amber-light)}

/* Bamboo tube */
.tube-section{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:12px 16px 8px;gap:14px}
.tube-wrap{position:relative;width:80px;height:140px}
.tube-body{
  position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:60px;height:120px;
  background:linear-gradient(90deg,rgba(90,50,15,1) 0%,rgba(160,90,25,1) 30%,rgba(180,110,30,1) 50%,rgba(120,65,20,1) 70%,rgba(80,45,12,1) 100%);
  border-radius:8px 8px 4px 4px;
  box-shadow:0 4px 20px rgba(0,0,0,.5),inset 2px 0 8px rgba(0,0,0,.3);
}
.tube-rim{
  position:absolute;bottom:116px;left:50%;transform:translateX(-50%);
  width:64px;height:8px;
  background:linear-gradient(90deg,rgba(70,40,10,1),rgba(140,80,22,1),rgba(70,40,10,1));
  border-radius:4px 4px 0 0;
}
.sticks{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);width:44px;height:60px;display:flex;align-items:flex-end;justify-content:center;gap:3px;overflow:hidden}
.stick{
  width:4px;height:var(--h,50px);
  background:linear-gradient(180deg,rgba(210,175,100,1),rgba(190,150,70,1));
  border-radius:2px 2px 0 0;
  transform-origin:bottom center;
}
.tube-wrap.shaking{animation:tube-shake .5s ease}
@keyframes tube-shake{
  0%,100%{transform:rotate(0)}
  15%{transform:rotate(-8deg) translateY(-4px)}
  30%{transform:rotate(7deg) translateY(-2px)}
  50%{transform:rotate(-5deg)}
  70%{transform:rotate(4deg)}
  85%{transform:rotate(-2deg)}
}
.fallen-stick{
  position:absolute;bottom:-16px;left:50%;
  width:4px;height:70px;
  background:linear-gradient(180deg,rgba(210,175,100,1),rgba(190,150,70,1));
  border-radius:2px;
  transform:translateX(-50%) rotate(85deg) translateY(-20px);
  opacity:0;transition:all .5s ease .2s;
}
.tube-wrap.revealed .fallen-stick{opacity:1;transform:translateX(-50%) rotate(75deg) translateY(0)}
.shake-instruction{font-size:12px;color:var(--text-dim);letter-spacing:.1em;text-align:center}
.btn-shake{padding:12px 36px;background:linear-gradient(135deg,var(--amber-deep),var(--amber),var(--amber-light),var(--amber));border:none;border-radius:4px;color:rgba(26,14,4,.95);font-family:'Noto Serif SC',serif;font-size:14px;font-weight:500;letter-spacing:.2em;cursor:pointer;box-shadow:0 4px 16px rgba(201,130,10,.3)}
.btn-shake:active{transform:scale(.97)}
.btn-shake:disabled{opacity:.4;cursor:not-allowed}
.btn-shake.hidden{display:none}

/* AI Submit */
.submit-wrap{position:relative;z-index:1;padding:0 16px 12px;display:none}
.btn-submit{width:100%;padding:15px 0;background:linear-gradient(90deg,#8a5500,#c9820a,#e8b86a,#c9820a,#8a5500);background-size:300% auto;border:none;border-radius:4px;color:rgba(26,14,4,.95);font-family:'Noto Serif SC',serif;font-size:14px;font-weight:500;letter-spacing:.22em;cursor:pointer;animation:gold-shimmer 3s linear infinite;box-shadow:0 4px 20px rgba(201,130,10,.3)}
.btn-submit:active{transform:scale(0.97)}

/* Loading */
.loading-screen{position:relative;z-index:1;display:none;flex-direction:column;align-items:center;padding:60px 20px;gap:16px}
.load-glyph{font-size:48px;color:rgba(201,130,10,0.3);font-weight:300;animation:load-breathe 2s ease-in-out infinite}
.load-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:rgba(201,130,10,.5);letter-spacing:0.18em}
.load-steps{display:flex;flex-direction:column;gap:5px}
@keyframes step-fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Divider */
.sec-head{position:relative;z-index:1;display:flex;align-items:center;gap:10px;padding:8px 16px 6px}
.sec-head span{font-size:10px;letter-spacing:.2em;color:rgba(201,130,10,.4);white-space:nowrap}
.sec-head::before,.sec-head::after{content:'';flex:1;height:1px;background:rgba(201,130,10,.12)}

/* Result card (static pre-display) */
.result-card-preview{position:relative;z-index:1;margin:0 16px;background:var(--card);border:1px solid rgba(201,130,10,.2);border-radius:10px;overflow:hidden;display:none}
.result-card-preview.show{display:block}
.result-top{
  background:linear-gradient(135deg,rgba(138,85,0,.3),rgba(201,130,10,.15));
  padding:18px 18px 14px;text-align:center;border-bottom:1px solid rgba(201,130,10,.12)
}
.lot-num{font-family:'Cormorant Garamond',serif;font-size:13px;color:rgba(201,130,10,.5);letter-spacing:.3em;margin-bottom:4px}
.lot-grade{font-size:15px;letter-spacing:.18em;margin-bottom:10px}
.grade-excellent{color:#f5e98a}
.grade-good{color:var(--amber-light)}
.grade-mid{color:rgba(240,230,216,.7)}
.grade-bad{color:rgba(180,100,100,.8)}
.lot-poem{border:1px solid rgba(201,130,10,.15);border-radius:6px;padding:10px 14px;background:rgba(0,0,0,.15)}
.poem-line{font-family:'Noto Serif SC',serif;font-size:13px;letter-spacing:.18em;color:rgba(240,230,216,.82);line-height:2.1}

/* AI interpretation */
.ai-interp{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.ai-card{background:var(--card);border:1px solid rgba(201,130,10,.15);border-radius:10px;overflow:hidden}
.ai-card.open{border-color:rgba(201,130,10,.3)}
.ai-card-head{display:flex;align-items:center;padding:12px 14px;gap:10px;cursor:pointer}
.ai-card-icon{width:28px;height:28px;border-radius:50%;background:rgba(201,130,10,0.2);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.ai-card-title{font-size:13px;letter-spacing:.08em;flex:1}
.ai-card-arrow{font-size:10px;color:rgba(255,245,220,0.25);transition:transform 0.25s}
.ai-card-body{padding:0 14px 14px;display:none}
.ai-card-body.open{display:block}
.ai-card-text{font-size:11px;color:var(--text-dim);letter-spacing:0.04em;line-height:1.9;white-space:pre-wrap}

/* CTAs */
.cta-wrap{position:relative;z-index:1;padding:12px 16px 8px;display:none}
.cta-wrap.show{display:block}
.btn-cta{width:100%;padding:14px 0;background:linear-gradient(135deg,var(--amber-deep),var(--amber),var(--amber-light),var(--amber));border:none;border-radius:4px;color:rgba(26,14,4,.95);font-family:'Noto Serif SC',serif;font-size:14px;font-weight:500;letter-spacing:.2em;cursor:pointer;box-shadow:0 4px 16px rgba(201,130,10,.3);margin-bottom:8px}
.btn-redo{width:100%;padding:11px 0;background:transparent;border:1px solid rgba(201,130,10,.25);border-radius:4px;color:rgba(201,130,10,.6);font-family:'Noto Serif SC',serif;font-size:13px;letter-spacing:.16em;cursor:pointer}

/* QA */
.qa-section{position:relative;z-index:1;display:none;padding:16px 0 80px}
.qa-label{font-size:10px;color:rgba(201,130,10,.5);letter-spacing:0.2em;margin-bottom:10px;padding:0 16px}
.qa-row{display:flex;gap:8px;padding:0 16px}
.qa-input{flex:1;background:var(--card);border:1px solid rgba(201,130,10,.15);border-radius:6px;padding:10px 12px;font-family:Noto Serif SC,serif;font-size:12px;color:var(--text);outline:none}
.qa-input:focus{border-color:rgba(201,130,10,.3)}
.qa-btn{padding:10px 16px;background:linear-gradient(135deg,var(--amber-deep),var(--amber));border:none;border-radius:6px;color:#1a0e04;font-family:Noto Serif SC,serif;font-size:12px;letter-spacing:0.1em;cursor:pointer;white-space:nowrap}
.qa-btn:active{transform:scale(0.97)}
.qa-btn:disabled{opacity:0.4;cursor:default}
.qa-history{padding:12px 16px 0}
.qa-my-msg{text-align:right;margin-bottom:8px}
.qa-my-msg span{display:inline-block;background:rgba(201,130,10,0.1);border:1px solid rgba(201,130,10,0.15);border-radius:6px;padding:8px 12px;font-size:11px;color:var(--text)}
.qa-ai-msg{margin-bottom:10px}
.qa-ai-msg span{display:inline-block;background:var(--card);border:1px solid rgba(201,130,10,0.1);border-radius:6px;padding:8px 12px;font-size:11px;color:var(--text-dim);line-height:1.8}

.stardust span{position:absolute;width:3px;height:3px;background:rgba(201,130,10,0.5);border-radius:50%;animation:twinkle 3s ease-in-out infinite;opacity:0;transition:opacity .5s}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* Qian display */
.qian-display{display:none;margin-bottom:16px;padding:20px 16px;background:linear-gradient(145deg,rgba(23,14,6,0.9),rgba(30,18,8,0.95));border:1px solid rgba(201,168,76,0.2);border-radius:10px;text-align:center;position:relative;overflow:hidden}
.qian-display.show{display:block}
.qian-glow{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(201,168,76,0.05),transparent 70%);pointer-events:none}
.qian-label{font-size:10px;letter-spacing:0.2em;color:rgba(201,168,76,0.4);margin-bottom:8px}
.qian-number{font-family:'Cormorant Garamond',serif;font-size:48px;color:var(--gold);letter-spacing:0.04em}
.qian-type{font-size:11px;letter-spacing:0.2em;margin-top:2px}
.qian-poem{margin-top:12px;font-size:13px;line-height:2.2;color:rgba(255,245,220,0.75);letter-spacing:0.06em;white-space:pre-line}
.qian-grade-excellent{color:#f5e98a;text-shadow:0 0 20px rgba(245,233,138,0.3)}
.qian-grade-good{color:#8dd9bf}
.qian-grade-mid{color:#e8d08a}
.qian-grade-bad{color:#c0a0a0}
.qian-grade-worst{color:#a05555;text-shadow:0 0 8px rgba(160,85,85,0.3)}

/* Enhanced shake */
.tube-wrap.shaking-hard{animation:tube-shake-hard .6s ease}
@keyframes tube-shake-hard{0%,100%{transform:rotate(0)}10%{transform:rotate(-12deg) translateY(-6px)}25%{transform:rotate(10deg) translateY(-4px)}40%{transform:rotate(-8deg) translateY(-2px)}55%{transform:rotate(14deg) translateY(-3px)}70%{transform:rotate(-6deg)}85%{transform:rotate(8deg)}}

/* Flying stick */
.flying-stick{position:absolute;bottom:100px;left:50%;width:4px;height:60px;background:linear-gradient(180deg,rgba(210,175,100,1),rgba(190,150,70,1));border-radius:2px;z-index:20;pointer-events:none;animation:stick-eject 0.8s ease-out forwards}
@keyframes stick-eject{0%{transform:translate(-50%,0) rotate(0deg);opacity:1}20%{transform:translate(-50%,-30px) rotate(5deg);opacity:1}40%{transform:translate(-60%,-80px) rotate(15deg);opacity:0.9}70%{transform:translate(-80%,-150px) rotate(35deg);opacity:0.5}100%{transform:translate(-90%,-220px) rotate(50deg);opacity:0}}

/* ══ 精装阅读增量升级 ══ */
#readProgressWrap{position:fixed;top:0;left:0;right:0;height:3px;z-index:1200;background:rgba(0,0,0,0.25);opacity:0;transition:opacity .3s;pointer-events:none}
#readProgressWrap.show{opacity:1}
#readProgressBar{height:100%;width:0;background:linear-gradient(90deg,#8a6420,#c9a84c,#e8d08a);box-shadow:0 0 8px rgba(201,168,76,0.5);transition:width .12s ease-out}
.chapter-cover{position:relative;margin:16px 4px 10px;border-radius:14px;overflow:hidden;min-height:152px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 8px 30px rgba(0,0,0,0.4);animation:fadeUp 0.6s ease both;background:#141018}
.chapter-cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.62;filter:saturate(0.92)}
.chapter-cover-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,6,3,0.35) 0%,rgba(8,6,3,0.55) 45%,rgba(8,6,3,0.9) 100%)}
.chapter-cover-body{position:relative;padding:16px 18px 14px}
.chapter-cover-num{font-family:'Cormorant Garamond','Noto Serif SC',serif;font-size:12px;letter-spacing:0.32em;color:rgba(232,208,138,0.82);margin-bottom:5px}
.chapter-cover-num::before{content:'';display:inline-block;width:22px;height:1px;background:linear-gradient(90deg,rgba(201,168,76,0.7),transparent);vertical-align:middle;margin-right:8px}
.chapter-cover-title{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:600;letter-spacing:0.06em;color:#f3e6c0;line-height:1.25;text-shadow:0 2px 12px rgba(0,0,0,0.6)}
.chapter-cover-lead{font-size:11px;line-height:1.7;letter-spacing:0.03em;color:rgba(235,225,195,0.72);margin-top:6px}
.hl-note{margin:10px 0;padding:12px 14px;background:linear-gradient(135deg,rgba(201,168,76,0.1),rgba(201,168,76,0.03));border:1px solid rgba(201,168,76,0.34);border-left:3px solid #c9a84c;border-radius:10px;font-size:12px;line-height:1.9;letter-spacing:0.03em;color:rgba(235,225,195,0.92)}
.hl-note b,.hl-note strong{color:#e8d08a}
.pull-quote{position:relative;margin:14px 10px;padding:6px 4px 6px 18px;text-align:center}
.pull-quote::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,transparent,rgba(201,168,76,0.7),transparent);border-radius:2px}
.pull-quote-text{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:500;line-height:1.75;letter-spacing:0.04em;color:#e8d08a}
.pull-quote-mark{font-family:'Cormorant Garamond',serif;font-size:24px;color:rgba(201,168,76,0.4);line-height:0}
.rv-viz-section{margin:0 4px 14px}
</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

</head>
<body>
<div id="readProgressWrap"><div id="readProgressBar"></div></div>
<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题" style="z-index:999;display:none">🌙</button>

<div class="stardust" id="stardust"></div>

<button class="back-btn" onclick="history.back()">‹ 返回</button>

<div class="header page-enter page-enter-d1">
  <div class="header-title">求签问事 · 灵签指引</div>
  <div class="header-sub">SACRED LOT ORACLE · DIVINE GUIDANCE</div>
  <div class="amber-line"></div>
</div>

<!-- Question -->
<div class="q-wrap page-enter page-enter-d2">
  <div class="q-label">默念心中所求之事</div>
  <div class="field-group">
    <div class="field-row">
      <textarea class="field-textarea" id="qInput" placeholder="例：求事业前程、姻缘归宿、财运运势…（越具体越灵验）"></textarea>
    </div>
    <div class="field-row">
      <span class="field-label">地点</span>
      <input class="field-input" type="text" id="locationInput" placeholder="求签地（选填）如：湄洲妈祖庙">
    </div>
  </div>
</div>

<div class="temple-tabs page-enter page-enter-d2">
  <div class="ttab active" onclick="selectTemple(this,'观音')">观音签</div>
  <div class="ttab" onclick="selectTemple(this,'关帝')">关帝签</div>
  <div class="ttab" onclick="selectTemple(this,'月老')">月老签</div>
  <div class="ttab" onclick="selectTemple(this,'财神')">财神签</div>
  <div class="ttab" onclick="selectTemple(this,'文昌')">文昌签</div>
</div>

<div class="tube-section page-enter page-enter-d3">
  <div class="tube-wrap" id="tubeWrap">
    <div class="sticks">
      <div class="stick" style="--h:52px;transform:rotate(-4deg)"></div>
      <div class="stick" style="--h:58px;transform:rotate(1deg)"></div>
      <div class="stick" style="--h:48px;transform:rotate(-2deg)"></div>
      <div class="stick" style="--h:54px;transform:rotate(3deg)"></div>
      <div class="stick" style="--h:50px;transform:rotate(-1deg)"></div>
      <div class="stick" style="--h:56px;transform:rotate(2deg)"></div>
      <div class="stick" style="--h:46px;transform:rotate(-3deg)"></div>
    </div>
    <div class="tube-rim"></div>
    <div class="tube-body"></div>
    <div class="fallen-stick" id="fallenStick"></div>
  </div>
  <div class="shake-instruction" id="shakeInstruction">默念心中所求之事，<br>诚心摇签</div>
  <button class="btn-shake" id="shakeBtn" onclick="shakeTube()">摇签</button>
</div>

<!-- AI Submit after shaking -->
<div class="submit-wrap" id="submitWrap">
  <button class="btn-submit" id="submitBtn" onclick="submitReading()">AI解签 · 深度解读</button>
</div>

<!-- Qian Display -->
<div class="qian-display" id="qianDisplay">
  <div class="qian-glow"></div>
  <div class="qian-label">灵签</div>
  <div class="qian-number" id="qianNumber">--</div>
  <div class="qian-type" id="qianType">--</div>
  <div class="qian-poem" id="qianPoem"></div>
</div>

<!-- Loading -->
<div class="loading-screen" id="loadingScreen">
  <div class="load-glyph">签</div>

<script>

var shaken = false;

var lotGrade = null;
var lotPoem = null;

var LOTS = {

  ],

function selectTemple(el, temple) {
  document.querySelectorAll('.ttab').forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');
  currentTemple = temple;
  if (shaken) resetQian();
}

function shakeTube() {
  if (shaken) return;
  var tube = document.getElementById('tubeWrap');
  var btn = document.getElementById('shakeBtn');
  btn.disabled = true;
  tube.classList.add('shaking');
  document.getElementById('shakeInstruction').textContent = '签已摇出…';
  setTimeout(function(){
    tube.classList.remove('shaking');
    tube.classList.add('revealed');
    setTimeout(showPreview, 400);
  }, 520);
  shaken = true;
}

function showPreview() {
  var lots = LOTS[currentTemple] || LOTS['观音'];
  var lot = lots[Math.floor(Math.random() * lots.length)];
  lotNumber = lot.n;
  lotGrade = lot.grade;
  lotPoem = lot.poem;

  document.getElementById('lotNum').textContent = '第 ' + lot.n + ' 签 · ' + currentTemple + '庙';
  document.getElementById('lotGrade').innerHTML = '<span class="' + lot.cls + '">' + lot.grade + '</span>';
  document.getElementById('lotPoem').innerHTML = lot.poem.map(function(l){
    return '<div class="poem-line">' + l + '</div>';
  }).join('');

  document.getElementById('resultDivider').style.display = 'flex';
  document.getElementById('resultCardPreview').classList.add('show');
  document.getElementById('submitWrap').style.display = 'block';
}

function submitReading() {
  var question = document.getElementById('qInput').value.trim();
  if (!question) { showToast('请描述你所求之事', 'error'); return; }

  document.querySelector('.q-wrap').style.display = 'none';
  document.querySelector('.temple-tabs').style.display = 'none';
  document.querySelector('.tube-section').style.display = 'none';
  document.getElementById('submitWrap').style.display = 'none';
  document.getElementById('loadingScreen').classList.add('show');

  var stepsEl = document.getElementById('loadSteps');
  stepsEl.innerHTML = '';
  var steps = ['诚心感应…','查阅签文…','推演命运轨迹…','结合所求之事…','生成解签报告…'];
  steps.forEach(function(s,i){
    setTimeout(function(){
      stepsEl.innerHTML += '<div class="load-step">✓ '+s+'</div>';
    }, i * 350);
  });

  setTimeout(function(){
    fetch('/api/lingqian', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        question: question,
        temple: currentTemple,
        signNumber: lotNumber,
        location: document.getElementById('locationInput').value || null,
        token: localStorage.getItem('sy_token') || ''
      })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      document.getElementById('loadingScreen').classList.remove('show');
      if (d.error) { showToast(d.error, 'error'); resetQian(); return; }
      if (d.contextId) lastContextId = d.contextId;
      renderAIInterpretation(d.interpretation || d.report || d.result || d.answer || '暂无回应，请重试');
      document.getElementById('ctaWrap').classList.add('show');
      document.getElementById('qaSection').style.display = 'block';
    })
    .catch(function(){
      document.getElementById('loadingScreen').classList.remove('show');
      showToast('网络异常，请重试', 'error');
      resetQian();
    });
  }, steps.length * 350 + 300);
}

function parseSections(text) {
  var known = ['📜','💰','💼','❤️','💪','🌟','🔮','📊','🎯','🔥','💧','🌿','🌊','⛰','⚔️','🛡️','✨','💫','⭐','☯','🌙','🌙','📈','💕','🤝','🎓','🏠','🚗','❄️','⚡','🌪','🏆','🎁','📝','💡','🕯','⚱','🧿','🔔','🗝','🪷','🎋','🏮','🎐','⌛'];
  var lines = text.split('\n');
  var sections = [];
  var current = null;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var matched = null;
    for (var k = 0; k < known.length; k++) {
      if (line.indexOf(known[k]) === 0) { matched = known[k]; break; }
    }
    if (matched) {
      if (current && current.lines.length) sections.push(current);
      current = { emoji: matched, title: line.substring(matched.length).trim(), lines: [] };
    } else if (current) {
      current.lines.push(line);
    } else if (line.trim()) {
      current = { emoji: '📜', title: '签文解读', lines: [line] };
    }
  }
  if (current && current.lines.length) sections.push(current);
  return sections;
}

function renderAIInterpretation(text) {
  var sections = parseSections(text);
  var interpEl = document.getElementById('aiInterp');
  var html = '';
  if (sections.length > 0) {
    for (var i = 0; i < sections.length; i++) {
      var sec = sections[i];
      html += '<div class="ai-card open">';
      html += '<div class="ai-card-head" onclick="var b=this.nextElementSibling;b.classList.toggle(\'open\');this.querySelector(\'.ai-card-arrow\').classList.toggle(\'open\')">';
      html += '<div class="ai-card-icon">'+(sec.emoji||'📜')+'</div>';
      html += '<div class="ai-card-title">'+(sec.title||'签文解读')+'</div>';
      html += '<div class="ai-card-arrow">⬇</div>';
      html += '</div>';
      html += '<div class="ai-card-body open"><div class="ai-card-text">'+sec.lines.join('\n')+'</div></div>';
      html += '</div>';
    }
  } else {
    html += '<div style="font-size:11px;color:var(--text-dim);letter-spacing:0.04em;line-height:1.9;white-space:pre-wrap">'+text+'</div>';
  }
  html += '<div style="height:80px"></div>';
  interpEl.innerHTML = html;
  interpEl.style.display = 'block';
  injectDisclaimer('aiInterp');
}

function resetQian() {
  shaken = false;
  lotNumber = null;
  var tube = document.getElementById('tubeWrap');
  tube.classList.remove('shaking', 'revealed');
  document.getElementById('shakeBtn').disabled = false;
  document.getElementById('shakeInstruction').textContent = '默念心中所求之事，\n诚心摇签';
  document.getElementById('resultDivider').style.display = 'none';
  document.getElementById('resultCardPreview').classList.remove('show');
  document.getElementById('submitWrap').style.display = 'none';
  document.getElementById('aiInterp').style.display = 'none';
  document.getElementById('aiInterp').innerHTML = '';
  document.getElementById('ctaWrap').classList.remove('show');
  document.getElementById('qaSection').style.display = 'none';
  document.getElementById('qaHistory').innerHTML = '';
  document.querySelector('.q-wrap').style.display = 'block';
  document.querySelector('.temple-tabs').style.display = 'flex';
  document.querySelector('.tube-section').style.display = 'flex';
}

function showToast(msg, type) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;max-width:360px;width:90%;padding:12px 16px;border-radius:8px;font-size:12px;letter-spacing:0.06em;text-align:center;font-family:Noto Serif SC,serif;cursor:pointer;';
  t.style.background = type === 'error' ? 'rgba(180,40,40,0.92)' : 'rgba(23,14,6,0.95)';
  t.style.border = type === 'error' ? '1px solid rgba(220,80,80,0.4)' : '1px solid rgba(201,168,76,0.2)';
  t.style.color = type === 'error' ? 'rgba(255,220,220,0.95)' : 'rgba(255,245,220,0.9)';
  t.textContent = msg;
  t.onclick = function(){ t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(function(){ t.remove(); },300); };
  document.body.appendChild(t);
  if (t._toastTimer) clearTimeout(t._toastTimer);
  t._toastTimer = setTimeout(function(){ t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(function(){ t.remove(); },300); }, 3000);
}

function createCheckout(btn) {
  btn.disabled = true;
  btn.textContent = '跳转支付…';
  fetch('/api/create-checkout', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      product: 'bazi_basic',
      token: localStorage.getItem('sy_token') || ''
    })
  }).then(function(r){ return r.json(); }).then(function(data){
    if(data.url) window.location.href = data.url;
    else { showToast('跳转失败，请重试', 'error'); btn.disabled = false; btn.textContent = '请大师详解此签 · $9.90'; }
  }).catch(function(){
    showToast('网络异常，请重试', 'error'); btn.disabled = false; btn.textContent = '请大师详解此签 · $9.90';
  });
}

function askQuestion() {
  var ctxId = document.getElementById('aiInterp').dataset ? document.getElementById('aiInterp').dataset.contextId : lastContextId;
  var q = document.getElementById('qaInput');
  if (!q.value.trim()) return;
  var h = document.getElementById('qaHistory');
  h.innerHTML += '<div class="qa-my-msg"><span>' + q.value.replace(/</g,'&lt;') + '</span></div>';
  var question = q.value;
  q.value = ''; q.disabled = true;
  var loadEl = document.createElement('div');
  loadEl.id = 'qaLoading';
  loadEl.style.cssText = 'text-align:left;margin-bottom:8px;font-size:10px;color:rgba(255,245,220,0.3);letter-spacing:0.06em';
  loadEl.textContent = '解签中…';
  h.appendChild(loadEl);
  fetch('/api/ask-followup', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({contextId: ctxId, question: question})
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    document.getElementById('qaLoading').remove();
    if (d.answer) {
      var answer = d.answer.replace(/</g,'&lt;').replace(/\\n/g,'<br>');
      h.innerHTML += '<div class="qa-ai-msg"><span>' + answer + '</span></div>';
    }
    q.disabled = false;
  })
  .catch(function(){
    document.getElementById('qaLoading').remove();
    h.innerHTML += '<div style="margin-bottom:10px;font-size:10px;color:rgba(200,80,80,0.6);letter-spacing:0.04em">网络错误，请稍后重试</div>';
    q.disabled = false;
  });
}

function injectLingqianScroll(lotNum, grade, poem) {
  // Guard: only inject once
  if (document.querySelector('.lingqian-scroll-injected')) return;
  if (!window.ReportViz && !lotNum) return;
  var tone = 'neutral';
  if (/上上|大吉|上吉/.test(grade)) tone = 'good';
  else if (/下下|大凶|凶/.test(grade)) tone = 'bad';

  var poemLines = Array.isArray(poem) ? poem.slice(0, 4) : ((poem || '').split('\n').filter(function(l){ return l.trim(); }).slice(0, 4));
  if (!poemLines.length) poemLines = ['天机难测玄机深', '诚心求签问神明', '此签吉凶已指引', '把握机缘听天命'];

  // Chapter cover — insert after resultDivider
  var coverHtml = '<div class="chapter-cover lingqian-scroll-injected">' +
    '<img class="chapter-cover-img" loading="lazy" src="/samples/caijing/art-spirit.png" alt="" onerror="this.style.display=\'none\'">' +
    '<div class="chapter-cover-veil"></div>' +
    '<div class="chapter-cover-body"><div class="chapter-cover-num">灵签</div>' +
    '<div class="chapter-cover-title">第' + lotNum + '签 · ' + (grade || '吉') + '</div>' +
    '<div class="chapter-cover-lead">观音灵签 · 求签问事 · 诚心自得</div></div></div>';

  var resultDiv = document.getElementById('resultDivider');
  if (resultDiv) {
    resultDiv.insertAdjacentHTML('afterend', coverHtml);
  }

  // Scroll card — prepend inside aiInterp
  var interp = document.getElementById('aiInterp');
  if (interp && window.ReportViz) {
    var scrollHtml = window.ReportViz.renderScrollCard({
      title: '灵签神谕',
      number: '第' + lotNum + '签',
      level: grade || '吉签',
      levelTone: tone,
      poem: poemLines
    });
    interp.insertAdjacentHTML('afterbegin', scrollHtml);
  }
}
</script>
<script>
var SECTION_ICONS={'📜':'rgba(201,130,10,0.3)','💰':'rgba(201,168,76,0.3)','💼':'rgba(74,143,160,0.3)','❤️':'rgba(201,96,106,0.3)','🌟':'rgba(201,168,76,0.3)','🔮':'rgba(141,103,191,0.3)','💪':'rgba(91,160,130,0.3)','🔥':'rgba(201,80,40,0.3)','💧':'rgba(74,159,212,0.3)','🌿':'rgba(91,160,100,0.3)','📈':'rgba(74,191,130,0.3)','💕':'rgba(201,96,140,0.3)','🤝':'rgba(160,120,80,0.3)','🎯':'rgba(201,130,40,0.3)','🏆':'rgba(201,168,76,0.3)','🎁':'rgba(201,100,76,0.3)','📝':'rgba(160,140,100,0.3)','💡':'rgba(201,180,60,0.3)','⚱':'rgba(140,100,80,0.3)','🔔':'rgba(201,168,76,0.3)','🗝':'rgba(160,140,100,0.3)','🪷':'rgba(201,140,180,0.3)','☯':'rgba(160,140,100,0.3)','🌙':'rgba(100,120,180,0.3)','🌙':'rgba(201,168,76,0.3)','🌊':'rgba(60,130,180,0.3)','⛰':'rgba(100,140,100,0.3)','🎋':'rgba(100,160,100,0.3)','🏮':'rgba(201,80,40,0.3)','🎐':'rgba(160,160,180,0.3)','⌛':'rgba(160,140,100,0.3)'};

/* renderUltimateReport */
function renderUltimateReport(text,containerId,opts){
  opts=opts||{};var secs=parseSections(text);var el=document.getElementById(containerId);if(!el)return;
  var c=opts.cardClass||'ai-section',h=opts.headClass||'ai-section-head',i=opts.iconClass||'ai-section-icon',t=opts.titleClass||'ai-section-title',a=opts.arrowClass||'ai-section-arrow',b=opts.bodyClass||'ai-section-body',x=opts.textClass||'ai-section-text',w=opts.wrapClass||'ai-section-wrap',db=opts.defaultBg||'rgba(201,130,10,0.2)';var im=opts.iconMap||SECTION_ICONS;
  var html='';if(secs.length>0){html+='<div class="'+w+'">';for(var j=0;j<secs.length;j++){var s=secs[j];var bg=im[s.emoji]||db;
    html+='<div class="'+c+' open"><div class="'+h+'" onclick="var b=this.nextElementSibling;b.classList.toggle(\'open\');this.querySelector(\'.'+a+'\').classList.toggle(\'open\')"><div class="'+i+'" style="background:'+bg+'">'+(s.emoji||'📜')+'</div><div class="'+t+'">'+(s.title||'')+'</div><div class="'+a+'">⬇</div></div><div class="'+b+' open"><div class="'+x+'">'+s.lines.join('\n')+'</div></div></div>';}
    html+='</div>';}else{html+='<div style="padding:0 16px;font-size:11px;color:var(--text-dim);letter-spacing:0.04em;line-height:1.9;white-space:pre-wrap">'+text+'</div>';}
  el.innerHTML=html;
}

/* Grade color helper */
function getGradeClass(g){if(g.indexOf('上上')>=0)return'qian-grade-excellent';if(g.indexOf('上签')>=0)return'qian-grade-good';if(g.indexOf('中签')>=0)return'qian-grade-mid';if(g.indexOf('下下')>=0)return'qian-grade-worst';if(g.indexOf('下签')>=0)return'qian-grade-bad';return'qian-grade-mid';}

/* Enhanced showPreview with qianDisplay */
function showPreview(){
  var lots=LOTS[currentTemple]||LOTS['观音'];var lot=lots[Math.floor(Math.random()*lots.length)];lotNumber=lot.n;
  lotGrade=lot.grade;lotPoem=lot.poem;
  document.getElementById('qianNumber').textContent='第 '+lot.n+' 签 · '+currentTemple;
  var qt=document.getElementById('qianType');qt.textContent=lot.grade;qt.className='qian-type '+getGradeClass(lot.grade);
  document.getElementById('qianPoem').textContent=lot.poem.join('　');
  document.getElementById('qianDisplay').classList.add('show');
  document.getElementById('resultDivider').style.display='flex';
  document.getElementById('submitWrap').style.display='block';
}

/* Flying stick */
function createFlyingStick(){var t=document.getElementById('tubeWrap');var s=document.createElement('div');s.className='flying-stick';t.appendChild(s);setTimeout(function(){if(s.parentNode)s.remove();},1000);}

/* Enhanced shakeTube with flying stick */
function shakeTube(){
  if(shaken)return;var tube=document.getElementById('tubeWrap'),btn=document.getElementById('shakeBtn');
  btn.disabled=true;tube.classList.add('shaking','shaking-hard');
  document.getElementById('shakeInstruction').textContent='一支灵签飞出…';
  setTimeout(function(){tube.classList.remove('shaking','shaking-hard');tube.classList.add('revealed');createFlyingStick();setTimeout(function(){showPreview();},900);},650);
  shaken=true;
}

/* Enhanced renderAIInterpretation with renderUltimateReport */
function renderAIInterpretation(text){
  renderUltimateReport(text,'aiInterp',{cardClass:'ai-card',headClass:'ai-card-head',iconClass:'ai-card-icon',titleClass:'ai-card-title',arrowClass:'ai-card-arrow',bodyClass:'ai-card-body',textClass:'ai-card-text',wrapClass:'ai-interp',defaultBg:'rgba(201,130,10,0.2)'});
  var el=document.getElementById('aiInterp');el.innerHTML+='<div style="height:80px"></div>';el.style.display='block';
  injectDisclaimer('aiInterp');
  if (lotNumber) injectLingqianScroll(lotNumber, lotGrade, lotPoem);
}

/* Enhanced resetQian */
function resetQian(){
  shaken=false;lotNumber=null;lotGrade=null;lotPoem=null;
  var injected=document.querySelector('.lingqian-scroll-injected');if(injected)injected.remove();
  var tube=document.getElementById('tubeWrap');tube.classList.remove('shaking','shaking-hard','revealed');
  document.getElementById('shakeBtn').disabled=false;
  document.getElementById('shakeInstruction').textContent='默念心中所求之事，\n诚心摇签';
  document.getElementById('resultDivider').style.display='none';
  document.getElementById('qianDisplay').classList.remove('show');
  document.getElementById('resultCardPreview').classList.remove('show');
  document.getElementById('submitWrap').style.display='none';
  document.getElementById('aiInterp').style.display='none';document.getElementById('aiInterp').innerHTML='';
  document.getElementById('ctaWrap').classList.remove('show');
  document.getElementById('qaSection').style.display='none';document.getElementById('qaHistory').innerHTML='';
  document.querySelector('.q-wrap').style.display='block';document.querySelector('.temple-tabs').style.display='flex';document.querySelector('.tube-section').style.display='flex';
  var fs=document.querySelector('.flying-stick');if(fs)fs.remove();
}

function toggleTheme(){var e=document.documentElement;var b=document.getElementById('themeToggle');e.classList.toggle('dark-mode');var l=e.classList.contains('dark-mode');if(b)b.textContent=l?'🌙':'🌙';localStorage.setItem('sy_theme',l?'dark':'dark');}

<script>
(function(){
  var bar = document.getElementById('readProgressBar');
  var wrap = document.getElementById('readProgressWrap');
  if(bar) {
    document.addEventListener('scroll', function(){
      var h = document.documentElement.scrollHeight - window.innerHeight;
      var pct = h > 0 ? (window.scrollY / h * 100) : 0;
      bar.style.width = Math.min(100, pct) + '%';
      if(pct > 2) wrap.classList.add('show'); else wrap.classList.remove('show');
    }, {passive:true});
  }
})();
</script>
