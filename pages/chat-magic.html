<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a0a2e">
<title>善缘 · AI命理</title>
<link rel="icon" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#0b0717;
  --deep:#130d24;
  --surface:#1e1535;
  --gold:#c9a84c;
  --gold-dim:#8a6e2f;
  --jade:#5bbfa0;
  --violet:#7c4dbd;
  --violet-light:#a07de0;
  --ink:#e8e0f0;
  --sub:#8a7fa0;
  --glow-gold:rgba(201,168,76,0.15);
  --glow-violet:rgba(124,77,189,0.2);
}
html,body{
  background:var(--void);
  font-family:'Noto Serif SC',serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  height:100%;
}
body{max-width:420px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* ── 星空背景 ── */
#cosmos{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d,3s) var(--delay,0s) infinite alternate}
@keyframes twinkle{0%{opacity:var(--min,0.1)}100%{opacity:var(--max,0.8)}}
.orb{position:absolute;border-radius:50%;filter:blur(60px);animation:drift var(--d,12s) var(--delay,0s) ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(var(--tx,20px),var(--ty,-20px))}}

/* ── 符文光晕 ── */
#runeRing{
  position:fixed;top:-120px;left:50%;transform:translateX(-50%);
  width:300px;height:300px;
  border:1px solid rgba(201,168,76,0.08);
  border-radius:50%;
  animation:slowSpin 40s linear infinite;
  pointer-events:none;z-index:0;
}
#runeRing::before{
  content:'☽ ✦ ☿ ✦ ♄ ✦ ☽ ✦ ♃ ✦ ☿ ✦';
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  font-size:8px;letter-spacing:14px;color:rgba(201,168,76,0.2);
  white-space:nowrap;width:300px;text-align:center;
}
@keyframes slowSpin{from{transform:translateX(-50%) rotate(0)}to{transform:translateX(-50%) rotate(360deg)}}

/* ── Header ── */
.header{
  position:relative;z-index:2;
  padding:16px 16px 12px;
  text-align:center;
  border-bottom:1px solid rgba(201,168,76,0.1);
  flex-shrink:0;
  background:linear-gradient(180deg,rgba(11,7,23,0.95) 0%,rgba(19,13,36,0.8) 100%);
  backdrop-filter:blur(12px);
}
.logo{
  font-family:'Cormorant Garamond',serif;
  font-size:15px;letter-spacing:0.5em;
  background:linear-gradient(135deg,var(--gold),#f0d98a,var(--gold-dim));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.logo-sub{font-size:9px;color:var(--sub);letter-spacing:0.2em;margin-top:4px;font-weight:300}
.back-btn{
  position:fixed;top:16px;left:14px;z-index:10;
  background:none;border:none;font-size:12px;color:var(--sub);cursor:pointer;
  font-family:'Noto Serif SC',serif;
}

/* ── 快捷问题 ── */
.quick-q{
  display:flex;gap:6px;padding:10px 14px 6px;
  flex-wrap:wrap;flex-shrink:0;position:relative;z-index:2;
  background:rgba(11,7,23,0.6);
}
.qq-btn{
  font-size:10px;padding:5px 11px;
  border:1px solid rgba(201,168,76,0.18);
  border-radius:20px;
  background:rgba(201,168,76,0.05);
  color:rgba(201,168,76,0.7);
  cursor:pointer;font-family:'Noto Serif SC',serif;
  transition:all 0.25s;letter-spacing:0.05em;
}
.qq-btn:hover{
  border-color:var(--gold);
  color:var(--gold);
  background:rgba(201,168,76,0.1);
  box-shadow:0 0 10px rgba(201,168,76,0.15);
}

/* ── 免费次数 ── */
#freeCounter{
  text-align:center;font-size:9px;color:var(--sub);
  letter-spacing:0.08em;padding:3px 16px 6px;
  flex-shrink:0;position:relative;z-index:2;
  background:rgba(11,7,23,0.6);
}

/* ── 聊天区 ── */
.chat-area{
  flex:1;overflow-y:auto;padding:14px 16px;
  display:flex;flex-direction:column;gap:14px;
  position:relative;z-index:2;
  scrollbar-width:thin;scrollbar-color:rgba(124,77,189,0.3) transparent;
}
.chat-area::-webkit-scrollbar{width:3px}
.chat-area::-webkit-scrollbar-thumb{background:rgba(124,77,189,0.3);border-radius:3px}

/* ── 消息气泡 ── */
.msg{max-width:87%;padding:11px 15px;font-size:13px;line-height:1.75;letter-spacing:0.03em;animation:appear 0.35s ease}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.msg.user{
  align-self:flex-end;
  background:linear-gradient(135deg,rgba(201,168,76,0.25),rgba(201,168,76,0.12));
  color:var(--ink);
  border:1px solid rgba(201,168,76,0.3);
  border-radius:14px 14px 2px 14px;
  box-shadow:0 0 20px rgba(201,168,76,0.08);
}
.msg.ai{
  align-self:flex-start;
  background:linear-gradient(135deg,rgba(30,21,53,0.95),rgba(19,13,36,0.9));
  color:var(--ink);
  border:1px solid rgba(124,77,189,0.25);
  border-radius:14px 14px 14px 2px;
  box-shadow:0 0 20px rgba(124,77,189,0.1),inset 0 1px 0 rgba(160,125,224,0.08);
}
.msg.ai::before{
  content:'✦';
  position:absolute;left:-16px;top:10px;
  font-size:7px;color:rgba(124,77,189,0.5);
}
.msg.ai{position:relative}
.role{font-size:8px;color:var(--violet-light);letter-spacing:0.15em;margin-bottom:5px;opacity:0.8}

/* ── 打字动画 ── */
.typing{display:flex;gap:4px;padding:4px 0;align-items:center}
.typing span{
  width:5px;height:5px;border-radius:50%;
  background:var(--violet-light);
  animation:pulse 1.4s infinite;
  box-shadow:0 0 6px var(--violet);
}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{transform:scale(0.6);opacity:0.4}50%{transform:scale(1);opacity:1}}

/* ── 输入栏 ── */
.input-bar{
  display:flex;gap:10px;padding:12px 16px;
  border-top:1px solid rgba(124,77,189,0.12);
  flex-shrink:0;
  background:rgba(11,7,23,0.85);
  backdrop-filter:blur(16px);
  position:relative;z-index:2;
}
.input-bar input{
  flex:1;padding:11px 16px;
  border:1px solid rgba(124,77,189,0.2);
  border-radius:24px;
  background:rgba(30,21,53,0.8);
  color:var(--ink);
  font-family:'Noto Serif SC',serif;font-size:13px;
  outline:none;letter-spacing:0.03em;
  transition:all 0.25s;
}
.input-bar input::placeholder{color:rgba(138,127,160,0.5)}
.input-bar input:focus{
  border-color:rgba(124,77,189,0.5);
  box-shadow:0 0 16px rgba(124,77,189,0.12);
}
.send-btn{
  width:42px;height:42px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--violet),#5a2d9c);
  color:#fff;font-size:16px;cursor:pointer;flex-shrink:0;
  transition:all 0.25s;
  box-shadow:0 0 16px rgba(124,77,189,0.3);
  display:flex;align-items:center;justify-content:center;
}
.send-btn:hover{box-shadow:0 0 24px rgba(124,77,189,0.5);transform:scale(1.05)}
.send-btn:disabled{opacity:0.35;transform:none;box-shadow:none}

/* ── 欢迎界面 ── */
.welcome{text-align:center;padding:40px 20px 20px;color:var(--sub)}
.oracle-eye{
  width:64px;height:64px;margin:0 auto 16px;
  border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#c9a84c,#7c4dbd,#0b0717);
  box-shadow:0 0 30px rgba(124,77,189,0.4),0 0 60px rgba(201,168,76,0.15);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;
  animation:breathe 4s ease-in-out infinite;
}
@keyframes breathe{0%,100%{box-shadow:0 0 30px rgba(124,77,189,0.4),0 0 60px rgba(201,168,76,0.15)}50%{box-shadow:0 0 50px rgba(124,77,189,0.6),0 0 80px rgba(201,168,76,0.25)}}
.welcome h2{font-size:15px;color:var(--ink);font-weight:400;margin-bottom:10px;letter-spacing:0.1em}
.welcome p{font-size:12px;line-height:1.9;color:var(--sub)}
.welcome-rune{font-size:10px;letter-spacing:0.3em;color:rgba(201,168,76,0.3);margin-top:12px}

/* ── 付费墙 ── */
.paywall-card{
  text-align:center;padding:22px 18px;margin:6px 0;
  background:linear-gradient(135deg,rgba(30,21,53,0.95),rgba(19,13,36,0.9));
  border:1px solid rgba(201,168,76,0.2);
  border-radius:16px;
  box-shadow:0 0 30px rgba(201,168,76,0.06);
}
</style>
</head>
<body>

<!-- 星空 -->
<div id="cosmos"></div>
<div id="runeRing"></div>

<button class="back-btn" onclick="history.back()">← 返回</button>

<div class="header">
  <div class="logo">善 缘 · AI 命理</div>
  <div class="logo-sub">洞见三千年东方命理 · 星图之间的你</div>
</div>

<div class="quick-q" id="quickQ">
  <button class="qq-btn" onclick="ask('我今年财运如何？')">☽ 今年财运</button>
  <button class="qq-btn" onclick="ask('和TA合适吗？')">♡ 缘分如何</button>
  <button class="qq-btn" onclick="ask('适合换工作吗？')">♄ 事业走向</button>
  <button class="qq-btn" onclick="ask('最近有小人吗？')">☿ 小人运势</button>
  <button class="qq-btn" onclick="ask('今年什么时候走好运？')">✦ 好运节点</button>
</div>

<div id="freeCounter" style="text-align:center;font-size:9px;color:var(--sub);letter-spacing:0.06em;padding:3px 16px 6px;flex-shrink:0;position:relative;z-index:2;background:rgba(11,7,23,0.6)">
  今日免费剩余：<span id="freeRemaining">5</span> 次 · 会员无限畅聊
</div>

<div class="chat-area" id="chatArea">
  <div class="msg ai" id="welcome">
    <div class="role">✦ AI 命理师 · AI生成</div>
    <div class="welcome">
      <div class="oracle-eye">☽</div>
      <h2>天机已开，等你来问</h2>
      <p>告诉我你的生辰八字<br>或直接问关于命运、缘分、运势的问题</p>
      <div class="welcome-rune">☽ ✦ ☿ ✦ ♄ ✦ ♃</div>
    </div>
  </div>
</div>

<div class="input-bar">
  <input id="input" placeholder="问天机，问缘分，问命运..." onkeydown="if(event.key==='Enter')send()" autofocus>
  <button class="send-btn" id="sendBtn" onclick="send()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
  </button>
</div>

<script>
/* ── 星空生成 ── */
(function(){
  var cosmos = document.getElementById('cosmos');
  for(var i=0;i<120;i++){
    var s = document.createElement('div');
    s.className = 'star';
    var sz = Math.random()*1.8+0.4;
    s.style.cssText = [
      'width:'+sz+'px','height:'+sz+'px',
      'left:'+Math.random()*100+'%','top:'+Math.random()*100+'%',
      '--d:'+(Math.random()*3+2)+'s',
      '--delay:'+Math.random()*4+'s',
      '--min:'+(Math.random()*0.1+0.05),
      '--max:'+(Math.random()*0.6+0.3)
    ].join(';');
    cosmos.appendChild(s);
  }
  var colors = ['rgba(124,77,189,0.12)','rgba(201,168,76,0.08)','rgba(91,191,160,0.07)'];
  for(var j=0;j<3;j++){
    var o = document.createElement('div');
    o.className='orb';
    o.style.cssText=[
      'width:'+(Math.random()*120+80)+'px',
      'height:'+(Math.random()*120+80)+'px',
      'background:'+colors[j],
      'left:'+Math.random()*80+'%',
      'top:'+Math.random()*80+'%',
      '--d:'+(Math.random()*8+10)+'s',
      '--delay:'+(Math.random()*5)+'s',
      '--tx:'+(Math.random()*40-20)+'px',
      '--ty:'+(Math.random()*40-20)+'px'
    ].join(';');
    cosmos.appendChild(o);
  }
})();

/* ── 聊天逻辑（原版保留） ── */
var msgs=[], sending=false, freeRemaining=5, paywallShown=false, isMember=false;
var _sessionId=localStorage.getItem('sy_session_id');
if(!_sessionId){
  _sessionId=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(36)+Math.random().toString(36).slice(2));
  localStorage.setItem('sy_session_id',_sessionId);
}
function loadQuota(){
  fetch('/api/chat/quota',{headers:{'Authorization':'Bearer '+(localStorage.getItem('sy_token')||'')}})
    .then(function(r){return r.json()})
    .then(function(d){
      if(d.isMember){isMember=true;freeRemaining=-1;updateQuotaUI();}
      else{freeRemaining=d.remaining||0;updateQuotaUI();}
    }).catch(function(){});
}
function updateQuotaUI(){
  var el=document.getElementById('freeRemaining');
  var wrap=document.getElementById('freeCounter');
  if(!el||!wrap)return;
  if(isMember){el.textContent='∞';wrap.style.color='var(--gold)';return;}
  el.textContent=freeRemaining;
  el.style.color=freeRemaining<=1?'#e8605a':'inherit';
}
loadQuota();
function updateFreeCounter(n){
  freeRemaining=(n!==undefined)?n:Math.max(0,freeRemaining-1);
  var el=document.getElementById('freeRemaining');
  if(el){el.textContent=freeRemaining;el.style.color=freeRemaining<=1?'#e8605a':'inherit';}
}
function addPaywallCard(){
  if(paywallShown)return;paywallShown=true;
  document.getElementById('input').disabled=true;
  document.getElementById('input').placeholder='开通会员后继续问天机';
  var area=document.getElementById('chatArea');
  var div=document.createElement('div');
  div.className='paywall-card';
  div.innerHTML='<div style="font-size:28px;margin-bottom:10px">✦</div>'+
    '<div style="font-size:14px;color:var(--gold);margin-bottom:6px;letter-spacing:0.12em">今日天机已尽</div>'+
    '<div style="font-size:11px;color:var(--sub);margin-bottom:16px;line-height:1.8">开通会员，星图为你长开<br>无限畅聊 · 完整命理报告解锁</div>'+
    '<a href="member.html" style="display:inline-block;padding:11px 32px;background:linear-gradient(135deg,var(--violet),#5a2d9c);border-radius:24px;color:#fff;font-size:13px;letter-spacing:0.12em;text-decoration:none;box-shadow:0 0 20px rgba(124,77,189,0.35)">开通会员 · $6.90/月</a>'+
    '<div style="margin-top:12px;font-size:10px;color:var(--sub)">或 <a href="bazi.html" style="color:var(--gold);text-decoration:none">免费排八字</a> 看命盘概览</div>';
  area.appendChild(div);
  area.scrollTop=area.scrollHeight;
}
function addMsg(text,role){
  var area=document.getElementById('chatArea');
  var div=document.createElement('div');
  div.className='msg '+role;
  if(role==='ai'){
    div.innerHTML='<div class="role">✦ AI 命理师 · AI生成</div>'+text.replace(/\n/g,'<br>');
  }else{
    div.textContent=text;
  }
  area.appendChild(div);
  area.scrollTop=area.scrollHeight;
}
function send(){
  var input=document.getElementById('input');
  var text=input.value.trim();
  if(!text||sending)return;
  ask(text);
}
function ask(text){
  if(!text)return;
  if(isMember){}
  else if(freeRemaining<=0){addPaywallCard();return;}
  sending=true;
  document.getElementById('sendBtn').disabled=true;
  addMsg(text,'user');
  document.getElementById('input').value='';
  var area=document.getElementById('chatArea');
  var typing=document.createElement('div');
  typing.className='msg ai';typing.id='typing';
  typing.innerHTML='<div class="role">✦ AI 命理师 · AI生成</div><div class="typing"><span></span><span></span><span></span></div>';
  area.appendChild(typing);
  area.scrollTop=area.scrollHeight;
  msgs.push({role:'user',content:text});
  var msgsToSend=msgs.length>10?msgs.slice(msgs.length-10):msgs;
  fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-Session-Id':_sessionId},
    body:JSON.stringify({messages:msgsToSend})
  }).then(function(r){return r.json()}).then(function(d){
    document.getElementById('typing').remove();
    sending=false;
    document.getElementById('sendBtn').disabled=false;
    if(d.limited){updateFreeCounter(0);addPaywallCard();}
    else if(d.answer){updateFreeCounter();addMsg(d.answer,'ai');msgs.push({role:'assistant',content:d.answer});}
    else{addMsg('星轨暂时模糊，请稍后再问','ai');}
  }).catch(function(){
    document.getElementById('typing').remove();
    sending=false;
    document.getElementById('sendBtn').disabled=false;
    addMsg('星轨暂时模糊，请稍后再问','ai');
  });
}
</script>
<script src="/assets/js/common.js"></script>
<script>if(window.SY&&SY.initMembership)SY.initMembership();</script>
</body>
</html>
