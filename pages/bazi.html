<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #faf8f5; --card: #ffffff; --mid: #f5f0e8;
  --gold: #c9a84c; --gold-light: #e8d08a; --gold-deep: #8a6420;
  --jade: #5bbfa0; --jade-mid: #8dd9bf;
  --amber: #c9820a; --amber-light: #e8b86a;
  --ink-text: rgba(40,35,30,0.92);
  --sub-text: rgba(80,70,55,0.72);
}
html, body { background: var(--bg); font-family: 'Noto Serif SC', serif; color: var(--ink-text); -webkit-font-smoothing: antialiased; }
body { max-width: 390px; margin: 0 auto; min-height: 100vh; overflow-y: auto; padding-bottom: 120px; }
body::before { content:''; position:fixed; inset:0; background:radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.1) 0%, transparent 50%); pointer-events:none; z-index:0; }

.back-btn { position:fixed; top:16px; left:16px; z-index:99; background:none; border:none; font-family:'Noto Serif SC',serif; font-size:13px; color:rgba(201,168,76,0.6); cursor:pointer; padding:4px 0; }

/* ── Input screen ── */
.input-screen { position:relative; z-index:1; }

.header { text-align:center; padding:44px 20px 20px; }
.header-title { font-size:20px; font-weight:400; letter-spacing:0.22em; margin-bottom:5px; }
.header-sub { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:11px; letter-spacing:0.26em; color:rgba(201,168,76,0.45); margin-bottom:14px; }
.gold-line { width:60px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:0 auto; }

.form-section { padding:14px 16px; }
.form-label { font-size:10px; letter-spacing:0.18em; color:rgba(201,168,76,0.5); margin-bottom:10px; }
.field-group { background:var(--card); border:1px solid rgba(201,168,76,0.12); border-radius:8px; overflow:hidden; }
.field-row { display:flex; align-items:center; padding:0 14px; border-bottom:1px solid rgba(201,168,76,0.08); }
.field-row:last-child { border-bottom:none; }
.field-label { font-size:11px; color:var(--sub-text); letter-spacing:0.06em; min-width:64px; flex-shrink:0; }
.field-input, .field-select { flex:1; background:none; border:none; outline:none; font-family:'Noto Serif SC',serif; font-size:13px; color:var(--ink-text); padding:12px 8px; letter-spacing:0.04em; -webkit-appearance:none; min-height:44px; }
.field-select option { background:var(--card); color:var(--ink-text); }
.field-input::placeholder { color:rgba(80,70,55,0.35); }

.gender-row { display:flex; gap:8px; padding:0 16px; margin-bottom:12px; }
.gender-opt { flex:1; background:var(--card); border:1px solid rgba(201,168,76,0.12); border-radius:6px; padding:10px 0; text-align:center; font-size:13px; color:var(--sub-text); letter-spacing:0.12em; cursor:pointer; transition:all 0.2s; }
.gender-opt.selected { border-color:var(--gold); background:rgba(201,168,76,0.12); color:var(--gold-light); }

.submit-section { padding:0 16px 16px; }
.btn-gen { width:100%; padding:15px 0; background:linear-gradient(135deg,var(--gold-deep),var(--gold),var(--gold-light),var(--gold)); border:none; border-radius:4px; color:rgba(14,10,4,0.95); font-family:'Noto Serif SC',serif; font-size:14px; font-weight:500; letter-spacing:0.22em; cursor:pointer; box-shadow:0 4px 20px rgba(201,168,76,0.3); }

/* ── Report screen ── */

/* Chart header */
.chart-header { padding:20px 16px 0; }
.name-row { display:flex; align-items:baseline; gap:12px; margin-bottom:4px; }
.report-name { font-size:22px; letter-spacing:0.14em; }
.report-tag { font-size:10px; color:var(--gold); border:1px solid rgba(201,168,76,0.3); padding:3px 8px; border-radius:2px; letter-spacing:0.1em; }
.birth-info { font-size:10px; color:var(--sub-text); letter-spacing:0.06em; margin-bottom:14px; }
.divider { height:1px; background:linear-gradient(90deg,transparent,rgba(201,168,76,0.2),transparent); margin:0 16px 14px; }

/* 四柱八字 grid */
.sizhu-label { font-size:10px; letter-spacing:0.2em; color:rgba(201,168,76,0.45); padding:0 16px; margin-bottom:8px; }
.sizhu-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:0 16px; margin-bottom:18px; }
.zhu { background:var(--card); border:1px solid rgba(201,168,76,0.12); border-radius:6px; text-align:center; padding:10px 4px; }
.zhu-label { font-size:8px; color:var(--sub-text); letter-spacing:0.1em; margin-bottom:6px; }
.zhu-tian { font-size:22px; color:var(--gold-light); font-weight:400; margin-bottom:3px; }
.zhu-di { font-size:18px; color:var(--jade-mid); font-weight:300; }
.zhu-elem { font-size:8px; color:var(--sub-text); margin-top:4px; }
.zhu.daymaster { border-color:rgba(201,168,76,0.4); background:rgba(201,168,76,0.06); }
.zhu.daymaster .zhu-tian { color:var(--gold); }

/* Elements bar */
.elements-section { padding:0 16px; margin-bottom:18px; }
.elements-title { font-size:10px; letter-spacing:0.2em; color:rgba(201,168,76,0.45); margin-bottom:10px; }
.elem-row { display:flex; align-items:center; gap:10px; margin-bottom:7px; }
.elem-name { font-size:12px; color:var(--ink-text); min-width:28px; text-align:center; }
.elem-bar-bg { flex:1; height:6px; background:rgba(201,168,76,0.1); border-radius:3px; overflow:hidden; }
.elem-fill { height:100%; border-radius:3px; }
.elem-score { font-size:10px; min-width:28px; text-align:right; }
.elem-status { font-size:9px; min-width:24px; text-align:right; }

/* Daymaster card */
.daymaster-card { margin:0 16px 14px; background:linear-gradient(135deg,rgba(201,168,76,0.06),rgba(201,168,76,0.02)); border:1px solid rgba(201,168,76,0.18); border-radius:10px; padding:14px; }
.dm-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.dm-glyph { width:40px; height:40px; border-radius:50%; background:radial-gradient(circle at 35% 30%, rgba(201,168,76,0.8), rgba(140,100,32,0.9) 60%, rgba(60,40,10,1)); display:flex; align-items:center; justify-content:center; font-size:20px; color:rgba(255,245,220,0.95); flex-shrink:0; }
.dm-info { flex:1; }
.dm-title { font-size:14px; letter-spacing:0.1em; margin-bottom:2px; }
.dm-sub { font-size:10px; color:rgba(201,168,76,0.6); letter-spacing:0.1em; }
.dm-desc { font-size:11px; color:var(--sub-text); letter-spacing:0.04em; line-height:1.9; }

/* Fortune sections */
.fortune-wrap { padding:0 16px; }
.fortune-sec { background:var(--card); border:1px solid rgba(201,168,76,0.1); border-radius:10px; margin-bottom:10px; overflow:hidden; }
.fortune-head { display:flex; align-items:center; padding:12px 14px; gap:10px; cursor:pointer; }
.fortune-icon { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; letter-spacing:0; flex-shrink:0; }
.fortune-title { font-size:13px; letter-spacing:0.08em; flex:1; }
.fortune-score { font-family:'Cormorant Garamond',serif; font-size:20px; }
.fortune-body { padding:0 14px 14px; display:none; }
.fortune-body.open { display:block; }
.fortune-text { font-size:11px; color:var(--sub-text); letter-spacing:0.04em; line-height:1.9; margin-bottom:10px; }
.fortune-tip { background:rgba(201,168,76,0.05); border:1px solid rgba(201,168,76,0.12); border-radius:6px; padding:8px 10px; font-size:10px; color:rgba(201,168,76,0.7); letter-spacing:0.06em; line-height:1.7; }

/* Dayun section */
.dayun-section { padding:0 16px; margin-bottom:14px; }
.dayun-head { font-size:10px; letter-spacing:0.2em; color:rgba(201,168,76,0.45); margin-bottom:10px; }
.dayun-scroll { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:4px; }
.dayun-scroll::-webkit-scrollbar { display:none; }
.dayun-item { flex-shrink:0; background:var(--card); border:1px solid rgba(201,168,76,0.1); border-radius:8px; padding:10px 12px; min-width:60px; text-align:center; cursor:pointer; transition:all 0.2s; }
.dayun-item.current { border-color:rgba(201,168,76,0.4); background:rgba(201,168,76,0.08); }
.dayun-age { font-size:9px; color:var(--sub-text); margin-bottom:4px; }
.dayun-gan { font-size:16px; color:var(--gold-light); font-weight:300; }
.dayun-zhi { font-size:14px; color:var(--jade-mid); font-weight:300; }
.dayun-trend { font-size:8px; margin-top:3px; }

/* Locked sections */
.locked-section { margin:0 16px 10px; background:var(--card); border:1px solid rgba(201,168,76,0.08); border-radius:10px; padding:16px 14px; display:flex; align-items:center; justify-content:space-between; }
.locked-left { flex:1; }
.locked-title { font-size:13px; color:rgba(60,52,40,0.72); letter-spacing:0.08em; margin-bottom:3px; }
.locked-hint { font-size:9px; color:rgba(80,70,55,0.5); letter-spacing:0.04em; }
.locked-icon { font-size:18px; color:rgba(201,168,76,0.25); }

/* Sticky CTA */
.sticky-cta { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:390px; z-index:10; background:rgba(14,10,4,0.95); backdrop-filter:blur(10px); border-top:1px solid rgba(201,168,76,0.15); padding:12px 16px 20px; }
.cta-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.cta-desc { font-size:11px; color:var(--sub-text); letter-spacing:0.04em; }
.cta-price { font-family:'Cormorant Garamond',serif; font-size:24px; color:var(--gold-light); }
.btn-unlock { width:100%; padding:13px 0; background:linear-gradient(135deg,var(--gold-deep),var(--gold),var(--gold-light),var(--gold)); border:none; border-radius:4px; color:rgba(14,10,4,0.95); font-family:'Noto Serif SC',serif; font-size:14px; font-weight:500; letter-spacing:0.2em; cursor:pointer; box-shadow:0 4px 16px rgba(201,168,76,0.3); }
.btn-member { width:100%; margin-top:8px; padding:11px 0; background:transparent; border:1px solid rgba(91,191,160,0.5); border-radius:4px; color:var(--jade); font-family:'Noto Serif SC',serif; font-size:12px; font-weight:400; letter-spacing:0.14em; cursor:pointer; }
.btn-member:active { transform:scale(0.97); }
.btn-member:disabled { opacity:0.5; cursor:default; }

/* Loading — 易经卦象旋转 + 逐字步骤 + 30秒提示 */
.loading-screen { position:relative; z-index:1; display:none; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px 40px; gap:24px; }
.loading-screen.show { display:flex; }

/* 卦象旋转容器 */
.hexagram-wrap { position:relative; width:90px; height:90px; display:flex; align-items:center; justify-content:center; }
.hexagram-ring { position:absolute; inset:0; border:1.5px solid rgba(201,168,76,0.25); border-radius:50%; animation:hex-spin 8s linear infinite; }
.hexagram-ring2 { position:absolute; inset:-8px; border:1px solid rgba(201,168,76,0.1); border-radius:50%; animation:hex-spin 12s linear infinite reverse; }
.hexagram { display:flex; flex-direction:column; gap:5px; align-items:center; animation:hex-spin 10s linear infinite; }
.hex-line { width:44px; height:2px; background:var(--gold); border-radius:1px; opacity:0.7; }
/* 阴爻（断线）— 第2/4/6条为断线，代表坤卦下三爻 */
.hex-line:nth-child(2),
.hex-line:nth-child(4),
.hex-line:nth-child(6) { width:36px; background:linear-gradient(to right,var(--gold) 0%,var(--gold) 40%,transparent 40%,transparent 60%,var(--gold) 60%,var(--gold) 100%); }

@keyframes hex-spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }

.load-text { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:14px; color:rgba(201,168,76,0.5); letter-spacing:0.18em; }

.load-steps { display:flex; flex-direction:column; gap:4px; margin-top:4px; align-items:center; }
.load-step { font-size:10px; color:rgba(80,70,55,0.45); letter-spacing:0.08em; min-height:1.4em; text-align:center; transition:color 0.3s; }
.load-step.active { color:var(--gold-light); }
.load-step.done { color:rgba(201,168,76,0.5); }

/* 不确定态 shimmer 进度条（无假承诺，随真实fetch收尾） */
.load-shimmer-bar { width:160px; height:3px; background:rgba(201,168,76,0.08); border-radius:2px; margin:12px auto 0; overflow:hidden; position:relative; }
.load-shimmer-bar-inner { position:absolute; top:0; left:0; height:100%; width:40%; border-radius:2px; background:linear-gradient(90deg,transparent,var(--gold),transparent); animation:shimmer-slide 1.3s ease-in-out infinite; }
@keyframes shimmer-slide { 0% { left:-40%; } 100% { left:100%; } }

/* Button active states */
.back-btn:active{transform:scale(0.97)}
.btn-gen:active{transform:scale(0.97)}
.btn-unlock:active{transform:scale(0.97)}

/* AI Report section cards */
.ai-section { background:var(--card); border:1px solid rgba(201,168,76,0.1); border-radius:10px; margin:0 16px 10px; overflow:hidden; }
.ai-section-head { display:flex; align-items:center; padding:12px 14px; gap:10px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.ai-section-icon { font-size:20px; flex-shrink:0; }
.ai-section-title { font-size:13px; letter-spacing:0.08em; flex:1; }
.ai-section-arrow { font-size:10px; color:rgba(201,168,76,0.5); transition:transform 0.25s; }
.ai-section-body { padding:0 14px 14px; display:none; }
.ai-section-body.open { display:block; }
.ai-section-text { font-size:11px; color:var(--sub-text); letter-spacing:0.04em; line-height:1.9; white-space:pre-wrap; }
.ai-plain-text { padding:0 16px 14px; font-size:11px; color:var(--sub-text); letter-spacing:0.04em; line-height:1.9; white-space:pre-wrap; }

/* QA section */
#qaSection { position:relative; z-index:1; display:none; padding:16px 0 80px; }
.qa-label { font-size:10px; color:rgba(201,168,76,0.5); letter-spacing:0.2em; margin-bottom:10px; padding:0 16px; }
.qa-row { display:flex; gap:8px; padding:0 16px; }
.qa-input { flex:1; background:var(--card); border:1px solid rgba(201,168,76,0.12); border-radius:6px; padding:10px 12px; font-family:Noto Serif SC,serif; font-size:12px; color:var(--ink-text); outline:none; }
.qa-input:focus { border-color:rgba(201,168,76,0.3); }
.qa-btn { padding:10px 16px; background:linear-gradient(135deg,var(--gold-deep),var(--gold)); border:none; border-radius:6px; color:#0e0a04; font-family:Noto Serif SC,serif; font-size:12px; letter-spacing:0.1em; cursor:pointer; white-space:nowrap; }
.qa-btn:active { transform:scale(0.97); }
.qa-btn:disabled { opacity:0.4; cursor:default; }
.qa-history { padding:12px 16px 0; }
.qa-my-msg { text-align:right; margin-bottom:8px; }
.qa-my-msg span { display:inline-block; background:rgba(201,168,76,0.1); border:1px solid rgba(201,168,76,0.15); border-radius:6px; padding:8px 12px; font-size:11px; color:var(--ink-text); }
.qa-ai-msg { margin-bottom:10px; }
.qa-ai-msg span { display:inline-block; background:var(--card); border:1px solid rgba(201,168,76,0.1); border-radius:6px; padding:8px 12px; font-size:11px; color:var(--sub-text); line-height:1.8; }

/* ✦ 升级动画层 ✦ */

/* 四柱逐个飞入 */
@keyframes zhuEnter{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:none}
}
.zhu{opacity:0;transform:translateY(20px);animation:zhuEnter 0.5s ease forwards}
.zhu:nth-child(1){animation-delay:0s}
.zhu:nth-child(2){animation-delay:0.15s}
.zhu:nth-child(3){animation-delay:0.3s}
.zhu:nth-child(4){animation-delay:0.45s}

/* 天干金色光泽 */
.zhu-tian{
  background:linear-gradient(90deg,#8a6420,#c9a84c,#e8d08a,#c9a84c,#8a6420);
  background-size:300% auto;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  animation:gold-shimmer 3s linear infinite;
}

/* 按钮金色光泽 */
.btn-gen,.btn-unlock{
  background:linear-gradient(90deg,#8a6420,#c9a84c,#e8d08a,#c9a84c,#8a6420) !important;
  background-size:300% auto !important;
  animation:gold-shimmer 3s linear infinite !important;
}

/* 通用入场动画 */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.page-enter-d1{animation-delay:.1s}.page-enter-d2{animation-delay:.15s}
.page-enter-d3{animation-delay:.2s}.page-enter-d4{animation-delay:.25s}
.page-enter-d5{animation-delay:.3s}.page-enter-d6{animation-delay:.35s}

/* 悬浮增强 */
.fortune-sec,.dayun-item,.locked-section,.daymaster-card,.header,.input-screen{transition:transform .3s ease,box-shadow .3s ease}
.fortune-sec:hover,.dayun-item:hover,.locked-section:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,0.3)}

/* 星尘背景 */
.stardust span{position:absolute;width:3px;height:3px;background:rgba(201,168,76,0.6);border-radius:50%;animation:twinkle 3s ease-in-out infinite;opacity:0;transition:opacity .5s}
.bottom-gradient{display:none}

/* ── Ultimate Report ── */
.ultimate-report{display:flex;flex-direction:column;gap:8px;padding:0 4px}
.ur-card{background:var(--card);border:1px solid rgba(201,168,76,0.14);border-radius:10px;overflow:hidden;animation:fadeUp 0.5s ease both;transition:all 0.3s}
.ur-card:hover{border-color:rgba(201,168,76,0.25);box-shadow:0 4px 20px rgba(201,168,76,0.08)}
.ur-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.ur-emoji{font-size:18px;width:28px;text-align:center;flex-shrink:0}
.ur-title{flex:1;font-size:13px;letter-spacing:0.08em;color:var(--ink-text)}
.ur-arrow{font-size:12px;color:rgba(201,168,76,0.3);transition:transform 0.3s;flex-shrink:0}
.ur-arrow.open{transform:rotate(180deg)}
.ur-body{display:none}
.ur-body.open{display:block}
.ur-text{font-size:12.5px;line-height:2;color:rgba(50,44,34,0.86);letter-spacing:0.04em;white-space:pre-wrap;padding:0 14px 14px}

/* ── Ring Charts ── */
.elem-ring-wrap{display:flex;justify-content:space-around;align-items:flex-start;padding:4px 0}
.elem-ring-item{display:flex;flex-direction:column;align-items:center;gap:4px;animation:fadeUp 0.6s ease both}
.elem-ring-item:nth-child(1){animation-delay:0s}
.elem-ring-item:nth-child(2){animation-delay:0.08s}
.elem-ring-item:nth-child(3){animation-delay:0.16s}
.elem-ring-item:nth-child(4){animation-delay:0.24s}
.elem-ring-item:nth-child(5){animation-delay:0.32s}
.score-rings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:4px 0}
.score-ring-item{display:flex;flex-direction:column;align-items:center;gap:4px;animation:fadeUp 0.6s ease both}
.score-ring-item:nth-child(1){animation-delay:0s}
.score-ring-item:nth-child(2){animation-delay:0.1s}
.score-ring-item:nth-child(3){animation-delay:0.2s}
.score-ring-item:nth-child(4){animation-delay:0.3s}

/* ── Text Highlights ── */
.hl-year{color:var(--gold-deep);font-weight:500}
.hl-score{color:#3a9678;font-weight:500}
.hl-money{color:var(--gold-deep);font-weight:500}

/* ── Overview section ── */
.overview-section{padding:0 16px;margin-bottom:4px}

/* ── Share buttons ── */
.share-bar{display:none;justify-content:center;gap:14px;padding:20px 16px 10px;position:relative;z-index:1}
.share-bar.show{display:flex}

<script>
function showToast(msg, type) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;max-width:360px;width:90%;padding:12px 16px;border-radius:8px;font-size:12px;letter-spacing:0.06em;text-align:center;font-family:Noto Serif SC,serif;cursor:pointer;';
  t.style.background = type === 'error' ? 'rgba(180,40,40,0.92)' : 'rgba(23,14,6,0.95)';
  t.style.border = type === 'error' ? '1px solid rgba(220,80,80,0.4)' : '1px solid rgba(201,168,76,0.2)';
  t.style.color = type === 'error' ? 'rgba(255,220,220,0.95)' : 'rgba(255,245,220,0.9)';
  t.textContent = msg;
  t.onclick = function(){ t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(function(){ t.remove(); },300); };
  document.body.appendChild(t);
  if (t._toastTimer) clearTimeout(t._toastTimer);
  t._toastTimer = setTimeout(function(){ t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(function(){ t.remove(); },300); }, 3000);
}
// Init year/day selectors
var ySel = document.getElementById('year');
for (var y = 2010; y >= 1920; y--) ySel.innerHTML += '<option value="'+y+'">'+y+'年</option>';
var dSel = document.getElementById('day');
for (var d = 1; d <= 31; d++) dSel.innerHTML += '<option value="'+d+'">'+d+'日</option>';

var gender = 'male';
var lastBaziInput = null;
var currentMode = 'truth';

function selectGender(el, g) {
  document.querySelectorAll('.gender-opt').forEach(function(o){ o.classList.remove('selected'); });
  el.classList.add('selected'); gender = g;
}

var TIAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var DI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var ELEM = {'甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水'};
var ELEM_DI = {'子':'水','丑':'土','寅':'木','卯':'木','辰':'土','巳':'火','午':'火','未':'土','申':'金','酉':'金','戌':'土','亥':'水'};
function getBazi(y, m, d, h) {
  var yearTian = TIAN[(y - 4) % 10];
  var yearDi = DI[(y - 4) % 12];
  var monthTian = TIAN[((y - 4) % 5 * 2 + m + 1) % 10];
  var monthDi = DI[(m + 1) % 12];
  var dayBase = (y * 365 + m * 30 + d + 40) % 60;
  var dayTian = TIAN[dayBase % 10];
  var dayDi = DI[dayBase % 12];
  var hourTian = TIAN[(dayBase % 5 * 2 + h) % 10];
  var hourDi = DI[h % 12];
  return [
    {label:'年柱', tian:yearTian, di:yearDi},
    {label:'月柱', tian:monthTian, di:monthDi},
    {label:'日柱', tian:dayTian, di:dayDi, isDay:true},
    {label:'时柱', tian:hourTian, di:hourDi}
  ];
}

function generateReport(btn) {
  btn = btn || (typeof event !== 'undefined' && event ? event.currentTarget : document.querySelector('.btn-gen'));
  var y = parseInt(document.getElementById('year').value);
  var m = parseInt(document.getElementById('month').value);
  var d = parseInt(document.getElementById('day').value);
  if (!y || !m || !d) { showToast('请填写完整的出生年月日', 'error'); return; }
  var consent = document.getElementById('consentCheck');
  if (consent && !consent.checked) { showToast('请先勾选同意隐私条款', 'error'); return; }
  // P1-1 防重复点烧token：禁用按钮 + 转圈
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn._label = btn.textContent; btn.textContent = '排盘中…'; }
  var h = parseInt(document.getElementById('hour').value);
  lastBaziInput = { year: y, month: m, day: d, hour: h, name: document.getElementById('name').value || '', gender: gender };

  document.getElementById('inputScreen').style.display = 'none';
  document.getElementById('loadingScreen').classList.add('show');
  runLoadingSteps();

  fetchBaziReport(lastBaziInput, currentMode).then(function(d){
    document.getElementById('loadingScreen').classList.remove('show');
    if (btn) { btn.disabled = false; btn.textContent = btn._label || '免费排盘 · 生成命理预览'; }
    if (d && d.reading) {
      showReport(d.reading, d.contextId, d.tier, d.locked);
    } else {
      document.getElementById('inputScreen').style.display = 'block';
      showToast('生成报告失败，请重试', 'error');
    }
  }).catch(function(){
    document.getElementById('loadingScreen').classList.remove('show');
    document.getElementById('inputScreen').style.display = 'block';
    if (btn) { btn.disabled = false; btn.textContent = btn._label || '免费排盘 · 生成命理预览'; }
    showToast('网络异常，请检查网络后重试', 'error');
  });
}

// 调用真后端 /api/bazi（未付费返回 basic，带 token 且已付费返回 full）
function fetchBaziReport(input, mode) {
  var token = localStorage.getItem('sy_token') || '';
  return fetch('/api/bazi', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: JSON.stringify({
      birthYear: input.year, birthMonth: input.month, birthDay: input.day, birthHour: input.hour,
      gender: input.gender, mode: mode || 'truth',
      question: '请全面分析我的命盘', token: token
    })
  }).then(function(r){ return r.json(); });
}

// 加载步骤动画（纯氛围，随真实 fetch resolve 收尾，不做假承诺）
function runLoadingSteps() {
  var steps = ['解析出生信息…','排定四柱八字…','分析日主五行…','推算大运流年…','细批命理报告…'];
  var stepsEl = document.getElementById('loadSteps');
  stepsEl.innerHTML = '';
  steps.forEach(function(s, i) {
    setTimeout(function(){
      if (!document.getElementById('loadingScreen').classList.contains('show')) return;
      var div = document.createElement('div');
      div.className = 'load-step active';
      stepsEl.appendChild(div);
      var chars = s.split(''), ci = 0;
      (function typeChar() {
        if (ci < chars.length) { div.textContent = '✧ ' + chars.slice(0, ci + 1).join(''); ci++; setTimeout(typeChar, 40); }
        else { div.className = 'load-step done'; div.textContent = '✓ ' + s; }
      })();
    }, i * 400);
  });
}

// 渲染后端返回的真报告；locked=true 时是免费 basic 预览，底部挂付费墙
function showReport(aiText, contextId, tier, locked) {

  document.getElementById('qaSection').style.display = 'block';
  document.getElementById('shareBar').classList.add('show');
  // 已存在的付费墙清理，避免付费回流后残留
  var oldCta = document.getElementById('stickyCta');
  if (oldCta) oldCta.remove();
  if (isLocked) {
    var cta = document.createElement('div');
    cta.className = 'sticky-cta';
    cta.id = 'stickyCta';
    cta.innerHTML =
      '<div class="cta-row"><div class="cta-desc">解锁完整命盘 · 流月大运 · 人生时间点</div></div>' +
      '<div style="background:rgba(201,168,76,0.05);border-radius:6px;padding:10px;margin-bottom:10px;font-size:9px">' +
      '<div style="display:grid;grid-template-columns:1fr 24px 24px;gap:1px;letter-spacing:0.04em">' +
      '<div style="padding:4px 0;color:var(--sub-text)"></div>' +
      '<div style="padding:4px 0;text-align:center;color:var(--sub-text)"><span style="font-size:10px">🔓</span><br>免费</div>' +
      '<div style="padding:4px 0;text-align:center;color:var(--gold-light)"><span style="font-size:10px">💎</span><br>完整</div>' +
      '<div style="padding:4px 0;border-top:1px solid rgba(201,168,76,0.08);color:var(--text)">四柱八字</div>' +
      '<div style="padding:4px 0;border-top:1px solid rgba(201,168,76,0.08);text-align:center">✅</div>' +
      '<div style="padding:4px 0;border-top:1px solid rgba(201,168,76,0.08);text-align:center">✅</div>' +
      '<div style="padding:4px 0;border-top:1px solid rgba(201,168,76,0.08)">五行能量分析</div>' +
      '<div style="padding:4px 0;border-top:1px solid rgba(201,168,76,0.08);text-align:center">✅</div>' +
      '<div style="padding:4px 0;border-top:1px solid rgba(201,168,76,0.08);text-align:center">✅</div>' +
      '<div style="padding:4px 0;border-top:1px solid rgba(201,168,76,0.08)">财运格局</div>' +
      '<div style="padding:4px 0;border-top:1px solid rgba(201,168,76,0.08);text-align:center">🔒</div>' +
      '<div style="padding:4px 0;border-top:1px solid rgba(201,168,76,0.08);text-align:center">✅</div>' +
      '<div style="padding:4px 0;border-top:1px solid rgba(201,168,76,0.08)">感情姻缘·事业</div>' +
      '<div style="padding:4px 0;border-top:1px solid rgba(201,168,76,0.08);text-align:center">🔒</div>' +
      '<div style="padding:4px 0;border-top:1px solid rgba(201,168,76,0.08);text-align:center">✅</div>' +
      '<div style="padding:4px 0;border-top:1px solid rgba(201,168,76,0.08)">8步大运详批</div>' +
      '<div style="padding:4px 0;border-top:1px solid rgba(201,168,76,0.08);text-align:center">🔒</div>' +

      '<button class="btn-unlock" onclick="createCheckout(this, \'full\', 19.9)">解锁完整命盘 · $19.90</button>' +

function injectDisclaimer(containerId) {
  var c = document.getElementById(containerId);
  if (!c || c.querySelector('.sy-disclaimer')) return;
  var d = document.createElement('div');
  d.className = 'sy-disclaimer';

  c.appendChild(d);
}

function createCheckout(btn, tier, price) {
  var label = btn.textContent;
  btn.disabled = true;
  btn.textContent = '跳转支付…';
  // P0-2① 支付跳转前把生日入参存起来，付费回流时读回自动重出报告
  if (lastBaziInput) {
    try { localStorage.setItem('sy_last_bazi', JSON.stringify(lastBaziInput)); } catch(e){}
  }
  fetch('/api/create-checkout', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      product: tier === 'member' ? 'member_monthly' : 'bazi_full',
      tier: tier,
      price: price,
      token: localStorage.getItem('sy_token') || '',
      // P0-2③ 支付成功后带 ?paid=1 回本页触发付费回流
      successUrl: location.origin + '/pages/bazi.html?paid=1'
    })
  }).then(function(r){ return r.json(); }).then(function(data){
    if(data.url) window.location.href = data.url;
    else { showToast('跳转失败，请重试', 'error'); btn.disabled = false; btn.textContent = label; }
  }).catch(function(){
    showToast('网络异常，请重试', 'error'); btn.disabled = false; btn.textContent = label;
  });
}

// P0-2② 付费回流：?paid=1 → 优先从后端拉最近输入 → localStorage兜底 → 带 token 重新拉取完整报告
function handlePaidReturn() {
  if (new URLSearchParams(location.search).get('paid') !== '1') return;
  try { history.replaceState(null, '', location.pathname); } catch(e){}

  function proceedWithPaidReport(input) {
    lastBaziInput = input;
    document.getElementById('inputScreen').style.display = 'none';
    document.getElementById('loadingScreen').classList.add('show');
    runLoadingSteps();
    fetchBaziReport(input, currentMode).then(function(d){
      document.getElementById('loadingScreen').classList.remove('show');
      if (d && d.reading) {
        showReport(d.reading, d.contextId, d.tier, d.locked);
        showToast('支付成功，已为您解锁完整命盘');
      } else {
        document.getElementById('inputScreen').style.display = 'block';
        showToast('报告加载失败，请重新排盘', 'error');
      }
    }).catch(function(){
      document.getElementById('loadingScreen').classList.remove('show');
      document.getElementById('inputScreen').style.display = 'block';
      showToast('网络异常，请重新排盘', 'error');
    });
  }

  // 先从localStorage尝试
  var saved = null;
  try { saved = JSON.parse(localStorage.getItem('sy_last_bazi') || 'null'); } catch(e){}
  if (saved && saved.year) { proceedWithPaidReport(saved); return; }

  // localStorage没有 → 从后端查最近输入（兜底）
  var token = localStorage.getItem('sy_token') || '';
  fetch('/api/bazi/recent-input', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({token: token})
  }).then(function(r){ return r.json(); }).then(function(d){
    if (d && d.input && d.input.birthYear) {
      proceedWithPaidReport(d.input);
    } else {
      showToast('支付成功！请重新排盘查看完整命盘');
    }
  }).catch(function(){
    showToast('支付成功！请重新排盘查看完整命盘');
  });
}
handlePaidReturn();

}

function parseAISections(text) {
  var known = ['📜','💰','💼','❤️','💪','🌟','🔮','📊','🎯','🔥','💧','🌿','🌊','⛰','⚔️','🛡️','✨','💫','⭐','☯','🌙','☀️','📈','💕','🤝','🎓','🏠','🚗','❄️','⚡','🌪','🏆','🎁','📝','💡','🕯','⚱','🧿','🔔','🗝','🪷','♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓'];
  var lines = text.split('\n');
  var sections = [];
  var current = null;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var matched = null;
    for (var k = 0; k < known.length; k++) {
      if (line.indexOf(known[k]) === 0) { matched = known[k]; break; }
    }
    if (matched) {
      if (current && current.lines.length) sections.push(current);
      current = { emoji: matched, title: line.substring(matched.length).trim(), lines: [] };
    } else if (current) {
      current.lines.push(line);
    } else if (line.trim()) {
      current = { emoji: '📜', title: '命理分析', lines: [line] };
    }
  }
  if (current && current.lines.length) sections.push(current);
  return sections;
}

function renderAITextReport(text, contextId, isLocked) {
  if (contextId) {
    document.getElementById('reportScreen').dataset.contextId = contextId;
  }
  var reportEl = document.getElementById('reportScreen');
  var html = '';

  // Header
  if (lastBaziInput) {
    var n = lastBaziInput.name || (lastBaziInput.gender === 'male' ? '先生' : '女士');
    html += '<div class="chart-header">';
    html += '<div class="name-row"><div class="report-name">'+n+'</div><div class="report-tag">AI 命理分析</div></div>';
    html += '<div class="divider"></div></div>';
  }

  // Parse bazi data from text
  var parsed = tryParseBaziData(text);

  // Fallback: compute from lastBaziInput if available
  if (parsed.hasDaymaster && lastBaziInput && !parsed.pillars) {
    var y = lastBaziInput.year, m = lastBaziInput.month, d = lastBaziInput.day, h = lastBaziInput.hour;
    var computed = getBazi(y, m, d, h);
    parsed.pillars = computed;
    if (!parsed.daymaster) parsed.daymaster = computed[2].tian;
    if (!parsed.elements) {
      var ec = {木:0,火:0,土:0,金:0,水:0};
      computed.forEach(function(z) {
        ec[ELEM[z.tian]] = (ec[ELEM[z.tian]]||0) + 2;
        ec[ELEM_DI[z.di]] = (ec[ELEM_DI[z.di]]||0) + 1;
      });
      var tot = 0; Object.keys(ec).forEach(function(k){tot += ec[k];});
      parsed.elements = {};
      Object.keys(ec).forEach(function(k){ parsed.elements[k] = Math.round(ec[k] / tot * 100); });
    }
  }

  // Build overview section (四柱八字 + 五行能量环 + 评分环)
  html += buildBaziOverview(parsed);

  // Mode toggle
  html += getModeToggleHTML();

  // Container for ultimate report
  html += '<div id="reportContent"></div>';
  // 底部留白：锁定态要给两颗按钮的付费墙让位
  html += '<div style="height:' + (isLocked ? '150px' : '40px') + '"></div>';

  reportEl.innerHTML = html;
  reportEl.classList.add('show');

  // Render ultimate report with collapsible section cards
  renderUltimateReport(text, 'reportContent');
  injectDisclaimer('reportScreen');
}

function getModeToggleHTML() {
  var truthActive = currentMode === 'truth' ? ' active' : '';
  var gentleActive = currentMode === 'gentle' ? ' active' : '';
  return '<div class="mode-toggle-wrap"><div class="mode-toggle-inner">' +
    '<button class="mode-opt' + truthActive + '" data-mode="truth" onclick="switchMode(this,\'truth\')">🔮 真相模式</button>' +
    '<button class="mode-opt' + gentleActive + '" data-mode="gentle" onclick="switchMode(this,\'gentle\')">💝 鼓励模式</button>' +
    '</div></div>';
}

function switchMode(el, mode) {
  if (!lastBaziInput) { showToast('请先生成命理报告', 'error'); return; }
  document.querySelectorAll('.mode-opt').forEach(function(o){ o.classList.remove('active'); });
  el.classList.add('active');
  currentMode = mode;
  var wraps = document.querySelectorAll('.mode-toggle-wrap');
  wraps.forEach(function(w){ w.classList.add('loading'); });
  showToast('正在生成' + (mode === 'gentle' ? '鼓励' : '真相') + '模式报告…');
  fetchBaziReport(lastBaziInput, mode)
  .then(function(d){
    wraps.forEach(function(w){ w.classList.remove('loading'); });
    if (d && d.reading) {
      showReport(d.reading, d.contextId, d.tier, d.locked);
    } else {
      showToast('生成报告失败，请重试', 'error');
    }
  })
  .catch(function(){
    wraps.forEach(function(w){ w.classList.remove('loading'); });
    showToast('网络错误，请稍后重试', 'error');
  });
}

// ── 全局五行颜色 ──
var ELEM_COLORS = {木:'#5bbfa0',火:'#e8603a',土:'#c9a84c',金:'#c0c8d0',水:'#4a9fd4'};

// ── 环形SVG生成 ──
function genRingSvg(pct, size, strokeW, color) {
  var r = (size - strokeW - 2) / 2;
  var circ = 2 * Math.PI * r;
  var offset = circ * (1 - Math.min(Math.max(pct||0,0),100) / 100);
  var c = size / 2;
  var fs = Math.round(size * 0.22);
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="'+strokeW+'"/>'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+strokeW+'" '+
    'stroke-dasharray="'+circ+'" stroke-dashoffset="'+offset+'" transform="rotate(-90 '+c+' '+c+')" stroke-linecap="round"/>'+
    '<text x="'+c+'" y="'+(c+fs*0.35)+'" text-anchor="middle" fill="rgba(50,44,34,0.9)" '+
    'font-size="'+fs+'" font-family="\'Cormorant Garamond\',serif">'+(pct||0)+'</text></svg>';
}

// ── 从文本解析八字数据 ──
function tryParseBaziData(text) {
  var result = { hasDaymaster: text.indexOf('日主') !== -1, pillars: null, elements: null, scores: null, daymaster: null };
  if (!result.hasDaymaster) return result;
  var pillarLabels = ['年柱','月柱','日柱','时柱'];
  var pillars = [];
  pillarLabels.forEach(function(lbl) {
    var m = text.match(new RegExp(lbl+'[：:][\\s]*([甲乙丙丁戊己庚辛壬癸])([子丑寅卯辰巳午未申酉戌亥])'));
    if (m && pillars.length < 4) pillars.push({label:lbl, tian:m[1], di:m[2]});
  });
  if (pillars.length === 4) result.pillars = pillars;
  var dm = text.match(/日主[：:][\\s]*([甲乙丙丁戊己庚辛壬癸])([木火土金水])/);
  if (dm) result.daymaster = dm[1];
  var elems = {};
  ['木','火','土','金','水'].forEach(function(el) {
    var m = text.match(new RegExp(el+'[\\s]*[：:]\\s*(\\d+)[\\s]*%'));
    if (m) elems[el] = parseInt(m[1]);
  });
  if (Object.keys(elems).length > 0) result.elements = elems;
  var scoreAliases = {'财运':'财','事业':'事','感情':'情','健康':'康','财富':'财','运势':'运'};
  var scores = {};
  Object.keys(scoreAliases).forEach(function(label) {
    var m = text.match(new RegExp(label+'[\\s]*[：:][\\s]*(\\d+)[\\s]*分'));
    if (m) scores[scoreAliases[label]] = parseInt(m[1]);
  });
  if (Object.keys(scores).length > 0) result.scores = scores;
  return result;
}

// ── 构建命盘概览HTML ──
function buildBaziOverview(parsed) {
  if (!parsed || !parsed.hasDaymaster) return '';
  var ec = ELEM_COLORS;
  var html = '';
  if (parsed.pillars) {
    html += '<div class="overview-section"><div class="sizhu-label" style="padding:0">命盘概览</div>';
    html += '<div class="sizhu-grid" style="padding:0">';
    parsed.pillars.forEach(function(z, i) {
      html += '<div class="zhu'+(z.label==='日柱'?' daymaster':'')+'" style="animation-delay:'+(i*0.1)+'s">';
      html += '<div class="zhu-label">'+z.label+'</div>';
      html += '<div class="zhu-tian">'+z.tian+'</div>';
      html += '<div class="zhu-di">'+z.di+'</div>';
      html += '<div class="zhu-elem">'+(ELEM[z.tian]||'')+'/'+(ELEM_DI[z.di]||'')+'</div></div>';
    });
    html += '</div></div>';
  }
  if (parsed.elements && Object.keys(parsed.elements).length > 0) {
    html += '<div style="margin:0 16px 10px;background:var(--card);border:1px solid rgba(201,168,76,.1);border-radius:10px;padding:14px">';
    html += '<div style="font-size:10px;letter-spacing:.2em;color:rgba(201,168,76,.5);margin-bottom:10px">五行能量</div>';
    html += '<div class="elem-ring-wrap">';
    ['木','火','土','金','水'].forEach(function(el, i) {
      if (parsed.elements[el] !== undefined) {
        html += '<div class="elem-ring-item" style="animation-delay:'+(i*0.08)+'s">'+
          genRingSvg(parsed.elements[el],52,4,ec[el]) +
          '<span style="font-size:9px;color:'+ec[el]+'">'+el+'</span></div>';
      }
    });
    html += '</div></div>';
  }
  if (parsed.scores && Object.keys(parsed.scores).length > 0) {
    var sc = {'财':'var(--gold)','事':'#4a9fd4','情':'#e8605a','康':'#5bbfa0','运':'var(--amber)'};
    var sl = {'财':'财运','事':'事业','情':'感情','康':'健康','运':'运势'};
    html += '<div style="margin:0 16px 12px;background:var(--card);border:1px solid rgba(201,168,76,.1);border-radius:10px;padding:14px">';
    html += '<div style="font-size:10px;letter-spacing:.2em;color:rgba(201,168,76,.5);margin-bottom:10px">命格评鉴</div>';
    html += '<div class="score-rings">';
    var idx = 0;
    Object.keys(parsed.scores).forEach(function(key) {
      html += '<div class="score-ring-item" style="animation-delay:'+(idx*0.1)+'s">'+
        genRingSvg(parsed.scores[key],56,4,sc[key]||'var(--gold)') +
        '<span style="font-size:9px;color:rgba(80,70,55,.6);letter-spacing:.1em">'+(sl[key]||key)+'</span></div>';
      idx++;
    });
    html += '</div></div>';
  }
  return html;
}

// ── 通用AI报告渲染器 v2.0 — 极致版 ──
function renderUltimateReport(text, containerId) {
  var container = document.getElementById(containerId);
  if (!container) return;
  var sections = [];
  var lines = text.split('\n');
  var currentSection = null;
  lines.forEach(function(line) {
    var trimmed = line.trim();
    if (!trimmed) return;
    var sectionMatch = trimmed.match(/^([\u{1F300}-\u{1FAFF}✦✧▪▸▶]\s*)(.*?)$/u) ||
                       trimmed.match(/^\*{2}([^*]+)\*{2}/) ||
                       trimmed.match(/^(\d+[\.、]\s*.*)$/);
    if (sectionMatch) {
      if (currentSection) sections.push(currentSection);
      currentSection = { emoji: sectionMatch[1]||'', title: (sectionMatch[2]||sectionMatch[1]||trimmed).trim(), content: [] };
    } else if (currentSection) { currentSection.content.push(trimmed); }
  });
  if (currentSection) sections.push(currentSection);
  if (sections.length===0) sections.push({emoji:'📜', title:'命理分析', content:lines});
  var html = '<div class="ultimate-report">';
  sections.forEach(function(sec, i) {
    var ct = sec.content.join('<br>');
    ct = ct.replace(/\*\*(.+?)\*\*/g,'<strong style="color:var(--gold-deep)">$1</strong>')
           .replace(/(\d{4})年/g,'<span class="hl-year">$1年</span>')
           .replace(/(\d+)分/g,'<span class="hl-score">$1分</span>')
           .replace(/\$(\d+\.?\d*)/g,'<span class="hl-money">$$$1</span>');
    html += '<div class="ur-card" style="animation-delay:'+(i*0.08)+'s">';
    html += '<div class="ur-head" onclick="var b=this.nextElementSibling;b.classList.toggle(\'open\');this.querySelector(\'.ur-arrow\').classList.toggle(\'open\')">';
    html += '<span class="ur-emoji">'+(sec.emoji||'📜')+'</span>';
    html += '<span class="ur-title">'+sec.title+'</span>';
    html += '<span class="ur-arrow open">▾</span></div>';
    html += '<div class="ur-body open"><div class="ur-text">'+ct+'</div></div></div>';
  });
  html += '</div>';
  container.innerHTML = html;
}
