<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>Runae · 合婚报告</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#060e0d;--card:#0f1b17;--card-2:#0b1512;
    --ink:#f0ebe0;--ink-2:rgba(240,235,224,.70);--ink-3:rgba(240,235,224,.42);
    --gold:#dcc082;--gold-soft:#e8d49c;--gold-wash:rgba(220,192,130,.14);
    --jade:#4fbfa0;--jade-deep:#0e2b24;--jade-soft:#7DDFC0;--jade-wash:rgba(79,191,160,.12);
    --rose:#B23A54;--rose-soft:#D46A80;--rose-wash:#F3E4E8;
    --line:rgba(240,235,224,.10);--line-2:rgba(240,235,224,.17);
    --sans:'Inter',-apple-system,system-ui,sans-serif;--serif:'Cormorant Garamond','Noto Serif SC',serif;
    --rl:20px;--r:14px;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--paper);font-family:var(--sans);color:var(--ink);line-height:1.5;font-feature-settings:"tnum";min-height:100vh}
  .wrap{max-width:430px;margin:0 auto;padding:0 24px 40px;min-height:100vh}
  svg.ic{width:18px;height:18px;stroke:var(--ink-3);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 12px}
  .nav-back{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-3);cursor:pointer;font-weight:500}
  .step{font-size:11px;color:var(--ink-3);letter-spacing:.1em;font-weight:600}

  /* ── hero ── */
  .rhero{text-align:center;padding:16px 4px 4px}
  .rhero .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .rhero .dv{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--rose-soft),transparent);margin:14px auto}
  .rhero h2{font-family:var(--serif);font-size:29px;font-weight:600;line-height:1.24;letter-spacing:-.01em;margin:0 6px}

  /* ── 双人合盘卡（对齐 report-v2 .chart，玫瑰金 rose 主题） ── */
  .chart{background:var(--jade-deep);border:1px solid rgba(195,160,90,.20);border-radius:var(--rl);padding:22px 20px;margin:18px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
  .duo{display:flex;align-items:center;justify-content:space-around;text-align:center}
  .duo .who{flex:1}
  .duo .who .c{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.15;background:linear-gradient(160deg,#E8C87E,#B98A3E);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.18))}
  .duo .who .l{font-size:11px;color:rgba(255,255,255,.62);margin-top:7px;letter-spacing:.08em}
  .duo .rel{flex:0 0 auto;padding:0 6px}
  .duo .rel .arw{font-size:20px;color:var(--gold-soft);line-height:1}
  .duo .rel .rl{font-size:10px;color:rgba(255,255,255,.7);margin-top:5px;letter-spacing:.06em}
  .score-line{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);text-align:center}
  .score-line .sc{font-family:var(--serif);font-size:34px;font-weight:700;color:#fff;line-height:1}
  .score-line .sc small{font-size:15px;opacity:.7}
  .score-line .sl{font-size:11px;color:rgba(255,255,255,.6);margin-top:4px;letter-spacing:.1em}

  /* ── read cards ── */
  .read{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);padding:20px;margin-bottom:14px}
  .read h3{font-size:14px;font-weight:600;margin-bottom:10px;letter-spacing:.01em}
  .read p{font-size:15px;color:var(--ink-2);line-height:1.75;white-space:pre-wrap}
  .read strong{color:var(--ink)}
  .blur{filter:blur(5px);opacity:.55;user-select:none;pointer-events:none}

  /* ── paywall ── */
  .wall{background:var(--card);border:1px solid var(--gold-soft);border-radius:var(--rl);padding:24px 20px;text-align:center;margin:16px 0;box-shadow:0 14px 34px -20px rgba(169,128,58,.30)}
  .wall h4{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:5px}
  .wall p{font-size:13px;color:var(--ink-2);margin-bottom:18px}
  .cta{width:100%;background:var(--jade-deep);color:#fff;border:none;border-radius:var(--r);padding:16px;font-size:15px;font-weight:600;font-family:var(--sans);cursor:pointer}
  .cta.gold{background:linear-gradient(135deg,var(--gold-soft),var(--gold))}
  .cta:disabled{opacity:.5;cursor:not-allowed}
  .wall .price{font-size:13px;color:var(--ink-3);margin-top:12px}
  .wall .price b{color:var(--gold);font-size:17px;font-weight:600}

  /* ── advisor ── */
  .adv{background:var(--jade-deep);border:1px solid rgba(195,160,90,.20);border-radius:var(--rl);padding:24px 21px;margin:22px 0 8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
  .adv .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);font-weight:600}
  .adv h4{font-family:var(--serif);font-size:21px;font-weight:600;margin:10px 0 4px;color:#fff}
  .adv ul{list-style:none;margin:14px 0}
  .adv li{font-size:13px;color:rgba(255,255,255,.86);padding:6px 0 6px 20px;position:relative}
  .adv li::before{content:'◆';position:absolute;left:2px;top:6px;color:var(--gold-soft);font-size:7px;line-height:2.1}
  .adv .sbtn{width:100%;background:transparent;color:var(--gold-soft);border:1px solid var(--gold-soft);border-radius:var(--r);padding:15px;font-size:14.5px;font-weight:600;margin-top:10px;cursor:pointer}

  /* ── skeleton / states ── */
  .skel{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);padding:20px;margin-bottom:14px}
  .skel .ln{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line),rgba(255,255,255,.06),var(--line));background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:11px}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .err{text-align:center;color:var(--ink-2);font-size:14px;padding:40px 10px}
  .loadmsg{text-align:center;color:var(--ink-3);font-size:13px;padding:12px 10px;letter-spacing:.04em}

  /* ── collect: 乙方精简表单（对齐 collect.html .field 样式） ── */
  .sec{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase;margin:26px 2px 13px}
  .self-chip{display:inline-flex;align-items:center;gap:8px;background:var(--rose-wash);border:1px solid rgba(178,58,84,.2);border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;color:var(--rose);margin-bottom:4px}
  .self-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--rose)}
  .field{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;align-items:center;gap:13px;margin-bottom:10px;transition:border-color .15s}
  .field:focus-within{border-color:var(--rose)}
  .field .fcol{flex:1;min-width:0}
  .field .lab{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.02em}
  .field input,.field select{border:none;background:transparent;font-family:var(--sans);font-size:15px;color:var(--ink);font-weight:500;width:100%;margin-top:2px;outline:none}
  .field input::placeholder{color:var(--ink-3);font-weight:400}
  .field .opt{font-size:11px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
  .g-toggle{display:flex;gap:2px;background:var(--rose-wash);border-radius:9px;padding:2px;flex-shrink:0}
  .g-toggle span{font-size:12px;padding:6px 13px;border-radius:7px;color:var(--ink-3);cursor:pointer;font-weight:500}
  .g-toggle span.on{background:#fff;color:var(--rose);font-weight:600}
  .go{width:100%;background:linear-gradient(135deg,var(--rose-soft),var(--rose));color:#fff;border:none;border-radius:var(--r);padding:17px;font-size:15.5px;font-weight:600;font-family:var(--sans);letter-spacing:.01em;box-shadow:0 14px 30px -16px rgba(178,58,84,.55);cursor:pointer;margin-top:24px}
  .go:disabled{opacity:.5;box-shadow:none;cursor:not-allowed}
  .consent{display:flex;align-items:flex-start;gap:9px;font-size:11.5px;color:var(--ink-2);line-height:1.6;margin-top:18px;cursor:pointer}
  .consent input{margin-top:2px;width:15px;height:15px;flex-shrink:0;accent-color:var(--rose)}
  .consent a{color:var(--rose)}
  .miss{background:var(--card-2);border:1px solid var(--gold-wash);border-radius:var(--r);padding:14px 16px;font-size:12.5px;color:var(--ink-2);line-height:1.7;margin-bottom:14px}
  .miss b{color:var(--ink)}
  .miss a{color:var(--jade);font-weight:600;cursor:pointer;text-decoration:none}
  .crossread{background:var(--card-2);border:1px solid var(--gold-soft);border-radius:var(--rl);padding:22px 20px;margin:22px 0 8px;box-shadow:0 10px 30px -22px rgba(169,128,58,.35)}
  .crossread .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .crossread h4{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--ink);margin:9px 0 6px;line-height:1.24}
  .crossread .fr{font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:16px}
  .crossread .cx{display:flex;align-items:flex-start;gap:13px;background:var(--card);border:1px solid var(--gold-wash);border-radius:var(--r);padding:14px 15px;margin-top:10px;cursor:pointer;transition:transform .12s,border-color .15s;text-align:left;width:100%;text-decoration:none}
  .crossread .cx:active{transform:scale(.98)}
  .crossread .cx:hover{border-color:var(--gold-soft)}
  .crossread .cx>svg{width:26px;height:26px;stroke:var(--gold);stroke-width:1.35;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;margin-top:1px}
  .crossread .cx .cn{font-size:14.5px;font-weight:600;color:var(--ink);font-family:var(--serif)}
  .crossread .cx .ch{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-top:3px}
  .crossread .cx .cg{margin-left:auto;align-self:center;stroke:var(--ink-3);width:16px;height:16px;flex-shrink:0}
</style>
</head>

  document.getElementById('hStep').textContent = T.step;
  document.getElementById('hHeroK').textContent = T.heroK;
  document.getElementById('hHeroH').textContent = T.heroH;
  document.getElementById('hSecA').textContent = T.secA;
  document.getElementById('hSecB').textContent = T.secB;
  document.getElementById('hLabDate').textContent = T.labDate;
  document.getElementById('hLabTime').textContent = T.labTime;
  document.getElementById('hOpt').textContent = T.opt;
  document.getElementById('hLabGender').textContent = T.labGender;
  document.querySelector('#gToggle span[data-g="male"]').textContent = T.male;
  document.querySelector('#gToggle span[data-g="female"]').textContent = T.female;
  document.getElementById('hConsent').innerHTML = esc(T.consent).replace(/&lt;b&gt;/g,'<b>').replace(/&lt;\/b&gt;/g,'</b>') + '<a href="'+_pl+'">'+T.privacy+'</a>' + (EN?').':'）。');
  document.getElementById('go').textContent = T.go;
  document.getElementById('hSub').textContent = T.sub;
  document.getElementById('loadmsg').textContent = T.loadmsg;

  /* -- Cross-Reading (交叉印证) component -- */
  var CROSS_CUR='hehun';
  var CROSS_META={
    bazi:{glyph:'<path d="M7 6v20M13 6v20M19 6v20M25 6v20"/>',n:{zh:'八字命理',en:'BaZi'},page:'report-v2.html',
      h:{zh:'从出生的四柱看你的先天格局，把此刻的困惑放回一整条人生曲线里。',en:'Your birth chart maps the whole arc — the deep pattern behind what you\'re feeling right now.'}},
    hehun:{glyph:'<circle cx="12" cy="16" r="7.5"/><circle cx="20" cy="16" r="7.5"/>',n:{zh:'合婚',en:'Compatibility'},page:'report-hehun.html',
      h:{zh:'把你和那个人放在一起看，两张盘怎么咬合、哪里需要磨合，一目了然。',en:'Put your chart next to your partner\'s and see exactly where you fit — and where you grind.'}},
    tarot:{glyph:'<rect x="6" y="8" width="12" height="18" rx="2" transform="rotate(-8 12 17)"/><rect x="15" y="6" width="12" height="18" rx="2" transform="rotate(8 21 15)"/>',n:{zh:'塔罗',en:'Tarot'},page:'report-tarot.html',
      h:{zh:'命盘讲长期趋势，塔罗回答此刻那件具体的事——该走还是该留。',en:'Your chart shows the long game; a card answers the one thing weighing on you today.'}},
    astro:{glyph:'<circle cx="16" cy="16" r="6"/><path d="M16 3v3M16 26v3M3 16h3M26 16h3M6.6 6.6l2.1 2.1M23.3 23.3l2.1 2.1M25.4 6.6l-2.1 2.1M8.7 23.3l-2.1 2.1"/>',n:{zh:'星座占星',en:'Astrology'},page:'report-astrology.html',
      h:{zh:'西方星盘从另一套坐标读你的性格与关系，常和东方命理指向同一个答案。',en:'Your Western chart reads the same you through a different lens — and usually lands on the same answer.'}},
    daily:{glyph:'<path d="M24 20a9 9 0 1 1-8-13 7 7 0 0 0 8 13z"/>',n:{zh:'每日运势',en:'Daily Horoscope'},page:'report-daily.html',
      h:{zh:'把大格局落到今天：今天宜什么、忌什么，天天更新。',en:'Brings the big picture down to today — what to lean into, what to avoid, refreshed daily.'}},
    palm:{glyph:'<path d="M11 26v-6M11 20V9a2 2 0 0 1 4 0v7M15 16V7a2 2 0 0 1 4 0v9M19 16v-5a2 2 0 0 1 4 0v9a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-3-5a2 2 0 0 1 3.4-2z"/>',n:{zh:'手相',en:'Palm Reading'},page:'report-palm.html',
      h:{zh:'掌纹记录的是后天的走势，和先天命盘对照着看，更立体。',en:'Your palm tracks how life is actually unfolding — a living counterpart to your birth chart.'}},
    face:{glyph:'<circle cx="16" cy="16" r="11"/><path d="M12 14h.01M20 14h.01M12 20a5 4 0 0 0 8 0"/>',n:{zh:'面相',en:'Face Reading'},page:'report-face.html',
      h:{zh:'五官里的运势密码，和命盘相互印证，看得见的另一层线索。',en:'The story in your features — a visible layer that echoes what your chart already hints at.'}}
  };
  var CROSS_DEFAULT={bazi:['astro','tarot'],hehun:['bazi','tarot'],tarot:['bazi','astro'],astro:['bazi','tarot'],daily:['bazi','astro'],palm:['bazi','face'],face:['bazi','palm']};
  function crossPick(){
    var asp=[];try{asp=(JSON.parse(localStorage.getItem('runae_profile')||'{}').aspects)||[];}catch(e){}
    var out=[];
    function add(list){list.forEach(function(m){if(m!==CROSS_CUR&&out.indexOf(m)<0)out.push(m);});}
    if(asp.indexOf('love')>-1) add(['hehun','tarot','astro']);
    if(asp.indexOf('career')>-1||asp.indexOf('wealth')>-1) add(['bazi','astro','tarot']);
    if(asp.indexOf('health')>-1) add(['bazi','palm','daily']);
    add(CROSS_DEFAULT[CROSS_CUR]||['bazi','astro']);
    return out.slice(0,3);
  }
  function crossReadHTML(){
    var picks=crossPick();if(!picks.length)return '';
    var L=EN?'en':'zh';
    var head=EN?'The same you, seen from every angle':'同一个你，多重印证';
    var fr=EN?'One profile. Every tradition weighs in — and they rarely disagree.':'一份命盘，多种传承一起看——它们很少各说各话。';
    var kk=EN?'Cross-Reading · Runae':'交叉印证 · Runae';
    var chev='<svg class="cg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
    var cards=picks.map(function(m){
      var meta=CROSS_META[m];if(!meta)return '';
      return '<a class="cx" href="'+meta.page+'?lang='+LANG+'"><svg viewBox="0 0 32 32">'+meta.glyph+'</svg>'
        +'<div><div class="cn">'+esc(meta.n[L])+'</div><div class="ch">'+esc(meta.h[L])+'</div></div>'+chev+'</a>';
    }).join('');
    return '<div class="crossread"><div class="k">'+esc(kk)+'</div><h4>'+esc(head)+'</h4><div class="fr">'+esc(fr)+'</div>'+cards+'</div>';
  }
  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // 渲染甲方信息卡（自动带入）；若无 profile 提示去补
  (function renderSelf(){
    var box = document.getElementById('selfBox');
    if (P.bdate) {
      var genderCn = selfGender === 'male' ? T.maleFull : T.femaleFull;
      box.innerHTML = '<div class="self-chip"><span class="dot"></span>' + T.youChip + esc(P.bdate) +
        (P.btime ? ' ' + esc(P.btime) : '') + ' · ' + genderCn + '</div>' +
        '<div style="font-size:11px;color:var(--ink-3);margin:6px 2px 0;letter-spacing:.03em">' + T.fromProfile + '<a href="collect.html?lang=' + LANG + '" style="color:var(--jade);font-weight:600;text-decoration:none">' + T.edit + '</a></div>';
    } else {
      box.innerHTML = '<div class="miss">' + T.missing + '<a href="collect.html?lang=' + LANG + '">' + T.missingLink + '</a></div>';
      document.getElementById('go').disabled = true;
    }
  })();

  // 乙方性别切换
  (function initGender(){
    var t = document.getElementById('gToggle');
    var hint = document.getElementById('genderHint');
    function paint(){
      t.querySelectorAll('span').forEach(function(s){ s.classList.toggle('on', s.dataset.g === bGender); });
      hint.textContent = (bGender === 'male' ? T.maleFull : T.femaleFull);
    }
    t.querySelectorAll('span').forEach(function(s){
      s.onclick = function(){ bGender = s.dataset.g; paint(); };
    });
    paint();
  })();

  // ── 解析生日字符串 → {y,m,d}；时间 → hour(0-23 或 '') ──
  function parseDate(str){
    var m = (str||'').split('-');
    return { y: +m[0], mo: +m[1], d: +m[2] };
  }
  function parseHour(str){
    if (!str) return '';
    var h = parseInt((str.split(':')[0]), 10);
    return isNaN(h) ? '' : h;
  }

  // ── 提交：组装双方 body，进入报告态并流式 ──
  document.getElementById('go').onclick = function(){
    if (!P.bdate){ alert(T.alertNeedSelf); return; }
    var bd = document.getElementById('bdate').value;
    if (!bd){ alert(T.alertNeedDate); return; }
    if (!document.getElementById('consent').checked){ alert(T.alertConsent); return; }

    var a = parseDate(P.bdate);
    var b = parseDate(bd);
    var curYear = new Date().getFullYear();
    if (a.y > curYear - 18 || b.y > curYear - 18){ alert(T.alertAge); return; }

    var body = {
      p1Year: a.y, p1Month: a.mo, p1Day: a.d, p1Hour: parseHour(P.btime), p1Gender: selfGender, p1Name: '',
      p2Year: b.y, p2Month: b.mo, p2Day: b.d, p2Hour: parseHour(document.getElementById('btime').value), p2Gender: bGender, p2Name: '',
      mode: 'marriage', lang: LANG
    };
    // 存一份供付费回流复用
    try { localStorage.setItem('sy_last_hehun', JSON.stringify(body)); } catch(e){}

    document.getElementById('collect').style.display = 'none';
    document.getElementById('report').style.display = 'block';
    window.scrollTo(0,0);
    streamHehun(body);
  };

  // ══════════ 报告渲染 ══════════
  var WX_ICON = {'木':'🌿','火':'🔥','土':'🪨','金':'⚪','水':'💧'};

  function relLabel(rel){
    return rel === '相生' ? T.relTable['相生'] :
           rel === '相克' ? T.relTable['相克'] :
                            T.relTable.def;
  }

  // 从 meta 事件渲染顶部合盘卡 + 分数（免费预览的确定性部分）
  function renderHero(meta, previewData){
    var hero = document.getElementById('hero');
    var a = previewData && previewData.a, b = previewData && previewData.b;
    var rel = (previewData && previewData.relationship) || '';
    var rInfo = relLabel(rel);
    var score = (previewData && previewData.baseScore) || meta.score || 0;
    score = Math.min(97, Math.max(42, Math.round(score)));

    var aCell = a ? ('<div class="c">' + esc(a.dayMaster) + '<br>' + (WX_ICON[a.element]||'') + '</div><div class="l">' + T.youL + esc(a.element) + T.elementSuf + '</div>')
                  : ('<div class="c">' + T.youCell + '</div><div class="l">' + T.partyA + '</div>');
    var bCell = b ? ('<div class="c">' + esc(b.dayMaster) + '<br>' + (WX_ICON[b.element]||'') + '</div><div class="l">' + T.taL + esc(b.element) + T.elementSuf + '</div>')
                  : ('<div class="c">' + T.taCell + '</div><div class="l">' + T.partyB + '</div>');

    hero.innerHTML =
      '<div class="rhero"><div class="k">' + T.heroK + '</div><div class="dv"></div><h2>' + T.heroTitle(rInfo ? rInfo.t : '') + '</h2></div>' +
      '<div class="chart">' +
        '<div class="duo">' +
          '<div class="who">' + aCell + '</div>' +
          '<div class="rel"><div class="arw">' + (rInfo?rInfo.arw:'⇌') + '</div><div class="rl">' + (rInfo?rInfo.tone:'') + '</div></div>' +
          '<div class="who">' + bCell + '</div>' +
        '</div>' +
        '<div class="score-line"><div class="sc">' + score + '<small>%</small></div><div class="sl">' + T.scoreLabel + '</div></div>' +
      '</div>';
  }

  // markdown → 分节 → .read 卡（对齐 report-v2 sections/md）
  var HEAD = /^\s*([【✅📜🌟💰❤💼🌿☀🔮⛰✨🙏💑💕💠🏠👶🤝📅🌙💌💬]|#{1,4}\s)/;
  function mdInline(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); }
  function toSections(text){
    var lines = text.split('\n'), secs = [], cur = null;
    lines.forEach(function(raw){
      var l = raw.replace(/\s+$/,''); if(!l.trim()) return;
      if (HEAD.test(l) && l.replace(/[#*\s]/g,'').length < 30){
        cur = { t: l.replace(/[#*【】]/g,'').trim(), b: [] }; secs.push(cur);
      } else { if(!cur){ cur={t:'',b:[]}; secs.push(cur);} cur.b.push(l.trim()); }
    });
    return secs.filter(function(s){ return s.t || s.b.length; });
  }
  function renderReading(text){
    var secs = toSections(text);
    if (!secs.length) return '<div class="read"><p>' + mdInline(text).replace(/\n/g,'<br>') + '</p></div>';
    return secs.map(function(s){
      return '<div class="read">' + (s.t ? '<h3>' + esc(s.t) + '</h3>' : '') + '<p>' + mdInline(s.b.join('\n')) + '</p></div>';
    }).join('');
  }

  var PAYWALL = T.paywall;
  var ADVISOR = T.advisor;
  var DISCLAIMER = T.disclaimer;

  function streamHehun(body){
    var bodyEl = document.getElementById('body');
    var meta = null;
    var accumulated = '';
    var started = false;
    var locked = true;

    // 先取确定性预览（真日主五行/关系/分数）以渲染顶部合盘卡
    var previewData = null;
    var pbody = { p1Year:body.p1Year, p1Month:body.p1Month, p1Day:body.p1Day, p1Gender:body.p1Gender,
                  p2Year:body.p2Year, p2Month:body.p2Month, p2Day:body.p2Day, p2Gender:body.p2Gender };
    if (body.p1Hour !== '' && body.p1Hour != null) pbody.p1Hour = body.p1Hour;
    if (body.p2Hour !== '' && body.p2Hour != null) pbody.p2Hour = body.p2Hour;
    fetch('/api/hehun/preview', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(pbody) })
      .then(function(r){ return r.json(); }).then(function(d){ if (d && d.ok){ previewData = d; if (meta) renderHero(meta, previewData); } }).catch(function(){});

    function paint(){
      var html = renderReading(accumulated);
      if (locked) html += PAYWALL;
      html += crossReadHTML() + ADVISOR + DISCLAIMER;
      bodyEl.innerHTML = html;
    }
    function fail(msg){
      bodyEl.innerHTML = '<div class="err">' + esc(msg) + '<br><br><button class="cta" style="max-width:220px;margin:14px auto 0" onclick="location.reload()">' + T.retry + '</button></div>';
    }

    var ctrl = new AbortController();
    var to = setTimeout(function(){ ctrl.abort(); }, 120000);

    fetch('/api/hehun/stream', {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
      signal: ctrl.signal, body: JSON.stringify(body)
    }).then(function(res){
      clearTimeout(to);
      if (!res.ok || !res.body){ fail(T.genFail); return; }
      var reader = res.body.getReader();
      var decoder = new TextDecoder('utf-8');
      var buf = '';
      function read(){
        reader.read().then(function(r){
          if (r.done){
            if (!started && !accumulated) fail(T.empty);
            return;
          }
          buf += decoder.decode(r.value, {stream:true});
          var lines = buf.split('\n'); buf = lines.pop();
          lines.forEach(function(line){
            if (!line.startsWith('data: ')) return;
            var raw = line.slice(6).trim();
            if (raw === '[DONE]') return;
            try {
              var ev = JSON.parse(raw);
              if (ev.type === 'meta'){
                meta = ev; locked = !!ev.locked;
                renderHero(meta, previewData);
              } else if (ev.type === 'chunk'){
                accumulated += ev.content;
                if (!started){ started = true; }
                paint();
              } else if (ev.type === 'done'){
                paint();
              } else if (ev.type === 'error'){
                if (!accumulated) fail(ev.message || T.genFail);
              }
            } catch(e){}
          });
          read();
        }).catch(function(){ if (!accumulated) fail(T.netErr); });
      }
      read();
    }).catch(function(){ clearTimeout(to); fail(T.netErr); });
  }

  // ── checkout（对齐 report-v2 goCheckout / hehun createCheckout） ──
  window.goCheckout = function(product){
    var btn = document.getElementById('unlockBtn');
    if (btn){ btn.disabled = true; btn.textContent = T.jumping; }
    fetch('/api/create-checkout', {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
      body: JSON.stringify({
        product: product,
        token: localStorage.getItem('sy_token') || '',
        successUrl: location.origin + '/pages/report-hehun.html?paid=1&lang=' + LANG,
        cancelUrl: location.href
      })
    }).then(function(r){ return r.json(); }).then(function(d){
      if (d.url){ location.href = d.url; return; }
      if (d.channel === 'cn'){ alert(T.ccn); }
      else { alert(T.cfail); }
      if (btn){ btn.disabled = false; btn.textContent = T.unlockBtn; }
    }).catch(function(){
      alert(T.cnet);
      if (btn){ btn.disabled = false; btn.textContent = T.unlockBtn; }
    });
  };

  // ── 付费回流：?paid=1 → 用上次的 body 重新流式（此时 tier 已升级，locked=false） ──
  (function handlePaidReturn(){
    if (location.search.indexOf('paid=1') < 0) return;
    var saved; try { saved = JSON.parse(localStorage.getItem('sy_last_hehun') || 'null'); } catch(e){}
    if (window.history.replaceState) window.history.replaceState({}, '', '/pages/report-hehun.html?lang=' + LANG);
    if (!saved || !saved.p1Year){ return; }
    document.getElementById('collect').style.display = 'none';
    document.getElementById('report').style.display = 'block';
    document.getElementById('loadmsg').textContent = T.unlockSuccess;
    streamHehun(saved);
  })();
</script>
