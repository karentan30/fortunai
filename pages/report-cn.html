<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  /* ── cosmos ── */
  --void-0:#08040f;--void:#0f0820;--indigo:#1a1035;--indigo-2:#231545;
  /* ── gold ── */
  --gold-hi:#f4e6b6;--gold:#dcc082;--gold-deep:#9a7530;--gold-soft:#e8d49c;
  --gold-line:rgba(220,192,130,.26);--gold-line-2:rgba(220,192,130,.48);--gold-glow:rgba(220,192,130,.4);
  /* ── violet accent ── */
  --star:#d3b6ff;--star-soft:#b492ea;--violet-line:rgba(176,120,255,.28);--violet-line-2:rgba(176,120,255,.48);--violet-glow:rgba(176,120,255,.5);
  /* ── text ── */
  --text-cream:#efeafa;--text-mute:#b0a6cf;--text-faint:#867ba6;--text-ghost:#5f5680;
  /* ── hair ── */
  --hair:rgba(206,190,255,.09);--hair-2:rgba(206,190,255,.16);
  --shadow-card:0 30px 60px -30px rgba(0,0,0,.9);--shadow-lift:0 20px 40px -24px rgba(0,0,0,.78);
  --serif:"Noto Serif SC",serif;--lat:"Cormorant Garamond",serif;
}

html,body{background:var(--void-0);font-family:var(--serif);color:var(--text-cream);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--gold);text-decoration:none}

/* ── cosmos background ── */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(135% 80% at 50% -8%,#3a2070 0%,#1e1040 38%,#100a20 72%,var(--void-0) 100%)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.7;
  background-image:radial-gradient(circle,rgba(236,223,255,.65) 1px,transparent 1px),radial-gradient(circle,rgba(244,230,182,.35) 1px,transparent 1px),radial-gradient(circle,rgba(211,182,255,.4) 1px,transparent 1px);
  background-size:130px 130px,90px 90px,170px 170px;background-position:18px 22px,65px 44px,32px 85px}

/* ── reading progress bar ── */
#rpProgressWrap{position:fixed;top:0;left:0;right:0;height:2px;z-index:1200;background:rgba(0,0,0,.3);opacity:0;transition:opacity .3s;pointer-events:none}
#rpProgressWrap.show{opacity:1}
#rpProgressBar{height:100%;width:0;background:linear-gradient(90deg,var(--star-soft),var(--gold-soft),var(--gold-hi));box-shadow:0 0 8px var(--violet-glow);transition:width .12s ease-out}
#rpChapterLabel{position:fixed;top:8px;right:12px;z-index:1200;font-family:var(--lat);font-size:11px;letter-spacing:.12em;color:var(--gold-soft);background:rgba(15,8,32,.82);border:1px solid var(--violet-line);border-radius:20px;padding:3px 11px;opacity:0;transition:opacity .3s;pointer-events:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#rpChapterLabel.show{opacity:1}

/* ── Loading ── */
#loading{position:fixed;inset:0;background:var(--void-0);z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px}
#loading.hidden{display:none}
.load-stars{font-size:40px;margin-bottom:20px;animation:spinGlyph 6s linear infinite;color:var(--gold)}
@keyframes spinGlyph{0%{transform:rotate(0deg) scale(1);opacity:.7}50%{transform:rotate(180deg) scale(1.12);opacity:1}100%{transform:rotate(360deg) scale(1);opacity:.7}}
.load-title{font-family:var(--serif);color:var(--gold-soft);font-size:20px;letter-spacing:.2em;margin-bottom:10px}
.load-sub{color:var(--text-mute);font-size:13px;margin-bottom:28px;max-width:260px;line-height:1.7}
.load-bar-wrap{width:220px;height:2px;background:rgba(220,192,130,.12);border-radius:2px;overflow:hidden;margin:0 auto}
.load-bar{height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold-hi));border-radius:2px;width:0;transition:width .4s ease}
.load-tip{color:var(--text-faint);font-size:11px;margin-top:14px;min-height:18px;font-family:var(--lat);letter-spacing:.08em}

/* ── Error ── */
#error-screen{display:none;position:fixed;inset:0;background:var(--void-0);z-index:8999;align-items:center;justify-content:center;text-align:center;padding:32px;flex-direction:column;gap:16px}
#error-screen.show{display:flex}
.err-title{color:#e87060;font-size:18px;font-family:var(--serif);letter-spacing:.08em}
.err-sub{color:var(--text-mute);font-size:14px;max-width:280px;line-height:1.8}
.err-btn{background:linear-gradient(135deg,var(--gold-deep),var(--gold),var(--gold-hi));color:#0a0814;border:none;padding:12px 32px;border-radius:50px;font-size:14px;font-weight:700;cursor:pointer;font-family:var(--serif);margin-top:8px;letter-spacing:.1em}

/* ── Report wrapper ── */
#report{display:none;position:relative;z-index:1;max-width:720px;margin:0 auto;padding:0 0 100px}
#report.show{display:block}

/* ── Cover hero ── */
.rp-cover{text-align:center;padding:72px 24px 56px;border-bottom:1px solid var(--gold-line);margin-bottom:0;position:relative}
.rp-cover::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:60%;height:1px;background:linear-gradient(90deg,transparent,var(--gold-line-2),transparent)}
.rp-brand{font-family:var(--lat);font-style:italic;font-size:12px;letter-spacing:.36em;color:rgba(220,192,130,.5);margin-bottom:28px}
.rp-name{font-family:var(--serif);font-size:42px;color:var(--text-cream);font-weight:300;letter-spacing:.18em;margin-bottom:10px;text-shadow:0 2px 24px rgba(176,120,255,.2)}
.rp-date{font-family:var(--lat);color:var(--text-faint);font-size:13px;letter-spacing:.16em;margin-bottom:32px}
.rp-divider{width:40px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-line-2),transparent);margin:0 auto 32px}

/* ── Four Pillars (四柱) grid ── */
.rp-pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;margin:0 auto 0}
.pillar{border-radius:14px;padding:12px 8px;text-align:center;background:linear-gradient(180deg,var(--indigo-2),var(--indigo));border:1px solid var(--hair-2);transition:border-color .2s}
.pillar .pl{display:block;font-size:9px;color:var(--text-ghost);letter-spacing:.14em;margin-bottom:8px;font-family:var(--lat)}
.pillar .pg{display:block;font-size:24px;color:var(--gold-soft);font-weight:400;line-height:1.1;margin-bottom:4px}
.pillar .pz{display:block;font-size:19px;color:var(--star-soft);font-weight:300;line-height:1.2}
.pillar.day{border-color:var(--gold-line-2);background:linear-gradient(180deg,rgba(220,192,130,.1),rgba(220,192,130,.03));box-shadow:0 0 20px rgba(220,192,130,.12)}
.pillar.day .pg{color:var(--gold-hi)}
.pillar.day .pl{color:var(--gold);opacity:.8}
/* legacy: .pillar.cell same as .pillar */
.pillar.cell{padding:10px 8px}

/* ── Overview: daymaster + wuxing + dayun ── */
.rp-overview{margin:0 auto;padding:24px 20px 0;max-width:640px}
.rp-daymaster{text-align:center;font-size:14px;color:var(--gold-soft);letter-spacing:.12em;margin-bottom:18px;font-family:var(--lat);font-style:italic}
.rp-daymaster b{color:var(--gold-hi);font-style:normal;font-family:var(--serif)}
.ov-title{font-size:10px;letter-spacing:.22em;color:var(--text-faint);text-transform:uppercase;margin-bottom:12px;font-family:var(--lat);display:flex;align-items:center;gap:10px}
.ov-title::before,.ov-title::after{content:'';flex:1;height:1px;background:var(--hair)}
.ov-wx{margin:0 auto 20px}
.wx-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.wx-k{width:18px;font-size:12px;color:var(--text-mute);flex-shrink:0;text-align:center}
.wx-bar{flex:1;height:5px;background:rgba(206,190,255,.08);border-radius:3px;overflow:hidden}
.wx-fill{display:block;height:100%;border-radius:3px;transition:width .7s ease}
.wx-v{width:28px;text-align:right;font-size:10px;color:var(--text-ghost);flex-shrink:0;font-family:var(--lat)}

/* dayun scroll */
.ov-dy-wrap{margin-bottom:8px}
.ov-dy{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;scrollbar-width:none}
.ov-dy::-webkit-scrollbar{display:none}
.dy-cell{flex:0 0 auto;min-width:56px;text-align:center;background:linear-gradient(180deg,var(--indigo-2),var(--indigo));border:1px solid var(--hair-2);border-radius:10px;padding:9px 6px;transition:border-color .2s}
.dy-cell.cur{border-color:var(--gold-line-2);background:linear-gradient(180deg,rgba(220,192,130,.1),rgba(220,192,130,.03));box-shadow:0 0 12px rgba(220,192,130,.1)}
.dy-gz{display:block;font-size:14px;color:var(--gold-soft);letter-spacing:.06em}
.dy-age{display:block;font-size:9px;color:var(--text-ghost);margin-top:3px;font-family:var(--lat)}
.dy-cell.fut{opacity:.38}

/* ── Chapter ToC ── */
.rp-toc{margin:32px 20px 0;padding:18px 18px 14px;background:var(--indigo);border:1px solid var(--hair);border-radius:20px;animation:rpFadeUp .5s ease both}
.rp-toc-title{font-size:10px;letter-spacing:.22em;color:var(--text-faint);margin-bottom:14px;font-family:var(--lat);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.rp-toc-title::after{content:'';flex:1;height:1px;background:var(--hair)}
.rp-toc-item{display:flex;align-items:baseline;gap:12px;padding:11px 2px;border-bottom:1px solid var(--hair);cursor:pointer;text-decoration:none;transition:opacity .2s;min-height:44px}
.rp-toc-item:last-child{border-bottom:none}
.rp-toc-item:active{opacity:.6}
.rp-toc-idx{font-family:var(--lat);font-size:14px;color:var(--gold);min-width:24px;text-align:center}
.rp-toc-label{flex:1;font-family:var(--serif);font-size:14px;letter-spacing:.02em;color:var(--text-cream)}
.rp-toc-arrow{font-size:12px;color:var(--text-ghost)}

/* ── Report Sections ── */
@keyframes rpFadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.rp-section{margin:16px 20px 0;animation:rpFadeUp .5s ease both}

/* chapter cover card */
.rp-chapter-cover{position:relative;border-radius:20px;overflow:hidden;min-height:110px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow-lift);background:var(--indigo-2);margin-bottom:0;border:1px solid var(--gold-line)}
.rp-chapter-body{padding:18px 20px 16px;position:relative}
.rp-chapter-num{font-family:var(--lat);font-size:11px;letter-spacing:.3em;color:var(--gold-soft);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.rp-chapter-num::before{content:'';width:18px;height:1px;background:linear-gradient(90deg,var(--gold-line-2),transparent);flex-shrink:0}
.rp-chapter-title{font-family:var(--serif);font-size:20px;font-weight:500;letter-spacing:.04em;color:var(--text-cream);line-height:1.3}

/* accordion card */
.rp-ur-card{background:linear-gradient(180deg,var(--indigo-2),var(--indigo));border:1px solid var(--hair-2);border-radius:18px;overflow:hidden;margin-top:10px;box-shadow:var(--shadow-lift)}
.rp-ur-head{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;user-select:none}
.rp-ur-emoji{font-size:15px;width:24px;text-align:center;flex-shrink:0;color:var(--gold-soft)}
.rp-ur-title{flex:1;font-family:var(--serif);font-size:15px;font-weight:500;letter-spacing:.04em;color:var(--text-cream)}
.rp-ur-arrow{font-size:12px;color:var(--text-faint);transition:transform .3s;flex-shrink:0}
.rp-ur-arrow.open{transform:rotate(180deg)}
.rp-ur-body{display:none;border-top:1px solid var(--hair)}
.rp-ur-body.open{display:block}
.rp-ur-text{font-size:14px;line-height:2;color:var(--text-mute);letter-spacing:.01em;padding:16px 20px 20px}
.rp-ur-text h3{font-family:var(--serif);font-size:14px;letter-spacing:.1em;color:var(--gold-soft);margin:16px 0 8px}
.rp-ur-text p{margin-bottom:12px}
.rp-ur-text p:last-child{margin-bottom:0}
.rp-ur-text strong,.rp-ur-text b{color:var(--gold-soft)}
.rp-ur-text ul,.rp-ur-text ol{padding-left:18px;margin-bottom:12px}
.rp-ur-text li{margin-bottom:5px}

/* pull quote */
.rp-pull-quote{position:relative;margin:18px 4px;padding:6px 4px 6px 20px}
.rp-pull-quote::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,transparent,var(--gold-line-2),transparent);border-radius:2px}
.rp-pull-quote-text{font-family:var(--serif);font-size:16px;font-weight:400;line-height:1.95;letter-spacing:.02em;color:var(--gold-soft)}

/* fallback: section used when parseSections renders direct h2 ── */
.rp-section h2{color:var(--gold-soft);font-size:17px;letter-spacing:.12em;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--gold-line);font-weight:500}
.rp-section h3{color:rgba(220,192,130,.8);font-size:14px;margin:20px 0 8px;letter-spacing:.06em}
.rp-section p{margin-bottom:12px;font-size:14px;line-height:2;color:var(--text-mute);letter-spacing:.01em}
.rp-section strong,.rp-section b{color:var(--gold-soft)}
.rp-section ul,.rp-section ol{padding-left:18px;margin-bottom:12px}
.rp-section li{margin-bottom:5px;font-size:14px;color:var(--text-mute);line-height:1.9}
.rp-section table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%;border-collapse:collapse;margin:14px 0;font-size:13px}
.rp-section th{background:rgba(220,192,130,.1);color:var(--gold);padding:8px 12px;border:1px solid var(--gold-line)}
.rp-section td{padding:8px 12px;border:1px solid var(--hair);color:var(--text-mute);vertical-align:top}

/* ── Paywall ── */
.locked-section{filter:blur(5px);pointer-events:none;user-select:none;max-height:180px;overflow:hidden;position:relative}
.paywall-gate{margin:20px 20px 0;background:linear-gradient(180deg,rgba(26,16,53,.96),rgba(15,8,32,.98));border:1px solid var(--gold-line-2);border-radius:22px;padding:36px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(220,192,130,.1)}
.gate-icon{font-size:32px;margin-bottom:10px;opacity:.85}
.gate-title{color:var(--gold-hi);font-size:18px;font-weight:500;letter-spacing:.14em;margin-bottom:6px;font-family:var(--serif)}
.gate-desc{color:var(--text-mute);font-size:12px;margin-bottom:18px;line-height:1.7}
.gate-price{color:var(--text-cream);font-size:26px;font-weight:300;margin-bottom:6px;font-family:var(--lat)}
.gate-orig{color:var(--text-ghost);font-size:13px;text-decoration:line-through;margin-left:6px}
.gate-btn{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--gold-deep),var(--gold),var(--gold-hi));color:#100820;border:none;padding:14px 0;border-radius:50px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.14em;font-family:var(--serif);display:block;width:100%;max-width:260px;margin:0 auto 12px;box-shadow:0 6px 22px rgba(220,192,130,.32)}
.gate-btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-18deg);animation:gateSheen 3.6s ease-in-out infinite}
@keyframes gateSheen{0%,72%{left:-60%}88%,100%{left:130%}}
.gate-btn:hover{transform:translateY(-1px);box-shadow:0 8px 30px rgba(220,192,130,.46)}
.gate-alt{color:rgba(220,192,130,.55);font-size:12px;cursor:pointer;text-decoration:underline;display:block}
#gate-items{text-align:left;margin:18px 0;display:grid;gap:12px}

/* ── Pay Modal ── */
#pay-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;align-items:center;justify-content:center}
#pay-modal.open{display:flex}
.pay-box{background:linear-gradient(180deg,var(--indigo-2),var(--indigo));border:1px solid var(--gold-line-2);border-radius:22px;padding:32px 24px;text-align:center;max-width:320px;width:90%;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.pay-title{color:var(--gold);font-size:15px;font-weight:500;letter-spacing:.14em;margin-bottom:4px;font-family:var(--serif)}
.pay-amount{color:var(--text-cream);font-size:32px;font-weight:300;margin-bottom:16px;font-family:var(--lat)}
#pay-qr-wrap{width:190px;height:190px;background:#fff;border-radius:12px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#pay-qr-img{width:100%;height:100%;object-fit:contain}
.pay-status{color:var(--text-mute);font-size:12px;margin-bottom:14px}
.pay-close{color:var(--text-ghost);font-size:12px;cursor:pointer;text-decoration:underline;display:inline-block;padding:12px 20px}

/* ── Share ── */
.share-bar{text-align:center;margin:32px 20px 20px;padding:24px;border:1px solid var(--gold-line);border-radius:18px;background:linear-gradient(180deg,rgba(26,16,53,.6),rgba(15,8,32,.8))}
.share-bar p{color:var(--text-mute);font-size:13px;margin-bottom:14px;line-height:1.7}
.share-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.share-btn{padding:10px 22px;border-radius:50px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:var(--serif);letter-spacing:.06em}
.share-wx{background:#07C160;color:#fff}
.share-copy{background:rgba(220,192,130,.12);color:var(--gold);border:1px solid var(--gold-line-2)}

/* ── Back ── */
.back-bar{text-align:center;padding:12px;color:var(--text-ghost);font-size:12px;margin:0 20px}
.back-bar a{color:rgba(220,192,130,.5)}

/* ── Disclaimer ── */
.rp-disclaimer{text-align:center;font-size:10px;color:var(--text-ghost);opacity:.7;padding:16px 24px calc(18px + env(safe-area-inset-bottom,0px));line-height:1.8;max-width:720px;margin:0 auto}

@media(max-width:600px){
  #report{padding:0 0 80px}
  .rp-name{font-size:30px;letter-spacing:.12em}
  .rp-section{margin:14px 14px 0}
  .paywall-gate{margin:16px 14px 0}
  .share-bar{margin:24px 14px 16px}
  .back-bar{margin:0 14px}
}
</style>
</head>
<body>

<!-- 阅读进度 -->
<div id="rpProgressWrap"><div id="rpProgressBar"></div></div>
<div id="rpChapterLabel"></div>

<!-- 加载中 -->
<div id="loading">
  <div class="load-stars">✦</div>
  <div class="load-title">正在为你排盘</div>
  <div class="load-sub" id="load-name-hint">天地合德，命理推演中...</div>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
  <div class="load-tip" id="load-tip">正在计算四柱八字...</div>
</div>

<!-- 错误页 -->
<div id="error-screen">
  <div class="err-title">⚠️ 排盘遇到了问题</div>
  <div class="err-sub" id="err-msg">AI命师暂时繁忙，请稍后再试</div>
  <button class="err-btn" onclick="history.back()">← 返回重新输入</button>
</div>

<!-- 报告 -->
<div id="report">
  <!-- 封面 hero -->
  <div class="rp-cover">
    <div class="rp-brand">善 缘 · 八 字 命 盘</div>
    <div class="rp-name" id="rp-name">—</div>
    <div class="rp-date" id="rp-date">—</div>
    <div class="rp-divider"></div>
    <div class="rp-pillars" id="rp-pillars"></div>
  </div>

  <!-- 免费内容 -->
  <div id="free-content"></div>

  <!-- 付款门 A -->
  <div id="gate-a" class="paywall-gate">
    <div class="gate-icon">🔮</div>

<script>

// ── 阅读进度条 ──
(function(){
  var prog = document.getElementById('rpProgressBar');
  var wrap = document.getElementById('rpProgressWrap');
  var chap = document.getElementById('rpChapterLabel');
  var _shown = false;
  function update(){
    var scrollTop = window.scrollY||document.documentElement.scrollTop;
    var docH = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight) - window.innerHeight;
    var pct = docH > 0 ? Math.min(100, (scrollTop/docH)*100) : 0;
    prog.style.width = pct+'%';
    if(!_shown && scrollTop > 80){ wrap.classList.add('show'); _shown=true; }
    // chapter label
    var sections = document.querySelectorAll('.rp-chapter-cover');
    var cur = null;
    sections.forEach(function(s){ if(s.getBoundingClientRect().top < 80) cur=s; });
    if(cur){
      var t = cur.querySelector('.rp-chapter-title');
      if(t){ chap.textContent = t.textContent; chap.classList.add('show'); }
    } else { chap.classList.remove('show'); }
  }
  window.addEventListener('scroll', update, {passive:true});
})();

// ── 进度条动画 ──
function startLoadAnim(){
  var bar = document.getElementById('load-bar');
  var tip = document.getElementById('load-tip');
  var targets = [15,35,55,75,90];
  var idx = 0;
  var iv = setInterval(function(){
    if(idx < targets.length){ _loadPct = targets[idx]; bar.style.width = _loadPct+'%'; tip.textContent = LOAD_TIPS[idx]||''; idx++; }
  }, 5000);
  return function(){ clearInterval(iv); bar.style.width='100%'; };
}

// ── Markdown 轻量渲染 ──
function md2html(text){
  if(!text) return '';
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/^#{1,3}\s+(.+)$/gm,'<h3>$1</h3>')
    .replace(/^[-*]\s+(.+)$/gm,'<li>$1</li>')
    .replace(/(<li>[\s\S]+?<\/li>)/g,'<ul>$1</ul>')
    .replace(/\n{2,}/g,'</p><p>')
    .replace(/^(?!<[hul])(.+)$/gm,'<p>$1</p>')
    .replace(/<p><\/p>/g,'')
    .replace(/(<\/ul>)\s*<ul>/g,'');
}

// ── 章节 emoji 列表 ──
var SECTION_EMOJIS = ['📜','🔥','🟤','💰','💕','💼','🏥','📅','🔮','✨','🌿','👨‍👩‍👧‍👦','🎯','📖','🔑','💌','🌟','⭐'];
var _sectionCount = 0;
var _tocItems = [];

// 渲染章节卡
function renderChapterCard(title, body, idx){
  var id = 'rp-sec-'+idx;
  var numLabel = (idx+1).toString().padStart(2,'0');
  _tocItems.push({num:numLabel, title:title, id:id});
  var bodyHtml = md2html(body);
  // accordion
  var html = '<div class="rp-section" id="'+id+'" data-chapter="'+encodeURIComponent(title)+'">';
  html += '<div class="rp-chapter-cover">';
  html += '<div class="rp-chapter-body">';
  html += '<div class="rp-chapter-num">'+numLabel+'</div>';
  html += '<div class="rp-chapter-title">'+escHtml(title)+'</div>';
  html += '</div></div>';
  html += '<div class="rp-ur-card">';
  html += '<div class="rp-ur-head" onclick="toggleSection(\''+id+'\')">';
  html += '<span class="rp-ur-emoji">✦</span>';
  html += '<span class="rp-ur-title">查看详情</span>';
  html += '<span class="rp-ur-arrow open" id="arr-'+id+'">▾</span>';
  html += '</div>';
  html += '<div class="rp-ur-body open" id="body-'+id+'">';
  html += '<div class="rp-ur-text">'+bodyHtml+'</div>';
  html += '</div>';
  html += '</div>';
  html += '</div>';
  return html;
}

function toggleSection(id){
  var body = document.getElementById('body-'+id);
  var arr = document.getElementById('arr-'+id);
  if(!body) return;
  var isOpen = body.classList.contains('open');
  body.classList.toggle('open',!isOpen);
  if(arr) arr.classList.toggle('open',!isOpen);
}

// ── 渲染免费/锁定内容 ──
function renderReport(reading, name, dateStr, timeStr, pillars){
  // 封面
  document.getElementById('rp-name').textContent = name || '命盘';
  document.getElementById('rp-date').textContent = dateStr + (timeStr ? ' · ' + timeStr : '');

  // 四柱可视化
  try{
    if(pillars){
      var _cols=[['年',pillars.year],['月',pillars.month],['日',pillars.day],['时',pillars.hour]];
      var _h=_cols.map(function(c,i){
        var p=c[1]||{}, isDay=(i===2), gan=p.gan||'', zhi=p.zhi||'';
        if(!gan && !zhi) return '';
        return '<div class="pillar cell'+(isDay?' day':'')+'"><span class="pl">'+c[0]+'柱'+(isDay?' · 日主':'')+'</span><span class="pg">'+(gan||'—')+'</span><span class="pz">'+(zhi||'—')+'</span></div>';
      }).join('');
      var _host=document.getElementById('rp-pillars'); if(_host && _h) _host.innerHTML=_h;
    }
  }catch(e){}

  // 命盘速览：五行能量条 + 大运时间轴
  try{
    if(pillars && (pillars.wuxing || (pillars.daYun && pillars.daYun.length))){
      var _ov='';
      if(pillars.dayMaster){ _ov+='<div class="rp-daymaster">日主 <b>'+pillars.dayMaster+(pillars.dayMasterElement||'')+'</b>'+(typeof pillars.isStrong==='boolean'?(' · '+(pillars.isStrong?'身强':'身弱')):'')+'</div>'; }
      if(pillars.wuxing){
        var _wx=pillars.wuxing, _wk=['木','火','土','金','水'];
        var _wmax=Math.max.apply(null,_wk.map(function(k){return +_wx[k]||0}).concat([1]));
        var _wc={'木':'#5bbfa0','火':'#c0472e','土':'#c8a35a','金':'#b0b3a3','水':'#3a5566'};
        _ov+='<div class="ov-title">五行能量</div><div class="ov-wx">'+_wk.map(function(k){
          var v=+_wx[k]||0, pct=(v===0)?0:Math.max(4,Math.round(v/_wmax*100));
          return '<div class="wx-row"><span class="wx-k">'+k+'</span><span class="wx-bar"><span class="wx-fill" style="width:'+pct+'%;background:'+_wc[k]+'"></span></span><span class="wx-v">'+(v?v.toFixed(1):'0')+'</span></div>';
        }).join('')+'</div>';
      }
      if(pillars.daYun && pillars.daYun.length){
        var _by=parseInt(dateStr,10)||0, _age=_by?(new Date().getFullYear()-_by):-1;
        _ov+='<div class="ov-title" style="margin-top:20px">大运</div><div class="ov-dy-wrap"><div class="ov-dy">'+pillars.daYun.map(function(d){
          var cur=(_age>=0 && _age>=d.startAge && _age<=d.endAge);
          var fut=(_age>=0 && d.startAge>_age);
          return '<div class="dy-cell'+(cur?' cur':'')+(fut?' fut':'')+'"><span class="dy-gz">'+(d.name||((d.gan||'')+(d.zhi||'')))+'</span><span class="dy-age">'+d.startAge+'-'+d.endAge+'岁</span></div>';
        }).join('')+'</div></div>';
      }
      if(_ov){
        var _wrap=document.createElement('div');
        _wrap.className='rp-overview';
        _wrap.innerHTML=_ov;
        var _hp=document.getElementById('rp-pillars');
        if(_hp && _hp.parentNode) _hp.parentNode.insertBefore(_wrap,_hp.nextSibling);
      }
    }
  }catch(e){}

  var parts = reading.split(/---LOCKED---/i);
  var freeText = parts[0] || '';
  var lockedText = parts[1] || '';

  // 解析免费区
  _sectionCount = 0;
  _tocItems = [];
  var freeHtml = parseSections(freeText);
  document.getElementById('free-content').innerHTML = freeHtml;

  // 插入 ToC（在 rp-overview 之后、free-content 之前）
  if(_tocItems.length > 1){
    var tocHtml = '<div class="rp-toc">';
    tocHtml += '<div class="rp-toc-title">报告目录</div>';
    _tocItems.forEach(function(it){
      tocHtml += '<a class="rp-toc-item" href="#'+it.id+'">'
        +'<span class="rp-toc-idx">'+it.num+'</span>'
        +'<span class="rp-toc-label">'+escHtml(it.title)+'</span>'
        +'<span class="rp-toc-arrow">›</span>'
        +'</a>';
    });
    tocHtml += '</div>';
    var freeEl = document.getElementById('free-content');
    freeEl.insertAdjacentHTML('beforebegin', tocHtml);
  }

  // 锁定区
  if(lockedText.trim()){
    var lockedHtml = parseSections(lockedText);
    document.getElementById('locked-content').innerHTML = lockedHtml;
    syInitUnlock();
  } else {
    document.getElementById('gate-a').style.display = 'none';
    document.getElementById('locked-content').style.display = 'none';
  }

  document.getElementById('share-bar').style.display = 'block';
}

function parseSections(text){
  if(!text) return '';
  var chunks = text.split(/\n(?=(?:\d+\.|[📜🔥🟤💰💕💼🏥📅🔮✨🌿👨‍👩‍👧‍👦🎯📖🔑💌🌟⭐]))/);
  return chunks.map(function(chunk){
    chunk = chunk.trim();
    if(!chunk) return '';
    var lines = chunk.split('\n');
    var title = lines[0];
    var body = lines.slice(1).join('\n').trim();
    var idx = _sectionCount++;
    return renderChapterCard(title, body, idx);
  }).join('');
}

function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── 支付 ──
// 🔴 0911: 付完钱必须**重新取一次正文**。老逻辑只是把 #locked-content 的模糊遮罩去掉，
//   而那里装的是服务端随免费预览一起下发的「章节标题预告单」——真实付费正文从没请求过。
//   服务端现已承认 report_unlock_a，重载一次即得全文。一次为限，防反复刷新。
function syReloadPaid(){
  try{
    if(sessionStorage.getItem('sy_reloaded_paid')==='1') return;
    sessionStorage.setItem('sy_reloaded_paid','1');
  }catch(e){}
  location.reload();
}

function syInitUnlock(){
  if(localStorage.getItem('sy_unlock_a')){
    document.getElementById('gate-a').style.display = 'none';
    document.getElementById('locked-content').classList.remove('locked-section');
  }
}

function syPay(tier, method){
  _syMethod = method || 'wechat';
  var ep = _syMethod==='alipay' ? SY_API+'/api/pay/alipay/qr' : SY_API+'/api/pay/wechat/create';
  document.getElementById('pay-title').textContent = _syMethod==='alipay' ? '支付宝扫码' : '微信扫码支付';
  document.getElementById('pay-amount').textContent = '¥19.9';
  document.getElementById('pay-status').textContent = '正在生成二维码...';
  document.getElementById('pay-qr-img').src = '';
  document.getElementById('pay-modal').classList.add('open');
  fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product:'report_unlock_a'})})
  .then(function(r){return r.json();}).then(function(d){
    if(!d.ok){document.getElementById('pay-status').textContent=d.error||'创建失败';return;}
    var qrData = d.code_url||d.qr_code||'';
    if(!qrData){document.getElementById('pay-status').textContent='获取二维码失败';return;}
    document.getElementById('pay-qr-img').src='https://api.qrserver.com/v1/create-qr-code/?size=190x190&data='+encodeURIComponent(qrData);
    document.getElementById('pay-status').textContent='请用'+(_syMethod==='alipay'?'支付宝':'微信')+'扫码 · 支付后自动解锁';
    syStartPoll(d.out_trade_no||d.order_no, tier);
  }).catch(function(){document.getElementById('pay-status').textContent='网络错误，请重试';});
}

function syStartPoll(orderNo, tier){
  if(_syPoll) clearInterval(_syPoll);
  var qep = _syMethod==='alipay' ? SY_API+'/api/pay/alipay/query' : SY_API+'/api/pay/wechat/query';
  _syPoll = setInterval(function(){
    fetch(qep+'?out_trade_no='+encodeURIComponent(orderNo))
    .then(function(r){return r.json();}).then(function(d){
      if(d.status==='paid'){
        clearInterval(_syPoll);
        localStorage.setItem('sy_unlock_'+tier, orderNo);
        syPayClose();
        syInitUnlock();
        var gate = document.getElementById('gate-'+tier);
        if(gate){gate.innerHTML='<p style="color:var(--gold);text-align:center;padding:16px">✅ 已解锁！</p>';setTimeout(function(){gate.style.display='none';syReloadPaid();},1000);}
      }
    }).catch(function(){});
  }, 3000);
}

function syPayClose(){
  document.getElementById('pay-modal').classList.remove('open');
  if(_syPoll) clearInterval(_syPoll);
}

  navigator.clipboard&&navigator.clipboard.writeText(url).then(function(){alert('链接已复制！');});
}

// ── 主流程 ──
(function main(){
  var name = qs('name');
  var dateStr = qs('date');
  var timeStr = qs('time');
  var city = qs('city');
  var gender = qs('gender') || 'female';

  if(!dateStr){
    document.getElementById('err-msg').textContent = '缺少出生日期，请返回重新输入';
    document.getElementById('error-screen').classList.add('show');
    document.getElementById('loading').classList.add('hidden');
    return;
  }

  if(name) document.getElementById('load-name-hint').textContent = '正在为 ' + name + ' 排盘...';

  var stopAnim = startLoadAnim();

  var parts = dateStr.split('-');
  var bYear  = parseInt(parts[0])||1990;
  var bMonth = parseInt(parts[1])||1;
  var bDay   = parseInt(parts[2])||1;
  var bHour  = timeStr ? (TIME_MAP[timeStr] !== undefined ? TIME_MAP[timeStr] : undefined) : undefined;

  var body = {birthYear:bYear, birthMonth:bMonth, birthDay:bDay, gender:gender, lang:'zh'};
  // 同源 cookie 通常已够，但没有 cookie 时这是唯一的身份兜底（服务端鉴权靠它认订单）
  try{ body.token = localStorage.getItem('sy_token') || ''; }catch(e){}
  if(bHour !== undefined) body.birthHour = bHour;
  if(name) body.name = name;
  if(city) body.city = city;

  fetch(SY_API+'/api/bazi', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  })
  .then(function(r){
    if(!r.ok) return r.json().then(function(e){throw new Error(e.error||'API错误');});
    return r.json();
  })
  .then(function(data){
    stopAnim();
    if(!data.reading){ throw new Error('报告生成失败，请重试'); }
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('report').classList.add('show');
    renderReport(data.reading, name, dateStr.replace(/-/g,'年').replace('-','月')+'日', timeStr, data.pillars);
  })
  .catch(function(err){
    stopAnim();
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('err-msg').textContent = err.message || 'AI暂时繁忙，请稍后重试';
    document.getElementById('error-screen').classList.add('show');
  });
})();
</script>
