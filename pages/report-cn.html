<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>善缘 · 你的八字命盘报告</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0618;color:#e8dcc8;font-family:'Noto Serif SC',serif;min-height:100vh;line-height:1.9}
a{color:#c9a84c;text-decoration:none}

/* ── Loading ── */
#loading{position:fixed;inset:0;background:#0d0618;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px}
#loading.hidden{display:none}
.load-stars{font-size:40px;margin-bottom:20px;animation:spin 4s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.load-title{color:#c9a84c;font-size:20px;letter-spacing:4px;margin-bottom:12px}
.load-sub{color:rgba(255,255,255,.45);font-size:13px;margin-bottom:32px;text-wrap:balance}
.load-bar-wrap{width:240px;height:4px;background:rgba(201,168,76,.15);border-radius:2px;overflow:hidden;margin:0 auto}
.load-bar{height:100%;background:linear-gradient(90deg,#b8922f,#e0c875);border-radius:2px;width:0;transition:width .4s ease}
.load-tip{color:rgba(255,255,255,.3);font-size:11px;margin-top:16px;min-height:18px}

/* ── Error ── */
#error-screen{display:none;position:fixed;inset:0;background:#0d0618;z-index:8999;align-items:center;justify-content:center;text-align:center;padding:32px;flex-direction:column;gap:16px}
#error-screen.show{display:flex}
.err-title{color:#e87060;font-size:18px}
.err-sub{color:rgba(255,255,255,.5);font-size:14px;max-width:280px;text-wrap:balance}
.err-btn{background:#c9a84c;color:#0a0814;border:none;padding:12px 32px;border-radius:50px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px}

/* ── Report ── */
#report{display:none;max-width:760px;margin:0 auto;padding:48px 28px 80px}
#report.show{display:block}

.rp-cover{text-align:center;padding:64px 0 48px;border-bottom:1px solid rgba(201,168,76,.2);margin-bottom:48px}
.rp-brand{font-size:11px;letter-spacing:6px;color:rgba(201,168,76,.5);margin-bottom:24px}
.rp-name{font-size:42px;color:#fff;font-weight:300;letter-spacing:8px;margin-bottom:12px}
.rp-date{color:rgba(255,255,255,.4);font-size:13px;letter-spacing:2px;margin-bottom:24px}
.rp-pillars{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.pillar{background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);border-radius:8px;padding:8px 16px;font-size:14px;color:rgba(201,168,76,.8);letter-spacing:2px}
.pillar.cell{padding:10px 16px;text-align:center;min-width:58px}
.pillar .pl{display:block;font-size:10px;color:#9a8a6a;letter-spacing:1px;margin-bottom:5px}
.pillar .pg{display:block;font-size:22px;color:#e8d8b0;line-height:1.15}
.pillar .pz{display:block;font-size:18px;color:#c9b890;line-height:1.2}
.pillar.day{border-color:#c9a84c;background:rgba(201,168,76,.16);box-shadow:0 0 18px rgba(201,168,76,.18)}
.pillar.day .pg{color:#e8d08a}
.rp-overview{margin:26px auto 0;max-width:360px}
.ov-title{font-size:12px;color:#c9a84c;letter-spacing:3px;margin-bottom:12px;text-align:center}
.ov-wx{margin:0 auto}
.wx-row{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.wx-k{width:16px;font-size:13px;color:#c9b890;flex-shrink:0}
.wx-bar{flex:1;height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
.wx-fill{display:block;height:100%;border-radius:4px;transition:width .6s ease}
.wx-v{width:28px;text-align:right;font-size:11px;color:#9a8a6a;flex-shrink:0}
.ov-dy{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.dy-cell{flex:0 0 auto;min-width:54px;text-align:center;background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.15);border-radius:8px;padding:8px 6px}
.dy-cell.cur{border-color:#c9a84c;background:rgba(201,168,76,.18)}
.dy-gz{display:block;font-size:14px;color:#e8d8b0;letter-spacing:1px}
.dy-age{display:block;font-size:9px;color:#9a8a6a;margin-top:3px}
.dy-cell.fut{opacity:.45}
.rp-daymaster{text-align:center;font-size:15px;color:#e8d08a;letter-spacing:2px;margin-bottom:16px}
.rp-daymaster b{color:#c9a84c;font-weight:500}

.rp-section{margin-top:56px}
.rp-section h2{color:#c9a84c;font-size:20px;letter-spacing:3px;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid rgba(201,168,76,.12)}
.rp-section p{margin-bottom:14px;font-size:15px;line-height:1.95;text-wrap:balance;word-break:keep-all}
.rp-section strong,.rp-section b{color:#e0c875}
.rp-section h3{color:rgba(201,168,76,.8);font-size:16px;margin:24px 0 10px;letter-spacing:1px}
.rp-section table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px}
.rp-section th{background:rgba(201,168,76,.12);color:#c9a84c;padding:8px 12px;text-align:center;border:1px solid rgba(201,168,76,.15)}
.rp-section td{padding:8px 12px;border:1px solid rgba(255,255,255,.06);text-align:center;vertical-align:top}
.rp-section ul,.rp-section ol{padding-left:20px;margin-bottom:14px}
.rp-section li{margin-bottom:6px;font-size:15px}

/* ── Paywall ── */
.locked-section{filter:blur(5px);pointer-events:none;user-select:none;max-height:200px;overflow:hidden;position:relative}
.paywall-gate{background:linear-gradient(135deg,#1a1030,#0d0618);border:1px solid rgba(201,168,76,.3);border-radius:16px;padding:36px 24px;text-align:center;margin:48px 0}
.gate-icon{font-size:36px;margin-bottom:10px}
.gate-title{color:#c9a84c;font-size:19px;font-weight:700;letter-spacing:3px;margin-bottom:8px}
.gate-desc{color:rgba(255,255,255,.55);font-size:13px;margin-bottom:20px;text-wrap:balance}
.gate-price{color:#fff;font-size:28px;font-weight:300;margin-bottom:6px}
.gate-orig{color:rgba(255,255,255,.3);font-size:13px;text-decoration:line-through;margin-left:6px}
.gate-btn{background:linear-gradient(135deg,#b8922f,#c9a84c,#e0c875);color:#0a0814;border:none;padding:14px 0;border-radius:50px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:2px;font-family:inherit;display:block;width:100%;max-width:260px;margin:0 auto 12px}
.gate-alt{color:rgba(201,168,76,.6);font-size:12px;cursor:pointer;text-decoration:underline;display:block}

/* ── Pay Modal ── */
#pay-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;align-items:center;justify-content:center}
#pay-modal.open{display:flex}
.pay-box{background:#1a1030;border:1px solid rgba(201,168,76,.35);border-radius:20px;padding:32px 24px;text-align:center;max-width:320px;width:90%}
.pay-title{color:#c9a84c;font-size:16px;font-weight:700;letter-spacing:2px;margin-bottom:4px}
.pay-amount{color:#fff;font-size:34px;font-weight:300;margin-bottom:16px}
#pay-qr-wrap{width:190px;height:190px;background:#fff;border-radius:12px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#pay-qr-img{width:100%;height:100%;object-fit:contain}
.pay-status{color:rgba(255,255,255,.5);font-size:12px;margin-bottom:14px}
.pay-close{color:rgba(255,255,255,.35);font-size:12px;cursor:pointer;text-decoration:underline}

/* ── Share ── */
.share-bar{text-align:center;margin:48px 0 24px;padding:24px;border:1px solid rgba(201,168,76,.1);border-radius:12px}
.share-bar p{color:rgba(255,255,255,.5);font-size:13px;margin-bottom:14px}
.share-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.share-btn{padding:10px 22px;border-radius:50px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit}
.share-wx{background:#07C160;color:#fff}
.share-copy{background:rgba(201,168,76,.15);color:#c9a84c;border:1px solid rgba(201,168,76,.3)}

/* ── Back to LP ── */
.back-bar{text-align:center;padding:12px;color:rgba(255,255,255,.3);font-size:12px}
.back-bar a{color:rgba(201,168,76,.5)}

@media(max-width:600px){
  #report{padding:32px 16px 80px}
  .rp-name{font-size:30px}
  .rp-section h2{font-size:17px}
}
</style>
</head>

<script>
// ── 工具 ──
var SY_API = (location.hostname==='localhost'||location.hostname==='127.0.0.1') ? 'http://localhost:3021' : '';
var TIME_MAP = {子时:0,丑时:1,寅时:3,卯时:5,辰时:7,巳时:9,午时:11,未时:13,申时:15,酉时:17,戌时:19,亥时:21};
var LOAD_TIPS = ['正在计算四柱八字...','分析五行能量分布...','推演大运流年...','整理命理师注解...','生成专属报告...'];
var _tipIdx = 0, _loadPct = 0, _syPoll = null, _syMethod = 'wechat';

function qs(name){ var u=new URLSearchParams(location.search); return (u.get(name)||'').trim(); }

// ── 个性化付款门 ──
function renderGate(){
  var name = qs('name') || '你';
  var date = qs('date'); // 1991-10-05
  var gender = qs('gender');
  var year = date ? parseInt(date.split('-')[0]) : 1990;
  var curYear = new Date().getFullYear();
  var age = curYear - year;

  // 根据出生年推算生肖和天干
  var SHENGXIAO = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
  var sx = SHENGXIAO[(year - 4) % 12];

  // 性别相关词
  var isF = gender === 'female';
  var pref = isF ? '她的' : '他的';

  // 个性化标题
  document.getElementById('gate-title').textContent = name + ' · 专属深度命盘';

  // 5条个性化内容
  var items = [
    {
      icon: '💰',
      title: name + '的财运格局',
      desc: curYear + '年财运是涨还是跌？' + (age < 30 ? '年轻' + sx + '命' : sx + '命' + age + '岁') + '的偏财时机与最应避开的破财月份'
    },
    {
      icon: '💕',
      title: isF ? '她的姻缘密码' : '他的桃花运势',
      desc: isF
        ? (age < 30 ? '感情空窗还是遇见对的人？' : '婚姻运何时开花？') + '命中另一半的生肖与方位，' + curYear + '年最旺桃花的季节'
        : (age < 30 ? '何时遇见她？' : '感情何时稳定？') + '命中另一半的特征，' + curYear + '年感情破冰时机'
    },
    {
      icon: '🏆',
      title: name + '适合什么事业？',
      desc: sx + '命' + (isF ? '女' : '男') + '命中的财禄方向——打工升职还是自己创业更旺？' + curYear + '年的贵人在哪个方位出现'
    },
    {
      icon: '🌿',
      title: '命中健康预警',
      desc: '生于' + (date ? date.replace(/-/g, '年').replace('年', '年').split('年').slice(0,2).join('年') + '月' : '此日') + '需重点护养的脏腑，' + curYear + '年容易出现的健康低谷与调养时机'
    },
    {
      icon: '🌊',
      title: '未来十年大运走势',
      desc: age + '岁正处于哪段大运？接下来几年是爬坡积累还是收获期，哪一年是命运的关键转折点'
    }
  ];

  var html = items.map(function(it){
    return '<div style="display:flex;gap:12px;align-items:flex-start">'
      + '<span style="font-size:18px;flex-shrink:0">' + it.icon + '</span>'
      + '<div><div style="font-size:13px;font-weight:600;color:#c9a84c;letter-spacing:0.05em">' + it.title + '</div>'
      + '<div style="font-size:12px;color:rgba(220,210,190,0.78);margin-top:3px;line-height:1.65">' + it.desc + '</div></div>'
      + '</div>';
  }).join('');

  var el = document.getElementById('gate-items');
  if(el) el.innerHTML = html;
}
document.addEventListener('DOMContentLoaded', renderGate);

// ── 进度条动画 ──
function startLoadAnim(){
  var bar = document.getElementById('load-bar');
  var tip = document.getElementById('load-tip');
  var targets = [15,35,55,75,90];
  var idx = 0;
  var iv = setInterval(function(){
    if(idx < targets.length){ _loadPct = targets[idx]; bar.style.width = _loadPct+'%'; tip.textContent = LOAD_TIPS[idx]||''; idx++; }
  }, 5000);
  return function(){ clearInterval(iv); bar.style.width='100%'; };
}

// ── Markdown 轻量渲染 ──
function md2html(text){
  if(!text) return '';
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/^#{1,3}\s+(.+)$/gm,'<h3>$1</h3>')
    .replace(/^[-*]\s+(.+)$/gm,'<li>$1</li>')
    .replace(/(<li>[\s\S]+?<\/li>)/g,'<ul>$1</ul>')
    .replace(/\n{2,}/g,'</p><p>')
    .replace(/^(?!<[hul])(.+)$/gm,'<p>$1</p>')
    .replace(/<p><\/p>/g,'')
    .replace(/(<\/ul>)\s*<ul>/g,'');
}

// ── 渲染免费/锁定内容 ──
function renderReport(reading, name, dateStr, timeStr, pillars){
  // 填封面
  document.getElementById('rp-name').textContent = name || '命盘';
  document.getElementById('rp-date').textContent = dateStr + (timeStr ? ' · ' + timeStr : '');

  // 四柱可视化（用后端返回的 pillars，日柱高亮=日主）·防御式，无数据即留空
  try{
    if(pillars){
      var _cols=[['年',pillars.year],['月',pillars.month],['日',pillars.day],['时',pillars.hour]];
      var _h=_cols.map(function(c,i){
        var p=c[1]||{}, isDay=(i===2), gan=p.gan||'', zhi=p.zhi||'';
        if(!gan && !zhi) return '';
        return '<div class="pillar cell'+(isDay?' day':'')+'"><span class="pl">'+c[0]+'柱'+(isDay?'·日主':'')+'</span><span class="pg">'+(gan||'—')+'</span><span class="pz">'+(zhi||'—')+'</span></div>';
      }).join('');
      var _host=document.getElementById('rp-pillars'); if(_host && _h) _host.innerHTML=_h;
    }
  }catch(e){}

  // 命盘速览：五行力量条 + 大运时间轴（付费感·全防御式，无数据即不渲染）
  try{
    if(pillars && (pillars.wuxing || (pillars.daYun && pillars.daYun.length))){
      var _ov='';
      if(pillars.dayMaster){ _ov+='<div class="rp-daymaster">日主 <b>'+pillars.dayMaster+(pillars.dayMasterElement||'')+'</b>'+(typeof pillars.isStrong==='boolean'?(' · '+(pillars.isStrong?'身强':'身弱')):'')+'</div>'; }
      if(pillars.wuxing){
        var _wx=pillars.wuxing, _wk=['木','火','土','金','水'];
        var _wmax=Math.max.apply(null,_wk.map(function(k){return +_wx[k]||0}).concat([1]));
        var _wc={'木':'#5bbfa0','火':'#d98b6a','土':'#c9a84c','金':'#d8c88a','水':'#6a9fd9'};
        _ov+='<div class="ov-title">五行能量</div><div class="ov-wx">'+_wk.map(function(k){
          var v=+_wx[k]||0, pct=(v===0)?0:Math.max(4,Math.round(v/_wmax*100));
          return '<div class="wx-row"><span class="wx-k">'+k+'</span><span class="wx-bar"><span class="wx-fill" style="width:'+pct+'%;background:'+_wc[k]+'"></span></span><span class="wx-v">'+(v?v.toFixed(1):'0')+'</span></div>';
        }).join('')+'</div>';
      }
      if(pillars.daYun && pillars.daYun.length){
        var _by=parseInt(dateStr,10)||0, _age=_by?(new Date().getFullYear()-_by):-1;
        _ov+='<div class="ov-title" style="margin-top:20px">大运</div><div class="ov-dy">'+pillars.daYun.map(function(d){
          var cur=(_age>=0 && _age>=d.startAge && _age<=d.endAge);
          var fut=(_age>=0 && d.startAge>_age);
          return '<div class="dy-cell'+(cur?' cur':'')+(fut?' fut':'')+'"><span class="dy-gz">'+(d.name||((d.gan||'')+(d.zhi||'')))+'</span><span class="dy-age">'+d.startAge+'-'+d.endAge+'岁</span></div>';
        }).join('')+'</div>';
      }
      if(_ov){ var _wrap=document.createElement('div'); _wrap.className='rp-overview'; _wrap.innerHTML=_ov; var _hp=document.getElementById('rp-pillars'); if(_hp && _hp.parentNode) _hp.parentNode.insertBefore(_wrap,_hp.nextSibling); }
    }
  }catch(e){}

  var parts = reading.split(/---LOCKED---/i);
  var freeText = parts[0] || '';
  var lockedText = parts[1] || '';

  // 解析免费区段落（按emoji标题分章）
  var freeHtml = parseSections(freeText);
  document.getElementById('free-content').innerHTML = freeHtml;

  // 锁定区
  if(lockedText.trim()){
    var lockedHtml = parseSections(lockedText);
    document.getElementById('locked-content').innerHTML = lockedHtml;
    // 检查localStorage解锁状态
    syInitUnlock();
  } else {
    document.getElementById('gate-a').style.display = 'none';
    document.getElementById('locked-content').style.display = 'none';
  }

  document.getElementById('share-bar').style.display = 'block';
}

function parseSections(text){
  if(!text) return '';
  // 按emoji或数字标题分段
  var chunks = text.split(/\n(?=(?:\d+\.|[📜🔥🟤💰💕💼🏥📅🔮✨🌿👨‍👩‍👧‍👦🎯📖🔑💌🌟⭐]))/);
  return chunks.map(function(chunk){
    chunk = chunk.trim();
    if(!chunk) return '';
    var lines = chunk.split('\n');
    var title = lines[0];
    var body = lines.slice(1).join('\n').trim();
    return '<div class="rp-section"><h2>' + escHtml(title) + '</h2>' + md2html(body) + '</div>';
  }).join('');
}

function escHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── 支付 ──
function syInitUnlock(){
  if(localStorage.getItem('sy_unlock_a')){
    document.getElementById('gate-a').style.display = 'none';
    document.getElementById('locked-content').classList.remove('locked-section');
  }
}

function syPay(tier, method){
  _syMethod = method || 'wechat';
  var ep = _syMethod==='alipay' ? SY_API+'/pay/alipay/qr' : SY_API+'/pay/wechat/create';
  document.getElementById('pay-title').textContent = _syMethod==='alipay' ? '支付宝扫码' : '微信扫码支付';
  document.getElementById('pay-amount').textContent = '¥19.9';
  document.getElementById('pay-status').textContent = '正在生成二维码...';
  document.getElementById('pay-qr-img').src = '';
  document.getElementById('pay-modal').classList.add('open');
  fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product:'report_unlock_a'})})
  .then(function(r){return r.json();}).then(function(d){
    if(!d.ok){document.getElementById('pay-status').textContent=d.error||'创建失败';return;}
    var qrData = d.code_url||d.qr_code||'';
    if(!qrData){document.getElementById('pay-status').textContent='获取二维码失败';return;}
    document.getElementById('pay-qr-img').src='https://api.qrserver.com/v1/create-qr-code/?size=190x190&data='+encodeURIComponent(qrData);
    document.getElementById('pay-status').textContent='请用'+(_syMethod==='alipay'?'支付宝':'微信')+'扫码 · 支付后自动解锁';
    syStartPoll(d.out_trade_no||d.order_no, tier);
  }).catch(function(){document.getElementById('pay-status').textContent='网络错误，请重试';});
}

function syStartPoll(orderNo, tier){
  if(_syPoll) clearInterval(_syPoll);
  var qep = _syMethod==='alipay' ? SY_API+'/pay/alipay/query' : SY_API+'/pay/wechat/query';
  _syPoll = setInterval(function(){
    fetch(qep+'?out_trade_no='+encodeURIComponent(orderNo))
    .then(function(r){return r.json();}).then(function(d){
      if(d.status==='paid'){
        clearInterval(_syPoll);
        localStorage.setItem('sy_unlock_'+tier, orderNo);
        syPayClose();
        syInitUnlock();
        var gate = document.getElementById('gate-'+tier);
        if(gate){gate.innerHTML='<p style="color:#c9a84c;text-align:center;padding:16px">✅ 已解锁！</p>';setTimeout(function(){gate.style.display='none';},1000);}
      }
    }).catch(function(){});
  }, 3000);
}

function syPayClose(){
  document.getElementById('pay-modal').classList.remove('open');
  if(_syPoll) clearInterval(_syPoll);
}

function copyLink(){
  var url = location.href.split('?')[0]+'?'+new URLSearchParams({name:qs('name'),date:qs('date'),time:qs('time'),city:qs('city'),ref:'share'}).toString();
  navigator.clipboard&&navigator.clipboard.writeText(url).then(function(){alert('链接已复制！');});
}

// ── 主流程 ──
(function main(){
  var name = qs('name');
  var dateStr = qs('date');   // YYYY-MM-DD
  var timeStr = qs('time');   // 子时/丑时/...
  var city = qs('city');
  var gender = qs('gender') || 'female';

  if(!dateStr){
    document.getElementById('err-msg').textContent = '缺少出生日期，请返回重新输入';
    document.getElementById('error-screen').classList.add('show');
    document.getElementById('loading').classList.add('hidden');
    return;
  }

  // 更新加载提示
  if(name) document.getElementById('load-name-hint').textContent = '正在为 ' + name + ' 排盘...';

  var stopAnim = startLoadAnim();

  // 解析日期
  var parts = dateStr.split('-');
  var bYear  = parseInt(parts[0])||1990;
  var bMonth = parseInt(parts[1])||1;
  var bDay   = parseInt(parts[2])||1;
  var bHour  = timeStr ? (TIME_MAP[timeStr] !== undefined ? TIME_MAP[timeStr] : undefined) : undefined;

  // 调用八字API
  var body = {
    birthYear: bYear, birthMonth: bMonth, birthDay: bDay,
    gender: gender, lang: 'zh'
  };
  if(bHour !== undefined) body.birthHour = bHour;
  if(name) body.name = name;
  if(city) body.city = city;

  fetch(SY_API+'/api/bazi', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  })
  .then(function(r){
    if(!r.ok) return r.json().then(function(e){throw new Error(e.error||'API错误');});
    return r.json();
  })
  .then(function(data){
    stopAnim();
    if(!data.reading){
      throw new Error('报告生成失败，请重试');
    }
    // 隐藏加载，显示报告
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('report').classList.add('show');
    // 渲染报告
    renderReport(data.reading, name, dateStr.replace(/-/g,'年').replace('-','月')+'日', timeStr, data.pillars);
  })
  .catch(function(err){
    stopAnim();
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('err-msg').textContent = err.message || 'AI暂时繁忙，请稍后重试';
    document.getElementById('error-screen').classList.add('show');
  });
})();
