<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink-deep: #0f1218; --ink-mid: #171c25; --ink-card: #131820;
  --teal: #4a8fa0; --teal-light: #7abfcc; --teal-mid: #a8d8e0;
  --gold: #c9a84c; --gold-light: #e8d08a;
  --rose: #c96a6a; --rose-light: #e8a0a0;
}
html, body { background: var(--ink-deep); font-family: 'Noto Serif SC', serif; color: #e0ecf0; -webkit-font-smoothing: antialiased; }
body { max-width: 390px; margin: 0 auto; min-height: 100vh; overflow-y: auto; padding-bottom: 52px; }
body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 0%, rgba(74,143,160,0.15) 0%, transparent 45%); pointer-events: none; z-index: 0; }
.back-btn { position: fixed; top: 16px; left: 16px; z-index: 99; background: none; border: none; font-family: 'Noto Serif SC', serif; font-size: 13px; color: rgba(122,191,204,0.7); cursor: pointer; padding: 4px 0; }

.header { position: relative; z-index: 1; text-align: center; padding: 44px 20px 20px; }
.header-title { font-size: 20px; font-weight: 400; letter-spacing: 0.22em; margin-bottom: 6px; }
.header-sub { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 11px; letter-spacing: 0.26em; color: rgba(74,143,160,0.55); margin-bottom: 14px; }
.teal-line { width: 60px; height: 1px; background: linear-gradient(90deg, transparent, var(--teal), transparent); margin: 0 auto; }

/* ── Mode tabs ── */
.mode-tabs { position: relative; z-index: 1; display: flex; gap: 0; margin: 16px 16px 0; background: var(--ink-card); border: 1px solid rgba(74,143,160,0.15); border-radius: 6px; overflow: hidden; }
.mode-tab { flex: 1; padding: 11px 0; text-align: center; font-size: 13px; letter-spacing: 0.1em; color: rgba(224,236,240,0.45); cursor: pointer; transition: all 0.2s; border-right: 1px solid rgba(74,143,160,0.1); }
.mode-tab:last-child { border-right: none; }
.mode-tab.active { background: rgba(74,143,160,0.18); color: var(--teal-light); }

/* ── Upload area ── */
.upload-wrap { position: relative; z-index: 1; padding: 14px 16px; }
.upload-area { background: var(--ink-card); border: 1.5px dashed rgba(74,143,160,0.25); border-radius: 10px; min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden; }
.upload-area:active { border-color: var(--teal); background: rgba(74,143,160,0.06); }
.upload-area.has-image { border-style: solid; border-color: rgba(74,143,160,0.3); }
.upload-icon { width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(74,143,160,0.25); display: flex; align-items: center; justify-content: center; font-size: 22px; color: rgba(74,143,160,0.4); font-weight: 300; }
.upload-text { font-size: 13px; color: rgba(224,236,240,0.5); letter-spacing: 0.08em; }
.upload-hint { font-size: 9px; color: rgba(224,236,240,0.2); letter-spacing: 0.06em; }
.upload-area img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
.upload-area .img-overlay { position: absolute; inset: 0; background: rgba(15,18,24,0.4); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.img-overlay-text { font-size: 12px; color: rgba(224,236,240,0.8); letter-spacing: 0.1em; background: rgba(15,18,24,0.6); padding: 6px 16px; border-radius: 3px; }
input[type=file] { display: none; }

/* Camera option */
.camera-row { display: flex; gap: 8px; margin-top: 8px; }
.cam-btn { flex: 1; background: var(--ink-card); border: 1px solid rgba(74,143,160,0.15); border-radius: 6px; padding: 10px 0; text-align: center; font-size: 11px; color: rgba(224,236,240,0.5); letter-spacing: 0.08em; cursor: pointer; transition: all 0.2s; }
.cam-btn:active { border-color: var(--teal); color: var(--teal-light); }

/* ── Question ── */
.q-wrap { position: relative; z-index: 1; padding: 0 16px 14px; }
.q-label { font-size: 10px; letter-spacing: 0.18em; color: rgba(74,143,160,0.45); margin-bottom: 8px; }
.q-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.q-chip { padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(74,143,160,0.18); background: transparent; font-size: 10px; color: rgba(224,236,240,0.5); cursor: pointer; letter-spacing: 0.06em; transition: all 0.2s; }
.q-chip.sel { border-color: var(--teal); background: rgba(74,143,160,0.15); color: var(--teal-light); }

/* ── Submit ── */
.submit-wrap { position: relative; z-index: 1; padding: 0 16px; }
.btn-analyze { width: 100%; padding: 15px 0; background: linear-gradient(135deg, #1a3a45, var(--teal), var(--teal-light), var(--teal)); border: none; border-radius: 4px; color: rgba(15,18,24,0.95); font-family: 'Noto Serif SC', serif; font-size: 14px; font-weight: 500; letter-spacing: 0.22em; cursor: pointer; box-shadow: 0 4px 18px rgba(74,143,160,0.3); }
.btn-analyze:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Loading ── */
.loading-wrap { position: relative; z-index: 1; display: none; flex-direction: column; align-items: center; padding: 30px 16px; gap: 14px; }
.loading-wrap.show { display: flex; }
.scan-anim { width: 120px; height: 120px; border-radius: 50%; border: 1px solid rgba(74,143,160,0.3); position: relative; animation: scan-spin 4s linear infinite; }
.scan-line { position: absolute; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--teal), transparent); top: 30%; animation: scan-move 1.5s ease-in-out infinite; }
@keyframes scan-spin { to { border-color: rgba(74,143,160,0.8); box-shadow: 0 0 20px rgba(74,143,160,0.2); } }
@keyframes scan-move { 0%,100% { top: 20%; opacity: 0.3; } 50% { top: 80%; opacity: 1; } }
.loading-text { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 13px; color: rgba(122,191,204,0.6); letter-spacing: 0.16em; animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }

/* ── Results ── */
.result-wrap { position: relative; z-index: 1; padding: 16px 16px 0; display: none; }
.result-wrap.show { display: block; }

/* Feature map */
.face-map { width: 100%; max-width: 280px; margin: 0 auto 18px; display: block; position: relative; }
.feature-card { background: var(--ink-card); border: 1px solid rgba(74,143,160,0.12); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
.feature-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.feature-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.feature-title { font-size: 13px; letter-spacing: 0.1em; }
.feature-score { margin-left: auto; font-family: 'Cormorant Garamond', serif; font-size: 18px; }
.feature-bar { height: 3px; background: rgba(74,143,160,0.1); border-radius: 2px; margin-bottom: 8px; overflow: hidden; }
.feature-fill { height: 100%; border-radius: 2px; }
.feature-text { font-size: 11px; color: rgba(224,236,240,0.5); letter-spacing: 0.04em; line-height: 1.85; }

.overall-box { background: rgba(74,143,160,0.07); border: 1px solid rgba(74,143,160,0.2); border-radius: 10px; padding: 14px; margin-bottom: 14px; text-align: center; }
.overall-label { font-size: 9px; letter-spacing: 0.2em; color: rgba(74,143,160,0.5); margin-bottom: 8px; }
.overall-quote { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px; color: rgba(224,236,240,0.8); letter-spacing: 0.08em; line-height: 1.6; }

.cta-btn { width: 100%; padding: 13px 0; background: transparent; border: 1px solid rgba(74,143,160,0.3); border-radius: 4px; color: var(--teal-light); font-family: 'Noto Serif SC', serif; font-size: 13px; letter-spacing: 0.18em; cursor: pointer; margin-bottom: 16px; }

/* ══════════ 精装报告阅读体验（对齐 bazi.html · 面相偏气运格局） ══════════ */
@keyframes mxFadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
/* 顶部阅读进度条 */
#readProgressWrap{position:fixed;top:0;left:0;right:0;height:3px;z-index:1200;background:rgba(0,0,0,0.25);opacity:0;transition:opacity .3s;pointer-events:none}
#readProgressWrap.show{opacity:1}
#readProgressBar{height:100%;width:0;background:linear-gradient(90deg,#2a6070,var(--teal),var(--teal-light));box-shadow:0 0 8px rgba(74,143,160,0.5);transition:width .12s ease-out}
#readProgressChapter{position:fixed;top:8px;right:12px;z-index:1200;font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:0.12em;color:rgba(168,216,224,0.9);background:rgba(8,12,18,0.72);border:1px solid rgba(74,143,160,0.28);border-radius:20px;padding:3px 11px;opacity:0;transition:opacity .3s;pointer-events:none;backdrop-filter:blur(6px)}
#readProgressChapter.show{opacity:1}

/* 章节封面卡 */
.chapter-cover{position:relative;margin:20px 0 10px;border-radius:14px;overflow:hidden;min-height:158px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 8px 30px rgba(0,0,0,0.45);animation:mxFadeUp 0.6s ease both;background:#0d141c}
.chapter-cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.6;filter:saturate(0.9)}
.chapter-cover-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,10,15,0.35) 0%,rgba(6,10,15,0.55) 45%,rgba(6,10,15,0.92) 100%)}
.chapter-cover-body{position:relative;padding:16px 16px 15px}
.chapter-cover-num{font-family:'Cormorant Garamond','Noto Serif SC',serif;font-size:11px;letter-spacing:0.3em;color:rgba(168,216,224,0.85);margin-bottom:5px}
.chapter-cover-num::before{content:'';display:inline-block;width:20px;height:1px;background:linear-gradient(90deg,rgba(122,191,204,0.7),transparent);vertical-align:middle;margin-right:8px}
.chapter-cover-title{font-family:'Noto Serif SC',serif;font-size:19px;font-weight:500;letter-spacing:0.06em;color:#e6f2f6;line-height:1.25;text-shadow:0 2px 12px rgba(0,0,0,0.6)}
.chapter-cover-lead{font-size:11px;line-height:1.7;letter-spacing:0.03em;color:rgba(214,232,238,0.72);margin-top:6px;max-width:94%}

/* 首字下沉 */
.mx-body{font-size:12.5px;line-height:2;color:rgba(214,232,238,0.82);letter-spacing:0.03em}
.mx-body.drop-cap::first-letter{float:left;font-family:'Noto Serif SC',Georgia,serif;font-size:3.2em;line-height:0.82;font-weight:700;color:var(--teal-light);margin:0.04em 0.12em 0 0;text-shadow:0 2px 10px rgba(74,143,160,0.3)}

/* 金句 pull quote */
.pull-quote{position:relative;margin:14px 6px;padding:6px 4px 6px 18px;text-align:center}
.pull-quote::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,transparent,rgba(122,191,204,0.7),transparent);border-radius:2px}
.pull-quote-text{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:500;line-height:1.75;letter-spacing:0.04em;color:var(--teal-light);text-shadow:0 1px 8px rgba(74,143,160,0.18)}
.pull-quote-mark{font-family:'Cormorant Garamond',serif;font-size:24px;color:rgba(122,191,204,0.4);line-height:0}

/* 高亮卡 */
.hl-note{margin:12px 0;padding:12px 14px;background:linear-gradient(135deg,rgba(74,143,160,0.12),rgba(74,143,160,0.03));border:1px solid rgba(74,143,160,0.3);border-left:3px solid var(--teal);border-radius:10px;font-size:12px;line-height:1.9;letter-spacing:0.02em;color:rgba(224,236,240,0.9)}
.hl-note b,.hl-note strong{color:var(--teal-light)}

/* 章节目录 */
.chapter-toc{margin:14px 0 6px;padding:16px 16px 12px;background:linear-gradient(160deg,rgba(13,20,28,0.92),rgba(8,12,18,0.96));border:1px solid rgba(74,143,160,0.24);border-radius:14px;animation:mxFadeUp 0.5s ease both}
.chapter-toc-title{font-size:11px;letter-spacing:0.2em;color:rgba(122,191,204,0.75);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.chapter-toc-item{display:flex;align-items:baseline;gap:10px;padding:8px 2px;border-bottom:1px dotted rgba(74,143,160,0.16);text-decoration:none;transition:all .2s;cursor:pointer}
.chapter-toc-item:last-child{border-bottom:none}
.chapter-toc-item:active{opacity:0.6}
.chapter-toc-idx{font-family:'Cormorant Garamond',serif;font-size:13px;color:rgba(122,191,204,0.65);min-width:26px}
.chapter-toc-label{flex:1;font-size:13px;letter-spacing:0.04em;color:rgba(224,236,240,0.9)}
.chapter-toc-arrow{font-size:12px;color:rgba(122,191,204,0.5)}

/* 精装章卡 */
.mx-chapter-card{background:var(--ink-card);border:1px solid rgba(74,143,160,0.12);border-radius:12px;padding:14px;margin-bottom:12px;animation:mxFadeUp 0.5s ease both}
.mx-chapter-card .feature-head{margin-bottom:10px}

/* report-viz 主题微调（面相青绿）：评分环标签 */
.rv-frame{background:linear-gradient(160deg,rgba(13,20,28,0.96),rgba(8,12,18,0.98)) !important;border-color:rgba(74,143,160,0.24) !important}
.rv-frame-title{color:var(--teal-light) !important}
.rv-ring-label{color:rgba(224,236,240,0.85) !important}

@media print{
  .chapter-cover{break-inside:avoid}
  #readProgressWrap,#readProgressChapter{display:none !important}
}
</style>

<body>
<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="切换主题" style="z-index:999">🌙</button>


<button class="back-btn" onclick="history.back()">‹ 返回</button>

<div class="header">
  <div class="header-title">面相 · 手相解读</div>
  <div class="header-sub">FACE & PALM READING · PHYSIOGNOMY</div>
  <div class="teal-line"></div>
</div>

<div class="mode-tabs">
  <div class="mode-tab active" onclick="switchMode('face',this)">面相</div>
  <div class="mode-tab" onclick="switchMode('palm',this)">手相</div>
</div>

<div class="upload-wrap">
  <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
    <div class="upload-icon" id="uploadIcon">面</div>
    <div class="upload-text" id="uploadText">上传正面照片</div>
    <div class="upload-hint" id="uploadHint">光线均匀·正面·无遮挡</div>
  </div>
  <input type="file" id="fileInput" accept="image/*" capture="user" onchange="handleFile(this)">
  <div class="camera-row">
    <div class="cam-btn" onclick="document.getElementById('fileInput').click()">从相册选择</div>
    <div class="cam-btn" onclick="openCamera()">拍照上传</div>
  </div>
</div>

<div class="q-wrap">
  <div class="q-label">你最想了解</div>
  <div class="q-chips" id="qChips">
    <div class="q-chip sel" onclick="toggleChip(this)">财运格局</div>
    <div class="q-chip" onclick="toggleChip(this)">感情婚姻</div>
    <div class="q-chip" onclick="toggleChip(this)">事业官运</div>
    <div class="q-chip" onclick="toggleChip(this)">健康寿元</div>
    <div class="q-chip" onclick="toggleChip(this)">性格特质</div>
    <div class="q-chip" onclick="toggleChip(this)">贵人小人</div>
  </div>
</div>

<div class="submit-wrap">
  <button class="btn-analyze" id="analyzeBtn" onclick="startAnalysis()" disabled>上传照片后开始解读</button>
</div>

<div class="loading-wrap" id="loadingWrap">
  <div class="scan-anim"><div class="scan-line"></div></div>
  <div class="loading-text" id="loadingText">面相扫描中…</div>
</div>

<div class="result-wrap" id="resultWrap">
  <!-- Dynamic results -->
</div>

<script>
var currentMode = 'face';
var hasImage = false;

function switchMode(mode, el) {
  document.querySelectorAll('.mode-tab').forEach(function(t){ t.classList.remove('active'); });
  el.classList.add('active');
  currentMode = mode;
  document.getElementById('uploadIcon').textContent = mode === 'face' ? '面' : '手';
  document.getElementById('uploadText').textContent = mode === 'face' ? '上传正面照片' : '上传手掌照片';
  document.getElementById('uploadHint').textContent = mode === 'face' ? '光线均匀·正面·无遮挡' : '手掌朝上·五指舒展·清晰';
  document.getElementById('loadingText').textContent = mode === 'face' ? '面相扫描中…' : '手相解析中…';
}

function handleFile(input) {
  if (!input.files[0]) return;
  var file = input.files[0];
  var reader = new FileReader();
  reader.onload = function(e) {
    var dataUrl = e.target.result;
    // 存储 base64 数据供 startAnalysis 使用
    var commaIdx = dataUrl.indexOf(',');
    window._mxImageData = {
      base64: commaIdx !== -1 ? dataUrl.slice(commaIdx + 1) : dataUrl,
      mimeType: file.type || 'image/jpeg'
    };
    var area = document.getElementById('uploadArea');
    area.innerHTML = '<img src="'+dataUrl+'" alt="" loading="lazy"><div class="img-overlay"><div class="img-overlay-text">已上传 · 点击更换</div></div>';
    area.classList.add('has-image');
    area.onclick = function(){ document.getElementById('fileInput').click(); };
    hasImage = true;
    var btn = document.getElementById('analyzeBtn');
    btn.textContent = '开始'+(currentMode==='face'?'面相':'手相')+'解读';
    btn.disabled = false;
  };
  reader.readAsDataURL(file);
}

function openCamera() {
  var inp = document.getElementById('fileInput');
  inp.setAttribute('capture', currentMode === 'face' ? 'user' : 'environment');
  inp.click();
}

function toggleChip(el) {
  el.classList.toggle('sel');
}

function startAnalysis() {
  if (!hasImage) return;

  // 防狂点：禁用按钮
  var btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.textContent = '分析中…';

  // 收集用户选择的关注点
  var chips = Array.from(document.querySelectorAll('.q-chip.sel')).map(function(c){ return c.textContent; });
  var question = chips.length ? chips.join('、') : (currentMode === 'face' ? '面相全面分析' : '手相全面分析');

  // 读取图片 base64（已在 handleFile 时存入 window._mxImageData）
  var imageBase64 = window._mxImageData ? window._mxImageData.base64 : null;
  var mimeType = window._mxImageData ? window._mxImageData.mimeType : 'image/jpeg';

  if (!imageBase64) {
    showMxToast('照片读取失败，请重新上传', 'error');
    btn.disabled = false;
    btn.textContent = '开始'+(currentMode==='face'?'面相':'手相')+'解读';
    return;
  }

  document.getElementById('loadingWrap').classList.add('show');
  document.getElementById('resultWrap').classList.remove('show');
  document.getElementById('resultWrap').innerHTML = '';
  document.getElementById('analyzeBtn').style.display = 'none';

  // 读取 auth token（httpOnly cookie，不从 localStorage 取；后端接受 Bearer ''）
  var token = '';

  fetch('/api/mianxiang', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token
    },
    body: JSON.stringify({
      question: question,
      imageBase64: imageBase64,
      mimeType: mimeType,
      lang: 'zh'
    })
  })
  .then(function(res) {
    if (!res.ok) return res.json().then(function(e){ throw new Error(e.error || '服务器错误 ' + res.status); });
    return res.json();
  })
  .then(function(data) {
    document.getElementById('loadingWrap').classList.remove('show');
    if (!data || !data.reading) throw new Error('AI 返回内容为空');
    renderResult(data.reading, data.tier, data.locked);
  })
  .catch(function(err) {
    document.getElementById('loadingWrap').classList.remove('show');
    document.getElementById('analyzeBtn').style.display = 'block';
    btn.disabled = false;
    btn.textContent = '重新开始解读';
    showMxToast('分析遇到问题：' + (err.message || '请稍后重试'), 'error');
  });
}

function showMxToast(msg, type) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;max-width:340px;width:90%;padding:12px 16px;border-radius:8px;font-family:"Noto Serif SC",serif;font-size:12px;letter-spacing:0.06em;text-align:center;cursor:pointer;' +

// 从正文抽一句有力金句
function mxPullQuote(text){
  var parts = String(text||'').split(/[。！；]/).map(function(s){return s.trim();})
    .filter(function(s){ return s.length>=8 && s.length<=30; });
  if(!parts.length) return '';
  var re = /(格局|气色|贵气|福泽|稳健|端正|清朗|厚重|沉稳|气度|从容|坚毅)/;
  for(var i=0;i<parts.length;i++){ if(re.test(parts[i])) return parts[i]; }
  return parts[0];
}

  var lbl=document.getElementById('readProgressChapter');

  var bar=document.getElementById('readProgressBar');
  if(_mxProgHandler) window.removeEventListener('scroll',_mxProgHandler);
  _mxProgHandler=function(){
    var rw=document.getElementById('resultWrap');
    if(!rw||!rw.classList.contains('show')){ wrap.classList.remove('show'); lbl.classList.remove('show'); return; }
    var doc=document.documentElement;
    var st=window.scrollY||doc.scrollTop||0;

function mxEscHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function mxRichText(s) {
  return mxEscHtml(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong style="color:var(--teal-light)">$1</strong>')
    .replace(/(\d{4})年/g, '<span style="color:var(--gold-light);font-weight:500">$1年</span>')
    .replace(/(\d+)分/g, '<span style="color:var(--teal-light)">$1分</span>');
}

function renderMxAIReport(aiText, tier, locked) {
  var rw = document.getElementById('resultWrap');

  // ── 付费墙判定 ──
  var isLocked = (locked === true) || (tier === 'free') || (tier === 'basic');

  // ── 按 ---LOCKED--- 干净切分：免费预览只解析分隔符之前的正文(全是免费章·全展示)，
  //    之后的锁定预告丢弃(转化由底部付费墙 CTA 承载)。修 bug: 原按章节 index 硬锁 (i>=2)，
  //    把第3个免费章(官禄宫)误当付费占位卡渲染。──
  var _lockPos = isLocked ? aiText.indexOf('---LOCKED---') : -1;
  var _freeText = _lockPos >= 0 ? aiText.slice(0, _lockPos) : aiText;

  // ── 解析 markdown 段落：标题行=章节，其余=正文 ──
  var sections = [];
  var cur = null;
  var lines = _freeText.split('\n');
  lines.forEach(function(line) {
    var tr = line.trim();
    if (!tr) return;
    var hMatch = tr.match(/^#{1,3}\s*(.+)$/)
               || tr.match(/^([\u{1F300}-\u{1FAFF}✦▪▸]\s*)(.*?)$/u)
               || tr.match(/^\*{2}([^*]+)\*{2}/);
    if (hMatch) {
      if (cur) sections.push(cur);
      var title = (hMatch[1] || hMatch[0]).replace(/^#{1,3}\s*/, '').trim();
      cur = { title: title, content: [] };
    } else if (cur) {
      if (tr !== '---') cur.content.push(tr);
    } else {
      if (!sections.length) sections.push({ title: '相理概览', content: [] });
      sections[sections.length - 1].content.push(tr);
    }
  });
  if (cur) sections.push(cur);
  if (!sections.length) sections.push({ title: '面相解读', content: [_freeText] });

  // ── 评分环（如有 report-viz.js，生成气色/格局双环） ──
  var scoreRingHtml = '';
  if (window.ReportViz) {
    try {
      scoreRingHtml = ReportViz.renderScoreRing.group([
        { label: '气色', score: 78, max: 100, tone: 'jade', sub: '当下气机神采' },
        { label: '格局', score: 74, max: 100, tone: 'gold', sub: '先天相理骨架' }
      ], (mode === 'face' ? '五官气运总览' : '手相气运总览'));
    } catch (e) {}
  }

  // ── AIGC 标识 ──
  var html = '<div style="display:flex;align-items:center;gap:6px;margin:0 0 12px;padding:7px 12px;background:rgba(74,143,160,0.06);border:1px solid rgba(74,143,160,0.2);border-radius:6px;font-size:11px;color:rgba(122,191,204,0.75);letter-spacing:0.06em"><span>🤖</span><span><b>AI 生成内容</b> · 仅供娱乐参考，不构成医疗/法律/财务建议。</span></div>';

  // 评分环
  if (scoreRingHtml) html += '<div style="margin:0 0 14px">' + scoreRingHtml + '</div>';

  // ── 章节目录 ──（已按 ---LOCKED--- 截断，展示的均为免费正文章，全部展示）
  var tocHtml = '<div class="chapter-toc"><div class="chapter-toc-title"><span>📖</span> 相理报告目录 · 共 ' + sections.length + ' 章</div>';
  sections.forEach(function(sec, i) {
    tocHtml += '<div class="chapter-toc-item" onclick="mxJump(\'mx-ai-chap-' + i + '\')">'
      + '<span class="chapter-toc-idx">' + (mxOrdinal(i)) + '</span>'
      + '<span class="chapter-toc-label">' + mxEscHtml(sec.title) + '</span>'
      + '<span class="chapter-toc-arrow">›</span></div>';
  });
  tocHtml += '</div>';
  html += tocHtml;

  // ── 章节渲染 ──（已按 ---LOCKED--- 截断，均为免费正文章，全展示；付费转化由底部 CTA 承载）
  sections.forEach(function(sec, i) {
    var anchorId = 'mx-ai-chap-' + i;

    // 章节封面卡
    var art = mxGetArt(sec.title);
    var leadLine = sec.content.length ? sec.content[0] : '';
    html += '<div id="' + anchorId + '">' + mxChapterCover(i, sec.title, art, leadLine) + '</div>';

    // 评分环（单个，小尺寸）— 仅前3章显示，节约空间
    if (i < 3 && window.ReportViz) {
      try {
        var ring = ReportViz.renderScoreRing({ label: mode === 'face' ? '气运' : '格局', score: 70 + (i * 7 % 25), max: 100, size: 88, tone: 'auto' });
        html += '<div style="display:flex;justify-content:center;margin:2px 0 6px">' + ring + '</div>';
      } catch (e) {}
    }

    // 金句
    var pq = mxPullQuote(sec.content.join('。'));
    if (pq) {
      html += '<div class="pull-quote"><span class="pull-quote-mark">"</span>'
        + '<div class="pull-quote-text">' + mxEscHtml(pq) + '</div>'
        + '<span class="pull-quote-mark">"</span></div>';
    }

    // 正文卡（首字下沉）
    html += '<div class="mx-chapter-card"><div class="feature-head"><div class="feature-dot" style="background:var(--teal)"></div><div class="feature-title">' + mxEscHtml(sec.title) + '</div></div>';
    var bodyHtml = sec.content.map(function(ln, li) {
      var cls = 'mx-body' + (li === 0 ? ' drop-cap' : '');
      return '<div class="' + cls + '">' + mxRichText(ln) + '</div>';
    }).join('');
    html += bodyHtml + '</div>';
  });

  // 合规气运调养提示
  html += '<div class="hl-note"><strong>🔑 气运调养</strong>：相由心生，气随神转。相理呈现的是当下格局与倾向，非定数。<b>心存善念、作息规律、待人从容</b>，气色与格局皆可日渐提升。</div>';

  html += '<button class="cta-btn" onclick="resetScan()">换张照片 · 重新解读</button>';

  if (isLocked) {
    html += '<button class="cta-btn" style="border-color:rgba(201,130,10,0.3);color:rgba(232,176,106,0.8);margin-bottom:8px" onclick="handleMxUnlock()">解锁完整面相报告 · $9.9</button>';
  }

  rw.innerHTML = html;
  rw.classList.add('show');
  try { mxSetupProgress(); } catch (e) {}
  injectDisclaimer('resultWrap');
}

function mxGetArt(title) {
  var t = String(title || '');
  if (/财|帛|鼻/.test(t)) return 'wealth';
  if (/感情|夫妻|婚|情|桃花/.test(t)) return 'love';
  if (/事业|官|禄|额|天庭/.test(t)) return 'career';
  if (/健康|疾厄|养生/.test(t)) return 'health';
  if (/五岳|三停|格局|总纲|命宫|概|总/.test(t)) return 'mingge';
  return 'mingge';
}

function injectDisclaimer(containerId) {
  var c = document.getElementById(containerId);
  if (!c || c.querySelector('.sy-disclaimer')) return;
  var d = document.createElement('div');
  d.className = 'sy-disclaimer';
  d.innerHTML = '<div style="height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,0.2),transparent);margin:0 auto;width:80%"></div><div style="font-size:10px;color:rgba(201,168,76,0.4);text-align:center;letter-spacing:0.06em;padding:10px 20px">仅供娱乐参考，切勿沉迷。命理是可能性的艺术，不是定数。</div>';
  c.appendChild(d);
}
</script>

<script>
(function(){var t=localStorage.getItem('sy_theme');if(t==='light'){document.documentElement.classList.add('light-mode');var b=document.getElementById('themeToggle');if(b)b.textContent='☀️';}})();
function toggleTheme(){var e=document.documentElement;var b=document.getElementById('themeToggle');e.classList.toggle('light-mode');var l=e.classList.contains('light-mode');if(b)b.textContent=l?'☀️':'🌙';localStorage.setItem('sy_theme',l?'light':'dark');}
</script>
