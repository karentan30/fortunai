<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0e0a04">
<title>我的命理档案 · 善缘</title>
<meta name="description" content="我的命理档案 · My Fortune Archive — 查看命理咨询记录与AI趋势总结">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0a04;--card:#170e06;--mid:#1f1408;
  --gold:#c9a84c;--gold-light:#e8d08a;--gold-deep:#8a6420;
  --jade:#5bbfa0;--jade-mid:#8dd9bf;
  --amber:#c9820a;--amber-light:#e8b86a;
  --ink-text:rgba(255,245,220,0.85);
  --sub-text:rgba(255,245,220,0.58);
}
html,body{background:var(--bg);font-family:'Noto Serif SC','Georgia',serif;color:var(--ink-text);-webkit-font-smoothing:antialiased}
body{max-width:390px;margin:0 auto;min-height:100vh;overflow-y:auto;padding-bottom:100px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(201,168,76,0.08) 0%,transparent 50%);pointer-events:none;z-index:0}

/* Header */
.header{position:sticky;top:0;z-index:100;background:rgba(14,10,4,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(201,168,76,0.12);padding:16px 16px 14px;display:flex;align-items:center;gap:12px}
.header-back{font-size:20px;color:var(--gold);text-decoration:none;padding:4px 0;flex-shrink:0}
.header-back:hover{opacity:0.7}
.header-title{font-size:14px;font-weight:500;letter-spacing:0.08em;color:var(--gold-light);flex:1}
.header-sub{font-size:9px;color:var(--sub-text);letter-spacing:0.06em}

/* Loading */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center}
.loading-spinner{width:24px;height:24px;border:2px solid rgba(201,168,76,0.15);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:11px;color:var(--sub-text);letter-spacing:0.1em}
.error-card{margin:20px 16px;padding:20px;border:1px solid rgba(200,60,60,0.3);border-radius:10px;background:rgba(200,60,60,0.08);text-align:center;font-size:12px;color:rgba(255,180,180,0.8);line-height:1.6}

/* Login prompt */
.login-prompt{margin:40px 16px;padding:40px 20px;border-radius:12px;border:1px solid rgba(201,168,76,0.15);background:rgba(23,14,6,0.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);text-align:center}
.login-prompt .prompt-icon{font-size:36px;margin-bottom:12px}
.login-prompt .prompt-title{font-size:16px;color:var(--gold);letter-spacing:0.1em;margin-bottom:8px}
.login-prompt .prompt-desc{font-size:11px;color:var(--sub-text);letter-spacing:0.06em;margin-bottom:20px;line-height:1.6}
.login-btn{display:inline-block;padding:10px 28px;background:linear-gradient(135deg,#8a6420,#c9a84c);border:none;border-radius:4px;color:#0e0a04;font-family:'Noto Serif SC',serif;font-size:13px;letter-spacing:0.12em;cursor:pointer;text-decoration:none;transition:opacity 0.2s}
.login-btn:hover{opacity:0.85}

/* Section title */
.section-title{margin:20px 16px 8px;font-size:13px;font-weight:500;letter-spacing:0.08em;color:var(--gold)}
.section-desc{margin:0 16px 14px;font-size:10px;color:var(--sub-text);letter-spacing:0.06em;line-height:1.5}

/* Reading list */
.reading-list{margin:0 16px;display:flex;flex-direction:column;gap:8px}
.reading-card{border:1px solid rgba(201,168,76,0.15);border-radius:10px;background:rgba(23,14,6,0.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow:hidden;transition:border-color 0.3s,box-shadow 0.3s;cursor:pointer}
.reading-card:hover{border-color:rgba(201,168,76,0.35);box-shadow:0 4px 20px rgba(201,168,76,0.08)}
.reading-card-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.reading-card-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.reading-type-badge{font-size:9px;padding:3px 8px;border-radius:3px;background:rgba(201,168,76,0.12);color:var(--gold);letter-spacing:0.06em;white-space:nowrap;border:1px solid rgba(201,168,76,0.15)}
.reading-date{font-size:10px;color:var(--sub-text);letter-spacing:0.04em;white-space:nowrap}
.reading-card-arrow{font-size:16px;color:var(--sub-text);transition:transform 0.3s;flex-shrink:0}
.reading-card.expanded .reading-card-arrow{transform:rotate(90deg)}

.reading-card-body{max-height:0;overflow:hidden;transition:max-height 0.4s ease,padding 0.3s ease;padding:0 16px;border-top:0px solid transparent}
.reading-card.expanded .reading-card-body{max-height:2000px;padding:12px 16px 16px;border-top:1px solid rgba(201,168,76,0.1)}

.reading-detail-label{font-size:9px;color:var(--sub-text);letter-spacing:0.06em;margin-bottom:6px}
.reading-detail-content{font-size:11px;line-height:1.7;color:var(--ink-text);white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto;background:rgba(0,0,0,0.15);border-radius:6px;padding:10px 12px;margin-bottom:10px}
.reading-input-preview{font-size:10px;color:var(--sub-text);line-height:1.5;margin-bottom:8px;padding:6px 10px;background:rgba(255,255,255,0.03);border-radius:4px}

/* Empty state */
.empty-state{margin:30px 16px;padding:40px 20px;border-radius:12px;border:1px solid rgba(201,168,76,0.1);text-align:center}
.empty-icon{font-size:32px;margin-bottom:10px}
.empty-title{font-size:14px;color:var(--sub-text);letter-spacing:0.08em;margin-bottom:6px}
.empty-desc{font-size:10px;color:var(--sub-text);letter-spacing:0.06em;line-height:1.6}

/* Summary section */
.summary-section{margin:20px 16px 0}
.summary-btn{width:100%;padding:14px 0;border:1px solid rgba(201,168,76,0.25);border-radius:8px;background:rgba(201,168,76,0.08);color:var(--gold);font-family:'Noto Serif SC',serif;font-size:12px;letter-spacing:0.08em;cursor:pointer;transition:all 0.3s;text-align:center}
.summary-btn:hover{background:rgba(201,168,76,0.16);border-color:rgba(201,168,76,0.45);transform:translateY(-2px)}
.summary-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.summary-btn .btn-icon{margin-right:6px}
.summary-card{margin-top:12px;padding:16px;border-radius:10px;border:1px solid rgba(201,168,76,0.15);background:rgba(23,14,6,0.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none}
.summary-card.show{display:block}
.summary-card-title{font-size:12px;color:var(--gold);letter-spacing:0.06em;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(201,168,76,0.1)}
.summary-card-content{font-size:11px;line-height:1.8;color:var(--ink-text);white-space:pre-wrap;word-break:break-word;max-height:500px;overflow-y:auto}
.summary-card-content em{color:var(--gold-light);font-style:italic}
.summary-card-content strong{color:var(--gold)}

/* Summary loading in button */
.summary-btn.loading{pointer-events:none}
.summary-btn.loading .btn-text{opacity:0.6}
.summary-btn.loading::after{content:'';display:inline-block;width:14px;height:14px;border:2px solid rgba(201,168,76,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-left:8px;vertical-align:middle}

/* Gold line */
.gold-line{height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,76,0.15),rgba(201,168,76,0.4),rgba(201,168,76,0.15),transparent);margin:14px 16px}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <a class="header-back" href="javascript:history.back()" aria-label="返回">&#x2039;</a>
  <div class="header-title">我的命理档案</div>
  <span class="header-sub">My Fortune Archive</span>
</div>

<!-- Main Content -->
<div id="app">
  <!-- Loading state (default) -->
  <div class="loading" id="loadingState">
    <div class="loading-spinner"></div>
    <div class="loading-text">加载中...</div>
  </div>
</div>

<script>
(function(){
  var app = document.getElementById('app');
  var token = localStorage.getItem('sy_token');

  function showToast(msg, type) {
    var t = document.createElement('div');
    t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;max-width:360px;width:90%;padding:12px 16px;border-radius:8px;font-size:12px;letter-spacing:0.06em;text-align:center;font-family:Noto Serif SC,serif;cursor:pointer;transition:opacity 0.3s;';
    t.style.background = type === 'error' ? 'rgba(180,40,40,0.92)' : 'rgba(23,14,6,0.95)';
    t.style.border = type === 'error' ? '1px solid rgba(220,80,80,0.4)' : '1px solid rgba(201,168,76,0.2)';
    t.style.color = type === 'error' ? 'rgba(255,220,220,0.95)' : 'rgba(255,245,220,0.9)';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.style.opacity = '0'; setTimeout(function(){ t.remove(); }, 300); }, 3000);
  }

  function getReadingTypeIcon(type) {
    var icons = {
      bazi: '命', tarot: '牌', ziwei: '紫', mianxiang: '相',
      hehun: '合', daily: '运', xingming: '名', astrology: '&#10025;',
      liuyao: '爻', lingqian: '签', daliuren: '壬', qimen: '遁',
      fengshui: '宅', geo_fortune: '地'
    };
    return icons[type] || '?';
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    var d = new Date(dateStr);
    var month = d.getMonth() + 1;
    var day = d.getDate();
    var hours = d.getHours();
    var mins = d.getMinutes();
    return month + '/' + day + ' ' + (hours < 10 ? '0' : '') + hours + ':' + (mins < 10 ? '0' : '') + mins;
  }

  function renderLoginPrompt() {
    app.innerHTML =
      '<div class="login-prompt">' +
        '<div class="prompt-icon">🙏</div>' +
        '<div class="prompt-title">登录后查看</div>' +
        '<div class="prompt-desc">请先登录您的善缘账号<br>查看命理咨询记录与AI趋势总结</div>' +
        '<a class="login-btn" href="login.html?redirect=' + encodeURIComponent('history.html') + '">立即登录</a>' +
      '</div>';
  }

  function renderContent(readings) {
    if (!readings || readings.length === 0) {
      var noDataHtml =
        '<div class="empty-state">' +
          '<div class="empty-icon">📖</div>' +
          '<div class="empty-title">暂无咨询记录</div>' +
          '<div class="empty-desc">您还没有命理咨询记录。<br>快去体验算命占卜吧！</div>' +
        '</div>';
      app.innerHTML = noDataHtml;
      return;
    }

    var html = '';

    // Summary button
    html += '<div class="summary-section">' +
      '<button class="summary-btn" id="summaryBtn" onclick="generateSummary(this)">' +
        '<span class="btn-icon">🔮</span><span class="btn-text">总结我近期的命理趋势</span>' +
      '</button>' +
      '<div class="summary-card" id="summaryCard">' +
        '<div class="summary-card-title">&#x2728; 命理趋势总结</div>' +
        '<div class="summary-card-content" id="summaryContent"></div>' +
      '</div>' +
    '</div>';

    // Section title
    html += '<div class="section-title">&#x1F4DC; 近期咨询记录</div>' +
      '<div class="section-desc">最近5次命理咨询，点击可查看详情</div>';

    // Reading list
    html += '<div class="reading-list">';
    for (var i = 0; i < readings.length; i++) {
      var r = readings[i];
      var inputStr = '';
      try {
        var parsed = typeof r.input === 'string' ? JSON.parse(r.input) : r.input;
        var parts = [];
        for (var key in parsed) {
          if (key === 'question') parts.push('问题: ' + String(parsed[key]).slice(0, 60));
          else if (key === 'birthYear') parts.push('出生: ' + parsed[key] + '年' + (parsed.birthMonth || '') + '月');
        }
        inputStr = parts.join(' · ');
      } catch(e) {
        inputStr = String(r.input).slice(0, 80);
      }
      if (!inputStr) inputStr = '点击查看详情';

      var readingBody = '';
      if (r.result) {
        var resultPreview = r.result;
        // Show first 500 chars in preview
        readingBody = '<div class="reading-detail-label">命理报告摘要</div>' +
          '<div class="reading-input-preview">' + escapeHtml(inputStr) + '</div>' +
          '<div class="reading-detail-content">' + escapeHtml(resultPreview) + '</div>';
      }

      html += '<div class="reading-card" onclick="toggleCard(this)">' +
        '<div class="reading-card-header">' +
          '<div class="reading-card-left">' +
            '<span class="reading-type-badge">' + (r.typeName || r.type) + '</span>' +
            '<span class="reading-date">' + formatDate(r.createdAt) + '</span>' +
          '</div>' +
          '<span class="reading-card-arrow">&#x203A;</span>' +
        '</div>' +
        '<div class="reading-card-body">' + readingBody + '</div>' +
      '</div>';
    }
    html += '</div>';
    html += '<div class="gold-line"></div>';

    app.innerHTML = html;
  }

  function escapeHtml(text) {
    if (!text) return '';
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(text));
    return div.innerHTML;
  }

  function toggleCard(el) {
    el.classList.toggle('expanded');
  }

  // Auth check and data fetch
  if (!token) {
    app.innerHTML = '';
    renderLoginPrompt();
    return;
  }

  fetch('/api/chat-history', {
    headers: { 'Authorization': 'Bearer ' + token }
  })
  .then(function(resp) {
    if (resp.status === 401) {
      renderLoginPrompt();
      throw new Error('unauthorized');
    }
    return resp.json();
  })
  .then(function(data) {
    renderContent(data.readings);
  })
  .catch(function(err) {
    if (err.message === 'unauthorized') return;
    app.innerHTML = '<div class="error-card">加载失败，请稍后重试</div>';
    console.error(err);
  });

  // Export generateSummary to global scope
  window.generateSummary = function(btn) {
    if (btn.classList.contains('loading')) return;
    btn.classList.add('loading');
    var btnText = btn.querySelector('.btn-text');
    btnText.textContent = '正在分析命理趋势...';

    fetch('/api/chat-summary', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      }
    })
    .then(function(resp) { return resp.json(); })
    .then(function(data) {
      btn.classList.remove('loading');
      btnText.textContent = '总结我近期的命理趋势';

      var card = document.getElementById('summaryCard');
      var content = document.getElementById('summaryContent');
      if (data.summary) {
        content.textContent = data.summary;
        card.classList.add('show');
      } else {
        showToast('暂无数据可总结', 'error');
      }
    })
    .catch(function(err) {
      btn.classList.remove('loading');
      btnText.textContent = '总结我近期的命理趋势';
      showToast('生成失败，请稍后重试', 'error');
      console.error(err);
    });
  };
})();
</script>
</body>
</html>
