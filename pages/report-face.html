<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#060e0d;--card:#0f1b17;--card-2:#0b1512;
    --ink:#f0ebe0;--ink-2:rgba(240,235,224,.70);--ink-3:rgba(240,235,224,.42);
    --gold:#dcc082;--gold-soft:#e8d49c;--gold-wash:rgba(220,192,130,.14);
    --jade:#4fbfa0;--jade-deep:#0e2b24;--jade-soft:#7DDFC0;--jade-wash:rgba(79,191,160,.12);
    --line:rgba(240,235,224,.10);--line-2:rgba(240,235,224,.17);
    --sans:'Inter',-apple-system,system-ui,sans-serif;--serif:'Cormorant Garamond','Noto Serif SC',serif;
    --rl:20px;--r:14px;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--paper);font-family:var(--sans);color:var(--ink);line-height:1.5;font-feature-settings:"tnum";min-height:100vh}
  .wrap{max-width:430px;margin:0 auto;padding:0 24px 40px;min-height:100vh}
  svg.ic{width:18px;height:18px;stroke:var(--ink-3);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 12px}
  .nav-back{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-3);cursor:pointer;font-weight:500}
  .step{font-size:11px;color:var(--ink-3);letter-spacing:.1em;font-weight:600}
  .rhero{text-align:center;padding:16px 4px 4px}
  .rhero .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .rhero .dv{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);margin:14px auto}
  .rhero h2{font-family:var(--serif);font-size:29px;font-weight:600;line-height:1.24;letter-spacing:-.01em;margin:0 6px}
  .rhero .sub{font-size:12.5px;color:var(--ink-2);margin-top:8px;line-height:1.6}

  /* ── Upload / capture entry (light-theme .tile) ── */
  .up-hero{text-align:center;padding:28px 4px 6px}
  .up-hero .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .up-hero .dv{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);margin:14px auto}
  .up-hero h2{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.26;margin:0 6px}
  .up-hero .sub{font-size:13px;color:var(--ink-2);margin-top:12px;line-height:1.7;padding:0 6px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);padding:22px 20px;margin:20px 0 12px}
  .drop{border:1.5px dashed var(--gold-soft);border-radius:var(--r);min-height:168px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;cursor:pointer;transition:.2s;position:relative;overflow:hidden;background:var(--card-2)}
  .drop:active{background:var(--gold-wash)}
  .drop.has-image{border-style:solid;border-color:var(--gold)}
  .drop-icon{width:52px;height:52px;border-radius:50%;border:1px solid var(--gold-soft);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:24px;color:var(--gold);background:var(--card)}
  .drop-text{font-family:var(--serif);font-size:16px;color:var(--ink);font-weight:600}
  .drop-hint{font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}
  .drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:calc(var(--r) - 1px)}
  .drop .ov{position:absolute;inset:0;background:rgba(38,34,28,.34);display:flex;align-items:center;justify-content:center;border-radius:calc(var(--r) - 1px)}
  .drop .ov span{font-size:12px;color:#fff;letter-spacing:.06em;background:rgba(38,34,28,.6);padding:7px 15px;border-radius:999px}
  input[type=file]{display:none}
  .cap-row{display:flex;gap:10px;margin-top:14px}
  .cap-btn{flex:1;background:var(--card-2);border:1px solid var(--line);border-radius:var(--r);height:48px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--ink);font-weight:500;cursor:pointer;transition:.2s}
  .cap-btn:active{border-color:var(--gold-soft);color:var(--gold)}
  .cap-btn svg{opacity:.7;flex-shrink:0}
  .trust{display:flex;justify-content:center;align-items:center;gap:12px;margin:14px 0 0;color:var(--ink-3);font-size:11px;letter-spacing:.02em;flex-wrap:wrap}
  .trust span{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .trust .d{width:3px;height:3px;border-radius:50%;background:var(--gold-soft)}
  .go{width:100%;background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#fff;border:none;border-radius:var(--r);padding:16px;font-size:15px;font-weight:600;font-family:var(--sans);cursor:pointer;margin-top:16px;box-shadow:0 14px 30px -18px rgba(169,128,58,.5)}
  .go:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .go small{font-weight:400;opacity:.8;font-size:12px}
  .disc-top{text-align:center;font-size:10.5px;color:var(--ink-3);line-height:1.7;padding:12px 20px 0}

  /* ── Report cards (from report-v2) ── */
  .rhero-wrap{padding-top:4px}
  .read{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);padding:20px;margin-bottom:14px}
  .read h3{font-size:14px;font-weight:600;margin-bottom:10px;letter-spacing:.01em}
  .read p{font-size:15px;color:var(--ink-2);line-height:1.75;white-space:pre-wrap}
  .read .lead{font-family:var(--serif);font-size:15px;color:var(--gold);font-weight:600;margin-bottom:8px;line-height:1.5}
  .blur{filter:blur(5px);opacity:.55;user-select:none;pointer-events:none}
  .wall{background:var(--card);border:1px solid var(--gold-soft);border-radius:var(--rl);padding:24px 20px;text-align:center;margin:16px 0;box-shadow:0 14px 34px -20px rgba(169,128,58,.30)}
  .wall h4{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:5px}
  .wall p{font-size:13px;color:var(--ink-2);margin-bottom:18px}
  .wall ul{list-style:none;margin:0 0 18px;text-align:left;max-width:280px;margin-left:auto;margin-right:auto}
  .wall li{font-size:13px;color:var(--ink-2);padding:5px 0 5px 20px;position:relative}
  .wall li::before{content:'◆';position:absolute;left:2px;top:5px;color:var(--gold-soft);font-size:7px;line-height:2.1}
  .cta{width:100%;background:var(--jade-deep);color:#fff;border:none;border-radius:var(--r);padding:16px;font-size:15px;font-weight:600;font-family:var(--sans);cursor:pointer}
  .cta.gold{background:linear-gradient(135deg,var(--gold-soft),var(--gold))}
  .cta:disabled{opacity:.6;cursor:not-allowed}
  .wall .price{font-size:13px;color:var(--ink-3);margin-top:12px}
  .wall .price b{color:var(--gold);font-size:17px;font-weight:600}
  .adv{background:var(--jade-deep);border:1px solid rgba(195,160,90,.20);border-radius:var(--rl);padding:24px 21px;margin:22px 0 8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
  .adv .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);font-weight:600}
  .adv h4{font-family:var(--serif);font-size:21px;font-weight:600;margin:10px 0 4px;color:#fff}
  .adv ul{list-style:none;margin:14px 0}
  .adv li{font-size:13px;color:rgba(255,255,255,.86);padding:6px 0 6px 20px;position:relative}
  .adv li::before{content:'◆';position:absolute;left:2px;top:6px;color:var(--gold-soft);font-size:7px;line-height:2.1}
  .adv .sbtn{width:100%;background:transparent;color:var(--gold-soft);border:1px solid var(--gold-soft);border-radius:var(--r);padding:15px;font-size:14.5px;font-weight:600;margin-top:10px;cursor:pointer}
  .aigc{display:flex;align-items:center;gap:7px;margin:0 0 14px;padding:9px 13px;background:var(--jade-wash);border:1px solid rgba(45,122,98,.2);border-radius:10px;font-size:11px;color:var(--jade);line-height:1.5}
  .aigc b{font-weight:600}
  .reset{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;font-size:12.5px;color:var(--ink-2);padding:14px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;background:var(--card-2);font-weight:500;cursor:pointer}
  .footdisc{text-align:center;padding:8px 20px 0}
  .footdisc .fl{width:80%;height:1px;background:linear-gradient(90deg,transparent,rgba(169,128,58,.25),transparent);margin:0 auto}
  .footdisc .ft{font-size:10px;color:var(--ink-3);letter-spacing:.04em;padding:10px 10px 0;line-height:1.6}

  .skel{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);padding:20px;margin-bottom:14px}
  .skel .ln{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line),rgba(255,255,255,.06),var(--line));background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:11px}

  .err{text-align:center;color:var(--ink-2);font-size:14px;padding:40px 10px}
  .loadmsg{text-align:center;color:var(--gold);font-size:13.5px;font-family:var(--serif);padding:18px 10px 0;letter-spacing:.06em;min-height:20px}
  .hide{display:none!important}
  .crossread{background:var(--card-2);border:1px solid var(--gold-soft);border-radius:var(--rl);padding:22px 20px;margin:22px 0 8px;box-shadow:0 10px 30px -22px rgba(169,128,58,.35)}
  .crossread .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .crossread h4{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--ink);margin:9px 0 6px;line-height:1.24}
  .crossread .fr{font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:16px}
  .crossread .cx{display:flex;align-items:flex-start;gap:13px;background:var(--card);border:1px solid var(--gold-wash);border-radius:var(--r);padding:14px 15px;margin-top:10px;cursor:pointer;transition:transform .12s,border-color .15s;text-align:left;width:100%;text-decoration:none}
  .crossread .cx:active{transform:scale(.98)}
  .crossread .cx:hover{border-color:var(--gold-soft)}
  .crossread .cx>svg{width:26px;height:26px;stroke:var(--gold);stroke-width:1.35;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;margin-top:1px}
  .crossread .cx .cn{font-size:14.5px;font-weight:600;color:var(--ink);font-family:var(--serif)}
  .crossread .cx .ch{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-top:3px}
  .crossread .cx .cg{margin-left:auto;align-self:center;stroke:var(--ink-3);width:16px;height:16px;flex-shrink:0}
</style>

  </div>

  <!-- ═══ STAGE 2 · 加载 ═══ -->
  <div id="loadStage" class="hide">
    <div class="skel"><div class="ln" style="width:60%"></div><div class="ln" style="width:100%"></div><div class="ln" style="width:88%"></div></div>
    <div class="skel"><div class="ln" style="width:45%"></div><div class="ln" style="width:96%"></div><div class="ln" style="width:92%"></div><div class="ln" style="width:70%"></div></div>
    <div class="loadmsg" id="loadmsg">AI 正观三停轮廓、察气色神韵…</div>
  </div>

  <!-- ═══ STAGE 3 · 报告 ═══ -->
  <div id="reportStage" class="hide">
    <div id="hero"></div>
    <div id="body"></div>
  </div>
</div>

    advBtn:'订阅 Runae 顾问 · $9.9 / 月',
    resetLine:'↻ 换张照片 · 重新解读',
    footdisc:'相由心生，气随神转。相理呈现的是当下格局与倾向，非定数；仅供娱乐参考，切勿沉迷。照片已用于本次分析后即丢弃，不作留存。',
    ckCn:'国内用户请用微信 / 支付宝支付（接入中）',
    ckFail:'跳转支付失败，请重试',
    ckNet:'网络异常，请重试',
    ckGoing:'跳转支付…'
  };

  // 应用静态文案
  (function applyI18n(){
    try{
      document.documentElement.lang = EN ? 'en' : 'zh-CN';
      document.title = T.title;
      var set=function(id,html){var el=document.getElementById(id);if(el)el.innerHTML=html;};
      set('navBack',T.navBack); set('stepLabel',T.step);
      set('upK',T.upK); set('upH',T.upH); set('upSub',T.upSub);
      set('dropText',T.dropText); set('dropHint',T.dropHint);
      set('capAlbum',T.capAlbum); set('capCamera',T.capCamera);
      set('trust1',T.trust1); set('trust2',T.trust2); set('trust3',T.trust3);
      set('discTop',T.discTop);
      var lm=document.getElementById('loadmsg'); if(lm)lm.textContent=T.loadMsgInit;
      var gb=document.getElementById('goBtn'); if(gb)gb.innerHTML=T.goIdle;
    }catch(e){}
  })();

  // ── 照片上传（对齐 mianxiang.html 格式：存 window._mxImageData{base64,mimeType}）──
  function pickFile(){ document.getElementById('fileInput').click(); }
  function pickAlbum(){ var i=document.getElementById('fileInput'); i.removeAttribute('capture'); i.click(); }
  function openCamera(){ var i=document.getElementById('fileInput'); i.setAttribute('capture','user'); i.click(); }

  function handleFile(input){
    if(!input.files[0]) return;
    var file = input.files[0];
    var reader = new FileReader();
    reader.onload = function(e){
      var dataUrl = e.target.result;
      var commaIdx = dataUrl.indexOf(',');
      window._mxImageData = {
        base64: commaIdx !== -1 ? dataUrl.slice(commaIdx + 1) : dataUrl,
        mimeType: file.type || 'image/jpeg'
      };
      var drop = document.getElementById('drop');
      drop.innerHTML = '<img src="'+dataUrl+'" alt=""><div class="ov"><span>'+(EN?'Uploaded · tap to change':'已上传 · 点击更换')+'</span></div>';
      drop.classList.add('has-image');
      hasImage = true;
      var btn = document.getElementById('goBtn');
      btn.innerHTML = T.goReady;
      btn.disabled = false;
    };
    reader.readAsDataURL(file);
  }

  /* -- Cross-Reading (交叉印证) component -- */
  var CROSS_CUR='face';
  var CROSS_META={
    bazi:{glyph:'<path d="M7 6v20M13 6v20M19 6v20M25 6v20"/>',n:{zh:'八字命理',en:'BaZi'},page:'report-v2.html',
      h:{zh:'从出生的四柱看你的先天格局，把此刻的困惑放回一整条人生曲线里。',en:'Your birth chart maps the whole arc — the deep pattern behind what you\'re feeling right now.'}},
    hehun:{glyph:'<circle cx="12" cy="16" r="7.5"/><circle cx="20" cy="16" r="7.5"/>',n:{zh:'合婚',en:'Compatibility'},page:'report-hehun.html',
      h:{zh:'把你和那个人放在一起看，两张盘怎么咬合、哪里需要磨合，一目了然。',en:'Put your chart next to your partner\'s and see exactly where you fit — and where you grind.'}},
    tarot:{glyph:'<rect x="6" y="8" width="12" height="18" rx="2" transform="rotate(-8 12 17)"/><rect x="15" y="6" width="12" height="18" rx="2" transform="rotate(8 21 15)"/>',n:{zh:'塔罗',en:'Tarot'},page:'report-tarot.html',
      h:{zh:'命盘讲长期趋势，塔罗回答此刻那件具体的事——该走还是该留。',en:'Your chart shows the long game; a card answers the one thing weighing on you today.'}},
    astro:{glyph:'<circle cx="16" cy="16" r="6"/><path d="M16 3v3M16 26v3M3 16h3M26 16h3M6.6 6.6l2.1 2.1M23.3 23.3l2.1 2.1M25.4 6.6l-2.1 2.1M8.7 23.3l-2.1 2.1"/>',n:{zh:'星座占星',en:'Astrology'},page:'report-astrology.html',
      h:{zh:'西方星盘从另一套坐标读你的性格与关系，常和东方命理指向同一个答案。',en:'Your Western chart reads the same you through a different lens — and usually lands on the same answer.'}},
    daily:{glyph:'<path d="M24 20a9 9 0 1 1-8-13 7 7 0 0 0 8 13z"/>',n:{zh:'每日运势',en:'Daily Horoscope'},page:'report-daily.html',
      h:{zh:'把大格局落到今天：今天宜什么、忌什么，天天更新。',en:'Brings the big picture down to today — what to lean into, what to avoid, refreshed daily.'}},
    palm:{glyph:'<path d="M11 26v-6M11 20V9a2 2 0 0 1 4 0v7M15 16V7a2 2 0 0 1 4 0v9M19 16v-5a2 2 0 0 1 4 0v9a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-3-5a2 2 0 0 1 3.4-2z"/>',n:{zh:'手相',en:'Palm Reading'},page:'report-palm.html',
      h:{zh:'掌纹记录的是后天的走势，和先天命盘对照着看，更立体。',en:'Your palm tracks how life is actually unfolding — a living counterpart to your birth chart.'}},
    face:{glyph:'<circle cx="16" cy="16" r="11"/><path d="M12 14h.01M20 14h.01M12 20a5 4 0 0 0 8 0"/>',n:{zh:'面相',en:'Face Reading'},page:'report-face.html',
      h:{zh:'五官里的运势密码，和命盘相互印证，看得见的另一层线索。',en:'The story in your features — a visible layer that echoes what your chart already hints at.'}}
  };
  var CROSS_DEFAULT={bazi:['astro','tarot'],hehun:['bazi','tarot'],tarot:['bazi','astro'],astro:['bazi','tarot'],daily:['bazi','astro'],palm:['bazi','face'],face:['bazi','palm']};
  function crossPick(){
    var asp=[];try{asp=(JSON.parse(localStorage.getItem('runae_profile')||'{}').aspects)||[];}catch(e){}
    var out=[];
    function add(list){list.forEach(function(m){if(m!==CROSS_CUR&&out.indexOf(m)<0)out.push(m);});}
    if(asp.indexOf('love')>-1) add(['hehun','tarot','astro']);
    if(asp.indexOf('career')>-1||asp.indexOf('wealth')>-1) add(['bazi','astro','tarot']);
    if(asp.indexOf('health')>-1) add(['bazi','palm','daily']);
    add(CROSS_DEFAULT[CROSS_CUR]||['bazi','astro']);
    return out.slice(0,3);
  }
  function crossReadHTML(){
    var picks=crossPick();if(!picks.length)return '';
    var L=EN?'en':'zh';
    var head=EN?'The same you, seen from every angle':'同一个你，多重印证';
    var fr=EN?'One profile. Every tradition weighs in — and they rarely disagree.':'一份命盘，多种传承一起看——它们很少各说各话。';
    var kk=EN?'Cross-Reading · Runae':'交叉印证 · Runae';
    var chev='<svg class="cg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
    var cards=picks.map(function(m){
      var meta=CROSS_META[m];if(!meta)return '';
      return '<a class="cx" href="'+meta.page+'?lang='+LANG+'"><svg viewBox="0 0 32 32">'+meta.glyph+'</svg>'
        +'<div><div class="cn">'+esc(meta.n[L])+'</div><div class="ch">'+esc(meta.h[L])+'</div></div>'+chev+'</a>';
    }).join('');
    return '<div class="crossread"><div class="k">'+esc(kk)+'</div><h4>'+esc(head)+'</h4><div class="fr">'+esc(fr)+'</div>'+cards+'</div>';
  }
  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
  // 剥离标题前的 emoji / markdown # 记号（与 report-v2 sections 一致）
  var HEAD=/^\s*([【✅📜🌟💰❤💼🌿☀🔮⛰✨🙏💕🏥]|#{1,3}\s|[\uD83C-\uDBFF])/;

  // 段落解析：emoji/井号标题行→章节；其余→正文（对齐 report-v2.html sections）
  function sections(text){
    var lines=text.split('\n'),secs=[],cur=null;
    lines.forEach(function(raw){
      var l=raw.replace(/\s+$/,''); if(!l.trim())return;
      if(l.trim()==='---') return;
      var isH = HEAD.test(l) && l.trim().length<40;
      if(isH){
        // 剥 emoji / ## / ### / 【】 / 星标，保留纯标题文字
        var t=l.replace(/^#{1,3}\s*/,'').replace(/[\uD800-\uDFFF←-⯿☀-➿️#*【】]/g,'').trim();
        cur={t:t,b:[]};secs.push(cur);
      }else{ if(!cur){cur={t:'',b:[]};secs.push(cur);} cur.b.push(l.trim()); }
    });
    return secs.filter(function(s){return s.t||s.b.length;});
  }
  // 正文里去掉漏进的字数指令 (200字)/(150 words)/约2500字
  function stripCount(s){
    return String(s==null?'':s)
      .replace(/[（(]\s*(?:约|about|approx\.?|~)?\s*\d[\d,]*\s*(?:字|个?字|words?|字数?)\s*[)）]/gi,'')
      .trim();
  }

  function fail(msg){
    document.getElementById('loadStage').classList.add('hide');
    document.getElementById('reportStage').classList.remove('hide');
    document.getElementById('hero').innerHTML='';
    document.getElementById('body').innerHTML='<div class="err">'+esc(msg)+'<br><br><button class="cta" style="max-width:220px;margin:14px auto 0" onclick="resetToUpload()">'+esc(T.resetBtn)+'</button></div>';
  }

  function resetToUpload(){
    if(loadTimer){ clearInterval(loadTimer); loadTimer=null; }
    document.getElementById('reportStage').classList.add('hide');
    document.getElementById('loadStage').classList.add('hide');
    document.getElementById('uploadStage').classList.remove('hide');
    var drop=document.getElementById('drop');
    drop.innerHTML='<div class="drop-icon">面</div><div class="drop-text">'+esc(T.dropText)+'</div><div class="drop-hint">'+esc(T.dropHint)+'</div>';
    drop.classList.remove('has-image');
    hasImage=false; window._mxImageData=null;
    var btn=document.getElementById('goBtn');
    btn.innerHTML=T.goIdle; btn.disabled=true;
    window.scrollTo(0,0);
  }

  // ── 加载文案轮播（观相仪式）──
  function startLoadRitual(){
    var lines=T.loadLines;
    var el=document.getElementById('loadmsg'); var i=0;
    el.textContent=lines[0];
    loadTimer=setInterval(function(){ i=(i+1)%lines.length; el.style.opacity=0;
      setTimeout(function(){ el.textContent=lines[i]; el.style.opacity=1; },220); },2600);
  }

  // ── 调 /api/mianxiang ──
  function startAnalysis(){
    if(!hasImage) return;
    var imageBase64 = window._mxImageData ? window._mxImageData.base64 : null;
    var mimeType = window._mxImageData ? window._mxImageData.mimeType : 'image/jpeg';
    if(!imageBase64){ resetToUpload(); return; }

    var btn=document.getElementById('goBtn'); btn.disabled=true; btn.innerHTML=T.goBusy;

    document.getElementById('uploadStage').classList.add('hide');
    document.getElementById('loadStage').classList.remove('hide');
    window.scrollTo(0,0);
    startLoadRitual();

    var token = localStorage.getItem('sy_token') || '';
    fetch('/api/mianxiang',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({ question:EN?'Please give me a complete face reading using the Ma Yi physiognomy system':'请按麻衣神相体系给我做一次完整的面相分析', imageBase64:imageBase64, mimeType:mimeType, lang:LANG })
    })
    .then(function(res){
      if(!res.ok) return res.json().then(function(e){
        if(e && e.code==='need_photo') throw new Error(T.needPhoto);
        if(e && e.code==='no_face') throw new Error(T.noFace);
        throw new Error(e.error||(T.serverErr+res.status));
      });
      return res.json();
    })
    .then(function(data){
      if(loadTimer){ clearInterval(loadTimer); loadTimer=null; }
      if(!data || !data.reading) throw new Error(T.emptyReading);
      renderReport(data.reading, data.tier, data.locked);
    })
    .catch(function(err){
      if(loadTimer){ clearInterval(loadTimer); loadTimer=null; }
      fail(T.genProblem+(err.message||T.tryLater));
    });
  }

  // ── 渲染报告（.read 分段 + 付费墙 + advisor）──
  function renderReport(reading, tier, locked){
    document.getElementById('loadStage').classList.add('hide');
    document.getElementById('reportStage').classList.remove('hide');
    var hero=document.getElementById('hero'), body=document.getElementById('body');

    var isLocked = (locked===true) || (tier==='free') || (tier==='basic');

    // ── 按 ---LOCKED--- 干净切分：分隔符之前为免费正文（全展示），之后为锁定预告 ──
    var parts=(reading||'').split(/---LOCKED---/i);
    var free=parts[0]||'', lockedPreview=parts[1]||'';
    // 去掉可能漏进免费正文头部的技术行
    free=free.replace(/^📜[^\n]*\n/,'').replace(/^公历[^\n]*\n/,'');

    hero.innerHTML='<div class="rhero"><div class="k">'+esc(T.heroK)+'</div><div class="dv"></div><h2>'+T.heroH+'</h2><div class="sub">'+esc(T.heroSub)+'</div></div>';

    // AIGC 标识
    var html='<div class="aigc"><span>🤖</span><span>'+T.aigc+'</span></div>';

    // 免费正文分段渲染为 .read 卡
    var secs=sections(free);
    if(!secs.length) secs=[{t:T.fallbackTitle,b:[free]}];
    secs.forEach(function(s){
      var bodyText=s.b.map(function(l){return stripCount(l);}).join('\n');
      html+='<div class="read">'+(s.t?'<h3>'+esc(stripCount(s.t))+'</h3>':'')+'<p>'+md(bodyText)+'</p></div>';
    });

    // 锁定预告（模糊呈现，转化交给付费墙）
    if(isLocked && lockedPreview.trim()){
      var preview=lockedPreview.replace(/^\s+/,'').split('\n').filter(function(l){return l.trim();}).slice(0,4).join(' · ');
      html+='<div class="read"><h3>'+esc(T.deeperTitle)+'</h3><p class="blur">'+md(stripCount(preview)).slice(0,140)+'……</p></div>';
    }

    // 付费墙
    if(isLocked){
      html+='<div class="wall"><h4>'+esc(T.wallH)+'</h4><p>'+esc(T.wallP)+'</p>'
        +'<ul>'+T.wallLi.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>'
        +'<button class="cta gold" id="unlockBtn" onclick="goCheckout(\'mianxiang_full\')">'+esc(T.wallBtn)+'</button>'
        +'<div class="price">'+T.wallPrice+'</div></div>';
    }

    html+=crossReadHTML();
    // Runae 顾问 advisor
    html+='<div class="adv"><div class="k">'+esc(T.advK)+'</div><h4>'+T.advH+'</h4>'
      +'<ul>'+T.advLi.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>'
      +'<button class="sbtn" onclick="goCheckout(\'member_monthly\')">'+esc(T.advBtn)+'</button></div>';

    // 换照重测
    html+='<div class="reset" onclick="resetToUpload()">'+esc(T.resetLine)+'</div>';

    // 合规免责页脚
    html+='<div class="footdisc"><div class="fl"></div><div class="ft">'+esc(T.footdisc)+'</div></div>';

    body.innerHTML=html;
    window.scrollTo(0,0);
  }

  window.goCheckout=function(product){
    var btn=document.getElementById('unlockBtn');
    if(product==='mianxiang_full' && btn){ btn.disabled=true; btn.textContent=T.ckGoing; }
    fetch('/api/create-checkout',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({product:product,token:localStorage.getItem('sy_token')||'',
        successUrl:location.origin+'/pages/report-face.html?paid=1&lang='+LANG,cancelUrl:location.href})})
     .then(function(r){return r.json();}).then(function(d){
       if(d.url){ location.href=d.url; }
       else if(d.channel==='cn'){ alert(T.ckCn); if(btn){btn.disabled=false;btn.textContent=T.wallBtn;} }
       else { alert(T.ckFail); if(btn){btn.disabled=false;btn.textContent=T.wallBtn;} }
     }).catch(function(){ alert(T.ckNet); if(btn){btn.disabled=false;btn.textContent=T.wallBtn;} });
  };
</script>
