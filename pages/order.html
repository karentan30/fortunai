<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  /* ── cosmos ── */
  --void-0:#08040f;--void:#0f0820;--indigo:#1a1035;--indigo-2:#231545;
  /* ── gold ── */
  --gold-hi:#f4e6b6;--gold:#dcc082;--gold-deep:#9a7530;--gold-soft:#e8d49c;
  --gold-line:rgba(220,192,130,.26);--gold-line-2:rgba(220,192,130,.48);--gold-glow:rgba(220,192,130,.4);
  /* ── violet accent ── */
  --star:#d3b6ff;--star-soft:#b492ea;--violet-line:rgba(176,120,255,.28);--violet-line-2:rgba(176,120,255,.48);--violet-glow:rgba(176,120,255,.5);
  /* ── text ── */
  --text-cream:#efeafa;--text-mute:#b0a6cf;--text-faint:#867ba6;--text-ghost:#5f5680;
  /* ── hair ── */
  --hair:rgba(206,190,255,.09);--hair-2:rgba(206,190,255,.16);
  --shadow-card:0 30px 60px -30px rgba(0,0,0,.9);--shadow-lift:0 20px 40px -24px rgba(0,0,0,.78);
  --serif:"Noto Serif SC",serif;--lat:"Cormorant Garamond",serif;
}

html,body{background:var(--void-0);font-family:var(--serif);color:var(--text-cream);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--gold);text-decoration:none}

/* ── cosmos background ── */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(135% 80% at 50% -8%,#3a2070 0%,#1e1040 38%,#100a20 72%,var(--void-0) 100%)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.7;
  background-image:radial-gradient(circle,rgba(236,223,255,.65) 1px,transparent 1px),radial-gradient(circle,rgba(244,230,182,.35) 1px,transparent 1px),radial-gradient(circle,rgba(211,182,255,.4) 1px,transparent 1px);
  background-size:130px 130px,90px 90px,170px 170px;background-position:18px 22px,65px 44px,32px 85px}

/* ── Page layout ── */
.page-wrap{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:0 0 140px}

/* ── Back button ── */
.back-btn{position:fixed;top:16px;left:16px;z-index:99;background:rgba(15,8,32,.7);border:1px solid var(--violet-line);border-radius:20px;font-family:var(--lat);font-size:12px;color:rgba(220,192,130,.7);cursor:pointer;padding:5px 14px;letter-spacing:.1em;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:border-color .2s,color .2s}
.back-btn:active{transform:scale(0.97);color:var(--gold)}

/* ── Theme toggle ── */
.theme-toggle{position:fixed;top:16px;right:16px;z-index:99;background:rgba(15,8,32,.7);border:1px solid var(--violet-line);border-radius:20px;font-size:14px;cursor:pointer;padding:5px 10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* ── Cover hero ── */
.order-cover{text-align:center;padding:72px 24px 40px;border-bottom:1px solid var(--gold-line);position:relative}
.order-cover::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:60%;height:1px;background:linear-gradient(90deg,transparent,var(--gold-line-2),transparent)}
.order-brand{font-family:var(--lat);font-style:italic;font-size:11px;letter-spacing:.36em;color:rgba(220,192,130,.5);margin-bottom:20px}
.order-glyph{font-size:36px;color:var(--gold-soft);margin-bottom:16px;opacity:.9;animation:glyphFloat 4s ease-in-out infinite}
@keyframes glyphFloat{0%,100%{transform:translateY(0) scale(1);opacity:.9}50%{transform:translateY(-5px) scale(1.05);opacity:1}}
.order-title{font-family:var(--serif);font-size:28px;font-weight:300;letter-spacing:.2em;color:var(--text-cream);margin-bottom:8px;text-shadow:0 2px 24px rgba(176,120,255,.2)}
.order-sub{font-family:var(--lat);font-style:italic;font-size:12px;letter-spacing:.28em;color:rgba(220,192,130,.45)}

/* ── Step indicator ── */
.steps{display:flex;align-items:center;padding:28px 32px 0;position:relative;z-index:1}
.step-dot{width:28px;height:28px;border-radius:50%;border:1px solid var(--violet-line);display:flex;align-items:center;justify-content:center;font-family:var(--lat);font-size:13px;color:var(--text-ghost);flex-shrink:0;transition:all .3s}
.step-dot.active{border-color:var(--gold-line-2);background:rgba(220,192,130,.1);color:var(--gold-soft);box-shadow:0 0 14px rgba(220,192,130,.15)}
.step-dot.done{border-color:rgba(130,220,180,.4);background:rgba(130,220,180,.08);color:rgba(130,220,180,.7)}
.step-line{flex:1;height:1px;background:var(--hair);margin:0 6px}
.step-line.done{background:rgba(130,220,180,.25)}

/* ── Section label ── */
.section-label{font-size:9px;letter-spacing:.26em;color:var(--text-faint);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-family:var(--lat)}
.section-label::before,.section-label::after{content:'';flex:1;height:1px;background:var(--hair)}

/* ── Form sections ── */
.form-section{position:relative;z-index:1;padding:24px 20px 0}

/* ── Field group ── */
.field-group{background:linear-gradient(180deg,var(--indigo-2),var(--indigo));border:1px solid var(--hair-2);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-lift)}
.field-row{display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--hair)}
.field-row:last-child{border-bottom:none}
.field-label{font-size:11px;color:var(--text-faint);letter-spacing:.08em;min-width:72px;flex-shrink:0;font-family:var(--lat)}
.field-input{flex:1;background:none;border:none;outline:none;font-family:var(--serif);font-size:13px;color:var(--text-cream);padding:15px 10px;letter-spacing:.04em}
.field-input::placeholder{color:var(--text-ghost)}
.field-select{flex:1;background:none;border:none;outline:none;font-family:var(--serif);font-size:13px;color:var(--text-cream);padding:15px 10px;letter-spacing:.04em;-webkit-appearance:none;cursor:pointer}
.field-select option{background:var(--indigo);color:var(--text-cream)}
.field-textarea{width:100%;background:none;border:none;outline:none;font-family:var(--serif);font-size:13px;color:var(--text-mute);padding:16px 18px;letter-spacing:.04em;line-height:1.9;resize:none;min-height:100px}
.field-textarea::placeholder{color:var(--text-ghost)}
.char-count{font-size:9px;color:var(--text-ghost);text-align:right;padding:0 18px 12px;font-family:var(--lat)}

/* ── Temple picker ── */
.temple-picker{position:relative;z-index:1;padding:24px 20px 0}
.temple-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.temple-option{background:linear-gradient(180deg,var(--indigo-2),var(--indigo));border:1px solid var(--hair-2);border-radius:14px;padding:14px 14px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow-lift)}
.temple-option.selected{border-color:var(--gold-line-2);background:linear-gradient(180deg,rgba(220,192,130,.1),rgba(220,192,130,.03));box-shadow:0 0 20px rgba(220,192,130,.12)}
.temple-name{font-size:14px;letter-spacing:.1em;color:var(--text-cream);margin-bottom:2px}
.temple-loc{font-size:10px;color:var(--gold-soft);letter-spacing:.08em;margin-bottom:7px;font-family:var(--lat)}
.temple-tags{display:flex;flex-wrap:wrap;gap:4px}
.ttag{font-size:8px;color:rgba(211,182,255,.6);border:1px solid var(--violet-line);border-radius:10px;padding:2px 7px;letter-spacing:.06em}

/* ── Timing grid ── */
.timing-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.timing-opt{background:linear-gradient(180deg,var(--indigo-2),var(--indigo));border:1px solid var(--hair-2);border-radius:14px;padding:14px 14px;cursor:pointer;transition:all .2s;text-align:center;box-shadow:var(--shadow-lift)}
.timing-opt.selected{border-color:var(--gold-line-2);background:linear-gradient(180deg,rgba(220,192,130,.1),rgba(220,192,130,.03));box-shadow:0 0 16px rgba(220,192,130,.12)}
.timing-name{font-size:13px;color:var(--text-cream);letter-spacing:.08em;margin-bottom:4px}
.timing-desc{font-size:9px;color:var(--text-faint);letter-spacing:.04em}

/* ── Items summary ── */
.items-summary{position:relative;z-index:1;padding:24px 20px 0}
.item-row{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;background:linear-gradient(180deg,var(--indigo-2),var(--indigo));border-bottom:1px solid var(--hair)}
.item-row:first-child{border-radius:18px 18px 0 0}
.item-row:last-child{border-bottom:none;border-radius:0 0 18px 18px}
.item-name{font-size:12px;color:var(--text-mute);letter-spacing:.04em}
.item-price{font-family:var(--lat);font-size:17px;color:var(--gold-soft)}
.item-price .unit{font-family:var(--serif);font-size:10px}

/* ── Form note / disclaimer ── */
.form-note{position:relative;z-index:1;font-size:9px;color:var(--text-ghost);text-align:center;padding:24px 28px 0;line-height:1.9;letter-spacing:.04em;opacity:.8}

/* ── Submit bar ── */
.submit-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:10;background:linear-gradient(0deg,rgba(8,4,15,.98) 0%,rgba(15,8,32,.94) 100%);border-top:1px solid var(--gold-line);padding:14px 20px 20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.total-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.total-label{font-size:11px;color:var(--text-faint);letter-spacing:.1em;font-family:var(--lat)}
.total-amount{font-family:var(--lat);font-size:28px;color:var(--gold-soft)}
.total-amount .unit{font-family:var(--serif);font-size:12px;color:var(--gold)}
.btn-submit{position:relative;overflow:hidden;width:100%;padding:15px 0;background:linear-gradient(135deg,var(--gold-deep),var(--gold),var(--gold-hi),var(--gold));border:none;border-radius:50px;color:#08040f;font-family:var(--serif);font-size:14px;font-weight:700;letter-spacing:.22em;cursor:pointer;box-shadow:0 6px 24px rgba(220,192,130,.32)}
.btn-submit::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-18deg);animation:btnSheen 3.6s ease-in-out infinite}
@keyframes btnSheen{0%,72%{left:-60%}88%,100%{left:130%}}
.btn-submit:active{transform:scale(0.97)}
.btn-submit:disabled{opacity:.55;pointer-events:none}

/* ── animations ── */
@keyframes rpFadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.form-section,.temple-picker,.items-summary{animation:rpFadeUp .45s ease both}

/* ── Responsive ── */
@media(max-width:375px){
  .order-title{font-size:22px}
  .steps{padding:24px 20px 0}
  .temple-grid,.timing-grid{gap:6px}
  .temple-option,.timing-opt{padding:11px 10px}
}
</style>

<script>
function showToast(msg, type) {
  var t = document.createElement('div');
  t.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;max-width:360px;width:90%;padding:12px 16px;border-radius:8px;font-size:12px;letter-spacing:0.06em;text-align:center;font-family:Noto Serif SC,serif;cursor:pointer;';
  t.style.background = type === 'error' ? 'rgba(180,40,40,0.92)' : 'rgba(23,14,6,0.95)';
  t.style.border = type === 'error' ? '1px solid rgba(220,80,80,0.4)' : '1px solid rgba(201,168,76,0.2)';
  t.style.color = type === 'error' ? 'rgba(255,220,220,0.95)' : 'rgba(255,245,220,0.9)';
  t.textContent = msg;
  t.onclick = function(){ t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(function(){ t.remove(); },300); };
  document.body.appendChild(t);
  if (t._toastTimer) clearTimeout(t._toastTimer);
  t._toastTimer = setTimeout(function(){ t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(function(){ t.remove(); },300); }, 3000);
}
var TEMPLES_DATA = [
  { id:'yonghegong', name:'雍和宫', loc:'北京', tags:['求财','消灾'] },
  { id:'putuo', name:'普陀山', loc:'浙江', tags:['求子','姻缘'] },
  { id:'lingyin', name:'灵隐寺', loc:'杭州', tags:['求财','学业'] },
  { id:'wutai', name:'五台山', loc:'山西', tags:['智慧','考运'] },
  { id:'emei', name:'峨眉山', loc:'四川', tags:['健康','消灾'] },
  { id:'jiuhua', name:'九华山', loc:'安徽', tags:['超度','祖先'] },
  { id:'guandi', name:'关帝庙', loc:'全国', tags:['生意','化煞'] },
  { id:'jiming', name:'鸡鸣寺', loc:'南京', tags:['姻缘','脱单'] }
];

var selectedTemple = null;
var selectedTiming = null;

// URL params
var params = new URLSearchParams(window.location.search);
var preTemple = params.get('temple');
var preTempleName = params.get('templeName');

// Render temple picker
var tg = document.getElementById('templePicker');
TEMPLES_DATA.forEach(function(t) {
  var tags = t.tags.map(function(tag){ return '<span class="ttag">'+tag+'</span>'; }).join('');
  var div = document.createElement('div');
  div.className = 'temple-option' + (t.id === preTemple ? ' selected' : '');
  div.dataset.id = t.id;
  div.innerHTML = '<div class="temple-name">'+t.name+'</div><div class="temple-loc">'+t.loc+'</div><div class="temple-tags">'+tags+'</div>';
  div.onclick = function() {
    document.querySelectorAll('.temple-option').forEach(function(el){ el.classList.remove('selected'); });
    this.classList.add('selected');
    selectedTemple = this.dataset.id;
  };
  tg.appendChild(div);
});
if (preTemple) selectedTemple = preTemple;

// Total from localStorage or URL
var total = 0;
try {
  var t = localStorage.getItem('sy_cart_total');
  if (t) total = parseInt(t);
} catch(e) {}
if (!total) total = parseInt(params.get('total') || 0);
document.getElementById('finalTotal').textContent = total || '--';

function updateCount(el) {
  document.getElementById('wishCount').textContent = el.value.length + ' / 200';
}

function selectTiming(el) {
  document.querySelectorAll('.timing-opt').forEach(function(o){ o.classList.remove('selected'); });
  el.classList.add('selected');
  selectedTiming = el.querySelector('.timing-name').textContent;
}

function submitOrder() {
  var donor = document.getElementById('donorName').value.trim();
  var wish = document.getElementById('wishText').value.trim();
  var contact = document.getElementById('contact').value.trim();
  var recipient = document.getElementById('recipientName').value.trim();
  var special = document.getElementById('specialReq').value.trim();
  if (!donor) { showToast('请填写施主姓名'); return; }
  if (!wish) { showToast('请填写祝愿词'); return; }
  if (!selectedTemple) { showToast('请选择焚化道场'); return; }
  if (!contact) { showToast('请填写联系方式，用于发回视频'); return; }
  var totalText = document.getElementById('finalTotal').textContent;
  if (totalText === '--') { showToast('请先选择冥器套餐', 'error'); return; }
  var total = totalText;
  var btn = document.querySelector('.btn-submit');
  btn.disabled = true;
  btn.textContent = '提交中…';
  fetch('/api/order', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      donorName: donor,
      wishText: wish,
      contact: contact,
      recipientName: recipient || '未指定',
      temple: selectedTemple,
      timing: selectedTiming,
      total: parseInt(total) || 0,
      specialReq: special
    })
  }).then(function(r){ return r.json(); }).then(function(data){
    if(data.success) {
      try { localStorage.removeItem('sy_cart_total'); localStorage.removeItem('sy_cart_items'); } catch(e) {}
      showToast('发愿已提交！师傅将在48小时内与您联系确认。愿善缘相伴，心愿达成。');
      window.location.href = '/';
    } else {
      showToast('提交失败：' + (data.error || '请重试'), 'error');
      btn.disabled = false;
      btn.textContent = '确认发愿 · 提交代供';
    }
  }).catch(function(){
    showToast('网络异常，请重试', 'error');
    btn.disabled = false;
    btn.textContent = '确认发愿 · 提交代供';
  });
}
</script>

<script>
(function(){var t=localStorage.getItem('sy_theme');if(t==='light'){document.documentElement.classList.add('light-mode');var b=document.getElementById('themeToggle');if(b)b.textContent='☀️';}})();
function toggleTheme(){var e=document.documentElement;var b=document.getElementById('themeToggle');e.classList.toggle('light-mode');var l=e.classList.contains('light-mode');if(b)b.textContent=l?'☀️':'🌙';localStorage.setItem('sy_theme',l?'light':'dark');}
</script>
<script src="/assets/js/common.js"></script>
</body>
