/* ── Design tokens — rice-paper base, bazi/ziwei family ── */

     FUNCTIONAL JS — unchanged from original

<script>
var BASE = '';
var refState = { ref_code: '', share_url: '', share_text: '' };

// B 用 A 的邀请链接落地此页时，先把 ?ref= 存 localStorage，后续注册时带给后端
(function(){ try { var r = new URLSearchParams(location.search).get('ref'); if (r) localStorage.setItem('sy_ref_code', r.trim().toUpperCase()); } catch(e){} })();

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type||'');
  t.onclick = function(){ t.className = 'toast'; };
  if (t._toastTimer) clearTimeout(t._toastTimer);
  t._toastTimer = setTimeout(function(){ t.className = 'toast'; }, 3000);
}

function getToken() { return localStorage.getItem('sy_token'); }

function copyText(text) {
  var textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch(e) { ok = false; }
  document.body.removeChild(textarea);
  return ok;
}

function copyCode() {
  if (!refState.ref_code) return;
  if (copyText(refState.ref_code)) showToast('邀请码已复制', 'success');
  else showToast('复制失败，请手动复制', 'error');
}

function copyLink() {
  var btn = document.getElementById('copyLinkBtn');
  var link = refState.share_url;
  if (!link) return;
  btn.disabled = true;
  if (copyText(link)) showToast('邀请链接已复制，快去分享吧', 'success');
  else showToast('复制失败，请手动复制', 'error');
  setTimeout(function(){ btn.disabled = false; }, 800);
}

function handleShare() {
  var btn = document.getElementById('shareBtn');
  var text = refState.share_text || '我在善缘算了命,挺准的,你也来测测缘分。';
  var url = refState.share_url || '';
  if (navigator.share) {
    btn.disabled = true;
    navigator.share({ title: '善缘 · 邀你同修', text: text, url: url })
      .catch(function(){})
      .finally(function(){ btn.disabled = false; });
    return;
  }
  // Fallback: copy combined text + link
  var combined = url ? (text + ' ' + url) : text;
  if (copyText(combined)) showToast('已复制邀请文案，粘贴给好友即可', 'success');

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

}

function copyShareText(platform) {
  var text = _sharePlatformTexts[platform] || '';
  if (!text) return;
  if (copyText(text)) showToast('文案已复制，粘贴即可发送 🎉', 'success');
  else showToast('复制失败，请手动复制', 'error');
}

function generateQR(url) {
  var box = document.getElementById('qrCodeBox');
  if (!box || !url) return;
  box.innerHTML = '';
  try {
    new QRCode(box, {
      text: url,
      width: 128,
      height: 128,
      colorDark: '#1a1208',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  } catch(e) {
    box.innerHTML = '<span style="font-size:10px;color:rgba(80,70,55,0.5);letter-spacing:0.06em">二维码生成失败</span>';
  }
}

function loadReferral(token) {
  return fetch(BASE + '/api/referral/mine', {
    headers: { 'Authorization': 'Bearer ' + token }
  }).then(function(r){
    if (r.status === 401 || r.status === 403) { throw { auth: true }; }
    if (!r.ok) throw new Error('referral load failed');
    return r.json();
  }).then(function(d){
    refState.ref_code = d.ref_code || '';
    refState.share_url = d.share_url || '';
    refState.share_text = d.share_text || '';
    // 缓存自己的邀请码到 localStorage，供 bazi/saju 分享函数用
    if (d.ref_code) localStorage.setItem('sy_my_ref_code', d.ref_code);
    document.getElementById('refCode').textContent = d.ref_code || '—';
    document.getElementById('shareUrl').textContent = d.share_url || '—';
    document.getElementById('invitedVal').textContent = (d.invited_count != null ? d.invited_count : '0');
    // QR code
    if (d.share_url) generateQR(d.share_url);
    // Platform share texts
    if (d.ref_code && d.share_url) buildPlatformTexts(d.share_url, d.ref_code);
  });
}

(function init(){
  // 中元节横幅
  if (isZhongyuanSeason()) {
    var banner = document.getElementById('zyBanner');
    if (banner) banner.style.display = 'block';
    var dl = document.getElementById('zyDeadline');
    if (dl) dl.textContent = '活动截止 2026年9月5日 · 今年中元节 8月28日';
  }

  var token = getToken();
  if (!token) {
    document.getElementById('guestView').style.display = 'block';
    return;
  }
  document.getElementById('mainView').style.display = 'block';
  loadReferral(token)
    .catch(function(err){
      if (err && err.auth) {
        document.getElementById('mainView').style.display = 'none';
        document.getElementById('guestView').style.display = 'block';
      } else {
        document.getElementById('mainView').style.display = 'none';
        document.getElementById('errorView').style.display = 'block';
      }
    });
})();
</script>
