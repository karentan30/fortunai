<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5bbfa0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>善缘 · 人生规划</title>
<meta name="description" content="善缘人生规划 — 八字选专业·留学规划·高考志愿，AI智能分析帮你找到最适合的人生路径">
<meta property="og:title" content="善缘 · 高考志愿填报">
<meta property="og:description" content="善缘高考志愿 — 八字选专业·数据填志愿，AI智能分析帮你找到最适合的大学专业">
<meta property="og:image" content="/og-card.png">
<meta property="og:url" content="https://shenyuan.mylumee.cn/">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --jade:#5bbfa0;--jade-deep:#3d9e82;--jade-light:#8dd9bf;
  --gold:#c9a84c;--gold-light:#e8d08a;--gold-deep:#8a6420;
  --bg:#faf8f5;--card:#ffffff;--ink:#1a1a18;--ink-mid:#4a4a46;--ink-light:#8a8a84;
  --radius:12px;--shadow:0 2px 12px rgba(0,0,0,0.06);}
html,body{background:var(--bg);font-family:'Noto Serif SC',serif;color:var(--ink);-webkit-font-smoothing:antialiased}
body{max-width:420px;margin:0 auto;min-height:100vh;padding:0 16px 120px}

.back-btn{position:fixed;top:16px;left:16px;z-index:99;background:none;border:none;font-family:'Noto Serif SC',serif;font-size:13px;color:var(--jade);cursor:pointer;padding:4px 0}

/* ── Input screen ── */
.input-screen{position:relative;z-index:1}
.header{text-align:center;padding:44px 20px 16px}
.header-icon{font-size:40px;margin-bottom:8px}
.header-title{font-size:20px;font-weight:400;letter-spacing:0.16em;margin-bottom:4px}
.header-title span{color:var(--jade)}
.header-sub{font-size:12px;color:var(--ink-mid);letter-spacing:0.12em;margin-bottom:4px}
.header-sub2{font-size:10px;color:var(--ink-light);letter-spacing:0.08em}
.jade-line{width:48px;height:2px;background:var(--jade);margin:14px auto;border-radius:1px}

.form-section{padding:0 16px 16px}
.form-label{font-size:10px;letter-spacing:0.18em;color:var(--jade-deep);margin-bottom:8px;font-weight:500}
.field-group{background:var(--card);border:1px solid rgba(91,191,160,0.12);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.field-row{display:flex;align-items:center;border-bottom:1px solid rgba(91,191,160,0.06)}
.field-row:last-child{border-bottom:none}
.field-label{font-size:11px;color:var(--ink-light);letter-spacing:0.06em;min-width:56px;flex-shrink:0;padding:0 0 0 14px}
.field-input,.field-select{flex:1;background:none;border:none;outline:none;font-family:'Noto Serif SC',serif;font-size:13px;color:var(--ink);padding:12px 14px 12px 8px;letter-spacing:0.04em;-webkit-appearance:none}
.field-select option{background:var(--card);color:var(--ink)}

.gender-row{display:flex;gap:8px;padding:0 16px;margin-bottom:12px}
.gender-opt{flex:1;background:var(--card);border:1px solid rgba(91,191,160,0.12);border-radius:8px;padding:10px 0;text-align:center;font-size:13px;color:var(--ink-light);letter-spacing:0.12em;cursor:pointer;transition:all 0.2s;box-shadow:var(--shadow)}
.gender-opt.selected{border-color:var(--jade);background:rgba(91,191,160,0.06);color:var(--jade-deep);box-shadow:0 0 0 1px var(--jade-light)}

.birth-row{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid rgba(91,191,160,0.06)}
.birth-field{flex:1;display:flex;align-items:center;gap:4px}
.birth-field select{flex:1;background:none;border:none;outline:none;font-family:'Noto Serif SC',serif;font-size:12px;color:var(--ink);padding:6px 0;letter-spacing:0.04em;-webkit-appearance:none}
.birth-field select option{background:var(--card);color:var(--ink)}
.birth-label{font-size:10px;color:var(--ink-light);flex-shrink:0}

.submit-section{padding:0 16px 16px}
.btn-gen{width:100%;padding:14px 0;background:linear-gradient(135deg,var(--jade-deep),var(--jade),var(--jade-light));border:none;border-radius:var(--radius);color:#fff;font-family:'Noto Serif SC',serif;font-size:14px;font-weight:500;letter-spacing:0.14em;cursor:pointer;box-shadow:0 4px 20px rgba(91,191,160,0.3);transition:all 0.2s}
.btn-gen:active{transform:scale(0.97)}
.btn-gen:disabled{opacity:0.5;cursor:default}

.price-badge{display:inline-block;font-size:10px;padding:3px 10px;border-radius:10px;background:rgba(91,191,160,0.1);color:var(--jade-deep);letter-spacing:0.06em;margin-top:6px}

/* ── Loading ── */
.loading-screen{display:none;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px 40px;gap:20px}
.loading-screen.show{display:flex}
.spinner{width:64px;height:64px;position:relative}
.spinner-ring{position:absolute;inset:0;border:2px solid transparent;border-top-color:var(--jade);border-radius:50%;animation:spin 1s linear infinite}
.spinner-ring:nth-child(2){inset:8px;border-top-color:var(--jade-light);animation-duration:1.2s;animation-direction:reverse}
.spinner-ring:nth-child(3){inset:16px;border-top-color:var(--gold);animation-duration:1.4s}
@keyframes spin{to{transform:rotate(360deg)}}
.load-text{font-size:14px;color:var(--ink-mid);letter-spacing:0.1em}
.load-steps{display:flex;flex-direction:column;gap:4px;align-items:center}
.load-step{font-size:10px;color:var(--ink-light);letter-spacing:0.08em;min-height:1.4em;text-align:center;transition:color 0.3s}
.load-step.active{color:var(--jade-deep)}
.load-step.done{color:var(--jade-light)}

/* ── Report screen ── */
.report-screen{display:none}
.report-screen.show{display:block}

.report-wrap{padding:0 4px}
.ur-card{background:var(--card);border:1px solid rgba(91,191,160,0.1);border-radius:var(--radius);margin:0 16px 10px;overflow:hidden;box-shadow:var(--shadow);transition:all 0.2s}
.ur-card:hover{border-color:rgba(91,191,160,0.2)}
.ur-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.ur-emoji{font-size:20px;width:28px;text-align:center;flex-shrink:0}
.ur-title{flex:1;font-size:13px;letter-spacing:0.08em;color:var(--ink)}
.ur-arrow{font-size:12px;color:var(--ink-light);transition:transform 0.3s;flex-shrink:0}
.ur-arrow.open{transform:rotate(180deg)}
.ur-body{display:none;padding:0 14px 14px}
.ur-body.open{display:block}
.ur-text{font-size:11.5px;line-height:2;color:var(--ink-mid);letter-spacing:0.04em;white-space:pre-wrap}
.ur-text strong{color:var(--jade-deep)}

/* Report header */
.rpt-header{text-align:center;padding:16px 16px 0}
.rpt-title{font-size:18px;letter-spacing:0.14em;margin-bottom:4px}
.rpt-sub{font-size:10px;color:var(--ink-light);letter-spacing:0.08em}
.rpt-divider{width:40px;height:1px;background:var(--jade);margin:12px auto}

/* Locked section */
.locked-section{margin:0 16px 10px;background:var(--card);border:1px solid rgba(91,191,160,0.08);border-radius:var(--radius);padding:16px 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.locked-left{flex:1}
.locked-title{font-size:13px;color:var(--ink-light);letter-spacing:0.08em;margin-bottom:3px}
.locked-hint{font-size:9px;color:var(--ink-light);letter-spacing:0.04em}
.locked-icon{font-size:18px;color:var(--jade-light)}

/* Preview text */
.preview-text{padding:0 16px 10px;font-size:11px;color:var(--ink-light);line-height:1.9;letter-spacing:0.04em;white-space:pre-wrap}

/* ── Sticky CTA ── */
.sticky-cta{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;z-index:10;background:var(--card);border-top:1px solid rgba(91,191,160,0.12);padding:12px 16px 20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 20px rgba(0,0,0,0.06)}
.cta-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cta-desc{font-size:11px;color:var(--ink-mid);letter-spacing:0.04em}
.cta-price{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--jade-deep)}
.cta-price small{font-size:12px;color:var(--ink-light);text-decoration:line-through;margin-right:6px}
.btn-unlock{width:100%;padding:13px 0;background:linear-gradient(135deg,var(--jade-deep),var(--jade),var(--jade-light));border:none;border-radius:var(--radius);color:#fff;font-family:'Noto Serif SC',serif;font-size:14px;font-weight:500;letter-spacing:0.14em;cursor:pointer;box-shadow:0 4px 16px rgba(91,191,160,0.3);transition:all 0.2s}
.btn-unlock:active{transform:scale(0.97)}
.btn-unlock:disabled{opacity:0.5;cursor:default}

/* ── Disclaimer + footer ── */
.disclaimer{text-align:center;font-size:9px;color:var(--ink-light);padding:20px 20px 0;letter-spacing:0.06em;line-height:1.7}
.footer-link{text-align:center;padding:16px 20px 10px}
.footer-link a{font-size:11px;color:var(--jade);text-decoration:none;letter-spacing:0.06em}
.footer-link a:hover{text-decoration:underline}

/* ── Error toast ── */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;max-width:360px;width:90%;padding:12px 16px;border-radius:8px;font-size:12px;letter-spacing:0.06em;text-align:center;font-family:Noto Serif SC,serif;cursor:pointer}
.toast.error{background:rgba(180,40,40,0.92);color:rgba(255,220,220,0.95)}
.toast.info{background:rgba(91,191,160,0.92);color:#fff}

/* Animation */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.animate{animation:fadeUp 0.4s ease both}

/* Province select with scroll */
.province-group{max-height:180px;overflow-y:auto}

/* ══════════ 精装报告阅读体验 ══════════ */
#readProgressWrap{position:fixed;top:0;left:0;right:0;height:3px;z-index:1200;background:rgba(0,0,0,0.25);opacity:0;transition:opacity .3s;pointer-events:none}
#readProgressWrap.show{opacity:1}
#readProgressBar{height:100%;width:0;background:linear-gradient(90deg,#8a6420,#c9a84c,#e8d08a);box-shadow:0 0 8px rgba(201,168,76,0.5);transition:width .12s ease-out}
.chapter-cover{position:relative;margin:20px 4px 10px;border-radius:14px;overflow:hidden;min-height:168px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 8px 30px rgba(0,0,0,0.4);animation:fadeUp 0.6s ease both;background:#141018}
.chapter-cover-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.62;filter:saturate(0.92)}
.chapter-cover-veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,6,3,0.35) 0%,rgba(8,6,3,0.55) 45%,rgba(8,6,3,0.9) 100%)}
.chapter-cover-body{position:relative;padding:18px 18px 16px}
.chapter-cover-num{font-family:'Cormorant Garamond','Noto Serif SC',serif;font-size:12px;letter-spacing:0.32em;color:rgba(232,208,138,0.82);margin-bottom:5px}
.chapter-cover-title{font-family:'Noto Serif SC',serif;font-size:21px;font-weight:600;letter-spacing:0.06em;color:#f3e6c0;line-height:1.25;text-shadow:0 2px 12px rgba(0,0,0,0.6)}
.chapter-cover-lead{font-size:12px;line-height:1.7;letter-spacing:0.03em;color:rgba(235,225,195,0.72);margin-top:7px;max-width:92%}
.pull-quote{position:relative;margin:16px 10px;padding:6px 4px 6px 20px;text-align:center}
.pull-quote::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,transparent,rgba(91,191,160,0.7),transparent);border-radius:2px}
.pull-quote-text{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:500;line-height:1.75;letter-spacing:0.04em;color:var(--jade, #5bbfa0);text-shadow:0 1px 8px rgba(91,191,160,0.18)}
.hl-note{margin:12px 0;padding:13px 15px;background:linear-gradient(135deg,rgba(201,168,76,0.1),rgba(201,168,76,0.03));border:1px solid rgba(201,168,76,0.34);border-left:3px solid #c9a84c;border-radius:10px;font-size:12px;line-height:1.9;letter-spacing:0.03em;color:rgba(235,225,195,0.92)}
.chapter-toc{margin:14px 4px 6px;padding:16px 16px 12px;background:linear-gradient(160deg,rgba(18,14,8,0.9),rgba(10,8,4,0.95));border:1px solid rgba(201,168,76,0.22);border-radius:14px;animation:fadeUp 0.5s ease both}
.chapter-toc-title{font-size:12px;letter-spacing:0.2em;color:rgba(201,168,76,0.7);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.chapter-toc-item{display:flex;align-items:baseline;gap:10px;padding:8px 2px;border-bottom:1px dotted rgba(201,168,76,0.14);text-decoration:none;transition:all .2s}
.chapter-toc-item:last-child{border-bottom:none}
.chapter-toc-idx{font-family:'Cormorant Garamond',serif;font-size:13px;color:rgba(201,168,76,0.6);min-width:26px}
.chapter-toc-label{flex:1;font-size:13px;letter-spacing:0.04em;color:rgba(232,220,190,0.9)}
.chapter-toc-arrow{font-size:12px;color:rgba(201,168,76,0.45)}
.drop-cap::first-letter{float:left;font-family:'Noto Serif SC',Georgia,serif;font-size:3.4em;line-height:0.82;font-weight:700;color:#e8d08a;margin:0.04em 0.12em 0 0;text-shadow:0 2px 10px rgba(201,168,76,0.28)}
</style>
<link rel="stylesheet" href="/assets/css/common.css">
</head>
<body>

<button class="back-btn" onclick="history.back()">← 返回</button>

<!-- Input screen -->
<div class="input-screen" id="inputScreen">
  <div class="header">
    <div class="header-icon">🎓</div>
    <div class="header-title">善缘 <span>FortuneAI</span> · 高考志愿</div>
    <div class="header-sub">八字选专业 · 数据填志愿</div>
    <div class="header-sub2">AI 智能分析 · 结合八字命理与大数据</div>
    <div class="jade-line"></div>
  </div>

  <div class="form-section">
    <div class="form-label">出生信息（阳历）</div>
    <div class="field-group">
      <div class="birth-row">
        <div class="birth-field">
          <select id="year"></select>
          <span class="birth-label">年</span>
        </div>
        <div class="birth-field">
          <select id="month">
            <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option>
            <option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
          </select>
          <span class="birth-label">月</span>
        </div>
        <div class="birth-field">
          <select id="day"></select>
          <span class="birth-label">日</span>
        </div>
        <div class="birth-field">
          <select id="hour">
            <option value="0">子</option><option value="1">丑</option><option value="2">寅</option><option value="3">卯</option>
            <option value="4">辰</option><option value="5">巳</option><option value="6">午</option><option value="7">未</option>
            <option value="8">申</option><option value="9">酉</option><option value="10">戌</option><option value="11">亥</option>
          </select>
          <span class="birth-label">时</span>
        </div>
      </div>
    </div>
  </div>

  <div class="form-section">
    <div class="form-label">个人信息</div>
    <div class="field-group">
      <div class="gender-row" style="padding:8px 14px;margin:0;border-bottom:1px solid rgba(91,191,160,0.06)">
        <div class="gender-opt selected" onclick="selectGender(this,'male')">男</div>
        <div class="gender-opt" onclick="selectGender(this,'female')">女</div>
      </div>
      <div class="field-row">
        <span class="field-label">高考分数</span>
        <input class="field-input" type="number" id="score" placeholder="输入高考总分" min="0" max="750">
      </div>
      <div class="field-row">
        <span class="field-label">省份</span>
        <select class="field-select" id="province"></select>
      </div>
      <div class="field-row">
        <span class="field-label">科目类别</span>
        <select class="field-select" id="subject">
          <option value="physics">物理类</option>
          <option value="history">历史类</option>
          <option value="science">理科</option>
          <option value="arts">文科</option>
          <option value="comprehensive">综合</option>
        </select>
      </div>
      <div class="field-row">
        <span class="field-label">全省排名</span>
        <input class="field-input" type="number" id="rank" placeholder="选填，填了更精准" min="1">
      </div>
    </div>
  </div>

  <div class="submit-section">
    <button class="btn-gen" onclick="generateReport()">AI 智能填报志愿</button>
    <div style="text-align:center;margin-top:8px">
      <span class="price-badge">免费看前2段 · 完整报告 ¥99</span>
    </div>
  </div>
</div>

<!-- Loading -->
<div class="loading-screen" id="loadingScreen">
  <div class="spinner">
    <div class="spinner-ring"></div>
    <div class="spinner-ring"></div>
    <div class="spinner-ring"></div>
  </div>
  <div class="load-text">AI 正在分析你的命盘与数据…</div>
  <div class="load-steps" id="loadSteps"></div>
</div>

<!-- Report screen -->
<div class="report-screen" id="reportScreen">
  <div class="rpt-header">
    <div class="rpt-title">🎓 高考志愿分析报告</div>
    <div class="rpt-sub" id="rptSub"></div>
    <div class="rpt-divider"></div>
  </div>
  <div class="report-wrap" id="reportContent"></div>
</div>

<!-- Sticky CTA -->
<div class="sticky-cta" id="stickyCta" style="display:none">
  <div class="cta-row">
    <div class="cta-desc">解锁完整报告 · 八字+数据全面分析</div>
    <div class="cta-price"><small>¥199</small> ¥99</div>
  </div>
  <button class="btn-unlock" onclick="handleUnlock()">付费解锁完整报告</button>
</div>

<!-- Footer -->
<div class="disclaimer">
  本分析仅供参考，不构成填报决策依据。高考志愿请结合个人实际分数、排名及省控线综合考量。
</div>
<div class="footer-link">
  <a href="/">← 返回善缘首页</a>
</div>

<script>
// ── Globals ──
var gender = 'male';
var provinces = [
  '北京','天津','上海','重庆','河北','山西','辽宁','吉林','黑龙江',
  '江苏','浙江','安徽','福建','江西','山东','河南','湖北','湖南',
  '广东','海南','四川','贵州','云南','陕西','甘肃','青海','台湾',
  '内蒙古','广西','西藏','宁夏','新疆'
];

var reportSections = [
  {emoji:'📜', title:'八字命格适合行业', key:'industry'},
  {emoji:'🔥', title:'适合的专业方向', key:'major'},
  {emoji:'🌆', title:'旺你的城市', key:'city'},
  {emoji:'🏫', title:'可报考的学校建议', key:'school'},
  {emoji:'💰', title:'毕业薪资展望', key:'salary'},
  {emoji:'🎯', title:'总结建议', key:'summary'}
];

var generatedData = null;
var isUnlocked = false;

// ── Init selects ──
(function init() {
  var ySel = document.getElementById('year');
  for (var y = 2026; y >= 1990; y--) ySel.innerHTML += '<option value="'+y+'">'+y+'</option>';
  var dSel = document.getElementById('day');
  for (var d = 1; d <= 31; d++) dSel.innerHTML += '<option value="'+d+'">'+d+'</option>';
  var pSel = document.getElementById('province');
  provinces.forEach(function(p) { pSel.innerHTML += '<option value="'+p+'">'+p+'</option>'; });
})();

function selectGender(el, g) {
  document.querySelectorAll('.gender-opt').forEach(function(o){ o.classList.remove('selected'); });
  el.classList.add('selected'); gender = g;
}

var currentTab = 'gaokao';
function switchTab(tab) {
  document.querySelectorAll('.tab-item').forEach(function(e){e.classList.remove('active')});
  document.querySelectorAll('.tab-item')[tab==='gaokao'?0:1].classList.add('active');
  currentTab = tab;
  document.getElementById('gaokaoExtra').style.display = tab === 'gaokao' ? 'block' : 'none';
  document.getElementById('liuxueExtra').style.display = tab === 'liuxue' ? 'block' : 'none';
  document.getElementById('genBtn').textContent = tab === 'gaokao' ? '✨ AI智能填报志愿' : '🌍 AI留学规划';

// ── Bazi helpers ──
var TIAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var DI   = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
var ELEM_MAP = {'甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水'};
var ELEM_DI  = {'子':'水','丑':'土','寅':'木','卯':'木','辰':'土','巳':'火','午':'火','未':'土','申':'金','酉':'金','戌':'土','亥':'水'};

function getDaymaster(y, m, d, h) {
  var dayBase = (y * 365 + m * 30 + d + 40) % 60;
  return TIAN[dayBase % 10];
}

function getBazi(y, m, d, h) {
  return [
    {tian: TIAN[(y-4)%10], di: DI[(y-4)%12]},
    {tian: TIAN[((y-4)%5*2+m+1)%10], di: DI[(m+1)%12]},
    {tian: getDaymaster(y,m,d), di: DI[dayBase(y,m,d)%12], isDay:true},
    {tian: TIAN[(dayBase(y,m,d)%5*2+h)%10], di: DI[h%12]}
  ];
  function dayBase(y,m,d) { return (y*365+m*30+d+40)%60; }
}

function getElemStrength(y,m,d) {
  var ec = {木:0,火:0,土:0,金:0,水:0};
  var bazi = getBazi(y,m,d,0);
  bazi.forEach(function(z){
    ec[ELEM_MAP[z.tian]] = (ec[ELEM_MAP[z.tian]]||0) + 2;
    ec[ELEM_DI[z.di]] = (ec[ELEM_DI[z.di]]||0) + 1;
  });
  return ec;
}

function rng(seed, max) { return (Math.abs(Math.sin(seed*9.5+128)*10000)|0)%max; }

function initReadProgress() {
  var bar = document.getElementById('readProgressBar');
  var wrap = document.getElementById('readProgressWrap');
  if (!bar || !wrap) return;
  wrap.classList.add('show');
  function updateProgress() {
    var scrollTop = window.scrollY || document.documentElement.scrollTop;
    var docH = document.documentElement.scrollHeight - window.innerHeight;
    var pct = docH > 0 ? Math.min(100, (scrollTop / docH) * 100) : 0;
    bar.style.width = pct + '%';
  }
  window.addEventListener('scroll', updateProgress, {passive: true});
  updateProgress();
}
}
