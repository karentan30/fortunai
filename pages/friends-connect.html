<dialog id="auth-dialog"><form id="auth-form"><button type="button" class="dialog-close" aria-label="关闭登录">×</button><h2>让相遇，有个开始。</h2><p class="muted">使用你的 Runae 账号，保存自己的交友卡。</p><div class="tab-row"><button type="button" class="active" data-auth-mode="login">登录</button><button type="button" data-auth-mode="register">注册</button></div><label>邮箱<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required maxlength="254"></label><label>密码<input name="password" type="password" autocomplete="current-password" minlength="6" maxlength="128" placeholder="至少 6 位" required></label><label class="check-line" id="auth-agreement" hidden><input name="agreement" type="checkbox">我已阅读并同意<a href="/pages/friends-terms.html" target="_blank" rel="noopener">服务条款</a>与<a href="/pages/friends-privacy.html" target="_blank" rel="noopener">隐私说明</a>。</label><p id="auth-error" class="error" role="alert"></p><button class="primary" type="submit">登录并继续 <span>↗</span></button><p class="fine-print">账号与现有 Runae 共用，交友档案需由你单独创建。</p></form></dialog>
