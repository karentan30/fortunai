<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8b1a1a">
<title>善缘 · 我的账户</title>
<meta name="description" content="善缘我的账户 — 报告历史、邀请管理、订阅续费">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#8b1a1a;--red-mid:#a52020;--red-light:#f9eaea;
  --gold:#c9a84c;--gold-light:#f5e9c0;--gold-deep:#9a7820;
  --ink:#1a1208;--ink-mid:#4a3820;--ink-soft:#7a6848;
  --cream:#faf6ee;--white:#fffdf8;--line:#e8dcc8;
  --jade:#5bbfa0;--jade-light:#8dd9bf;
  --error:#d32f2f;--error-light:#ffebee;--success:#388e3c;--success-light:#e8f5e9;
}
@media (prefers-color-scheme:dark) {
  :root{
    --ink:#e8dcc8;--ink-mid:#c9a84c;--ink-soft:#a89878;
    --cream:#1a1208;--white:#2a2018;--line:#4a3820;
  }
}
html,body{background:var(--cream);font-family:'Noto Serif SC',serif;color:var(--ink);-webkit-font-smoothing:antialiased}
body{max-width:390px;margin:0 auto;min-height:100vh;padding-bottom:100px}

/* ── HEADER ── */
.header{background:linear-gradient(160deg,#3d0808 0%,var(--red) 55%,#c04040 100%);padding:48px 24px 40px;text-align:center;color:#fff;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='30' cy='30' r='1' fill='rgba(201,168,76,0.15)'/%3E%3C/svg%3E") repeat;pointer-events:none}
.header-logo{font-size:13px;letter-spacing:.3em;color:var(--gold-light);opacity:.8;margin-bottom:20px;font-family:'Noto Sans SC',sans-serif}
.header-h1{font-size:28px;font-weight:700;line-height:1.3;margin-bottom:8px;color:#fff}
.header-sub{font-size:12px;color:rgba(255,255,255,.75);letter-spacing:.08em;font-family:'Noto Sans SC',sans-serif}

/* ── PROFILE ── */
.profile-section{background:var(--white);border-bottom:1px solid var(--line);padding:20px 20px}
.profile-card{display:flex;gap:14px;align-items:center}
.profile-avatar{width:52px;height:52px;border-radius:50%;background:var(--red-light);border:2px solid var(--red);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.profile-info{flex:1;min-width:0}
.profile-email{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile-label{font-size:11px;color:var(--ink-soft);letter-spacing:.06em;font-family:'Noto Sans SC',sans-serif}

/* ── TABS ── */
.tabs{display:flex;background:var(--white);border-bottom:2px solid var(--line);position:sticky;top:0;z-index:90}
.tab{flex:1;padding:14px 16px;text-align:center;font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;transition:all 0.3s;border-bottom:3px solid transparent;font-family:'Noto Sans SC',sans-serif;letter-spacing:.06em}
.tab.active{color:var(--red);border-bottom-color:var(--red)}
.tab:hover{color:var(--ink-mid)}

/* ── SECTION CONTENT ── */
.section-content{display:none;padding:20px 16px}
.section-content.active{display:block}
.section-title{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--ink);display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:3px;height:16px;background:var(--red);border-radius:2px}

/* ── REPORTS (P0) ── */
.report-list{display:flex;flex-direction:column;gap:10px}
.report-card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all 0.2s}
.report-card:hover{border-color:var(--gold);box-shadow:0 2px 8px rgba(201,168,76,0.1)}
.report-icon{width:40px;height:40px;border-radius:8px;background:var(--red-light);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.report-info{flex:1;min-width:0}
.report-name{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:3px}
.report-meta{font-size:11px;color:var(--ink-soft);font-family:'Noto Sans SC',sans-serif}
.report-actions{display:flex;gap:6px;flex-shrink:0}
.btn-view{padding:6px 12px;background:var(--red-light);border:1px solid var(--red);border-radius:4px;font-size:11px;font-weight:700;color:var(--red);cursor:pointer;transition:all 0.2s;font-family:'Noto Sans SC',sans-serif}
.btn-view:hover{background:var(--red);color:#fff}
.btn-download{padding:6px 12px;background:transparent;border:1px solid var(--line);border-radius:4px;font-size:11px;font-weight:700;color:var(--ink-soft);cursor:pointer;transition:all 0.2s;font-family:'Noto Sans SC',sans-serif}
.btn-download:hover{background:var(--cream);border-color:var(--gold)}

/* ── REFERRALS (P0) ── */
.ref-codes-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.ref-code-card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.ref-channel{font-size:11px;color:var(--ink-soft);font-family:'Noto Sans SC',sans-serif;margin-bottom:6px;letter-spacing:.06em}
.ref-code-text{font-size:14px;font-weight:700;color:var(--red);font-family:'Courier New',monospace;margin-bottom:8px;letter-spacing:.04em}
.ref-code-copy{padding:6px 12px;background:var(--red-light);border:1px solid var(--red);border-radius:4px;font-size:10px;color:var(--red);cursor:pointer;transition:all 0.2s;font-family:'Noto Sans SC',sans-serif;font-weight:700;width:100%;letter-spacing:.06em}
.ref-code-copy:hover{background:var(--red);color:#fff}
.ref-code-count{font-size:9px;color:var(--ink-soft);margin-top:6px;letter-spacing:.04em}

.ref-stats{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.ref-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
.ref-stat-item{text-align:center;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ref-stat-item:nth-child(2n){border-bottom:1px solid var(--line)}
.ref-stat-value{font-size:18px;font-weight:700;color:var(--red);display:block;margin-bottom:4px;font-family:'Noto Sans SC',sans-serif}
.ref-stat-label{font-size:10px;color:var(--ink-soft);letter-spacing:.06em;font-family:'Noto Sans SC',sans-serif}
.ref-tier-info{background:var(--red-light);border-radius:8px;padding:12px;text-align:center}
.ref-tier-label{font-size:10px;color:var(--ink-soft);letter-spacing:.06em;font-family:'Noto Sans SC',sans-serif}
.ref-tier-value{font-size:16px;font-weight:700;color:var(--red);margin:4px 0;font-family:'Noto Sans SC',sans-serif}
.ref-bonus{font-size:12px;color:var(--gold-deep);font-family:'Noto Sans SC',sans-serif;margin-top:6px}

.ref-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px}
.ref-table th{background:var(--red-light);color:var(--red);padding:10px 8px;text-align:left;font-weight:700;border:1px solid var(--line);font-family:'Noto Sans SC',sans-serif}
.ref-table td{padding:10px 8px;border:1px solid var(--line);color:var(--ink);font-family:'Noto Sans SC',sans-serif}
.ref-table tr:nth-child(even){background:var(--cream)}
.ref-status-ok{color:var(--jade);font-weight:700}
.ref-status-wait{color:var(--ink-soft);font-style:italic}

/* ── SUBSCRIPTION (P0) ── */
.subscription-card{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.sub-status-label{font-size:10px;color:var(--ink-soft);letter-spacing:.06em;font-family:'Noto Sans SC',sans-serif;margin-bottom:6px}
.sub-tier{font-size:16px;font-weight:700;color:var(--red);margin-bottom:8px;font-family:'Noto Sans SC',sans-serif}
.sub-info-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}
.sub-info-row:last-child{border-bottom:none}
.sub-info-label{color:var(--ink-soft);font-family:'Noto Sans SC',sans-serif}
.sub-info-value{color:var(--ink);font-weight:700;font-family:'Noto Sans SC',sans-serif}
.sub-status-badge{display:inline-block;padding:3px 8px;background:var(--jade-light);color:#fff;border-radius:12px;font-size:10px;font-weight:700;font-family:'Noto Sans SC',sans-serif}
.sub-btn-group{display:flex;gap:8px;margin-top:14px}
.btn-renew{flex:1;padding:10px 0;background:var(--red);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;font-family:'Noto Sans SC',sans-serif;letter-spacing:.06em}
.btn-renew:hover{background:var(--red-mid);box-shadow:0 2px 8px rgba(139,26,26,0.2)}
.btn-upgrade{flex:1;padding:10px 0;background:var(--cream);color:var(--red);border:1.5px solid var(--red);border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;font-family:'Noto Sans SC',sans-serif;letter-spacing:.06em}
.btn-upgrade:hover{background:var(--red-light)}

.sub-history{margin-top:12px}
.sub-history-title{font-size:12px;font-weight:700;color:var(--ink);margin-bottom:10px;font-family:'Noto Sans SC',sans-serif}
.sub-history-table{width:100%;border-collapse:collapse;font-size:11px}
.sub-history-table th{background:var(--cream);color:var(--ink-soft);padding:8px;text-align:left;font-weight:700;border:1px solid var(--line);font-family:'Noto Sans SC',sans-serif}
.sub-history-table td{padding:8px;border:1px solid var(--line);color:var(--ink);font-family:'Noto Sans SC',sans-serif}
.sub-history-table tr:nth-child(even){background:var(--white)}

/* ── ACCOUNT SETTINGS (P1) ── */
.form-group{margin-bottom:14px}
.form-label{font-size:11px;color:var(--ink-soft);letter-spacing:.06em;font-family:'Noto Sans SC',sans-serif;margin-bottom:6px;display:block}
.form-input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-size:13px;color:var(--ink);font-family:'Noto Serif SC',serif;background:var(--white);transition:all 0.2s}
.form-input:focus{outline:none;border-color:var(--red);box-shadow:0 0 8px rgba(139,26,26,0.1)}
.form-check{display:flex;align-items:center;padding:8px 0}
.form-check input[type="checkbox"]{margin-right:8px;cursor:pointer}
.form-check label{font-size:12px;color:var(--ink);cursor:pointer;flex:1;font-family:'Noto Sans SC',sans-serif}
.settings-group{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.settings-group-title{font-size:12px;font-weight:700;color:var(--red);margin-bottom:12px;letter-spacing:.06em;font-family:'Noto Sans SC',sans-serif}

/* ── SHARE CARD (P1) ── */
.share-card-preview{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;position:relative}
.share-card-canvas{width:100%;max-width:320px;height:180px;margin:0 auto;display:block;border-radius:8px;background:linear-gradient(135deg,var(--red),var(--gold));display:flex;align-items:center;justify-content:center;color:#fff;text-align:center}
.share-card-btn-group{display:flex;gap:8px;margin-top:12px}
.btn-download-card{flex:1;padding:10px 0;background:var(--cream);color:var(--red);border:1.5px solid var(--red);border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;font-family:'Noto Sans SC',sans-serif;letter-spacing:.06em}
.btn-download-card:hover{background:var(--red-light)}
.btn-share-card{flex:1;padding:10px 0;background:var(--red);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;font-family:'Noto Sans SC',sans-serif;letter-spacing:.06em}
.btn-share-card:hover{background:var(--red-mid)}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:40px 20px}
.empty-icon{font-size:48px;opacity:0.3;margin-bottom:12px;display:block}
.empty-text{font-size:12px;color:var(--ink-soft);letter-spacing:.06em;margin-bottom:14px}
.btn-primary{display:inline-block;padding:10px 20px;background:var(--red);color:#fff;border-radius:6px;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer;transition:all 0.2s;font-family:'Noto Sans SC',sans-serif;letter-spacing:.06em}
.btn-primary:hover{background:var(--red-mid);box-shadow:0 2px 8px rgba(139,26,26,0.2)}

/* ── LOADING SKELETON ── */
.skeleton{background:linear-gradient(90deg,var(--line) 0%,var(--cream) 50%,var(--line) 100%);background-size:200% 100%;animation:loading 1.5s infinite;border-radius:4px}
@keyframes loading{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── FOOTER ── */
.footer{text-align:center;padding:20px 16px;font-size:11px;color:var(--ink-soft);border-top:1px solid var(--line);margin-top:20px;font-family:'Noto Sans SC',sans-serif}
.footer a{color:var(--gold-deep);text-decoration:none;margin:0 6px;letter-spacing:.04em}
.footer a:hover{color:var(--red)}

/* ── UTILITIES ── */
.hidden{display:none!important}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:999;max-width:340px;width:90%;padding:12px 16px;border-radius:8px;font-size:12px;letter-spacing:.06em;line-height:1.5;text-align:center;font-family:'Noto Sans SC',sans-serif;cursor:pointer;transition:opacity 0.3s;background:rgba(0,0,0,0.8);color:#fff}
.toast.error{background:rgba(180,40,40,0.95);color:rgba(255,220,220,0.95)}
.toast.success{background:rgba(40,130,80,0.95);color:rgba(220,255,230,0.95)}

/* Back button */
.header-back{position:absolute;top:20px;left:20px;background:none;border:none;font-size:24px;color:#fff;cursor:pointer;opacity:0.8;transition:opacity 0.2s;font-family:system-ui;padding:8px}
.header-back:hover{opacity:1}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.active{display:flex}
.modal-dialog{background:var(--white);border-radius:12px;padding:24px;max-width:90%;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,0.15)}
.modal-header{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--ink);display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;font-size:24px;color:var(--ink-soft);cursor:pointer;padding:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{color:var(--ink)}
.modal-body{margin-bottom:20px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;border-top:1px solid var(--line);padding-top:16px}

/* ── VALIDATION ── */
.form-error{border-color:var(--error)!important}
.form-error-msg{color:var(--error);font-size:10px;margin-top:4px;letter-spacing:.04em;font-family:'Noto Sans SC',sans-serif}
.form-success{border-color:var(--jade)!important}

/* ── RESPONSIVE ── */
@media(max-width:480px) {
  body{max-width:100%;padding-bottom:80px}
  .ref-stats{padding:12px}
  .ref-stat-grid{grid-template-columns:1fr;gap:8px}
  .ref-stat-item{padding-bottom:8px;border-bottom:1px solid var(--line)}
  .ref-stat-item:nth-child(2n){border-bottom:1px solid var(--line)}
  .ref-code-card{padding:10px}
  .report-card{gap:8px}
  .settings-group{padding:10px}
  .form-input{padding:8px 10px;font-size:12px}
  .modal-dialog{padding:16px}
  table{font-size:10px}
  td, th{padding:6px 4px}
}

@media(prefers-reduced-motion:reduce) {
  *{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}
}
</head>
<body>

<!-- Header -->
<div class="header">
  <button class="header-back" onclick="window.history.back();">‹</button>
  <div class="header-logo">善缘</div>
  <div class="header-h1">我的账户</div>
  <div class="header-sub">MY ACCOUNT</div>
</div>

<!-- Profile -->
<div class="profile-section">
  <div class="profile-card">
    <div class="profile-avatar" id="profileAvatar">👤</div>
    <div class="profile-info">
      <div class="profile-email" id="profileEmail">加载中…</div>
      <div class="profile-label" id="profileLabel">善缘用户</div>
    </div>
  </div>
</div>

<!-- Tabs -->
<div class="tabs">
  <div class="tab active" data-tab="reports" onclick="switchTab('reports')">报告历史</div>
  <div class="tab" data-tab="referrals" onclick="switchTab('referrals')">邀请管理</div>
  <div class="tab" data-tab="subscription" onclick="switchTab('subscription')">订阅管理</div>
  <div class="tab" data-tab="settings" onclick="switchTab('settings')">账户设置</div>
</div>

<!-- ═════ REPORTS (P0) ═════ -->
<div class="section-content active" id="reports-content">
  <div style="padding:20px 16px">
    <div class="section-title">我的报告</div>
    <div class="report-list" id="reportList">
      <div class="report-card" style="opacity:0.5">
        <div class="report-icon" style="background:var(--cream)"><span class="skeleton" style="width:20px;height:20px;border-radius:4px"></span></div>
        <div class="report-info" style="flex:1">
          <div class="skeleton" style="width:60%;height:13px;margin-bottom:6px"></div>
          <div class="skeleton" style="width:40%;height:10px"></div>
        </div>
      </div>
      <div class="report-card" style="opacity:0.5">
        <div class="report-icon" style="background:var(--cream)"><span class="skeleton" style="width:20px;height:20px;border-radius:4px"></span></div>
        <div class="report-info" style="flex:1">
          <div class="skeleton" style="width:55%;height:13px;margin-bottom:6px"></div>
          <div class="skeleton" style="width:45%;height:10px"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═════ REFERRALS (P0) ═════ -->
<div class="section-content" id="referrals-content">
  <div style="padding:20px 16px">
    <div class="section-title">邀请码</div>

    <!-- Ref codes grid (5 channels) -->
    <div id="refCodesContainer">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="ref-code-card" style="opacity:0.5">
          <div class="skeleton" style="width:40%;height:11px;margin:6px auto"></div>
          <div class="skeleton" style="width:70%;height:14px;margin:8px auto"></div>
          <div class="skeleton" style="width:100%;height:28px;margin-top:8px"></div>
          <div class="skeleton" style="width:50%;height:9px;margin:6px auto"></div>
        </div>
        <div class="ref-code-card" style="opacity:0.5">
          <div class="skeleton" style="width:40%;height:11px;margin:6px auto"></div>
          <div class="skeleton" style="width:70%;height:14px;margin:8px auto"></div>
          <div class="skeleton" style="width:100%;height:28px;margin-top:8px"></div>
          <div class="skeleton" style="width:50%;height:9px;margin:6px auto"></div>
        </div>
      </div>
    </div>

    <div class="section-title" style="margin-top:24px">邀请成果</div>

    <!-- Stats card -->
    <div id="refStatsContainer">
      <div class="ref-stats" style="opacity:0.5">
        <div class="skeleton" style="width:100%;height:60px"></div>
      </div>
    </div>

    <!-- Referrals table -->
    <div id="refTableContainer" style="margin-top:14px">
      <div style="overflow-x:auto">
        <table class="ref-table">
          <thead><tr><th>日期</th><th>用户</th><th>渠道</th><th>状态</th></tr></thead>
          <tbody>
            <tr><td colspan="4" style="text-align:center;color:var(--ink-soft)">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ═════ SUBSCRIPTION (P0) ═════ -->
<div class="section-content" id="subscription-content">
  <div style="padding:20px 16px">
    <div class="section-title">订阅状态</div>
    <div id="subscriptionContainer">
      <div class="subscription-card" style="opacity:0.5">
        <div class="skeleton" style="width:60%;height:16px;margin-bottom:12px"></div>
        <div class="skeleton" style="width:100%;height:50px"></div>
      </div>
    </div>
  </div>
</div>

<!-- ═════ ACCOUNT SETTINGS (P1) ═════ -->
<div class="section-content" id="settings-content">
  <div style="padding:20px 16px">
    <div class="section-title">基本信息</div>
    <div class="settings-group">
      <div class="form-group">
        <label class="form-label">昵称</label>
        <input type="text" class="form-input" id="inputName" placeholder="输入昵称">
      </div>
      <div class="form-group">
        <label class="form-label">邮箱</label>
        <input type="email" class="form-input" id="inputEmail" placeholder="邮箱地址" disabled>
      </div>
      <div class="form-group">
        <label class="form-label">生日</label>

      <button style="width:100%;padding:10px 0;background:var(--cream);color:var(--ink);border:1px solid var(--line);border-radius:6px;font-size:12px;cursor:pointer;margin-bottom:8px;font-family:'Noto Sans SC',sans-serif;font-weight:700;letter-spacing:.06em" onclick="handleLogoutDevice()">登出当前设备</button>
      <button style="width:100%;padding:10px 0;background:var(--cream);color:var(--ink);border:1px solid var(--line);border-radius:6px;font-size:12px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;font-weight:700;letter-spacing:.06em" onclick="handleLogoutAll()">登出所有设备</button>

<!-- Password Change Modal -->
<div class="modal-overlay" id="passwordModal">
  <div class="modal-dialog">
    <div class="modal-header">
      <span>修改密码</span>
      <button class="modal-close" onclick="closePasswordModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">当前密码</label>
        <input type="password" class="form-input" id="currentPassword" placeholder="输入当前密码">
        <div class="form-error-msg" id="currentPasswordError"></div>
      </div>
      <div class="form-group">
        <label class="form-label">新密码（至少6位，包含数字和字母）</label>
        <input type="password" class="form-input" id="newPassword" placeholder="输入新密码">
        <div class="form-error-msg" id="newPasswordError"></div>
      </div>
      <div class="form-group">
        <label class="form-label">确认新密码</label>
        <input type="password" class="form-input" id="confirmPassword" placeholder="再次输入新密码">
        <div class="form-error-msg" id="confirmPasswordError"></div>
      </div>

      <button style="flex:1;padding:10px 0;background:var(--cream);color:var(--ink);border:1px solid var(--line);border-radius:6px;font-size:12px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;font-weight:700" onclick="closePasswordModal()">取消</button>
      <button style="flex:1;padding:10px 0;background:var(--red);color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer;font-family:'Noto Sans SC',sans-serif;font-weight:700" onclick="submitPasswordChange()">确认修改</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var BASE = '';
var LANG = 'zh';

function getToken() {
  return localStorage.getItem('sy_token');
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '');
  t.onclick = function(){ t.className = 'toast'; };
  if (t._toastTimer) clearTimeout(t._toastTimer);
  t._toastTimer = setTimeout(function(){ t.className = 'toast'; }, 3000);
}

function switchTab(tabName) {
  // Hide all sections
  document.querySelectorAll('.section-content').forEach(function(el) {
    el.classList.remove('active');
  });
  // Remove active from tabs
  document.querySelectorAll('.tab').forEach(function(el) {
    el.classList.remove('active');
  });
  // Show selected section
  document.getElementById(tabName + '-content').classList.add('active');
  // Add active to tab
  document.querySelector('[data-tab="' + tabName + '"]').classList.add('active');

  // Load data for specific tabs
  if (tabName === 'reports') loadReports();
  else if (tabName === 'referrals') loadReferrals();
  else if (tabName === 'subscription') loadSubscription();
  else if (tabName === 'settings') loadSettings();
}

// ════ REPORTS (P0) ════
function loadReports() {
  var token = getToken();
  if (!token) {
    document.getElementById('reportList').innerHTML = '<div class="empty-state"><span class="empty-icon">🔒</span><div class="empty-text">请先登录</div></div>';
    return;
  }

  fetch(BASE + '/api/orders/mine', {
    headers: { 'Authorization': 'Bearer ' + token }
  })
  .then(function(r) { return r.ok ? r.json() : Promise.reject(new Error('获取失败')); })
  .then(function(data) {
    var orders = data.orders || data.data || [];
    if (!Array.isArray(orders)) orders = [];

    // Filter for report/divination products
    var reports = orders.filter(function(o) {
      var name = o.product_name || o.name || '';
      return name.indexOf('报告') >= 0 || name.indexOf('八字') >= 0 || name.indexOf('合婚') >= 0 || name.indexOf('读') >= 0;
    });

    renderReports(reports);
  })
  .catch(function(err) {
    console.error('Report load error:', err);
    document.getElementById('reportList').innerHTML = '<div class="empty-state"><span class="empty-icon">⚠️</span><div class="empty-text">暂无报告</div></div>';
  });
}

function renderReports(reports) {
  var list = document.getElementById('reportList');
  if (!reports || reports.length === 0) {
    list.innerHTML = '<div class="empty-state"><span class="empty-icon">📋</span><div class="empty-text">暂无报告记录</div><a href="/pages/bazi.html" class="btn-primary" style="margin-top:14px">立即购买</a></div>';
    return;
  }

  var html = '';
  reports.forEach(function(o) {
    var name = o.product_name || o.name || '报告';
    var date = o.created_at ? o.created_at.substring(0, 10) : '';
    var expires = o.expires_at ? o.expires_at.substring(0, 10) : '';
    var icon = '📄';

    if (name.indexOf('八字') >= 0) icon = '命';
    if (name.indexOf('合婚') >= 0) icon = '合';
    if (name.indexOf('紫微') >= 0) icon = '紫';

    html += '<div class="report-card">';
    html += '<div class="report-icon">' + icon + '</div>';
    html += '<div class="report-info">';
    html += '<div class="report-name">' + name + '</div>';
    html += '<div class="report-meta">购于 ' + date;
    if (expires) html += ' · 有效期至 ' + expires;
    html += '</div></div>';
    html += '<div class="report-actions">';
    html += '<button class="btn-view" onclick="viewReport(\'' + o.id + '\')">查看</button>';
    html += '</div></div>';
  });

  list.innerHTML = html;
}

function viewReport(reportId) {
  showToast('正在打开报告…');
  setTimeout(function() {
    window.location.href = '/pages/report.html?id=' + reportId;
  }, 500);
}

// ════ REFERRALS (P0) ════
var referralData = {};

function loadReferrals() {
  var token = getToken();
  if (!token) {
    document.getElementById('refCodesContainer').innerHTML = '<div class="empty-state"><span class="empty-icon">🔒</span><div class="empty-text">请先登录</div></div>';
    return;
  }

  fetch(BASE + '/api/referral/mine', {
    headers: { 'Authorization': 'Bearer ' + token }
  })
  .then(function(r) { return r.ok ? r.json() : Promise.reject(new Error('获取失败')); })
  .then(function(data) {
    referralData = data;
    renderReferralCodes(data);
    renderReferralStats(data);
    renderReferralTable(data);
  })
  .catch(function(err) {
    console.error('Referral load error:', err);
    document.getElementById('refCodesContainer').innerHTML = '<div class="empty-state"><span class="empty-icon">⚠️</span><div class="empty-text">加载失败</div></div>';
  });
}

function renderReferralCodes(data) {
  var refCodes = data.ref_codes || {};
  var channels = { tiktok: 'TikTok', xiaohongshu: '小红书', youtube: 'YouTube', wechat: '微信', organic: '自然流量' };
  var html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';

  Object.entries(refCodes).forEach(function(pair, idx) {
    var ch = pair[0];
    var code = pair[1];
    var chName = channels[ch] || ch;
    var inviteCount = data.invitees_by_channel && data.invitees_by_channel[ch] ? data.invitees_by_channel[ch].length : 0;

    html += '<div class="ref-code-card">';
    html += '<div class="ref-channel">' + chName + '</div>';
    html += '<div class="ref-code-text">' + code + '</div>';
    html += '<button class="ref-code-copy" onclick="copyRefCode(\'' + code + '\')">复制</button>';
    html += '<div class="ref-code-count">' + inviteCount + '人使用</div>';
    html += '</div>';
  });

  html += '</div>';
  document.getElementById('refCodesContainer').innerHTML = html;
}

function copyRefCode(code) {
  var textarea = document.createElement('textarea');
  textarea.value = code;
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    showToast('邀请码已复制！');
  } catch(e) {
    showToast('复制失败，请手动复制', 'error');
  }
  document.body.removeChild(textarea);
}

function renderReferralStats(data) {
  var invited = data.invited_count || 0;
  var converted = data.converted_count || 0;
  var rate = invited > 0 ? Math.round(converted / invited * 100) : 0;
  var tier = data.current_tier || 'Pending';
  var bonus = data.total_bonus || 0;

  var html = '<div class="ref-stats">';
  html += '<div class="ref-stat-grid">';
  html += '<div class="ref-stat-item"><span class="ref-stat-value">' + invited + '</span><span class="ref-stat-label">已邀请</span></div>';
  html += '<div class="ref-stat-item"><span class="ref-stat-value">' + converted + '</span><span class="ref-stat-label">已转化</span></div>';
  html += '<div class="ref-stat-item"><span class="ref-stat-value">' + rate + '%</span><span class="ref-stat-label">转化率</span></div>';
  html += '<div class="ref-stat-item"><span class="ref-stat-value">¥' + bonus + '</span><span class="ref-stat-label">预期收益</span></div>';
  html += '</div>';
  html += '<div class="ref-tier-info">';
  html += '<div class="ref-tier-label">当前等级</div>';
  html += '<div class="ref-tier-value">' + tier + '</div>';
  html += '</div></div>';

  document.getElementById('refStatsContainer').innerHTML = html;
}

function renderReferralTable(data) {
  var invitees = data.invitees || [];
  if (!invitees || invitees.length === 0) {
    document.getElementById('refTableContainer').innerHTML = '<div class="empty-state" style="padding:20px 0"><span class="empty-icon">👥</span><div class="empty-text">暂无邀请记录</div></div>';
    return;
  }

  var html = '<div style="overflow-x:auto"><table class="ref-table"><thead><tr><th>日期</th><th>用户</th><th>渠道</th><th>状态</th><th>奖励</th></tr></thead><tbody>';

  invitees.forEach(function(inv) {
    var date = inv.created_at ? inv.created_at.substring(0, 10) : '';
    var name = inv.invitee_email ? inv.invitee_email.substring(0, inv.invitee_email.indexOf('@')) : '用户';
    var ch = inv.channel || '其他';
    var status = inv.converted ? '✅ 已转化' : '❌ 未购买';
    var bonus = inv.bonus || 0;

    html += '<tr>';
    html += '<td>' + date + '</td>';
    html += '<td>' + name + '</td>';
    html += '<td>' + ch + '</td>';
    html += '<td><span class="' + (inv.converted ? 'ref-status-ok' : 'ref-status-wait') + '">' + status + '</span></td>';
    html += '<td>¥' + bonus + '</td>';
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  document.getElementById('refTableContainer').innerHTML = html;
}

// ════ SUBSCRIPTION (P0) ════
function loadSubscription() {
  var token = getToken();
  if (!token) {
    document.getElementById('subscriptionContainer').innerHTML = '<div class="empty-state"><span class="empty-icon">🔒</span><div class="empty-text">请先登录</div></div>';
    return;
  }

  fetch(BASE + '/api/auth/me', {
    headers: { 'Authorization': 'Bearer ' + token }
  })
  .then(function(r) { return r.ok ? r.json() : Promise.reject(new Error('获取失败')); })
  .then(function(data) {
    renderSubscription(data.membership || {});
  })
  .catch(function(err) {
    console.error('Subscription load error:', err);
    document.getElementById('subscriptionContainer').innerHTML = '<div class="empty-state"><span class="empty-icon">⚠️</span><div class="empty-text">加载失败</div></div>';
  });
}

function renderSubscription(membership) {
  var isMember = membership.isMember || false;
  var expiresAt = membership.expiresAt || null;
  var tier = membership.tier || 'Standard';
  var price = membership.price || '¥39/月';

  if (!isMember) {
    var html = '<div class="empty-state" style="padding:30px 20px">';
    html += '<span class="empty-icon">👑</span>';
    html += '<div class="empty-text">您还未开通会员</div>';
    html += '<div style="margin-top:14px">';
    html += '<a href="/pages/member.html" class="btn-primary">升级会员</a>';
    html += '</div></div>';
    document.getElementById('subscriptionContainer').innerHTML = html;
    return;
  }

  var daysLeft = 0;
  if (expiresAt) {
    var expDate = new Date(expiresAt);
    var now = new Date();
    daysLeft = Math.ceil((expDate - now) / (1000 * 60 * 60 * 24));
  }

  var html = '<div class="subscription-card">';
  html += '<div class="sub-status-label">当前订阅</div>';
  html += '<div class="sub-tier">' + tier + ' (' + price + ')</div>';
  html += '<div class="sub-info-row">';
  html += '<span class="sub-info-label">有效期至</span>';
  html += '<span class="sub-info-value">' + (expiresAt ? expiresAt.substring(0, 10) : '无限期') + '</span>';
  html += '</div>';
  html += '<div class="sub-info-row">';
  html += '<span class="sub-info-label">剩余天数</span>';
  html += '<span class="sub-info-value">' + daysLeft + ' 天 <span class="sub-status-badge" style="margin-left:8px">✅ 活跃</span></span>';
  html += '</div>';
  html += '<div class="sub-btn-group">';
  html += '<button class="btn-renew" onclick="handleRenew()">立即续费</button>';
  html += '<button class="btn-upgrade" onclick="handleUpgrade()">升级到年卡</button>';
  html += '</div>';
  html += '</div>';

  // History table
  html += '<div style="margin-top:20px">';
  html += '<div class="sub-history-title">订阅历史</div>';
  html += '<div style="overflow-x:auto">';
  html += '<table class="sub-history-table">';
  html += '<thead><tr><th>开始</th><th>到期</th><th>套餐</th><th>金额</th></tr></thead>';
  html += '<tbody><tr><td>' + (expiresAt ? expiresAt.substring(0, 10) : '') + '</td><td>' + (expiresAt ? expiresAt.substring(0, 10) : '') + '</td><td>' + tier + '</td><td>' + price + '</td></tr></tbody>';
  html += '</table></div></div>';

  document.getElementById('subscriptionContainer').innerHTML = html;
}

function handleRenew() {
  showToast('正在跳转到续费页面…');
  setTimeout(function() {
    window.location.href = '/pages/member.html?action=renew';
  }, 500);
}

function handleUpgrade() {
  showToast('正在跳转到升级页面…');
  setTimeout(function() {
    window.location.href = '/pages/member.html?action=upgrade';
  }, 500);
}

// ════ SETTINGS (P1) ════
function loadSettings() {
  var token = getToken();
  if (!token) return;

  fetch(BASE + '/api/auth/me', {
    headers: { 'Authorization': 'Bearer ' + token }
  })
  .then(function(r) { return r.ok ? r.json() : Promise.reject(new Error('获取失败')); })
  .then(function(data) {
    var user = data.user || {};
    document.getElementById('inputName').value = user.name || '';
    document.getElementById('inputEmail').value = user.email || '';
    document.getElementById('inputBirthday').value = user.birthday || '';

    if (user.gender) {
      document.querySelector('input[name="gender"][value="' + user.gender + '"]').checked = true;
    }
  })
  .catch(function(err) {
    console.error('Settings load error:', err);
  });
}

function handleSaveSettings() {
  var token = getToken();
  if (!token) {
    showToast('请先登录', 'error');
    return;
  }

  var name = document.getElementById('inputName').value;
  var birthday = document.getElementById('inputBirthday').value;
  var gender = document.querySelector('input[name="gender"]:checked') ? document.querySelector('input[name="gender"]:checked').value : '';

  fetch(BASE + '/api/user/profile', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ name: name, birthday: birthday, gender: gender })
  })
  .then(function(r) { return r.ok ? r.json() : Promise.reject(new Error('保存失败')); })
  .then(function(data) {
    showToast('设置已保存', 'success');
  })
  .catch(function(err) {
    showToast('保存失败，请稍后重试', 'error');
  });
}

function handleChangePassword() {
  var newPass = prompt('请输入新密码 (至少6位):');
  if (!newPass || newPass.length < 6) {
    showToast('密码至少6位', 'error');
    return;
  }
  showToast('功能开发中…');
}

function handleLogoutDevice() {
  showToast('已登出当前设备', 'success');
  setTimeout(function() {
    localStorage.removeItem('sy_token');
    window.location.href = '/pages/login.html';
  }, 600);
}

function handleLogoutAll() {
  if (!confirm('将登出所有登录的设备，确定吗？')) return;
  showToast('已登出所有设备', 'success');
  setTimeout(function() {
    localStorage.removeItem('sy_token');
    window.location.href = '/pages/login.html';
  }, 600);
}

// Init
(function() {
  var token = getToken();
  if (!token) {
    window.location.href = '/pages/login.html';
    return;
  }

  // Load profile
  fetch(BASE + '/api/auth/me', {
    headers: { 'Authorization': 'Bearer ' + token }
  })
  .then(function(r) { return r.ok ? r.json() : Promise.reject(new Error('获取失败')); })
  .then(function(data) {
    var user = data.user || {};
    document.getElementById('profileEmail').textContent = user.email || '';
    document.getElementById('profileLabel').textContent = user.name ? user.name : '善缘用户';
  })
  .catch(function(err) {
    console.error('Profile load error:', err);
  });

  // Load reports by default
  loadReports();
})();
</script>
