<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  /* ── Runae 账户页 — 暖宣纸底 + 玉绿品牌色（与 bazi/ziwei 一脉相承）── */
  --paper-0:#e4e6d6; --paper:#eef0e2; --paper-2:#f4f5ea; --paper-3:#f9faf1; --paper-edge:#d6ddc9;
  --bg: var(--paper); --card: var(--paper-3); --mid: var(--paper-2);
  /* jade — 品牌主色 */
  --jade-hi:#8fc2a5; --jade:#2f8f6b; --jade-deep:#1f6b4e; --jade-soft:#5aa886; --jade-ink:#184e39; --jade-mid:#8fc2a5;
  --jade-line:rgba(31,107,78,.28); --jade-line-2:rgba(31,107,78,.50); --jade-glow:rgba(47,143,107,.38); --jade-wash:rgba(47,143,107,.09);
  /* gilt — 仅用于印章/强调 */
  --gilt-hi:#e7d3a0; --gilt:#c8a35a; --gilt-deep:#a07d38;
  /* 文字 */
  --ink:#232a22; --ink-mid:#4a5a44; --ink-soft:#68705f; --ink-faint:#a0a898;
  /* 分割线 */
  --hair:rgba(40,66,44,.10); --hair-2:rgba(40,66,44,.18);
  /* 状态色 */
  --error:#c0392b; --error-light:#fdecea; --success:#2f8f6b; --success-light:#e8f5ef;
  /* 字体 */
  --serif:'Noto Serif SC',serif; --sans:'Noto Sans SC',-apple-system,BlinkMacSystemFont,sans-serif; --lat:'Cormorant Garamond',serif;
}

html, body { background: var(--bg); font-family: var(--serif); color: var(--ink); -webkit-font-smoothing: antialiased; }
body { max-width: 390px; margin: 0 auto; min-height: 100vh; padding-bottom: max(100px, calc(env(safe-area-inset-bottom) + 80px)); }

/* 宣纸纹底 */
body::before {
  content: ''; position: fixed; inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(200,163,90,.07) 0%, transparent 55%);
  pointer-events: none; z-index: 0;
}

/* ── HEADER — 深色仪式感渐变（参照 bazi.html 的深色系 header） ── */
.header {
  position: relative; z-index: 1;
  background: linear-gradient(160deg, #0d2b1e 0%, #1a5c42 45%, #2f8f6b 85%, #5aa886 100%);
  padding: 44px 24px 36px; text-align: center; overflow: hidden;
}
/* 金色光晕点缀 */
.header::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% -10%, rgba(200,163,90,.18) 0%, transparent 60%);
  pointer-events: none;
}
/* 细纹肌理 */
.header::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background-image: radial-gradient(circle, rgba(200,163,90,.12) 1px, transparent 1px);
  background-size: 28px 28px; opacity: .5;
}
.header-back {
  position: absolute; top: 18px; left: 16px; z-index: 2;
  background: none; border: none; font-size: 22px; color: rgba(231,211,160,.7);
  cursor: pointer; padding: 8px; line-height: 1; transition: color .2s;
  font-family: var(--lat);
}
.header-back:hover { color: var(--gilt-hi); }
.header-logo {
  position: relative; z-index: 1;
  font-family: var(--lat); font-style: italic; font-size: 12px;
  letter-spacing: .32em; color: rgba(231,211,160,.65); margin-bottom: 16px;
  text-transform: uppercase;
}
.header-h1 {
  position: relative; z-index: 1;
  font-family: var(--serif); font-size: 26px; font-weight: 500;
  letter-spacing: .12em; color: #f2ede4; margin-bottom: 6px;
}
.header-sub {
  position: relative; z-index: 1;
  font-family: var(--lat); font-style: italic; font-size: 12.5px;
  letter-spacing: .28em; color: rgba(200,163,90,.55);
}
/* 金线分隔 */
.header-line {
  position: relative; z-index: 1;
  width: 48px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(200,163,90,.5), transparent);
  margin: 14px auto 0;
}

/* ── PROFILE — 宣纸浮卡 ── */
.profile-section {
  position: relative; z-index: 1;
  background: var(--card); border-bottom: 1px solid var(--hair);
  padding: 16px 20px;
}
.profile-card { display: flex; gap: 14px; align-items: center; }
.profile-avatar {
  width: 50px; height: 50px; border-radius: 50%;
  background: linear-gradient(135deg, var(--jade-wash), rgba(47,143,107,.15));
  border: 1.5px solid var(--jade-line-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.profile-info { flex: 1; min-width: 0; }
.profile-email {
  font-family: var(--sans); font-size: 14px; font-weight: 500;
  color: var(--ink); margin-bottom: 3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.profile-label {
  font-family: var(--lat); font-style: italic; font-size: 12px;
  letter-spacing: .12em; color: var(--jade-soft);
}

/* ── TABS ── */
.tabs {
  display: flex; background: var(--card);
  border-bottom: 1px solid var(--hair-2);
  position: sticky; top: 0; z-index: 90;
  box-shadow: 0 2px 12px rgba(28,60,42,.08);
}
.tab {
  flex: 1; padding: 13px 6px; text-align: center;
  font-family: var(--serif); font-size: 12px; font-weight: 400;
  letter-spacing: .1em; color: var(--ink-soft);
  cursor: pointer; transition: all .25s;
  border-bottom: 2px solid transparent;
}
.tab.active { color: var(--jade); border-bottom-color: var(--jade); }
.tab:hover { color: var(--ink-mid); }

/* ── SECTION CONTENT ── */
.section-content { display: none; padding: 20px 16px; position: relative; z-index: 1; }
.section-content.active { display: block; }

/* 标题：玉绿细竖线 + 衬线字 */
.section-title {
  font-family: var(--serif); font-size: 14px; font-weight: 500;
  letter-spacing: .14em; color: var(--ink); margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.section-title::before {
  content: ''; width: 2px; height: 15px;
  background: linear-gradient(to bottom, var(--gilt), var(--jade));
  border-radius: 1px; flex-shrink: 0;
}

/* ── REPORTS ── */
.report-list { display: flex; flex-direction: column; gap: 10px; }
.report-card {
  background: var(--card); border: 1px solid var(--hair);
  border-radius: 12px; padding: 14px;
  display: flex; align-items: center; gap: 12px;
  cursor: pointer; transition: all .2s;
}
.report-card:hover { border-color: var(--jade-line-2); box-shadow: 0 4px 16px rgba(28,60,42,.10); transform: translateY(-1px); }
.report-icon {
  width: 40px; height: 40px; border-radius: 10px;
  background: var(--jade-wash); border: 1px solid var(--jade-line);
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; flex-shrink: 0; font-family: var(--serif);
  color: var(--jade-deep); letter-spacing: 0;
}
.report-info { flex: 1; min-width: 0; }
.report-name { font-family: var(--serif); font-size: 13px; font-weight: 500; color: var(--ink); margin-bottom: 3px; letter-spacing: .06em; }
.report-meta { font-family: var(--sans); font-size: 11px; color: var(--ink-soft); }
.report-actions { display: flex; gap: 6px; flex-shrink: 0; }
.btn-view {
  padding: 6px 12px;
  background: var(--jade-wash); border: 1px solid var(--jade-line-2);
  border-radius: 6px; font-size: 11px; font-weight: 500;
  color: var(--jade-deep); cursor: pointer; transition: all .2s;
  font-family: var(--sans); letter-spacing: .06em;
}
.btn-view:hover { background: var(--jade); color: #fff; border-color: var(--jade); }
.btn-download {
  padding: 6px 12px; background: transparent;
  border: 1px solid var(--hair-2); border-radius: 6px;
  font-size: 11px; color: var(--ink-soft); cursor: pointer;
  transition: all .2s; font-family: var(--sans);
}
.btn-download:hover { background: var(--mid); border-color: var(--jade-line); }

/* ── REFERRALS ── */
.ref-codes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.ref-code-card {
  background: var(--card); border: 1px solid var(--hair);
  border-radius: 12px; padding: 14px; text-align: center;
  transition: all .2s;
}
.ref-code-card:hover { border-color: var(--jade-line); }
.ref-channel { font-family: var(--sans); font-size: 10px; color: var(--ink-faint); margin-bottom: 6px; letter-spacing: .1em; text-transform: uppercase; }
.ref-code-text { font-family: var(--lat); font-size: 15px; font-weight: 600; color: var(--jade-deep); margin-bottom: 10px; letter-spacing: .06em; }
.ref-code-copy {
  padding: 7px 12px; width: 100%;
  background: var(--jade-wash); border: 1px solid var(--jade-line-2);
  border-radius: 6px; font-size: 10px; font-weight: 500;
  color: var(--jade-deep); cursor: pointer; transition: all .2s;
  font-family: var(--sans); letter-spacing: .1em;
}
.ref-code-copy:hover { background: var(--jade); color: #fff; border-color: var(--jade); }
.ref-code-count { font-family: var(--sans); font-size: 9px; color: var(--ink-faint); margin-top: 6px; }

.ref-stats {
  background: var(--card); border: 1px solid var(--hair);
  border-radius: 12px; padding: 16px; margin-bottom: 16px;
}
.ref-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.ref-stat-item {
  text-align: center; padding-bottom: 12px;
  border-bottom: 1px solid var(--hair);
}
.ref-stat-value {
  font-family: var(--lat); font-size: 20px; font-weight: 500;
  color: var(--jade); display: block; margin-bottom: 4px; letter-spacing: .04em;
}
.ref-stat-label { font-family: var(--sans); font-size: 10px; color: var(--ink-soft); letter-spacing: .1em; }
.ref-tier-info {
  background: var(--jade-wash); border-radius: 8px;
  padding: 12px; text-align: center;
}
.ref-tier-label { font-family: var(--sans); font-size: 10px; color: var(--ink-soft); letter-spacing: .1em; }
.ref-tier-value { font-family: var(--serif); font-size: 15px; color: var(--jade-deep); margin: 4px 0; letter-spacing: .1em; }
.ref-bonus { font-family: var(--sans); font-size: 11px; color: var(--gilt-deep); margin-top: 5px; }

.ref-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 12px; }
.ref-table th {
  background: var(--jade-wash); color: var(--jade-deep);
  padding: 9px 8px; text-align: left; font-weight: 500;
  border: 1px solid var(--hair); font-family: var(--sans); letter-spacing: .06em;
}
.ref-table td { padding: 9px 8px; border: 1px solid var(--hair); color: var(--ink); font-family: var(--sans); }
.ref-table tr:nth-child(even) { background: var(--mid); }
.ref-status-ok { color: var(--jade); font-weight: 600; }
.ref-status-wait { color: var(--ink-soft); font-style: italic; }

/* ── SUBSCRIPTION ── */
.subscription-card {
  background: var(--card); border: 1px solid var(--hair);
  border-radius: 12px; padding: 18px; margin-bottom: 14px;
}
.sub-status-label { font-family: var(--sans); font-size: 10px; color: var(--ink-faint); letter-spacing: .12em; margin-bottom: 6px; text-transform: uppercase; }
.sub-tier { font-family: var(--serif); font-size: 16px; font-weight: 500; color: var(--jade-deep); margin-bottom: 10px; letter-spacing: .1em; }
.sub-info-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 0; border-bottom: 1px solid var(--hair);
  font-family: var(--sans); font-size: 12px;
}
.sub-info-row:last-of-type { border-bottom: none; }
.sub-info-label { color: var(--ink-soft); }
.sub-info-value { color: var(--ink); font-weight: 500; }
.sub-status-badge {
  display: inline-block; padding: 3px 9px;
  background: var(--jade); color: #fff;
  border-radius: 12px; font-size: 10px; font-weight: 500;
  font-family: var(--sans); letter-spacing: .04em;
}
.sub-btn-group { display: flex; gap: 8px; margin-top: 16px; }
.btn-renew {
  flex: 1; padding: 11px 0;
  background: linear-gradient(135deg, var(--jade-deep), var(--jade), var(--jade-soft));
  color: #fff; border: none; border-radius: 10px;
  font-family: var(--serif); font-size: 13px; font-weight: 500;
  letter-spacing: .12em; cursor: pointer; transition: all .2s;
  box-shadow: 0 4px 14px rgba(31,107,78,.25);
}
.btn-renew:hover { box-shadow: 0 6px 20px rgba(31,107,78,.38); transform: translateY(-1px); }
.btn-upgrade {
  flex: 1; padding: 11px 0;
  background: transparent; color: var(--jade-deep);
  border: 1.5px solid var(--jade-line-2); border-radius: 10px;
  font-family: var(--serif); font-size: 13px; font-weight: 400;
  letter-spacing: .1em; cursor: pointer; transition: all .2s;
}
.btn-upgrade:hover { background: var(--jade-wash); }

.sub-history { margin-top: 14px; }
.sub-history-title { font-family: var(--serif); font-size: 12px; color: var(--ink-mid); margin-bottom: 10px; letter-spacing: .1em; }
.sub-history-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.sub-history-table th { background: var(--mid); color: var(--ink-soft); padding: 8px; text-align: left; font-weight: 500; border: 1px solid var(--hair); font-family: var(--sans); }
.sub-history-table td { padding: 8px; border: 1px solid var(--hair); color: var(--ink); font-family: var(--sans); }
.sub-history-table tr:nth-child(even) { background: var(--card); }

/* ── SETTINGS ── */
.settings-group {
  background: var(--card); border: 1px solid var(--hair);
  border-radius: 12px; padding: 16px; margin-bottom: 14px;
}
.settings-group-title { font-family: var(--serif); font-size: 12px; color: var(--jade); margin-bottom: 12px; letter-spacing: .1em; }
.form-group { margin-bottom: 14px; }
.form-label { font-family: var(--sans); font-size: 11px; color: var(--ink-soft); letter-spacing: .1em; margin-bottom: 6px; display: block; }
.form-input {
  width: 100%; padding: 10px 12px;
  border: 1px solid var(--hair-2); border-radius: 8px;
  font-family: var(--serif); font-size: 14px; color: var(--ink);
  background: var(--paper-2); transition: all .2s; outline: none;
}
.form-input:focus { border-color: var(--jade-line-2); box-shadow: 0 0 0 3px var(--jade-wash); }
.form-input:disabled { background: var(--mid); color: var(--ink-soft); cursor: not-allowed; }
.form-check { display: flex; align-items: center; padding: 8px 0; gap: 10px; }
.form-check input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--jade); }
.form-check label { font-family: var(--sans); font-size: 12px; color: var(--ink); cursor: pointer; flex: 1; }

/* 账户安全按钮 */
.btn-setting-action {
  width: 100%; padding: 11px 0;
  background: var(--mid); color: var(--ink);
  border: 1px solid var(--hair-2); border-radius: 8px;
  font-family: var(--sans); font-size: 12px; font-weight: 500;
  letter-spacing: .06em; cursor: pointer; margin-bottom: 8px;
  transition: all .2s;
}
.btn-setting-action:hover { background: var(--paper-edge); border-color: var(--hair-2); }
.btn-save-settings {
  width: 100%; padding: 13px 0;
  background: linear-gradient(135deg, var(--jade-deep), var(--jade), var(--jade-soft));
  color: #fff; border: none; border-radius: 10px;
  font-family: var(--serif); font-size: 14px; font-weight: 500;
  letter-spacing: .16em; cursor: pointer; margin-top: 20px;
  box-shadow: 0 4px 14px rgba(31,107,78,.25); transition: all .2s;
}
.btn-save-settings:hover { box-shadow: 0 6px 22px rgba(31,107,78,.38); transform: translateY(-1px); }

/* ── EMPTY STATE ── */
.empty-state { text-align: center; padding: 40px 20px; }
.empty-icon { font-size: 42px; opacity: .25; margin-bottom: 12px; display: block; }
.empty-text { font-family: var(--sans); font-size: 12px; color: var(--ink-soft); letter-spacing: .08em; margin-bottom: 14px; line-height: 1.8; }
.btn-primary {
  display: inline-block; padding: 11px 22px;
  background: linear-gradient(135deg, var(--jade-deep), var(--jade));
  color: #fff; border-radius: 10px;
  font-family: var(--serif); font-size: 13px; font-weight: 500;
  text-decoration: none; cursor: pointer; letter-spacing: .12em;
  transition: all .2s; box-shadow: 0 4px 14px rgba(31,107,78,.25);
}
.btn-primary:hover { box-shadow: 0 6px 20px rgba(31,107,78,.38); transform: translateY(-1px); }

/* ── LOADING SKELETON ── */
.skeleton {
  background: linear-gradient(90deg, var(--hair) 0%, var(--paper-edge) 50%, var(--hair) 100%);
  background-size: 200% 100%; animation: skel-load 1.6s infinite; border-radius: 4px; display: block;
}
@keyframes skel-load { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* ── FOOTER ── */
.footer {
  text-align: center; padding: 20px 16px;
  font-family: var(--sans); font-size: 11px; color: var(--ink-faint);
  border-top: 1px solid var(--hair); margin-top: 20px;
  position: relative; z-index: 1;
}
.footer a { color: var(--jade-soft); text-decoration: none; margin: 0 6px; letter-spacing: .04em; transition: color .2s; }
.footer a:hover { color: var(--jade-deep); }
/* 金色分割点 */
.footer-sep { color: rgba(200,163,90,.4); margin: 0 2px; }

/* ── UTILITIES ── */
.hidden { display: none !important; }
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  z-index: 999; max-width: 340px; width: 90%;
  padding: 12px 18px; border-radius: 10px;
  font-family: var(--sans); font-size: 12px; letter-spacing: .06em;
  line-height: 1.6; text-align: center; cursor: pointer;
  transition: opacity .3s; background: rgba(30,40,28,.88); color: #e8f0e4;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  box-shadow: 0 8px 24px rgba(0,0,0,.2);
}
.toast.error { background: rgba(160,40,30,.92); color: rgba(255,220,215,.95); }
.toast.success { background: rgba(31,107,78,.92); color: rgba(220,255,235,.95); }

/* ── MODAL ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(28,38,26,.55); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.modal-overlay.active { display: flex; }
.modal-dialog {
  background: var(--card); border: 1px solid var(--hair-2);
  border-radius: 16px; padding: 24px; max-width: 90%; width: 340px;
  max-height: 90vh; overflow-y: auto;
  box-shadow: 0 24px 60px -20px rgba(28,60,42,.45), 0 0 0 1px var(--hair);
}
.modal-header {
  font-family: var(--serif); font-size: 16px; font-weight: 500;
  letter-spacing: .1em; color: var(--ink); margin-bottom: 18px;
  display: flex; justify-content: space-between; align-items: center;
}
.modal-close {
  background: none; border: none; font-size: 20px;
  color: var(--ink-soft); cursor: pointer; padding: 4px;
  width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
  border-radius: 50%; transition: all .2s;
}
.modal-close:hover { background: var(--mid); color: var(--ink); }
.modal-body { margin-bottom: 16px; }
.modal-footer {
  display: flex; gap: 10px;
  border-top: 1px solid var(--hair); padding-top: 16px; margin-top: 16px;
}

/* ── VALIDATION ── */
.form-error { border-color: var(--error) !important; }
.form-error-msg { color: var(--error); font-size: 10px; font-family: var(--sans); margin-top: 4px; letter-spacing: .04em; }
.form-success { border-color: var(--jade) !important; }

/* ── RESPONSIVE ── */
@media (max-width: 480px) {
  body { max-width: 100%; }
  .ref-stat-grid { grid-template-columns: 1fr; gap: 6px; }
  .ref-stat-item { padding-bottom: 8px; }
  .modal-dialog { padding: 18px; }
  table { font-size: 10px; }
  td, th { padding: 6px 4px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <button class="header-back" onclick="window.history.back();">‹</button>

      <button style="flex:1;padding:10px 0;background:linear-gradient(135deg,var(--jade-deep),var(--jade));color:#fff;border:none;border-radius:8px;font-size:12px;cursor:pointer;font-family:var(--sans);font-weight:500" onclick="submitPasswordChange()">确认修改</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var BASE = '';
var LANG = 'zh';
var isLoading = false;

function getToken() {
  return localStorage.getItem('sy_token');
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '');
  t.onclick = function(){ t.className = 'toast'; };
  if (t._toastTimer) clearTimeout(t._toastTimer);
  t._toastTimer = setTimeout(function(){ t.className = 'toast'; }, 3000);
}

function showError(fieldId, msg) {
  var errorEl = document.getElementById(fieldId + 'Error');
  if (errorEl) {
    errorEl.textContent = msg;
    var input = document.getElementById(fieldId);
    if (input) input.classList.add('form-error');
  }
}

function clearError(fieldId) {
  var errorEl = document.getElementById(fieldId + 'Error');
  if (errorEl) errorEl.textContent = '';
  var input = document.getElementById(fieldId);
  if (input) input.classList.remove('form-error');
}

function validateEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function validatePassword(pwd) {
  return pwd && pwd.length >= 6 && /[a-zA-Z]/.test(pwd) && /[0-9]/.test(pwd);
}

function validateBirthday(bd) {
  if (!bd) return true; // optional
  var d = new Date(bd);
  return d instanceof Date && !isNaN(d) && d.getFullYear() > 1900 && d < new Date();
}

function switchTab(tabName) {
  // Hide all sections
  document.querySelectorAll('.section-content').forEach(function(el) {
    el.classList.remove('active');
  });
  // Remove active from tabs
  document.querySelectorAll('.tab').forEach(function(el) {
    el.classList.remove('active');
  });
  // Show selected section
  document.getElementById(tabName + '-content').classList.add('active');
  // Add active to tab
  document.querySelector('[data-tab="' + tabName + '"]').classList.add('active');

  // Load data for specific tabs
  if (tabName === 'reports') loadReports();
  else if (tabName === 'referrals') loadReferrals();
  else if (tabName === 'subscription') loadSubscription();
  else if (tabName === 'settings') loadSettings();
}

// ════ REPORTS (P0) ════
function loadReports() {
  var token = getToken();
  if (!token) {
    document.getElementById('reportList').innerHTML = '<div class="empty-state"><span class="empty-icon">🔒</span><div class="empty-text">请先登录</div></div>';
    return;
  }

  isLoading = true;
  document.getElementById('reportList').style.opacity = '0.6';

  fetch(BASE + '/api/orders/mine', {
    headers: { 'Authorization': 'Bearer ' + token }
  })
  .then(function(r) { return r.ok ? r.json() : Promise.reject(new Error('获取失败')); })
  .then(function(data) {
    var orders = data.orders || data.data || [];
    if (!Array.isArray(orders)) orders = [];

    // Filter for report/divination products
    var reports = orders.filter(function(o) {
      var name = o.product_name || o.name || '';
      return name.indexOf('报告') >= 0 || name.indexOf('八字') >= 0 || name.indexOf('合婚') >= 0 || name.indexOf('读') >= 0;
    }).sort(function(a, b) {
      return new Date(b.created_at || 0) - new Date(a.created_at || 0);
    });

    renderReports(reports);
    isLoading = false;
    document.getElementById('reportList').style.opacity = '1';
  })
  .catch(function(err) {
    console.error('Report load error:', err);
    document.getElementById('reportList').innerHTML = '<div class="empty-state"><span class="empty-icon">⚠️</span><div class="empty-text">暂无报告</div></div>';
    isLoading = false;
    document.getElementById('reportList').style.opacity = '1';
  });
}

function renderReports(reports) {
  var list = document.getElementById('reportList');
  if (!reports || reports.length === 0) {
    list.innerHTML = '<div class="empty-state"><span class="empty-icon">📋</span><div class="empty-text">暂无报告记录</div><a href="/pages/bazi.html" class="btn-primary" style="margin-top:14px">立即购买</a></div>';
    return;
  }

  var html = '';
  reports.forEach(function(o) {
    var name = o.product_name || o.name || '报告';
    var date = o.created_at ? o.created_at.substring(0, 10) : '';
    var expires = o.expires_at ? o.expires_at.substring(0, 10) : '';
    var icon = '📄';

    if (name.indexOf('八字') >= 0) icon = '命';
    if (name.indexOf('合婚') >= 0) icon = '合';
    if (name.indexOf('紫微') >= 0) icon = '紫';

    html += '<div class="report-card">';
    html += '<div class="report-icon">' + icon + '</div>';
    html += '<div class="report-info">';
    html += '<div class="report-name">' + name + '</div>';
    html += '<div class="report-meta">购于 ' + date;
    if (expires) html += ' · 有效期至 ' + expires;
    html += '</div></div>';
    html += '<div class="report-actions">';
    html += '<button class="btn-view" onclick="viewReport(\'' + o.id + '\')">查看</button>';
    html += '</div></div>';
  });

  list.innerHTML = html;
}

function viewReport(reportId) {
  showToast('正在打开报告…');
  setTimeout(function() {
    window.location.href = '/pages/report.html?id=' + reportId;
  }, 500);
}

// ════ REFERRALS (P0) ════
var referralData = {};

function loadReferrals() {
  var token = getToken();
  if (!token) {
    document.getElementById('refCodesContainer').innerHTML = '<div class="empty-state"><span class="empty-icon">🔒</span><div class="empty-text">请先登录</div></div>';
    return;
  }

  isLoading = true;
  showSkeletonReferrals();

  fetch(BASE + '/api/referral/mine', {
    headers: { 'Authorization': 'Bearer ' + token }
  })
  .then(function(r) {
    if (!r.ok) return Promise.reject(new Error(r.status === 401 ? '登录已过期' : '获取失败'));
    return r.json();
  })
  .then(function(data) {
    referralData = data || {};
    renderReferralCodes(data || {});
    renderReferralStats(data || {});
    renderReferralTable(data || {});
    isLoading = false;
  })
  .catch(function(err) {
    console.error('Referral load error:', err);
    document.getElementById('refCodesContainer').innerHTML = '<div class="empty-state"><span class="empty-icon">⚠️</span><div class="empty-text">加载失败</div></div>';
    isLoading = false;
  });
}

function showSkeletonReferrals() {
  document.getElementById('refCodesContainer').innerHTML = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;opacity:0.5"><div class="ref-code-card"><div class="skeleton" style="width:40%;height:11px;margin:6px auto"></div></div></div>';
}

function renderReferralCodes(data) {
  var refCodes = data.ref_codes || {};
  var channels = { tiktok: 'TikTok', xiaohongshu: '小红书', youtube: 'YouTube', wechat: '微信', organic: '自然流量' };
  var html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">';

  Object.entries(refCodes).forEach(function(pair, idx) {
    var ch = pair[0];
    var code = pair[1];
    var chName = channels[ch] || ch;
    var inviteCount = data.invitees_by_channel && data.invitees_by_channel[ch] ? data.invitees_by_channel[ch].length : 0;

    html += '<div class="ref-code-card">';
    html += '<div class="ref-channel">' + chName + '</div>';
    html += '<div class="ref-code-text">' + code + '</div>';
    html += '<button class="ref-code-copy" onclick="copyRefCode(\'' + code + '\')">复制</button>';
    html += '<div class="ref-code-count">' + inviteCount + ' 人使用</div>';
    html += '</div>';
  });

  html += '</div>';
  document.getElementById('refCodesContainer').innerHTML = html;
}

function copyRefCode(code) {
  var textarea = document.createElement('textarea');
  textarea.value = code;
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    showToast('邀请码已复制！');
  } catch(e) {
    showToast('复制失败，请手动复制', 'error');
  }
  document.body.removeChild(textarea);
}

function renderReferralStats(data) {
  var invited = data.invited_count || 0;
  var converted = data.converted_count || 0;
  var rate = invited > 0 ? Math.round(converted / invited * 100) : 0;
  var tier = data.current_tier || 'pending';

  // Fix: bonus_amount replaces total_bonus
  var bonus = data.bonus_amount || data.total_bonus || 0;
  bonus = parseInt(bonus) || 0;

  var tierLabels = { pending: '等待中', basic: '基础', standard: '标准', premium: '高级' };
  var tierName = tierLabels[tier] || tier;

  var html = '<div class="ref-stats">';
  html += '<div class="ref-stat-grid">';
  html += '<div class="ref-stat-item"><span class="ref-stat-value">' + invited + '</span><span class="ref-stat-label">已邀请</span></div>';
  html += '<div class="ref-stat-item"><span class="ref-stat-value">' + converted + '</span><span class="ref-stat-label">已转化</span></div>';
  html += '<div class="ref-stat-item"><span class="ref-stat-value">' + rate + '%</span><span class="ref-stat-label">转化率</span></div>';
  html += '<div class="ref-stat-item"><span class="ref-stat-value">¥' + bonus + '</span><span class="ref-stat-label">累计奖励</span></div>';
  html += '</div>';
  html += '<div class="ref-tier-info">';
  html += '<div class="ref-tier-label">当前等级</div>';
  html += '<div class="ref-tier-value">' + tierName + '</div>';
  if (data.next_tier_at) {
    html += '<div class="ref-bonus" style="font-size:11px;margin-top:4px">下一等级还需邀请 ' + (data.next_tier_at - invited) + ' 人</div>';
  }
  html += '</div></div>';

  document.getElementById('refStatsContainer').innerHTML = html;
}

function renderReferralTable(data) {
  var invitees = data.invitees || [];
  if (!invitees || invitees.length === 0) {
    document.getElementById('refTableContainer').innerHTML = '<div class="empty-state" style="padding:20px 0"><span class="empty-icon">👥</span><div class="empty-text">暂无邀请记录</div></div>';
    return;
  }

  var html = '<div style="overflow-x:auto"><table class="ref-table"><thead><tr><th>日期</th><th>用户</th><th>渠道</th><th>状态</th></tr></thead><tbody>';

  invitees.forEach(function(inv) {
    var date = inv.created_at ? inv.created_at.substring(0, 10) : '未知';
    var email = inv.invitee_email || inv.email || '';
    var name = email ? email.substring(0, email.indexOf('@')) : '用户';
    var ch = inv.channel || '其他';
    var status = inv.converted ? '✅ 已转化' : '⏳ 待转化';
    var statusClass = inv.converted ? 'ref-status-ok' : 'ref-status-wait';

    html += '<tr>';
    html += '<td>' + date + '</td>';
    html += '<td title="' + email + '">' + name + '</td>';
    html += '<td>' + ch + '</td>';
    html += '<td><span class="' + statusClass + '">' + status + '</span></td>';
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  document.getElementById('refTableContainer').innerHTML = html;
}

// ════ SUBSCRIPTION (P0) ════
function loadSubscription() {
  var token = getToken();
  if (!token) {
    document.getElementById('subscriptionContainer').innerHTML = '<div class="empty-state"><span class="empty-icon">🔒</span><div class="empty-text">请先登录</div></div>';
    return;
  }

  isLoading = true;
  document.getElementById('subscriptionContainer').style.opacity = '0.6';

  Promise.all([
    fetch(BASE + '/api/auth/me', {
      headers: { 'Authorization': 'Bearer ' + token }
    }).then(r => r.ok ? r.json() : Promise.reject(new Error('获取失败'))),
    fetch(BASE + '/api/subscription/history', {
      headers: { 'Authorization': 'Bearer ' + token }
    }).then(r => r.ok ? r.json() : { history: [] })
  ])
  .then(function(results) {
    var data = results[0] || {};
    var history = results[1]?.history || [];
    renderSubscription(data.membership || {}, history);
    isLoading = false;
    document.getElementById('subscriptionContainer').style.opacity = '1';
  })
  .catch(function(err) {
    console.error('Subscription load error:', err);
    // Fallback: render without history
    fetch(BASE + '/api/auth/me', {
      headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(data => {
      renderSubscription(data.membership || {}, []);
      isLoading = false;
      document.getElementById('subscriptionContainer').style.opacity = '1';
    })
    .catch(() => {
      document.getElementById('subscriptionContainer').innerHTML = '<div class="empty-state"><span class="empty-icon">⚠️</span><div class="empty-text">加载失败</div></div>';
      isLoading = false;
      document.getElementById('subscriptionContainer').style.opacity = '1';
    });
  });
}

function renderSubscription(membership, history) {
  var isMember = membership.isMember || false;
  var expiresAt = membership.expiresAt || null;
  var tier = membership.tier || 'Standard';
  var price = membership.price || '¥39/月';

  if (!isMember) {
    var html = '<div class="empty-state" style="padding:30px 20px">';
    html += '<span class="empty-icon">👑</span>';
    html += '<div class="empty-text">您还未开通会员</div>';
    html += '<div style="margin-top:14px">';
    html += '<a href="/pages/member.html" class="btn-primary">升级会员</a>';
    html += '</div></div>';
    document.getElementById('subscriptionContainer').innerHTML = html;
    return;
  }

  var daysLeft = 0;
  var isExpired = false;
  if (expiresAt) {
    var expDate = new Date(expiresAt);
    var now = new Date();
    daysLeft = Math.ceil((expDate - now) / (1000 * 60 * 60 * 24));
    isExpired = daysLeft <= 0;
  }

  var html = '<div class="subscription-card">';
  html += '<div class="sub-status-label">当前订阅</div>';
  html += '<div class="sub-tier">' + tier + ' (' + price + ')</div>';
  html += '<div class="sub-info-row">';
  html += '<span class="sub-info-label">有效期至</span>';
  html += '<span class="sub-info-value">' + (expiresAt ? expiresAt.substring(0, 10) : '无限期') + '</span>';
  html += '</div>';
  html += '<div class="sub-info-row">';
  html += '<span class="sub-info-label">状态</span>';
  if (isExpired) {
    html += '<span class="sub-info-value"><span class="sub-status-badge" style="background:var(--error-light);color:var(--error)">已过期</span></span>';
  } else {
    html += '<span class="sub-info-value">' + daysLeft + ' 天<span class="sub-status-badge" style="margin-left:8px">✅ 活跃</span></span>';
  }
  html += '</div>';
  html += '<div class="sub-btn-group">';
  html += '<button class="btn-renew" onclick="handleRenew()">立即续费</button>';
  html += '<button class="btn-upgrade" onclick="handleUpgrade()">升级到年卡</button>';
  html += '</div>';
  html += '</div>';

  // History table
  if (history && history.length > 0) {
    html += '<div style="margin-top:20px">';
    html += '<div class="sub-history-title">订阅历史</div>';
    html += '<div style="overflow-x:auto">';
    html += '<table class="sub-history-table">';
    html += '<thead><tr><th>开始</th><th>到期</th><th>套餐</th><th>金额</th></tr></thead>';
    html += '<tbody>';
    history.forEach(function(h) {
      html += '<tr>';
      html += '<td>' + (h.start_date ? h.start_date.substring(0, 10) : '') + '</td>';
      html += '<td>' + (h.end_date ? h.end_date.substring(0, 10) : '') + '</td>';
      html += '<td>' + (h.tier || '标准') + '</td>';
      // 金额由服务端算好带币种：订单里的 amount 是「分」，且 Stripe 单是美元、
      // 微信/支付宝单是人民币，前端自己拼 '¥' 会把 $11.99 显示成 ¥1199
      html += '<td>' + (h.amount_text || ('¥' + (h.amount || 0))) + '</td>';
      html += '</tr>';
    });
    html += '</tbody>';
    html += '</table></div></div>';
  }

  document.getElementById('subscriptionContainer').innerHTML = html;
}

function handleRenew() {
  showToast('正在跳转到续费页面…');
  setTimeout(function() {
    window.location.href = '/pages/member.html?action=renew';
  }, 500);
}

function handleUpgrade() {
  showToast('正在跳转到升级页面…');
  setTimeout(function() {
    window.location.href = '/pages/member.html?action=upgrade';
  }, 500);
}

// ════ SETTINGS (P1) ════
function loadSettings() {
  var token = getToken();
  if (!token) return;

  isLoading = true;

  fetch(BASE + '/api/auth/me', {
    headers: { 'Authorization': 'Bearer ' + token }
  })
  .then(function(r) { return r.ok ? r.json() : Promise.reject(new Error('获取失败')); })
  .then(function(data) {
    var user = data.user || {};

    // Reset all error states
    document.querySelectorAll('.form-error-msg').forEach(function(el) { el.textContent = ''; });
    document.querySelectorAll('.form-error').forEach(function(el) { el.classList.remove('form-error'); });

    document.getElementById('inputName').value = user.name || '';
    document.getElementById('inputEmail').value = user.email || '';
    document.getElementById('inputBirthday').value = user.birthday || '';

    // Fix: properly initialize radio buttons
    document.querySelectorAll('input[name="gender"]').forEach(function(el) {
      el.checked = false;
    });
    if (user.gender) {
      var genderInput = document.querySelector('input[name="gender"][value="' + user.gender + '"]');
      if (genderInput) genderInput.checked = true;
    }

    isLoading = false;
  })
  .catch(function(err) {
    console.error('Settings load error:', err);
    showToast('加载设置失败', 'error');
    isLoading = false;
  });
}

function handleSaveSettings() {
  var token = getToken();
  if (!token) {
    showToast('请先登录', 'error');
    return;
  }

  if (isLoading) return;

  var name = (document.getElementById('inputName').value || '').trim();
  var birthday = document.getElementById('inputBirthday').value;
  var gender = document.querySelector('input[name="gender"]:checked') ? document.querySelector('input[name="gender"]:checked').value : '';

  // Clear all previous errors
  document.querySelectorAll('.form-error-msg').forEach(function(el) { el.textContent = ''; });
  document.querySelectorAll('.form-error').forEach(function(el) { el.classList.remove('form-error'); });

  // Validate
  var hasError = false;
  if (name && name.length > 50) {
    showError('inputName', '昵称不能超过50个字符');
    hasError = true;
  }
  if (birthday && !validateBirthday(birthday)) {
    showError('inputBirthday', '生日格式不正确或日期无效');
    hasError = true;
  }

  if (hasError) return;

  isLoading = true;
  showToast('正在保存…');

  fetch(BASE + '/api/user/profile', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ name: name, birthday: birthday, gender: gender })
  })
  .then(function(r) {
    if (!r.ok) return Promise.reject(new Error(r.status === 401 ? '登录已过期' : '保存失败'));
    return r.json();
  })
  .then(function(data) {
    showToast('设置已保存', 'success');
    isLoading = false;
  })
  .catch(function(err) {
    console.error('Save error:', err);
    showToast('保存失败，请稍后重试', 'error');
    isLoading = false;
  });
}

function handleChangePassword() {
  document.getElementById('passwordModal').classList.add('active');
  // Clear fields
  document.getElementById('currentPassword').value = '';
  document.getElementById('newPassword').value = '';
  document.getElementById('confirmPassword').value = '';
  document.querySelectorAll('.modal-body .form-error-msg').forEach(el => el.textContent = '');
}

function closePasswordModal() {
  document.getElementById('passwordModal').classList.remove('active');
  document.getElementById('currentPassword').value = '';
  document.getElementById('newPassword').value = '';
  document.getElementById('confirmPassword').value = '';
  document.querySelectorAll('.modal-body .form-error-msg').forEach(el => el.textContent = '');
}

function submitPasswordChange() {
  var token = getToken();
  if (!token) {
    showToast('请先登录', 'error');
    return;
  }

  if (isLoading) return;

  var currentPassword = document.getElementById('currentPassword').value;
  var newPassword = document.getElementById('newPassword').value;
  var confirmPassword = document.getElementById('confirmPassword').value;

  // Clear errors
  clearError('currentPassword');
  clearError('newPassword');
  clearError('confirmPassword');

  // Validate
  if (!currentPassword) {
    showError('currentPassword', '请输入当前密码');
    return;
  }
  if (!newPassword) {
    showError('newPassword', '请输入新密码');
    return;
  }
  if (!validatePassword(newPassword)) {
    showError('newPassword', '密码至少6位，需包含字母和数字');
    return;
  }
  if (newPassword !== confirmPassword) {
    showError('confirmPassword', '两次输入的密码不一致');
    return;
  }

  isLoading = true;

  fetch(BASE + '/api/auth/verify-password', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ password: currentPassword })
  })
  .then(r => {
    if (!r.ok) return Promise.reject(new Error('当前密码错误'));
    return fetch(BASE + '/api/user/change-password', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + token,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ new_password: newPassword })
    });
  })
  .then(r => {
    if (!r.ok) return Promise.reject(new Error('修改失败'));
    return r.json();
  })
  .then(() => {
    showToast('密码已修改', 'success');
    closePasswordModal();
    isLoading = false;
  })
  .catch(err => {
    showError('currentPassword', err.message);
    isLoading = false;
  });
}

function handleLogoutDevice() {
  if (!confirm('确定要登出当前设备吗？')) return;
  showToast('正在登出…', 'success');
  setTimeout(function() {
    localStorage.removeItem('sy_token');
    localStorage.removeItem('sy_user');
    window.location.href = '/pages/login.html';
  }, 600);
}

function handleLogoutAll() {
  if (!confirm('将登出所有登录的设备，确定吗？')) return;
  showToast('正在登出…', 'success');
  setTimeout(function() {
    localStorage.removeItem('sy_token');
    localStorage.removeItem('sy_user');
    window.location.href = '/pages/login.html';
  }, 600);
}

// Init — with back button fallback (solves direct link issue)
(function() {
  var token = getToken();
  if (!token) {
    showToast('登录已过期，请重新登录', 'error');
    setTimeout(function() {
      window.location.href = '/pages/login.html';
    }, 1500);
    return;
  }

  // Back button fallback: if no history, go to /index.html
  var backBtn = document.querySelector('.header-back');
  backBtn.onclick = function() {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = '/index.html';
    }
  };

  // Load profile
  fetch(BASE + '/api/auth/me', {
    headers: { 'Authorization': 'Bearer ' + token }
  })
  .then(function(r) {
    if (!r.ok) return Promise.reject(new Error(r.status === 401 ? '登录已过期' : '加载失败'));
    return r.json();
  })
  .then(function(data) {
    var user = data.user || {};
    document.getElementById('profileEmail').textContent = user.email || '';
    document.getElementById('profileLabel').textContent = user.name ? user.name : '善缘用户';
  })
  .catch(function(err) {
    console.error('Profile load error:', err);
    // If auth fails, redirect to login
    if (err.message.indexOf('已过期') >= 0) {
      showToast('登录已过期，请重新登录', 'error');
      setTimeout(function() {
        localStorage.removeItem('sy_token');
        window.location.href = '/pages/login.html';
      }, 1500);
    }
  });

  // Load reports by default
  loadReports();

  // Close password modal on Escape
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closePasswordModal();
  });
})();
</script>
