<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Runae · 你的星盘</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#060e0d;--card:#0f1b17;--card-2:#0b1512;
    --ink:#f0ebe0;--ink-2:rgba(240,235,224,.70);--ink-3:rgba(240,235,224,.42);
    --gold:#dcc082;--gold-soft:#e8d49c;--gold-wash:rgba(220,192,130,.14);
    --jade:#4fbfa0;--jade-deep:#0e2b24;--jade-soft:#7DDFC0;--jade-wash:rgba(79,191,160,.12);
    --line:rgba(240,235,224,.10);--line-2:rgba(240,235,224,.17);
    --sans:'Inter',-apple-system,system-ui,sans-serif;--serif:'Cormorant Garamond','Noto Serif SC',serif;
    --rl:20px;--r:14px;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--paper);font-family:var(--sans);color:var(--ink);line-height:1.5;font-feature-settings:"tnum";min-height:100vh}
  .wrap{max-width:430px;margin:0 auto;padding:0 24px 40px;min-height:100vh}
  svg.ic{width:18px;height:18px;stroke:var(--ink-3);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 12px}
  .nav-back{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-3);cursor:pointer;font-weight:500}
  .step{font-size:11px;color:var(--ink-3);letter-spacing:.1em;font-weight:600}
  .rhero{text-align:center;padding:16px 4px 4px}
  .rhero .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .rhero .dv{width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);margin:14px auto}
  .rhero h2{font-family:var(--serif);font-size:29px;font-weight:600;line-height:1.24;letter-spacing:-.01em;margin:0 6px}

  /* Big Three natal chart card (mirrors report-v2 .chart / .pillars) */
  .chart{background:var(--jade-deep);border:1px solid rgba(195,160,90,.20);border-radius:var(--rl);padding:22px 20px;margin:18px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
  .pillars.two{grid-template-columns:repeat(2,1fr)}
  .pil .sym{font-size:22px;line-height:1;color:var(--jade-soft);margin-bottom:8px}
  .pil .c{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.15;background:linear-gradient(160deg,#E8C87E,#B98A3E);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.18))}
  .pil .en{font-size:11px;color:var(--jade-soft);font-family:var(--serif);letter-spacing:.04em;margin-top:3px}
  .pil .deg{font-size:9.5px;color:rgba(255,255,255,.5);margin-top:3px;letter-spacing:.04em}
  .pil .l{font-size:10px;color:rgba(255,255,255,.62);margin-top:8px;letter-spacing:.08em}
  .chart-note{text-align:center;font-size:11px;color:rgba(255,255,255,.5);margin-top:14px;line-height:1.6;letter-spacing:.02em}

  .read{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);padding:20px;margin-bottom:14px}
  .read h3{font-size:14px;font-weight:600;margin-bottom:10px;letter-spacing:.01em}
  .read p{font-size:15px;color:var(--ink-2);line-height:1.75;white-space:pre-wrap}
  .read p+p{margin-top:10px}
  .blur{filter:blur(5px);opacity:.55;user-select:none;pointer-events:none}

  /* element balance bars */
  .elrow{display:flex;align-items:center;gap:10px;margin-bottom:11px}
  .elrow:last-child{margin-bottom:0}
  .elrow .en{font-family:var(--serif);font-size:14px;font-weight:600;min-width:60px}
  .elrow .track{flex:1;height:7px;border-radius:5px;background:var(--gold-wash);overflow:hidden}
  .elrow .fill{height:100%;border-radius:5px}
  .elrow .num{font-size:11px;color:var(--ink-3);min-width:26px;text-align:right;font-weight:600}
  .el-fire{background:linear-gradient(90deg,#E88B4A,#C9622C)}
  .el-earth{background:linear-gradient(90deg,#B98A3E,#8A6220)}
  .el-air{background:linear-gradient(90deg,#C3A05A,#DFC488)}
  .el-water{background:linear-gradient(90deg,#4FA88C,#2D7A62)}

  /* aspect chips */
  .asp{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
  .asp:last-child{border-bottom:none}
  .asp .g{font-size:15px;color:var(--gold);min-width:20px;text-align:center}
  .asp .txt{flex:1;font-size:13.5px;color:var(--ink-2)}
  .asp .txt b{color:var(--ink);font-weight:600}
  .asp .orb{font-size:10.5px;color:var(--ink-3)}

  .wall{background:var(--card);border:1px solid var(--gold-soft);border-radius:var(--rl);padding:24px 20px;text-align:center;margin:16px 0;box-shadow:0 14px 34px -20px rgba(169,128,58,.30)}
  .wall h4{font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:5px}
  .wall p{font-size:13px;color:var(--ink-2);margin-bottom:18px}
  .cta{width:100%;background:var(--jade-deep);color:#fff;border:none;border-radius:var(--r);padding:16px;font-size:15px;font-weight:600;font-family:var(--sans);cursor:pointer}
  .cta.gold{background:linear-gradient(135deg,var(--gold-soft),var(--gold))}
  .wall .price{font-size:13px;color:var(--ink-3);margin-top:12px}
  .wall .price b{color:var(--gold);font-size:17px;font-weight:600}
  .expand{display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;color:var(--ink-2);padding:14px;border:1px solid var(--gold-wash);border-radius:var(--r);margin-bottom:12px;background:var(--card-2);font-weight:500}
  .adv{background:var(--jade-deep);border:1px solid rgba(195,160,90,.20);border-radius:var(--rl);padding:24px 21px;margin:22px 0 8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
  .adv .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-soft);font-weight:600}
  .adv h4{font-family:var(--serif);font-size:21px;font-weight:600;margin:10px 0 4px;color:#fff}
  .adv ul{list-style:none;margin:14px 0}
  .adv li{font-size:13px;color:rgba(255,255,255,.86);padding:6px 0 6px 20px;position:relative}
  .adv li::before{content:'◆';position:absolute;left:2px;top:6px;color:var(--gold-soft);font-size:7px;line-height:2.1}
  .adv .sbtn{width:100%;background:transparent;color:var(--gold-soft);border:1px solid var(--gold-soft);border-radius:var(--r);padding:15px;font-size:14.5px;font-weight:600;margin-top:10px;cursor:pointer}
  .skel{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);padding:20px;margin-bottom:14px}
  .skel .ln{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--line),rgba(255,255,255,.06),var(--line));background-size:200% 100%;animation:sh 1.3s infinite;margin-bottom:11px}
  @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .err{text-align:center;color:var(--ink-2);font-size:14px;padding:40px 10px}
  .disc{font-size:11px;color:var(--ink-3);text-align:center;line-height:1.7;margin:18px 4px 0;letter-spacing:.02em}
  .crossread{background:var(--card-2);border:1px solid var(--gold-soft);border-radius:var(--rl);padding:22px 20px;margin:22px 0 8px;box-shadow:0 10px 30px -22px rgba(169,128,58,.35)}
  .crossread .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600}
  .crossread h4{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--ink);margin:9px 0 6px;line-height:1.24}
  .crossread .fr{font-size:13px;color:var(--ink-2);line-height:1.6;margin-bottom:16px}
  .crossread .cx{display:flex;align-items:flex-start;gap:13px;background:var(--card);border:1px solid var(--gold-wash);border-radius:var(--r);padding:14px 15px;margin-top:10px;cursor:pointer;transition:transform .12s,border-color .15s;text-align:left;width:100%;text-decoration:none}
  .crossread .cx:active{transform:scale(.98)}
  .crossread .cx:hover{border-color:var(--gold-soft)}
  .crossread .cx>svg{width:26px;height:26px;stroke:var(--gold);stroke-width:1.35;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;margin-top:1px}
  .crossread .cx .cn{font-size:14.5px;font-weight:600;color:var(--ink);font-family:var(--serif)}
  .crossread .cx .ch{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-top:3px}
  .crossread .cx .cg{margin-left:auto;align-self:center;stroke:var(--ink-3);width:16px;height:16px;flex-shrink:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><div class="nav-back" id="navBack"><svg class="ic" style="width:15px;height:15px"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="navBackTxt">返回</span></div><div class="step" id="stepLabel">星座占星 · Astrology</div></div>
  <div id="hero"></div>
  <div id="chartMount"></div>
  <div id="body">
    <div class="skel"><div class="ln" style="width:60%"></div><div class="ln" style="width:100%"></div><div class="ln" style="width:88%"></div></div>
    <div class="skel"><div class="ln" style="width:45%"></div><div class="ln" style="width:96%"></div><div class="ln" style="width:92%"></div><div class="ln" style="width:70%"></div></div>
    <div class="err" id="loadmsg" data-i18n="loadmsg">正在为你起星盘…</div>
  </div>
</div>
<script>
  var LANG=(new URLSearchParams(location.search).get('lang'))||localStorage.getItem('runae_lang')||'zh';localStorage.setItem('runae_lang',LANG);var EN=(LANG==='en');
  if(EN){document.documentElement.lang='en';document.title='Runae · Your Chart';}
  // ── profile ──
  var P={};
  try{ P=JSON.parse(localStorage.getItem('runae_profile')||'{}'); }catch(e){}

  // localStorage runae_profile shape (per report-v2.html bd()): bdate 'YYYY-MM-DD', btime 'HH:MM', gender
  function readBirth(){
    var m=(P.bdate||'').split('-');
    var y=+m[0]||null, mo=+m[1]||null, d=+m[2]||null;
    var hour=null, minute=0;
    if(P.btime){ var t=P.btime.split(':'); var h=parseInt(t[0],10); if(!isNaN(h)){hour=h; var mm=parseInt(t[1],10); if(!isNaN(mm))minute=mm;} }
    return {
      birthYear:y, birthMonth:mo, birthDay:d,
      birthHour:hour, birthMinute:minute,
      lat:(P.lat!=null&&P.lat!=='')?+P.lat:null,
      lng:(P.lng!=null&&P.lng!=='')?+P.lng:null,
      tz:(P.tz!=null&&P.tz!=='')?+P.tz:null,
      gender:P.gender||'female', lang:LANG
    };
  }

  // ---- static UI text (bilingual) ----
  (function initBar(){
    var nb=document.getElementById('navBackTxt'), st=document.getElementById('stepLabel'),
        back=document.getElementById('navBack'), lm=document.getElementById('loadmsg');
    if(nb) nb.textContent = EN?'Back':'返回';
    if(st) st.textContent = EN?'Astrology':'星座占星 · Astrology';
    if(lm) lm.textContent = EN?'Casting your chart…':'正在为你起星盘…';
    if(back) back.onclick=function(){ history.length>1?history.back():(location.href='pick.html?lang='+LANG); };
  })();

  // ── sign metadata (engine returns English names only) ──
  var SIGN_ZH={Aries:'白羊座',Taurus:'金牛座',Gemini:'双子座',Cancer:'巨蟹座',Leo:'狮子座',Virgo:'处女座',Libra:'天秤座',Scorpio:'天蝎座',Sagittarius:'射手座',Capricorn:'摩羯座',Aquarius:'水瓶座',Pisces:'双鱼座'};
  var SIGN_GLYPH={Aries:'♈',Taurus:'♉',Gemini:'♊',Cancer:'♋',Leo:'♌',Virgo:'♍',Libra:'♎',Scorpio:'♏',Sagittarius:'♐',Capricorn:'♑',Aquarius:'♒',Pisces:'♓'};
  var SIGN_ELEMENT={Aries:'fire',Leo:'fire',Sagittarius:'fire',Taurus:'earth',Virgo:'earth',Capricorn:'earth',Gemini:'air',Libra:'air',Aquarius:'air',Cancer:'water',Scorpio:'water',Pisces:'water'};
  var EL_ZH={fire:'火',earth:'土',air:'风',water:'水'};
  var PLANET_ZH={Sun:'太阳',Moon:'月亮',Mercury:'水星',Venus:'金星',Mars:'火星',Jupiter:'木星',Saturn:'土星',Uranus:'天王星',Neptune:'海王星',Pluto:'冥王星'};
  var ASPECT_ZH={conjunct:'合相',opposition:'对分相',square:'刑相',trine:'拱相',sextile:'六分相'};
  var ASPECT_EN={conjunct:'conjunct',opposition:'opposition',square:'square',trine:'trine',sextile:'sextile'};
  var EL_EN={fire:'Fire',earth:'Earth',air:'Air',water:'Water'};
  // localized label helpers (engine returns English sign/planet names)
  function signName(s){ return EN ? (s||'') : (SIGN_ZH[s]||s||''); }
  function planetName(p){ return EN ? (p||'') : (PLANET_ZH[p]||p); }
  function aspectName(t){ return EN ? (ASPECT_EN[t]||t) : (ASPECT_ZH[t]||t); }
  function elName(e){ return EN ? EL_EN[e] : EL_ZH[e]; }

  /* -- Cross-Reading (交叉印证) component -- */
  var CROSS_CUR='astro';
  var CROSS_META={
    bazi:{glyph:'<path d="M7 6v20M13 6v20M19 6v20M25 6v20"/>',n:{zh:'八字命理',en:'BaZi'},page:'report-v2.html',
      h:{zh:'从出生的四柱看你的先天格局，把此刻的困惑放回一整条人生曲线里。',en:'Your birth chart maps the whole arc — the deep pattern behind what you\'re feeling right now.'}},
    hehun:{glyph:'<circle cx="12" cy="16" r="7.5"/><circle cx="20" cy="16" r="7.5"/>',n:{zh:'合婚',en:'Compatibility'},page:'report-hehun.html',
      h:{zh:'把你和那个人放在一起看，两张盘怎么咬合、哪里需要磨合，一目了然。',en:'Put your chart next to your partner\'s and see exactly where you fit — and where you grind.'}},
    tarot:{glyph:'<rect x="6" y="8" width="12" height="18" rx="2" transform="rotate(-8 12 17)"/><rect x="15" y="6" width="12" height="18" rx="2" transform="rotate(8 21 15)"/>',n:{zh:'塔罗',en:'Tarot'},page:'report-tarot.html',
      h:{zh:'命盘讲长期趋势，塔罗回答此刻那件具体的事——该走还是该留。',en:'Your chart shows the long game; a card answers the one thing weighing on you today.'}},
    astro:{glyph:'<circle cx="16" cy="16" r="6"/><path d="M16 3v3M16 26v3M3 16h3M26 16h3M6.6 6.6l2.1 2.1M23.3 23.3l2.1 2.1M25.4 6.6l-2.1 2.1M8.7 23.3l-2.1 2.1"/>',n:{zh:'星座占星',en:'Astrology'},page:'report-astrology.html',
      h:{zh:'西方星盘从另一套坐标读你的性格与关系，常和东方命理指向同一个答案。',en:'Your Western chart reads the same you through a different lens — and usually lands on the same answer.'}},
    daily:{glyph:'<path d="M24 20a9 9 0 1 1-8-13 7 7 0 0 0 8 13z"/>',n:{zh:'每日运势',en:'Daily Horoscope'},page:'report-daily.html',
      h:{zh:'把大格局落到今天：今天宜什么、忌什么，天天更新。',en:'Brings the big picture down to today — what to lean into, what to avoid, refreshed daily.'}},
    palm:{glyph:'<path d="M11 26v-6M11 20V9a2 2 0 0 1 4 0v7M15 16V7a2 2 0 0 1 4 0v9M19 16v-5a2 2 0 0 1 4 0v9a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-3-5a2 2 0 0 1 3.4-2z"/>',n:{zh:'手相',en:'Palm Reading'},page:'report-palm.html',
      h:{zh:'掌纹记录的是后天的走势，和先天命盘对照着看，更立体。',en:'Your palm tracks how life is actually unfolding — a living counterpart to your birth chart.'}},
    face:{glyph:'<circle cx="16" cy="16" r="11"/><path d="M12 14h.01M20 14h.01M12 20a5 4 0 0 0 8 0"/>',n:{zh:'面相',en:'Face Reading'},page:'report-face.html',
      h:{zh:'五官里的运势密码，和命盘相互印证，看得见的另一层线索。',en:'The story in your features — a visible layer that echoes what your chart already hints at.'}}
  };
  var CROSS_DEFAULT={bazi:['astro','tarot'],hehun:['bazi','tarot'],tarot:['bazi','astro'],astro:['bazi','tarot'],daily:['bazi','astro'],palm:['bazi','face'],face:['bazi','palm']};
  function crossPick(){
    var asp=[];try{asp=(JSON.parse(localStorage.getItem('runae_profile')||'{}').aspects)||[];}catch(e){}
    var out=[];
    function add(list){list.forEach(function(m){if(m!==CROSS_CUR&&out.indexOf(m)<0)out.push(m);});}
    if(asp.indexOf('love')>-1) add(['hehun','tarot','astro']);
    if(asp.indexOf('career')>-1||asp.indexOf('wealth')>-1) add(['bazi','astro','tarot']);
    if(asp.indexOf('health')>-1) add(['bazi','palm','daily']);
    add(CROSS_DEFAULT[CROSS_CUR]||['bazi','astro']);
    return out.slice(0,3);
  }
  function crossReadHTML(){
    var picks=crossPick();if(!picks.length)return '';
    var L=EN?'en':'zh';
    var head=EN?'The same you, seen from every angle':'同一个你，多重印证';
    var fr=EN?'One profile. Every tradition weighs in — and they rarely disagree.':'一份命盘，多种传承一起看——它们很少各说各话。';
    var kk=EN?'Cross-Reading · Runae':'交叉印证 · Runae';
    var chev='<svg class="cg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
    var cards=picks.map(function(m){
      var meta=CROSS_META[m];if(!meta)return '';
      return '<a class="cx" href="'+meta.page+'?lang='+LANG+'"><svg viewBox="0 0 32 32">'+meta.glyph+'</svg>'
        +'<div><div class="cn">'+esc(meta.n[L])+'</div><div class="ch">'+esc(meta.h[L])+'</div></div>'+chev+'</a>';
    }).join('');
    return '<div class="crossread"><div class="k">'+esc(kk)+'</div><h4>'+esc(head)+'</h4><div class="fr">'+esc(fr)+'</div>'+cards+'</div>';
  }
  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');}
  var HEAD=/^\s*([【✅📜🌟💰❤💼🌿☀🔮⛰✨🙏☉☾♀♂↑]|#{1,3}\s|[\uD83C-\uDBFF])/;
  function sections(text){
    var lines=text.split('\n'),secs=[],cur=null;
    lines.forEach(function(raw){
      var l=raw.replace(/\s+$/,''); if(!l.trim())return;
      if(HEAD.test(l)&&l.trim().length<40){
        cur={t:l.replace(/[\uD800-\uDFFF←-⯿☀-➿️#*【】]/g,'').trim(),b:[]};secs.push(cur);
      }else{ if(!cur){cur={t:'',b:[]};secs.push(cur);} cur.b.push(l.trim()); }
    });
    return secs.filter(function(s){return s.t||s.b.length;});
  }

  function planetOf(chart,name){ return (chart.planets||[]).find(function(p){return p.name===name;})||null; }

  // ── Big Three hero + chart card ──
  function renderChart(chart){
    var sun=planetOf(chart,'Sun'), moon=planetOf(chart,'Moon'), asc=chart.ascendant;
    var hero=document.getElementById('hero'), mount=document.getElementById('chartMount');
    var sunName=sun?signName(sun.sign):'';
    hero.innerHTML='<div class="rhero"><div class="k">Western Astrology · '+esc(P.bdate||'')+'</div><div class="dv"></div><h2>'+(EN?('Your Sun is in '+esc(sunName)):('你的太阳落在「'+esc(sunName)+'」'))+'</h2></div>';

    // pillars: Sun / Moon / (Rising if present)
    function pil(pl,label){
      if(!pl) return '';
      var s=pl.sign;
      // when EN, .c shows English sign and .en subtitle is redundant → hide it
      var sub = EN ? '' : ('<div class="en">'+esc(s)+'</div>');
      return '<div class="pil"><div class="sym">'+esc(SIGN_GLYPH[s]||'✦')+'</div><div class="c">'+esc(signName(s))+'</div>'+sub+'<div class="deg">'+esc(pl.formatted?pl.formatted.split(' ')[0]:'')+'</div><div class="l">'+label+'</div></div>';
    }
    var hasAsc=!!asc, two=hasAsc?'':' two';
    var cells=pil(sun,EN?'Sun':'太阳 Sun')+pil(moon,EN?'Moon':'月亮 Moon')+(hasAsc?pil(asc,EN?'Rising':'上升 Rising'):'');
    var note = hasAsc
      ? (EN?'Natal tropical chart · Sun / Moon / Rising':'本命回归黄道星盘 · 太阳／月亮／上升')
      : (EN?'No birth time given, so no Rising sign or houses yet. Add your exact birth time to unlock Rising and the 12 houses.':'未填出生时间，暂无上升星座与宫位。补上准确出生时刻，可解锁上升与十二宫。');
    mount.innerHTML='<div class="chart"><div class="pillars'+two+'">'+cells+'</div><div class="chart-note">'+note+'</div></div>';
  }

  // ── structured cards (always available — element balance + top aspects) ──
  function elementBalance(chart){
    var counts={fire:0,earth:0,air:0,water:0},total=0;
    (chart.planets||[]).forEach(function(p){ var e=SIGN_ELEMENT[p.sign]; if(e){counts[e]++;total++;} });
    if(chart.ascendant){ var ae=SIGN_ELEMENT[chart.ascendant.sign]; if(ae){counts[ae]++;total++;} }
    if(!total) return '';
    var order=['fire','earth','air','water'];
    var rows=order.map(function(e){
      var pct=Math.round(counts[e]/total*100);
      var lab = EN ? EL_EN[e] : (EL_ZH[e]+' <span style="font-size:11px;color:var(--ink-3);font-weight:400">'+e.charAt(0).toUpperCase()+e.slice(1)+'</span>');
      return '<div class="elrow"><div class="en">'+lab+'</div><div class="track"><div class="fill el-'+e+'" style="width:'+pct+'%"></div></div><div class="num">'+counts[e]+'</div></div>';
    }).join('');
    // dominant element note
    var dom=order.reduce(function(a,b){return counts[b]>counts[a]?b:a;});
    var domNote=(EN
      ? {fire:'Fire-heavy — driven and direct, quick to ignite and quick to flare.',earth:'Earth-heavy — grounded and results-focused; safety comes from what you can control.',air:'Air-heavy — quick-thinking and communicative; energized by understanding and connection.',water:'Water-heavy — emotionally attuned and intuitive, with a rich inner world.'}
      : {fire:'火象偏重——行动力强、热情直接，容易点火也容易急躁。',earth:'土象偏重——务实稳定、重视结果，安全感来自可掌控的现实。',air:'风象偏重——思维灵活、善于沟通，靠理解与连接获得能量。',water:'水象偏重——情感细腻、直觉敏锐，内在世界丰富而深。'})[dom];
    return '<div class="read"><h3>'+(EN?'Element Balance':'元素能量分布 · Element Balance')+'</h3>'+rows+'<p style="margin-top:14px;font-size:13.5px">'+domNote+'</p></div>';
  }

  function topAspects(chart){
    var asp=(chart.aspects||[]).slice(0,6);
    if(!asp.length) return '';
    var rows=asp.map(function(a){
      var p1=planetName(a.planet1), p2=planetName(a.planet2);
      return '<div class="asp"><div class="g">'+esc(a.symbol||'✦')+'</div><div class="txt"><b>'+esc(p1)+' '+esc(aspectName(a.type))+' '+esc(p2)+'</b></div><div class="orb">'+a.orb+'°</div></div>';
    }).join('');
    return '<div class="read"><h3>'+(EN?'Key Aspects':'主要行星相位 · Key Aspects')+'</h3><p style="font-size:13px;margin-bottom:12px">'+(EN?'Aspects are the angles between planets, marking the tensions and gifts in your character (the smaller the orb, the stronger the effect).':'相位是行星之间的角度关系，标示你性格中的张力与天赋（容许度越小越显著）。')+'</p>'+rows+'</div>';
  }

  // ── AI reading render (streamed) ──
  function renderReadingSections(text){
    var secs=sections(text);
    if(!secs.length) return '';
    return secs.map(function(s){
      return '<div class="read">'+(s.t?'<h3>'+esc(s.t)+'</h3>':'')+'<p>'+md(s.b.join('\n'))+'</p></div>';
    }).join('');
  }

  // ── paywall + advisor ──
  function paywallHtml(){
    if(EN){
      return '<div class="wall"><h4>Unlock your full chart</h4><p>All 12 houses · planet-by-planet reading · aspect cross-checks · transit forecast</p><button class="cta gold" onclick="goCheckout(\'astro_full\')">Unlock full version</button><div class="price"><b>$9.90</b> one-time · or subscribe for more value ↓</div></div>'
        +crossReadHTML()
        +'<div class="adv"><div class="k">Runae Advisor · remembers you</div><h4>More than a chart<br>an astrologer who actually knows you</h4><ul><li>Daily transits and sky updates, every single day</li><li>Ask follow-ups anytime in AI chat — like an astrologer on call</li><li>Your Western chart plus Eastern astrology — the same you, seen from every angle</li><li>Remembers your chart and your history — the more you use it, the better it knows you</li><li>Book a one-on-one with a real reader (member discount)</li></ul><button class="sbtn" onclick="goCheckout(\'member_monthly\')">Subscribe to Runae Advisor · $9.9 / mo</button></div>';
    }
    return '<div class="wall"><h4>解锁完整星盘</h4><p>十二宫全解 · 逐星深度解读 · 相位交叉印证 · 行运预测</p><button class="cta gold" onclick="goCheckout(\'astro_full\')">解锁完整版</button><div class="price"><b>$9.90</b> 一次性 · 或订阅更划算 ↓</div></div>'
      +crossReadHTML()
      +'<div class="adv"><div class="k">Runae 顾问 · 会记得你</div><h4>不止一份星盘<br>是一个懂你的占星顾问</h4><ul><li>每日星象与行运动态，天天更新</li><li>AI 对话随时追问深聊，像身边的占星师</li><li>西方星盘 + 东方命理，交叉印证同一个你</li><li>记得你的盘与历史，越用越懂你</li><li>可约真人占星师一对一（会员优惠）</li></ul><button class="sbtn" onclick="goCheckout(\'member_monthly\')">订阅 Runae 顾问 · $9.9 / 月</button></div>';
  }

  function fail(msg){
    document.getElementById('body').innerHTML='<div class="err">'+esc(msg)+'<br><br><button class="cta" style="max-width:200px;margin:14px auto 0" onclick="location.reload()">'+(EN?'Retry':'重试')+'</button></div>';
  }

  window.goCheckout=function(product){
    fetch('/api/create-checkout',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({product:product,token:localStorage.getItem('sy_token')||'',
        successUrl:location.origin+'/pages/report-astrology.html?paid=1&lang='+LANG,cancelUrl:location.href})})
     .then(function(r){return r.json();}).then(function(d){
       if(d.url){ location.href=d.url; }
       else if(d.channel==='cn'){ alert(EN?'Please pay via WeChat / Alipay (coming soon).':'国内用户请用微信 / 支付宝支付（接入中）'); }
       else { alert(EN?'Couldn’t open checkout — please try again.':'跳转支付失败，请重试'); }
     }).catch(function(){ alert(EN?'Network error — please try again.':'网络异常，请重试'); });
  };

  var DISC=EN
    ? '<div class="disc">AI-generated reading · for entertainment and self-exploration only; not predictive advice, not medical, legal, or financial advice · suitable for readers aged 14+.</div>'
    : '<div class="disc">AI 生成解读 · 仅供娱乐与自我探索，不作预测性建议，不构成医疗、法律或财务建议 · 内容适合 14 岁以上读者。</div>';

  // ── main: stream from /api/western-astrology ──
  var chartData=null, readingText='', bodyEl=document.getElementById('body');

  // Build the full body once we have chart + (whatever) reading. Called repeatedly during stream.
  function paint(streaming){
    var html='';
    var readingHtml=renderReadingSections(readingText);
    if(readingHtml){
      html+=readingHtml;
    }else if(streaming){
      // still waiting for first text — keep a light skeleton
      html+='<div class="skel"><div class="ln" style="width:55%"></div><div class="ln" style="width:100%"></div><div class="ln" style="width:90%"></div></div>';
    }
    // structured cards (always shown — never let the page be empty)
    if(chartData){
      html+=elementBalance(chartData);
      html+=topAspects(chartData);
    }
    if(!streaming){
      html+=paywallHtml()+DISC;
    }
    bodyEl.innerHTML=html;
  }

  async function run(){
    var b=readBirth();
    if(!b.birthYear||!b.birthMonth||!b.birthDay){
      fail(EN?'We couldn’t find your birth info — please go back and enter your birth date.':'没有找到你的出生信息，请先返回填写出生日期。');
      return;
    }
    var res;
    try{
      res=await fetch('/api/western-astrology',{
        method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)
      });
    }catch(e){ fail(EN?'Network error — please check your connection and retry.':'网络异常，请检查连接后重试。'); return; }
    if(!res.ok){ fail((EN?'Couldn’t cast your chart (':'星盘生成失败（')+res.status+(EN?') — please try again.':'），请重试。')); return; }
    if(!res.body||!res.body.getReader){
      // no streaming support — read whole text and parse ndjson
      var txt=await res.text();
      txt.split('\n').forEach(function(l){ handleLine(l); });
      finish();
      return;
    }
    var reader=res.body.getReader(), dec=new TextDecoder(), buf='';
    while(true){
      var chunk;
      try{ chunk=await reader.read(); }catch(e){ break; }
      if(chunk.done) break;
      buf+=dec.decode(chunk.value,{stream:true});
      var lines=buf.split('\n'); buf=lines.pop();
      lines.forEach(handleLine);
    }
    finish();
  }

  var streamErrored=false;
  function handleLine(line){
    var t=line.trim();
    if(!t||t.indexOf('data:')!==0) return;
    var raw=t.slice(5).trim();
    if(!raw) return;
    var ev; try{ ev=JSON.parse(raw); }catch(e){ return; }
    if(ev.type==='chart'){
      chartData=ev.chart;
      renderChart(chartData);
      paint(true);
    }else if(ev.type==='delta'){
      readingText+=ev.text||''; paint(true);
    }else if(ev.type==='text'){
      readingText+=ev.text||''; paint(true);
    }else if(ev.type==='error'){
      streamErrored=true;
    }
  }

  function finish(){
    if(!chartData){
      fail(EN?'Chart calculation failed — please check your birth info and retry.':'星盘计算失败，请检查出生信息后重试。');
      return;
    }
    // If the reading never arrived, the structured cards (element + aspects) still carry the page.
    if(!readingText.trim() && streamErrored){
      // prepend a graceful note above structured cards
      readingText='';
    }
    paint(false);
  }

  run();
</script>
