<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Runae · Choose a Reading</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#060e0d;--card:#0f1b17;--card-2:#0b1512;
    --ink:#f0ebe0;--ink-2:rgba(240,235,224,.70);--ink-3:rgba(240,235,224,.42);
    --gold:#dcc082;--gold-soft:#e8d49c;--gold-wash:rgba(220,192,130,.14);
    --jade:#4fbfa0;--jade-deep:#0e2b24;--jade-soft:#7DDFC0;--jade-wash:rgba(79,191,160,.12);
    --line:rgba(240,235,224,.10);--line-2:rgba(240,235,224,.17);
    --sans:'Inter',-apple-system,system-ui,sans-serif;--serif:'Cormorant Garamond','Noto Serif SC',serif;
    --rl:20px;--r:14px;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--paper);font-family:var(--sans);color:var(--ink);line-height:1.5;font-feature-settings:"tnum";min-height:100vh}
  .wrap{max-width:430px;margin:0 auto;padding:0 24px 0;min-height:100vh;display:flex;flex-direction:column}
  svg.ic{width:18px;height:18px;stroke:var(--ink-3);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
  svg.mic{width:26px;height:26px;stroke:var(--ink);stroke-width:1.35;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 12px}
  .nav-back{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-3);cursor:pointer;font-weight:500}
  .step{font-size:11px;color:var(--ink-3);letter-spacing:.1em;font-weight:600}
  .stepper{display:flex;align-items:center;gap:7px;margin:2px 2px 22px}
  .stepper i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
  .stepper i.on{background:var(--jade)}
  .stepper .ln{flex:1;height:1px;background:var(--line-2)}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-bottom:12px}
  h1.t{font-family:var(--serif);font-size:37px;font-weight:600;line-height:1.12;letter-spacing:-.012em}
  .sub{font-size:14px;color:var(--ink-2);margin-top:12px;line-height:1.65}
  .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
  .mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--rl);padding:20px;position:relative;min-height:138px;display:flex;flex-direction:column;cursor:pointer;transition:transform .12s,border-color .15s}
  .mcard:active{transform:scale(.98)}
  .mcard .mic{margin-bottom:12px}
  .mcard .mn{font-size:16px;font-weight:600;font-family:var(--serif)}
  .mcard .md{font-size:12px;color:var(--ink-2);margin-top:6px;line-height:1.55;flex:1}
  .mcard .tag{font-size:11px;color:var(--ink-3);font-weight:500;margin-top:11px;display:flex;align-items:center;gap:5px}
  .mcard.top{grid-column:1/-1;flex-direction:row;align-items:center;gap:18px;min-height:auto;background:var(--jade-deep);border-color:var(--jade-deep)}
  .mcard.top .mic{margin:0;stroke:var(--gold-soft);width:30px;height:30px}
  .mcard.top .mn{font-size:18px;color:#fff}
  .mcard.top .md{color:rgba(255,255,255,.82);margin-top:4px}
  .mcard.rec::after{content:'为你推荐';position:absolute;top:14px;right:14px;font-size:10px;color:var(--ink-3);letter-spacing:.04em}
  .mcard.top.rec::after{color:var(--gold-soft)}
  .mcard.lock{opacity:.55;cursor:default}
  .mcard.lock:active{transform:none}
  .mcard.lock .mic{stroke:var(--ink-3)}
  .sticky{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(244,240,231,0),var(--paper) 34%);padding:18px 0 22px;margin-top:auto}
  .cta{width:100%;background:var(--jade-deep);color:#fff;border:none;border-radius:var(--r);padding:17px;font-size:15.5px;font-weight:600;font-family:var(--sans);letter-spacing:.01em;box-shadow:0 14px 30px -16px rgba(28,74,58,.55);cursor:pointer}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M7.5 10.5V7a4.5 4.5 0 0 1 9 0v3.5"/></symbol>
  <symbol id="m-bazi" viewBox="0 0 32 32"><path d="M7 6v20M13 6v20M19 6v20M25 6v20"/></symbol>
  <symbol id="m-hehun" viewBox="0 0 32 32"><circle cx="12" cy="16" r="7.5"/><circle cx="20" cy="16" r="7.5"/></symbol>
  <symbol id="m-tarot" viewBox="0 0 32 32"><rect x="6" y="8" width="12" height="18" rx="2" transform="rotate(-8 12 17)"/><rect x="15" y="6" width="12" height="18" rx="2" transform="rotate(8 21 15)"/></symbol>
  <symbol id="m-astro" viewBox="0 0 32 32"><circle cx="16" cy="16" r="6"/><path d="M16 3v3M16 26v3M3 16h3M26 16h3M6.6 6.6l2.1 2.1M23.3 23.3l2.1 2.1M25.4 6.6l-2.1 2.1M8.7 23.3l-2.1 2.1"/></symbol>
  <symbol id="m-daily" viewBox="0 0 32 32"><path d="M24 20a9 9 0 1 1-8-13 7 7 0 0 0 8 13z"/></symbol>
  <symbol id="m-palm" viewBox="0 0 32 32"><path d="M11 26v-6M11 20V9a2 2 0 0 1 4 0v7M15 16V7a2 2 0 0 1 4 0v9M19 16v-5a2 2 0 0 1 4 0v9a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-3-5a2 2 0 0 1 3.4-2z"/></symbol>
  <symbol id="m-face" viewBox="0 0 32 32"><circle cx="16" cy="16" r="11"/><path d="M12 14h.01M20 14h.01M12 20a5 4 0 0 0 8 0"/></symbol>
</defs></svg>

<div class="wrap">
  <div class="bar"><div class="nav-back" id="navBack"><svg class="ic" style="width:15px;height:15px;transform:rotate(180deg)"><use href="#i-chev"/></svg><span id="backTxt">返回</span></div><div class="step">2 / 3</div></div>
  <div class="stepper"><i class="on"></i><span class="ln"></span><i class="on"></i><span class="ln"></span><i></i></div>
  <div class="eyebrow" id="eyebrow">用你刚填的信息</div>
  <h1 class="t" id="title">想算哪一种</h1>
  <p class="sub" id="sub">灰色的，补张照片即可解锁。</p>

  <div class="mgrid" id="grid"></div>

  <div style="text-align:center;margin-top:20px;font-size:13px;color:var(--ink-3)"><a href="advisor-chat.html" id="linkAdvisor" style="color:var(--jade);font-weight:600;text-decoration:none">💬 问 AI 顾问</a>&nbsp;&nbsp;·&nbsp;&nbsp;<a href="booking.html" id="linkBooking" style="color:var(--gold);font-weight:600;text-decoration:none">预约真人命理师</a></div>

  <div class="sticky"><button class="cta" id="go">生成我的报告</button></div>
</div>

<script>
  // ===== 统一语言检测 =====
  var LANG=(new URLSearchParams(location.search).get('lang'))||localStorage.getItem('runae_lang')||'zh';localStorage.setItem('runae_lang',LANG);var EN=(LANG==='en');
  var Q='?lang='+LANG;

  // ===== 文案字典 =====
  var T={
    zh:{
      docTitle:'Runae · 选择推演',
      htmlLang:'zh-CN',
      back:'返回',
      eyebrow:'用你刚填的信息',
      title:'想算哪一种',
      subBase:'灰色的，补张照片即可解锁。',
      subSorted:function(sel){ return '按你选的「'+sel+'」排序。'; },
      linkAdvisor:'💬 问 AI 顾问',
      linkBooking:'预约真人命理师',
      go:'生成我的报告',
      confirmPalm:'去补一张手相照片来解锁？',
      confirmFace:'去补一张面相照片来解锁？',
      aspectSep:' · ',
      A2N:{career:'事业',love:'爱情',wealth:'财运',health:'健康'},
      methods:{
        bazi:{name:'八字命理',desc:'四柱排盘 · 事业财运姻缘深度解读',tag:''},
        hehun:{name:'合婚',desc:'两个人合不合，一测便知',tag:'复用你的生辰'},
        tarot:{name:'塔罗',desc:'此刻的困惑，抽牌给你答案',tag:'立即可算'},
        astro:{name:'星座占星',desc:'西方星盘 · 性格与运势',tag:'复用你的生辰'},
        daily:{name:'每日运势',desc:'今天宜什么、忌什么',tag:'每天更新'},
        palm:{name:'手相',desc:'掌纹里的命运线',tag:'补手相照解锁'},
        face:{name:'面相',desc:'五官里的运势密码',tag:'补面相照解锁'}
      }
    },
    en:{
      docTitle:'Runae · Choose a Reading',
      htmlLang:'en',
      back:'Back',
      eyebrow:'Based on what you just told us',
      title:'Which reading?',
      subBase:'Grayed out? Add a photo to unlock.',
      subSorted:function(sel){ return 'Ordered around what matters most to you: '+sel+'. '; },
      linkAdvisor:'💬 Ask the AI advisor',
      linkBooking:'Book a human reader',
      go:'Generate my report',
      confirmPalm:'Add a palm photo to unlock?',
      confirmFace:'Add a face photo to unlock?',
      aspectSep:' · ',
      A2N:{career:'Career',love:'Love',wealth:'Wealth',health:'Health'},
      methods:{
        bazi:{name:'BaZi Reading',desc:'Four Pillars · a deep read on career, wealth & love',tag:''},
        hehun:{name:'Compatibility',desc:'How the two of you fit — the quick answer',tag:'Uses your birth details'},
        tarot:{name:'Tarot',desc:"Whatever's on your mind right now — pull a card",tag:'Ready now'},
        astro:{name:'Astrology',desc:'Your Western natal chart · personality & path',tag:'Uses your birth details'},
        daily:{name:'Daily Horoscope',desc:"Today's dos and don'ts",tag:'Updated daily'},
        palm:{name:'Palm Reading',desc:'What the lines in your palm reveal',tag:'Add palm photo to unlock'},
        face:{name:'Face Reading',desc:'The story written in your features',tag:'Add face photo to unlock'}
      }
    }
  };
  var t=T[LANG]||T.zh;

  // ===== 应用文案 =====
  document.documentElement.lang=t.htmlLang;
  document.title=t.docTitle;
  document.getElementById('backTxt').textContent=t.back;
  document.getElementById('eyebrow').textContent=t.eyebrow;
  document.getElementById('title').textContent=t.title;
  document.getElementById('linkAdvisor').textContent=t.linkAdvisor;
  document.getElementById('linkBooking').textContent=t.linkBooking;
  document.getElementById('go').textContent=t.go;
  // 站内链接带 lang
  document.getElementById('navBack').onclick=function(){ location.href='collect.html'+Q; };
  document.getElementById('linkAdvisor').href='advisor-chat.html'+Q;
  document.getElementById('linkBooking').href='booking.html'+Q;

  var P={}; try{ P=JSON.parse(localStorage.getItem('runae_profile')||'{}'); }catch(e){}
  if(!P.bdate){ location.href='collect.html'+Q; }

  var A2N=t.A2N;
  var aspects=P.aspects||[];
  var sel=aspects.map(function(a){return A2N[a];}).filter(Boolean).join(t.aspectSep);
  document.getElementById('sub').textContent = (sel? t.subSorted(sel):'') + t.subBase;

  // 方法定义（名称/描述/标签走字典）
  var M=t.methods;
  var METHODS=[
    {id:'bazi', name:M.bazi.name, glyph:'m-bazi', desc:M.bazi.desc, tag:M.bazi.tag, top:true},
    {id:'hehun',name:M.hehun.name,glyph:'m-hehun',desc:M.hehun.desc,tag:M.hehun.tag, aspect:'love'},
    {id:'tarot',name:M.tarot.name,glyph:'m-tarot',desc:M.tarot.desc,tag:M.tarot.tag, aspect:'love'},
    {id:'astro',name:M.astro.name,glyph:'m-astro',desc:M.astro.desc,tag:M.astro.tag},
    {id:'daily',name:M.daily.name,glyph:'m-daily',desc:M.daily.desc,tag:M.daily.tag},
    {id:'palm', name:M.palm.name, glyph:'m-palm', desc:M.palm.desc, tag:M.palm.tag, need:'hasPalm'},
    {id:'face', name:M.face.name, glyph:'m-face', desc:M.face.desc, tag:M.face.tag, need:'hasFace'}
  ];
  // 按方向排序：love 选中→合婚/塔罗提前；bazi 永远置顶
  var loveOn=aspects.indexOf('love')>-1;
  var ordered=METHODS.slice();
  if(loveOn){ ordered.sort(function(a,b){ if(a.top)return -1;if(b.top)return 1; var ap=(a.aspect==='love')?0:1, bp=(b.aspect==='love')?0:1; return ap-bp; }); }

  var grid=document.getElementById('grid');
  ordered.forEach(function(m){
    var locked = m.need && !P[m.need];
    var el=document.createElement('div');
    el.className='mcard'+(m.top?' top rec':'')+((m.aspect&&aspects.indexOf(m.aspect)>-1&&!m.top)?' rec':'')+(locked?' lock':'');
    var tagHtml = locked
      ? '<div class="tag"><svg class="ic" style="width:13px;height:13px"><use href="#i-lock"/></svg>'+m.tag+'</div>'
      : (m.tag? '<div class="tag">'+m.tag+'</div>':'');
    if(m.top){
      el.innerHTML='<svg class="mic"><use href="#'+m.glyph+'"/></svg><div><div class="mn">'+m.name+'</div><div class="md">'+m.desc+'</div></div>';
    } else {
      el.innerHTML='<svg class="mic"><use href="#'+m.glyph+'"/></svg><div class="mn">'+m.name+'</div><div class="md">'+m.desc+'</div>'+tagHtml;
    }
    el.onclick=function(){
      if(locked){ if(confirm(m.need==='hasPalm'?t.confirmPalm:t.confirmFace)) location.href='collect.html'+Q; return; }
      localStorage.setItem('runae_method', m.id);
      var PG={bazi:'report-v2.html',hehun:'report-hehun.html',tarot:'report-tarot.html',astro:'report-astrology.html',daily:'report-daily.html',palm:'report-palm.html',face:'report-face.html'};
      location.href=(PG[m.id]||'report-v2.html')+Q;
    };
    grid.appendChild(el);
  });

  document.getElementById('go').onclick=function(){
    localStorage.setItem('runae_method','bazi');
    location.href='report-v2.html'+Q;
  };
</script>
</body>
</html>
