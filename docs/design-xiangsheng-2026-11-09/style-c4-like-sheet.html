<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>想认识 · 相生</title>
<style>
:root{
  --bg:#0c1214;--bg-2:#111a1c;--ink:#ebe5d6;--ink-2:#c3bfb3;--muted:#8f958f;
  --gold:#c8ae7d;--gold-2:#a8916a;--hair:rgba(200,174,125,.32);--hair-2:rgba(200,174,125,.16);
  --red:#b5503c;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:300 14px/1.85 var(--sans);letter-spacing:.04em;
  background-image:radial-gradient(ellipse at 50% 14%,rgba(40,70,72,.36),transparent 55%)}
.wrap{max-width:430px;margin:0 auto;padding:0 24px 40px}
header{display:flex;justify-content:space-between;align-items:center;height:64px}
.brand{font:500 20px/1 var(--serif);letter-spacing:.4em;color:var(--ink);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.back{font-size:12px;color:var(--muted);text-decoration:none;min-height:44px;display:inline-flex;align-items:center;letter-spacing:.12em}
.eyebrow{margin:20px 0 6px;text-align:center;font-size:11px;letter-spacing:.5em;color:var(--gold)}
.title{margin:0;text-align:center;font:400 24px/1.55 var(--serif);letter-spacing:.14em}
.title em{font-style:normal;color:var(--gold)}
.lede{margin:12px auto 0;max-width:320px;text-align:center;font:400 13px/2 var(--serif);color:var(--ink-2);letter-spacing:.06em}
.lede:before{content:"";display:block;width:28px;height:1px;background:var(--hair);margin:0 auto 10px}
.fic{display:flex;justify-content:center;margin:12px 0 0}
.fic span{font-size:10.5px;letter-spacing:.3em;color:#e0937f;border:1px solid rgba(181,80,60,.6);padding:2px 10px}
.private{display:flex;justify-content:center;margin:8px 0 0}
.private span{font-size:11px;letter-spacing:.3em;color:var(--gold);border:1px solid var(--hair);padding:3px 12px}
h2{margin:40px 0 16px;font:400 12px var(--sans);letter-spacing:.5em;color:var(--gold);display:flex;align-items:center;gap:14px}
h2:after{content:"";flex:1;height:1px;background:var(--hair-2)}
h2 small{order:2;font-size:10px;letter-spacing:.2em;color:var(--muted)}
.note{font-size:11px;color:var(--muted);margin:8px 0 0;letter-spacing:.1em;line-height:1.8}
.frame{position:relative;border:1px solid var(--hair);padding:18px 16px}
.frame:before{content:"";position:absolute;inset:5px;border:1px solid var(--hair-2);pointer-events:none}
/* fields */
.fl{margin:0 0 18px}
.fl>label,.fl>.lb{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.35em;color:var(--muted);margin:0 0 8px}
.fl>.lb small{letter-spacing:.1em;font-size:10.5px}
.seg{display:inline-flex;border:1px solid var(--hair)}
.seg span{min-width:56px;min-height:32px;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.15em;color:var(--muted)}
.seg span.on{background:var(--gold);color:#14191a}
.row3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.in{display:flex;align-items:center;justify-content:space-between;min-height:46px;padding:0 12px;border:1px solid var(--hair-2);border-bottom-color:var(--hair);font:400 16px var(--serif);color:var(--ink);letter-spacing:.08em}
.in:after{content:"";width:6px;height:6px;border-right:1px solid var(--gold-2);border-bottom:1px solid var(--gold-2);transform:rotate(45deg);margin:-4px 0 0 8px}
.in.tx:after{display:none}
.in.ph{color:var(--muted);font:300 14px var(--sans)}
.hours{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hours span{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:46px;border:1px solid var(--hair-2);font:400 15px/1.2 var(--serif);color:var(--ink)}
.hours span small{font:300 9.5px var(--sans);color:var(--muted);letter-spacing:.04em;margin-top:2px}
.hours span.on{border-color:var(--gold);background:rgba(200,174,125,.07);color:var(--gold)}
.unk{display:flex;align-items:center;justify-content:space-between;margin:6px 0 0;min-height:44px;padding:0 12px;border:1px dashed var(--hair);font-size:13px;color:var(--ink-2);letter-spacing:.12em}
.unk b{font-weight:300;font-size:10.5px;color:var(--gold);border:1px solid var(--hair);padding:0 6px;letter-spacing:.15em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{display:flex;align-items:center;justify-content:center;min-height:44px;border:1px solid var(--hair-2);font:400 15px var(--serif);letter-spacing:.3em;color:var(--muted)}
.opt.on{border-color:var(--gold);color:var(--gold);background:rgba(200,174,125,.06)}
/* checkbox */
.chk{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair-2);align-items:start}
.chk:first-of-type{border-top:1px solid var(--hair-2)}
.box{width:20px;height:20px;border:1px solid var(--gold-2);margin-top:3px;position:relative}
.box.on{background:var(--gold);border-color:var(--gold)}
.box.on:after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border-right:2px solid #14191a;border-bottom:2px solid #14191a;transform:rotate(45deg)}
.chk p{margin:0;font-size:13px;line-height:1.8;color:var(--ink);letter-spacing:.04em}
.chk p small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;margin-top:2px}
.chk p a{color:var(--gold);text-decoration:none;white-space:nowrap}
.req{display:inline-block;font-size:10px;letter-spacing:.15em;padding:0 5px;margin-right:6px;border:1px solid rgba(181,80,60,.6);color:#e0937f;vertical-align:1px;line-height:1.6}
.req.o{border-color:var(--hair);color:var(--muted)}
/* buttons */
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:56px;background:var(--gold);border:0;color:#14191a;font:500 16px/1.3 var(--serif);letter-spacing:.2em;cursor:pointer}
.btn small{font:300 11px var(--sans);letter-spacing:.12em;color:rgba(20,25,26,.75);margin-top:2px}
.btn.dis{opacity:.42}
.btn2{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;background:transparent;border:1px solid var(--gold);color:var(--gold);font:400 15px var(--serif);letter-spacing:.2em;cursor:pointer}
.hint{text-align:center;font-size:11px;color:var(--muted);letter-spacing:.12em;margin:10px 0 0}
.foot{margin:40px 0 0;text-align:center;font-size:10.5px;color:var(--muted);letter-spacing:.2em;line-height:2}

html,body{height:844px;overflow:hidden}
.bgpage{filter:saturate(.8)}
.dim{position:fixed;inset:0;background:rgba(5,8,9,.72)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#0f1719;border-top:1px solid var(--gold);padding:10px 24px 26px}
.sheet:before{content:"";position:absolute;left:0;right:0;top:4px;height:1px;background:var(--hair-2)}
.grab{width:36px;height:3px;background:var(--hair);margin:4px auto 12px}
.close{position:absolute;right:14px;top:10px;width:44px;height:44px;display:grid;place-items:center;color:var(--muted);font-size:20px}
.sheet h3{margin:0;text-align:center;font:400 20px/1.5 var(--serif);letter-spacing:.15em}
.sheet h3 em{font-style:normal;color:var(--gold)}
.sheet .sub{margin:0;text-align:center;font-size:12px;color:var(--ink-2);letter-spacing:.1em}
.lbl{display:flex;justify-content:space-between;margin:18px 0 6px;font-size:11px;letter-spacing:.3em;color:var(--muted)}
.lbl small{letter-spacing:.1em}
.ta{min-height:92px;padding:10px 12px;border:1px solid var(--hair-2);border-bottom-color:var(--hair);font:400 14px/1.8 var(--serif);color:var(--muted)}
.ta b{font-weight:400;color:var(--ink)}
.cnt{text-align:right;font-size:10.5px;color:var(--muted);margin:4px 0 0}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0 0;padding:12px 0;border-top:1px solid var(--hair-2);border-bottom:1px solid var(--hair-2)}
.tg b{display:block;font-weight:400;font-size:14px;color:var(--ink);letter-spacing:.1em}
.tg small{display:block;font-size:11px;color:var(--gold-2);letter-spacing:.04em}
.sw{flex:none;width:44px;height:26px;border-radius:13px;border:1px solid var(--hair);background:transparent;position:relative;padding:0}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--muted)}
.rule{margin:10px 0 0;font-size:11px;color:var(--muted);letter-spacing:.06em;line-height:1.8}
.sheet .btn{margin-top:16px}

</style></head><body class=""><div class="bgpage"><div class="wrap"><header><a class="brand" href="#">相生</a><a class="back" href="#">← 附近的人</a></header>
<div class="fic"><span>虚 构 示 例</span></div>
<p class="eyebrow">搭 子 介 绍</p>
<p class="title">知夏 <span style="font-size:13px;color:var(--muted);letter-spacing:.2em">癸水日主 · INFJ · 3km内</span></p>
<div class="frame" style="margin-top:22px;height:300px"></div></div></div><div class="dim"></div>
<section class="sheet" role="dialog" aria-label="想认识">
<div class="grab"></div><span class="close" aria-label="关闭">×</span>
<h3>想认识 <em>知夏</em></h3>
<p class="sub">对方也点「想认识」，你们才会互相看到更多</p>
<div class="lbl"><span>留 一 句 话</span><small>选填</small></div>
<div class="ta"><b>看到你也打羽毛球，</b>周末要不要一起打两局？</div>
<p class="cnt">20 / 60</p>
<div class="tg"><div><b>附上我的视频介绍</b><small>对方可看一次，你可随时撤回</small></div><button type="button" class="sw" role="switch" aria-checked="false" aria-label="附上我的视频介绍"></button></div>
<p class="rule">不附视频也一样能发；对方点了「想认识」后，视频会按你的资料设置展示。</p>
<button class="btn" type="button">发送「想认识」</button>
</section></body></html>
