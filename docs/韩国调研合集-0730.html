# 善缘 · 韩国算命/사주市场深度调查（0730）

> 出海韩国"第二城"决策依据。数据带来源。一句话：值得做，但打法要改（引擎同源、需深度本地化、祭祀线不上）。

## 1. 市场规模（值得做）
- 市场 **$3.7B / 约4-4.7万亿韩元**（含现金交易实际更高；线上可统计口径 InnoForest 2024 = 1.4万亿韩元）
- **66-70% 国民每年至少算一次命**；20-30代兴趣最高（青少年71.5%）
- 注册命理商户 10,950 家（2024，较2021+21%）；人均终身消费约 $370
- 增速：점신 2024营收+58%、포스텔러 MAU YoY+28%。规模已超韩国 webtoon 出口、碾压本土票房。
- 来源：Seoulz（superstition-economy / saju-industry）、Hankyung、EPNC、Seoul Economic Daily

## 2. 竞品三赛道（AI万字深报告=空位）
| App | 规模 | 模式 | 定价 | AI |
|---|---|---|---|---|
| 점신 Jeomsin | 1700-1900万下载·MAU~110万(第一) | **广告免费** | 结果卡看5-7s广告解锁+真人+부적 | 中 |
| 포스텔러 Forceteller | 860万注册·MAU+28% | **订阅深报告+IP+B2B** | 免费日运+付费年报；已出英文版破100万 | 高 |
| 헬로우봇 HelloBot | MAU~51万 | 角色chatbot | 单次付费chat | 高 |
| 천명 Cheonmyung | 2023营收48亿韩元 | **真人marketplace抽佣** | 5万-30万韩元/次 | 低 |
| 사주GPT/Fated等 | 长尾 | AI一次性 | AI궁합~$3·AI사주~8000韩元 | 极高 |

**缝隙**：头部都是短卡片/日运/真人，**没人把"AI万字深报告"当主打**=善缘核心差异化空位。⚠️포스텔러背靠 Kakao 有弹药，靠差异化不靠烧钱。

## 3. 用户与季节
- 主力 **25-40岁女性**；MZ增长最快。动机=就业/住房焦虑下的**自我安抚**（非真信命）→ 语气要安抚+自我反思，不吓唬。
- 场景：恋爱结婚（궁합）/求职/人生转折。궁합是约会活动=天然社交传播。
- **季节峰：신년운세（新年运势）12月-2月最大（+20%用量）** / 수능高考11月 / 婚季。→ **必须12月前上线吃신년운세第一波**。
- 价格带：线下사주3-5万韩元·情侣궁합5-10万·真人5-30万；**AI사주~8000·AI궁합~$3**（AI把价打到冲动消费带）。

## 4. 本地化清单（上线前必过·否则被看穿是"中国货"）
- [ ] 全韩语原生UI，术语韩式：**십성/신살/용신/일간**（非中译）
- [ ] **궁합按韩式"30年大运同步"逻辑重做**（比中式合婚跨度长、更重）
- [ ] 加 **토정비결**（韩国独有·三柱144卦·신년运势标配，缺了不地道）
- [ ] **작명（起名）**：八字补五行选汉字，明确付费品类，第二波上
- [ ] **만세력**历法/节气边界按韩国惯例校准
- [ ] 接 **KakaoPay / NaverPay / Toss**（不接=流失）；App内购走IAP
- [ ] 语气改**温柔陪伴+重情(jeong)**，去冷技术流
- [ ] 加"娱乐参考"免责（应对2026 AI法）
- [ ] 品牌**去"中国感"**，定位"正统四柱智慧"，别强调"中华"
- 监管：宽松，无牌照无审查。

## 5. 打法
**功能上线顺序**：①사주基础+오늘의운세（免费引流）②궁합（最强付费·重点）③**신년운세+토정비결（抢12-1月峰·首发必须有）**④AI万字深报告（付费主力·差异化）⑤작명（第二波）
**定价**：AI深报告 **9,900-19,900韩元**·AI궁합 4,900-9,900·可选月订阅（对标포스텔러）·真人连线后期（对标천명抽佣）
**渠道**：신년운세季集中弹药 · Naver검색+블로그 · Instagram（女性25-40）· YouTube · KakaoTalk分享（궁합社交裂变）· H5+App双轨 · 借热综找KOL/命理师联名
**差异化牌**：AI万字深报告（空位）+ 正统四柱引擎（"真排盘非编故事"，比纯LLM套壳硬）+ 궁합30年大运深度 + 温柔陪伴语气

## 6. 善缘功能在韩国成立性
| 功能 | 韩国需求 | 结论 |
|---|---|---|
| 四柱八字=사주 | ★★★★★ | 直接复用·改术语 |
| 合婚=궁합 | ★★★★★ 最强付费 | 重点·按韩式重构 |
| AI万字深报告 | ★★★★☆ 头部空位 | 核心武器 |
| 起名=작명 | ★★★★☆ | 第二波 |
| 新年运势+토정비결 | ★★★★★ 最大峰 | 必须首发 |
| 纪念/追思 | ★★☆☆☆ 제사衰退中 | 谨慎·非首发 |
| **代烧/代祭** | ★☆☆☆☆ **华人烧纸逻辑韩国不成立** | **首发不上** |
| 水晶/冥器 | ★★☆☆☆ | 轻周边非主打 |

**第一步**：启动韩语 사주+궁합+AI深报告+신년운세/토정비결 H5（复用善缘引擎+H5基建），术语韩化、接三大钱包、赶12月前上线吃2027신년운세。祭祀线暂缓。

*来源见各段链接；调研 0730。*

# 善缘 · 竞品营销打法手册（0730）

> 命理/占星 App = 成熟打法库，可直接抄。韩国非面对面命理 1.4万亿韩元/年·+25%·80%MZ·女性为主。全球头部 Nebula $50M ARR。
> **底层洞察：MZ 不信"迷信"，把命理当自我理解+情绪安慰+社交谈资。Naver 命理最高频搜索词="좋다(好)"——求安慰不求预言。所有 tone 必须"陪伴/自我关怀"，不是"神秘/权威说教"。**

## 竞品打法速览
| 竞品 | 规模/营收 | 主渠道 | 内容范式 | 裂变 | 变现 | tone |
|---|---|---|---|---|---|---|
| **점신**(韩#1) | 1900万下载·830亿韩元(+58%) | ASO(名塞신년운세)+明星YT | 逐时段运势+"今天穿什么色"+AI看脸 | O2O导真人 | 订阅₩2900/月·前3分钟免费·预付25折 | 唯一还打"准/神秘"(靠老大位) |
| **포스텔러**★最该抄 | 900万·100亿韩元·Kakao投·83%MZ | **IG 12.5万粉/7303帖**+ASO | **每月22篇场景化运势**("情人节脱单吗""创业财运合盘") | 궁합自传播·H5合盘 | 虚拟币单次·15真人·无订阅 | "人人都是主角"·删父权·柔软 |
| **헬로우봇** | 600万·80%MZ | **FB Messenger塔罗bot(3月50万赞)**·学校论坛自传播 | **角色IP**(라마마恋爱塔罗·판밍밍熊猫사주) | 궁합截图分享 | 打赏测·情感深 | 聊天=**降算命羞耻感最有效** |
| **천명** | 10万·25万真实评价 | ASO·口碑 | "命理师版大众点评" | 弱裂变强撮合 | **₩1万一口价·无隐藏加价** | 严选(10取2)+海量评价=透明 |
| **Co-Star**(US) | 3400万·被Midjourney收 | 纯口碑病毒(美18-25女每4人1装) | **毒舌push本身=被疯转** | **Add Friends合盘·$3/好友** | 生长优先 | 极简黑白·去羞耻 |
| **Nebula** | 30M·$50M ARR·+250% | 重付费UA·**TikTok**·UGC网红 | "他在想我吗"关系焦虑钩 | 合盘 | 真人live chat·**绝不给负面预言** | 陪伴(激进付费墙伤口碑=教训) |
| **The Pattern** | 名人引爆(Channing Tatum) | 名人裂变 | **星盘翻大白话心理段·"精准感"=传播燃料** | 名人二传 | — | "准到发毛" |
| **测测**(中) | 4600万·85%女·16-28 | 小红书·社群 | 趣味测试切入 | 测试分享 | **付费问答3元起·1分钟出·每天8000+问** | "精准" |
| **FateTell**(港) | 半年近盈亏平衡 | Day1付费墙 | 掷筊+八字易经AI | — | 付费墙 | **"实用/决策工具"→男女比近1:1破圈男性** |

## 可直接抄 Top 10（抄谁→善缘怎么落地）
1. **App名塞"2026 병오년 신년운세"** ← 韩国全行业。零成本ASO核弹·立刻改标题吃12-1月搜索峰
2. **궁합合盘=社交货币(第一裂变引擎)** ← Co-Star/포스텔러。双人合盘H5→兼容度%+金句→一键分享KakaoTalk/IG/小红书·**share-to-unlock(分享才看完整)** ←**我们已建分享卡+邀请码,正好接这个**
3. **신년운세年度旗舰战役+实体굿즈** ← 全行业。11月底上线免费新年运势专版→深度年运付费·出"我2026关键词是__"IG模板·联名幸运符
4. **每日走心/毒舌推送=独立传播内容** ← Co-Star(每天只推1条造期待)
5. **AI深度报告=大白话精准感aha** ← The Pattern/测测。八字翻大白话·准到想截图·讲"差2小时解读全不同"
6. **角色IP化AI命理军师降羞耻** ← 헬로우봇。给善缘有人设的陪伴系AI角色·聊天≠算命=MZ无压力
7. **每月固定N篇场景化运势内容工厂** ← 포스텔러22篇/月。主题超具体("该不该跳槽·财运合盘")
8. **付费问答+真人飞轮+"正能量质控"** ← 测测/Nebula。3-5元起问·前3分钟免费·头部高收入激励供给·**绝不给负面预言**(Nebula铁律)
9. **名人/KOL引爆+官号实时高情商回应** ← The Pattern/점신
10. **"实用/决策"定位破圈男性+异业联名** ← FateTell/점신×샐러디沙拉。命理=事业财富时机工具·×餐饮/水晶/美妆联名借流量·别学Nebula激进付费墙

## 善缘落地建议
**渠道优先级**：①ASO+신년운세关键词(零成本·立刻)②IG运势内容号(对标포스텔러·每月≥20篇场景化运势卡·默认可分享模板)③KakaoTalk合盘分享裂变(包装成"复채礼物"送亲友)④低成本泛投测钩子(旺季12-2月才集中加TikTok/Reels付费UA)⑤华人:小红书+达人分销+微信裂变
**内容范式**：포스텔러场景化运势 + 헬로우봇角色IP聊天 + The Pattern/测测大白话深度报告，全部默认做成分享模板
**裂变钩子**：**궁합合盘兼容度%分享卡 + share-to-unlock**(韩国MZ验证过的最强社交货币)
**tone铁律**：共情陪伴·不吓唬·不权威说教·删父权词——这是打动MZ + 跟老大점신(还打神秘牌)差异化的护城河

## 一句话结论
**冷启动第一动作：App/官网标题立刻改"2026 병오년 신년운세·사주·타로·궁합"(零成本吃季节搜索)，11月底前上线"免费新年运势 + 궁합合盘分享卡(share-to-unlock)"病毒专版——신년운세季节流量冷启动 + 合盘分享卡零成本裂变 + AI深度年运报告&真人咨询变现。**

⚠️ 融资/营收/IPO数字来自2024-25韩媒外媒报道，签约/财务判断前复核最新；用户量级/pricing/打法结论稳。来源见调查各链接。

# 善缘 · 韩国 MVP PRD（0730·基于竞品分析）

> 依据 `docs/韩国市场调查-0730.md`。功能全部从**竞品缝隙**推导。
> 目标：**12月前上线吃 2027 신년운세第一波**。首发只做 사주+궁합+AI深报告+신년운세；祭祀走本地化另案（见韩国祭祀调查）。

## 竞品缝隙 → 我们做什么
| 竞品 | 他们的强项 | 他们的缺口 | 善缘对策 |
|---|---|---|---|
| 점신 Jeomsin | 广告免费日运·流量最大 | 只有短卡片·无深度·广告打断体验 | 我们免费日运引流，但**用无广告+深报告**拉开档次 |
| 포스텔러 Forceteller | 订阅深报告+IP·有英文版 | 报告仍偏模板·궁합浅 | **AI万字深报告 + 궁합30年大运深度**超越 |
| 천명 Cheonmyung | 真人连线 | 贵(5-30万韩元)·慢·非即时 | AI 即时+便宜(9,900-19,900韩元)先满足大众 |
| 헬로우봇 HelloBot | 角色chat有趣 | 娱乐化·不深 | 我们主打"真排盘非编故事"的专业感 |
| **共同缺口** | — | **没人主打"AI万字深度报告"** | ← **善缘核心差异化武器** |

## MVP 功能清单（P0 首发·按优先级）
1. **사주 기본운세 + 오늘의운세（免费引流）** — table stakes，人人有，我们无广告体验更好
2. **AI 심층 리포트（AI万字深报告）★核心差异化** — 事业/财运/애정/健康/流年·麦玲玲风格(给具体时间点+数字+先难后解)·**温柔陪伴语气(重情 jeong)非冷技术流**·付费主力
3. **궁합（合婚）★最强付费+双人裂变** — 按**韩式30年大运同步**逻辑重做·必须两人各测=天然 K>1 裂变
4. **신년운세 + 토정비결★季节峰必备** — 12-2月最大流量·토정비결是韩国独有标配(缺了不地道)
5. **오늘의운세 push 订阅** — 每日推送养日活+订阅现金流(对标포스텔러)

## P1（第二波）

# 善缘 · 韩国「祭祀代行 + 线上追思」市场调查（0730）

> CEO 顶回"韩国也能做祭祀"——调查证实：**能做，但不是烧纸那套。** 中国"烧纸钱/冥器/代烧直播"在韩国=零。真机会=**벌초/성묘 대행(代客清坟扫墓)+视频证据 + 온라인 추모관 + 遗照AI复原**。

## 一句话结论
第一步只做一个：**추석(阳历9末-10初)前的 성묘/벌초 대행，拍全程照片/无人机视频给海外/远方子女看**。全年现金最集中、痛点最尖、竞品最烂的入口。사주主线负责获客+信任，祭祀代行做旺季变现+情感留存。**代拜、烧纸、冥币一律不做。**

## 1. 文化在衰退+简化=机会（不是阻力）
- 차례参与率 2014年71% → 近年~40%；2024中秋仅**41%**打算行제사
- 성균관调查：**55.9%成年人今后不打算再行제사**；放弃第一理由="应简化/改家庭聚会"(41.2%)=需求转向外包
- **성균관2022官方发"차례상简化案"**(煎饼不用炸/9道够/基础6样)——**儒教权威亲自给"简化外包"背书**，文化敏感天花板被抬高
- 负担主力=**女性·40代**=清晰客群：被祭祀压垮、想外包又怕被说不孝的中年女性

## 2. 现成竞品与价格（真实市场已存在）
**A. 벌초/성묘 대행**（成熟但分散土气）：산림조합10-15万원/기 · **조상님복덕방/이발소(最像样竞品)148,500원/기·卫星图测面积+作业前后多角度拍照给远方家属+透明报价** ← 照片证据模式已被验证。价格带 **10-20万원/기**，峰值100%集中추석前2-4周。
**B. 제사 대행**：主要是祭品/布置代做(상차림)~21万원/桌。⚠️**"代替本人行礼/磕头"几乎无商业化，文化红线，不碰。**
**C. 온라인 추모관**：政府 **e하늘免费**(3D纪念馆/遗照/视频/共享)=公共品，商业馆必须明显更好才有人付；민영+**宠物追思是最活跃付费细分**。
**D. AI追思/遗照复原**：딥브레인 Re;Memory 建馆1.2-2.4万美元+每次对话1200美元(CES奖)——**韩国人对"AI+故人"付费天花板极高**；遗照AI复原=低门槛高情感甜点。

## 3. 大盘（很大且在涨）
- 상조(丧葬互助)加入者 2015年404万→**2024年892万**；预收款→**9.45万亿韩元(~500亿RMB)**。为身后事/追思付钱=国民级消费，善缘从"追思+代行"侧翼切入不碰重资产殡葬。
- **재외동포约700万**：祭祖做不了/回不去是真痛点，但⚠️**无量化数据，是假设，上线小投放验证，别当已证实**。
- 超高龄+1人家庭+双职工=结构性长期推动祭祀外包。

## 4. 定价参考
| 产品 | 市场现价 | 善缘定位 |
|---|---|---|
| 벌초/성묘 대행+拍摄 | 10-20万원/기 | **12.9-15.9万원·主打4K+航拍给海外子女** |
| 제사祭品/布置代办 | ~21万원/桌 | 旺季套餐·谨慎不碰代拜 |
| 온라인 추모관 | 免费(政府)~订阅 | 难单卖·捆绑代行做增值 |
| 遗照AI复原 | 几万원级 | **引流甜点** |
| AI故人对话 | 千万원级 | 远期不碰 |

## 5. 该做什么（优先级）
1. **【第一步主打】추석/설날 성묘·벌초 대행 + 视频证据包**：竞品只发手机照片→善缘做**无人机航拍+前后对比+短视频+卫星图透明报价**，卖给回不了乡的首尔/海外子女。추석前3周=现金机器，설날/한식第二波。
2. **【留存】온라인 추모관**（与代行捆绑不单卖）：每次代行自动生成数字纪念馆，一次交易→年度复购+情感锁定，要明显强过免费e하늘。
3. **【引流甜点】遗照AI复原/追思短视频**：低价高情感获客钩，衔接善缘AI能力（本机ComfyUI）。
4. **【谨慎】제사祭品/布置代办**：只做置办+布置，**绝不代拜**。

## 与사주主线配合
사주获客+信任(高频低敏感易传播) → 추석前代行收钱(高客单) → 追思馆留存。**同一画像：关心祖先/家庭/运势的中年女性。**

## 风险（诚实）
1. **代拜红线**：接受代割草/代置办，抵触"外人替本人磕头"。碰=翻车。
2. **宗教分层**：~30%基督/天主教不祭祀但做追모→追思馆/遗照对他们成立、祭祀代行不成立，别套错话术。
3. **中国血统敏感**：善缘露"中国祭祀出海"标签有反噬→**彻底本地化品牌/韩语韩国面孔/不提任何中式元素**。
4. **政府免费替代**（e하늘/地方벌초补贴）压低低端付费→别拼价格，拼体验+情感增值。
5. **旺季极端集中**：全年现金压추석前一个月→产能/人力调度是运营命门。
