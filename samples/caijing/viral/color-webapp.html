// ---------- 取色 & 分类 ----------
function medianColor(data,w,pts,r){const R=[],G=[],B=[];for(const[px,py]of pts){for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const x=Math.round(px)+dx,y=Math.round(py)+dy;const i=(y*w+x)*4;if(i<0||i>=data.length)continue;R.push(data[i]);G.push(data[i+1]);B.push(data[i+2]);}}const med=a=>{a.sort((p,q)=>p-q);return a[Math.floor(a.length/2)]||0};return[med(R),med(G),med(B)];}
function grayWorld(data){let sr=0,sg=0,sb=0,n=data.length/4;for(let i=0;i<data.length;i+=4){sr+=data[i];sg+=data[i+1];sb+=data[i+2];}sr/=n;sg/=n;sb/=n;const g=(sr+sg+sb)/3,kr=g/sr,kg=g/sg,kb=g/sb;const out=new Uint8ClampedArray(data.length);for(let i=0;i<data.length;i+=4){out[i]=Math.min(255,data[i]*kr);out[i+1]=Math.min(255,data[i+1]*kg);out[i+2]=Math.min(255,data[i+2]*kb);out[i+3]=255;}return out;}
// 眼白白平衡:用巩膜(眼白·已知中性)当基准校色,治暖光偏色
function scleraWB(data,w,h,lm){
  const eyes=[[33,133,159,145,157,154,160,144],[362,263,386,374,384,381,387,373]];
  let sr=0,sg=0,sb=0,cnt=0;
  for(const idxs of eyes){
    const xs=idxs.map(i=>lm[i][0]),ys=idxs.map(i=>lm[i][1]);
    const x0=Math.floor(Math.min(...xs)),x1=Math.ceil(Math.max(...xs)),y0=Math.floor(Math.min(...ys)),y1=Math.ceil(Math.max(...ys));
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=(y*w+x)*4;if(i<0||i>=data.length)continue;const r=data[i],g=data[i+1],b=data[i+2];const mx=Math.max(r,g,b),mn=Math.min(r,g,b);const v=mx/255,s=mx?(mx-mn)/mx:0;if(v>0.5&&s<0.20){sr+=r;sg+=g;sb+=b;cnt++;}}
  }
  if(cnt<10) return grayWorld(data);
  sr/=cnt;sg/=cnt;sb/=cnt;const g=(sr+sg+sb)/3,kr=g/sr,kg=g/sg,kb=g/sb;
  const out=new Uint8ClampedArray(data.length);
  for(let i=0;i<data.length;i+=4){out[i]=Math.min(255,data[i]*kr);out[i+1]=Math.min(255,data[i+1]*kg);out[i+2]=Math.min(255,data[i+2]*kb);out[i+3]=255;}
  return out;
}
function rgb2hsv([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;}return[h*60,mx?d/mx:0,mx];}
function hex([r,g,b]){return"#"+[r,g,b].map(v=>Math.round(v).toString(16).padStart(2,"0")).join("").toUpperCase();}
function classify(skin,hair){const warmth=skin[0]-skin[2];const[,,sv]=rgb2hsv(skin);const[,,hv]=rgb2hsv(hair);const contrast=sv-hv;const warm=warmth>6,light=sv>0.62,hi=contrast>0.42;let key;if(!warm&&light&&!hi)key="cool_summer";else if(!warm)key="cool_winter";else if(warm&&light)key="warm_spring";else key="warm_autumn";return{key,warmth,sv,contrast,warm,light};}

function loadImg(f){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(f);});}

// 多类别分割 → {cutout人像抠图, cat类别掩码, 裁剪框} (0背景/1头发/2身体皮肤/3脸/4衣服/5其他)
async function makeSeg(img,cv,w,h,lm){
  if(!segmenter)return null;
  try{
    const seg=segmenter.segment(cv);
    const cat=new Uint8Array(seg.categoryMask.getAsUint8Array());
    try{seg.categoryMask.close();}catch(e){}
    const xs=lm.map(p=>p[0]),ys=lm.map(p=>p[1]);
    const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
    const fw=x1-x0,fh=y1-y0;
    const L=Math.max(0,Math.round(x0-fw*0.7)),T=Math.max(0,Math.round(y0-fh*0.5)),Rr=Math.min(w,Math.round(x1+fw*0.7)),Bt=Math.min(h,Math.round(y1+fh*1.35));
    const cw=Rr-L,ch=Bt-T;
    const cut=document.createElement("canvas");cut.width=cw;cut.height=ch;
    const cx=cut.getContext("2d",{willReadFrequently:true});
    cx.drawImage(img,L*img.width/w,T*img.height/h,cw*img.width/w,ch*img.height/h,0,0,cw,ch);
    const id=cx.getImageData(0,0,cw,ch);
    for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){if(cat[(T+y)*w+(L+x)]===0)id.data[(y*cw+x)*4+3]=0;}
    cx.putImageData(id,0,0);
    return {cutout:cut,cat,L,T,cw,ch,w,h,img};
  }catch(e){return null;}
}
// 只给"衣服"(类别4)换色,保留明暗褶皱 → 像真穿这个颜色
function recolorGarment(seg,hex){
  const {cat,L,T,cw,ch,w,h,img}=seg;
  const cv=document.createElement("canvas");cv.width=cw;cv.height=ch;
  const ctx=cv.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(img,L*img.width/w,T*img.height/h,cw*img.width/w,ch*img.height/h,0,0,cw,ch);
  const id=ctx.getImageData(0,0,cw,ch),d=id.data;
  const tr=parseInt(hex.slice(1,3),16),tg=parseInt(hex.slice(3,5),16),tb=parseInt(hex.slice(5,7),16);let n=0;
  for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){if(cat[(T+y)*w+(L+x)]===4){const i=(y*cw+x)*4;const lum=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)/255;const f=0.4+lum*0.8;d[i]=Math.min(255,tr*f);d[i+1]=Math.min(255,tg*f);d[i+2]=Math.min(255,tb*f);n++;}}
  ctx.putImageData(id,0,0);
  return {cv,ok:n>cw*ch*0.02};
}
function onColor(cutout,color){const W=150,H=Math.round(cutout.height*W/cutout.width);const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");x.fillStyle=color;x.fillRect(0,0,W,H);x.drawImage(cutout,0,0,W,H);return c;}

function annotate(img,lm,w,h){const cv=document.createElement("canvas");const xs=lm.map(p=>p[0]),ys=lm.map(p=>p[1]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);const fw=x1-x0,fh=y1-y0;const L=Math.max(0,x0-fw*0.4),T=Math.max(0,y0-fh*0.5),Rr=Math.min(w,x1+fw*0.4),Bt=Math.min(h,y1+fh*0.35);const cw=Rr-L,ch=Bt-T;cv.width=cw;cv.height=ch;const ctx=cv.getContext("2d");ctx.drawImage(img,L*img.width/w,T*img.height/h,cw*img.width/w,ch*img.height/h,0,0,cw,ch);const oval=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];ctx.strokeStyle="rgba(255,255,255,.9)";ctx.lineWidth=2;ctx.setLineDash([7,5]);ctx.beginPath();oval.forEach((i,k)=>{const x=lm[i][0]-L,y=lm[i][1]-T;k?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.closePath();ctx.stroke();ctx.setLineDash([]);ctx.fillStyle="#fff";[33,133,362,263,1,168,61,291,0,17,50,280].forEach(i=>{const x=lm[i][0]-L,y=lm[i][1]-T;ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill();});return cv;}

    <div class="subh" style="margin-top:14px">🌸 腮红 <small style="font-weight:500;color:#b0a080">· 按气色匹配</small></div>
    ${blushPick.html}
    <div class="demo">＊★ 为按你实测颜色算出的最匹配色号;链接接淘宝联盟,点击直接买</div></div>
  <div class="sum">${S.sum}</div>

    <div class="s">让她也测测是什么季型 · 彩镜 · 拍脸30秒 · 想测几次测几次</div>

  $("rwrap").innerHTML=html;

  const annCanvas=annotate(img,lm,w,h);$("annwrap").appendChild(annCanvas);
  // 上身换色
  if(swapImgs&&Object.keys(swapImgs).length){
    const mk=(box,arr,ok)=>{arr.forEach(([n,c])=>{const d=document.createElement("div");d.className="cc";const im=document.createElement("img");im.src=swapImgs[c]||"";d.appendChild(im);const t=document.createElement("div");t.className="ccn";t.style.borderColor=c;t.textContent=(ok?"✓ ":"✕ ")+n;d.appendChild(t);$(box).appendChild(d);});};
    mk("swapok",S.swap,true);mk("swapno",S.swapA,false);

  document.querySelectorAll(".prod").forEach(a=>a.addEventListener("click",()=>track('click_buy',{tier:a.dataset.tier,season:cls.key})));
  let faceCv=cutout;
  if(!faceCv){const xs=lm.map(p=>p[0]),ys=lm.map(p=>p[1]);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);const fw=x1-x0,fh=y1-y0;const L=Math.max(0,x0-fw*0.3),T=Math.max(0,y0-fh*0.4),Rr=Math.min(w,x1+fw*0.3),Bt=Math.min(h,y1+fh*0.55);const cw=Rr-L,ch=Bt-T;faceCv=document.createElement("canvas");faceCv.width=cw;faceCv.height=ch;faceCv.getContext("2d").drawImage(img,L*img.width/w,T*img.height/h,cw*img.width/w,ch*img.height/h,0,0,cw,ch);}

  // 二维码曝光埋点:分享卡(含带 ?ref 的二维码)成功生成即算 QR 曝光
  if(SHARE||SHARE2){ try{track('qr_shown',{season:cls.key});}catch(_){} }
}

// 画四季色彩扇形:脸放在该季型色扇背景上(小红书病毒格式)
function drawSunburst(faceCv,colors,W,H){
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const ctx=cv.getContext("2d");
  const cx=W/2,cy=H*0.5,R=Math.hypot(W,H),N=Math.max(18,colors.length*2);
  for(let i=0;i<N;i++){const p=colors[i%colors.length];ctx.fillStyle=Array.isArray(p)?p[1]:p;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,(i/N)*6.2832-1.5708,((i+1)/N)*6.2832-1.5708);ctx.closePath();ctx.fill();}
  if(faceCv&&faceCv.width>0&&faceCv.height>0){const fw=W*0.6,fh=faceCv.height*fw/faceCv.width;try{ctx.drawImage(faceCv,cx-fw/2,cy-fh*0.44,fw,fh);}catch(e){}}
  return cv;
}

      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">${S.tags.map(t=>`<span style="border:2px solid #a5502f55;color:#a5502f;border-radius:24px;padding:6px 18px;font-size:21px;font-weight:600">${t}</span>`).join("")}</div>
    </div>
    <div style="display:flex;gap:14px;margin-top:18px">${[["肤色",cols.skin],["发色",cols.hair],["瞳色",cols.eye],["唇色",cols.lipC]].map(([n,c])=>`<div style="flex:1;text-align:center;background:#fff;border:1.5px solid #eee0c4;border-radius:14px;padding:14px 4px"><div style="width:64px;height:64px;border-radius:14px;margin:0 auto;border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.15);background:${hex(c)}"></div><div style="font-size:21px;margin-top:9px;color:#5a3a1f;font-weight:600">${n}</div><div style="font-size:15px;color:#aa9">${hex(c)}</div></div>`).join("")}</div>

// 图2:综合报告①-⑥(含金量·磁排海报)
function buildReportCard(cls,cols,img,S,faceCv,annCanvas,swapImgs){

  const bar=(lab,rt,v)=>`<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-size:19px;color:#6a4f38;margin-bottom:5px"><span>${lab}</span><span style="color:#a5502f;font-weight:700">${rt}</span></div><div style="height:12px;border-radius:7px;background:#eaddc6;position:relative"><i style="position:absolute;top:-4px;left:${v}%;width:20px;height:20px;border-radius:50%;background:#a5502f"></i></div></div>`;

  const recolor=(arr,ok)=>arr.map(([n,c])=>{const src=swapImgs&&swapImgs[c];const im=src?`<img src="${src}" style="width:100%;border-radius:8px;display:block">`:`<div style="width:100%;height:150px;background:${c};border-radius:8px"></div>`;return `<div style="flex:1;text-align:center">${im}<div style="font-size:17px;margin-top:6px;color:#5a3a1f;font-weight:600;border-top:3px solid ${c};padding-top:4px;display:inline-block">${ok?'✓':'✕'} ${n}</div></div>`;}).join("");
  const mk=(n,arr)=>`<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px"><div style="width:50px;font-size:18px;color:#6a4f38;font-weight:600">${n}</div>${arr.map(([nm,c])=>`<div style="display:flex;align-items:center;gap:5px"><div style="width:28px;height:28px;border-radius:50%;background:${c};border:2px solid #fff"></div><span style="font-size:16px;color:#7a6a52">${nm}</span></div>`).join("")}</div>`;
  const el=document.createElement("div");
  el.style.cssText="position:fixed;left:-9999px;top:0;width:1080px;box-sizing:border-box;padding:44px;font-family:'PingFang SC',sans-serif;background:#f3ece0;color:#3a332a";
  el.innerHTML=`
    <div style="text-align:center;margin-bottom:8px"><div style="font-size:46px;font-weight:800;letter-spacing:4px;color:#3a2f26">个人色彩分析</div><div style="font-family:Georgia,serif;font-style:italic;color:#a08a6a;font-size:20px;letter-spacing:3px">PERSONAL COLOR ANALYSIS</div></div>
    <div style="display:flex;gap:20px;background:#fffdf7;border-radius:16px;padding:22px;margin-top:16px">
      <img src="${img.src}" style="width:250px;height:320px;object-fit:cover;border-radius:14px">
      <div style="flex:1">
        <div style="font-size:21px;color:#8a4b28;font-weight:700">① 最适合你的色彩季型</div>
        <div style="font-size:52px;font-weight:800;color:#8a4b28;margin:6px 0">${S.zh} <span style="font-family:Georgia,serif;font-style:italic;font-size:30px;color:#a5502f">${S.en}</span></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">${S.tags.map(t=>`<span style="border:2px solid #a5502f55;color:#a5502f;border-radius:20px;padding:5px 15px;font-size:17px;font-weight:600">${t}</span>`).join("")}</div>
        ${bar('冷 ← 冷暖 → 暖',cls.warm?'偏暖':'偏冷',warmV)}${bar('深 ← 明度 → 浅',cls.light?'偏浅':'中低',Math.min(92,lightV))}${bar('柔 ← 纯度 → 艳','中',pureV)}${bar('低 ← 对比 → 高',cls.contrast>0.42?'高':'中',contV)}
      </div>
    </div>
    <div style="background:#fffdf7;border-radius:16px;padding:22px;margin-top:14px">
      <div style="font-size:21px;color:#8a4b28;font-weight:700;margin-bottom:14px">② 肤发瞳 + 五官分析</div>

        <img src="${annCanvas.toDataURL('image/jpeg',0.9)}" style="width:210px;border-radius:12px">

      ${qr?`<img src="${qr}" style="width:100px;height:100px;border:2px solid #a5502f44;border-radius:10px">`:``}
    </div>`;
  document.body.appendChild(el);return el;
}

      await new Promise(r=>setTimeout(r,700));

  }catch(e){alert("保存失败,可长按卡片截图保存~");}

});
