<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Runae">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fcfb0"/>
      <stop offset="1" stop-color="#4aa98c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3c877"/>
      <stop offset="1" stop-color="#c9a84c"/>
    </linearGradient>
  </defs>

  <!-- rounded square jade base -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- subtle inner ring / rune halo -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="10"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#c9a84c" stroke-opacity="0.30" stroke-width="3"/>

  <!-- gold "缘" (yuan / affinity, fate) -->
  <text x="256" y="256" fill="url(#gold)"
        font-family="'Songti SC','STSong','Noto Serif SC','SimSun',serif"
        font-size="300" font-weight="700"
        text-anchor="middle" dominant-baseline="central">缘</text>
</svg>
