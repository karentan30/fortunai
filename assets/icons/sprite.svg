  <path d="M12 9V6M9.2 6h5.6"/>
  <circle cx="9.6" cy="14" r="1.1" fill="currentColor" stroke="none"/>
  <circle cx="14.4" cy="14" r="1.1" fill="currentColor" stroke="none"/>
  <path d="M3.3 12.8v2.4M20.7 12.8v2.4"/>
</symbol>

