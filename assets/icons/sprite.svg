<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<!--
  runae · UI 描线图标集（emoji → SVG 替换方案，2026-09-09）
  来源：scratchpad/shared/assets/README-icons.md（Karen 待批方案）
  每个 <symbol> 只放一份 path 数据，页面里用
    <svg class="rn-ic" viewBox="0 0 24 24" width="1em" height="1em" style="stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round">
      <use href="/assets/icons/sprite.svg#ic-xxx"></use>
    </svg>
  引用，不在每个页面重复写 path。stroke 用 currentColor，跟随文字颜色/主题。
-->
<symbol id="ic-robot" viewBox="0 0 24 24">
