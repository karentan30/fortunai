<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --jade:#5bbfa0;--jade-deep:#3d9e82;--jade-light:#8dd9bf;
  --gold:#c9a84c;--gold-light:#e8d08a;
  --bg:#faf8f5;--card:#ffffff;--ink:#1a1a18;--ink-mid:#4a4a46;--ink-light:#8a8a84;
  --radius:12px;--shadow:0 2px 12px rgba(0,0,0,0.06);}
/* peace clasp */
.peace-clasp{position:relative;border-radius:50%;width:100px;height:100px;margin:10px auto 14px;
  background:radial-gradient(circle at 34% 27%,rgba(255,255,255,0.92) 0%,rgba(255,255,255,0.35) 7%,transparent 18%),
    radial-gradient(circle at 70% 68%,var(--jade-deep) 0%,transparent 38%),
    radial-gradient(circle at 20% 72%,rgba(0,180,80,0.25) 0%,transparent 35%),
    radial-gradient(ellipse at 42% 38%,var(--jade-light) 0%,var(--jade) 22%,var(--jade) 52%,var(--jade-deep) 100%);
  box-shadow:0 6px 24px rgba(91,191,160,0.3)}
.peace-clasp::after{content:'';position:absolute;border-radius:50%;background:var(--bg);
  width:28px;height:28px;top:50%;left:50%;transform:translate(-50%,-50%);
  box-shadow:inset 0 2px 6px rgba(0,0,0,0.08)}
html,body{background:var(--bg);font-family:'Noto Serif SC',serif;color:var(--ink);-webkit-font-smoothing:antialiased}
body{max-width:420px;margin:0 auto;min-height:100vh;padding:0 16px 40px}
.header{text-align:center;padding:36px 0 8px}
.logo{font-family:'Cormorant Garamond',serif;font-size:15px;letter-spacing:0.3em;color:var(--jade);font-weight:400}
.tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:var(--ink-mid);margin:6px 0 2px;font-weight:300}
.tagline-sub{font-size:11px;color:var(--ink-light);letter-spacing:0.2em}
.jade-line{width:48px;height:2px;background:var(--jade);margin:12px auto;border-radius:1px}
.proof{display:flex;justify-content:center;gap:24px;padding:8px 0 16px}
.proof-item{text-align:center}
.proof-num{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--jade)}
.proof-label{font-size:9px;color:var(--ink-light);letter-spacing:0.08em;margin-top:2px}
.features{padding:0 0 8px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fcard{background:var(--card);border:1px solid rgba(91,191,160,0.12);border-radius:var(--radius);padding:18px 12px 14px;text-align:center;cursor:pointer;text-decoration:none;transition:all 0.2s;box-shadow:var(--shadow)}
.fcard:hover{border-color:rgba(91,191,160,0.35);transform:translateY(-2px);box-shadow:0 6px 20px rgba(91,191,160,0.1)}
.ficon{font-size:28px;margin-bottom:6px}
.fname{font-size:14px;color:var(--ink);letter-spacing:0.08em;margin-bottom:2px}
.fsub{font-size:10px;color:var(--ink-light);letter-spacing:0.04em}
.fbadge{display:inline-block;font-size:8px;padding:2px 8px;border-radius:8px;margin-top:4px;letter-spacing:0.04em}
.fbadge.free{background:rgba(91,191,160,0.1);color:var(--jade-deep)}
.fbadge.paid{background:rgba(201,168,76,0.1);color:#8a7a40}
.mbanner{background:linear-gradient(135deg,var(--jade-deep),var(--jade));border-radius:var(--radius);padding:18px 16px;margin:6px 0 0;text-decoration:none;display:block;transition:all 0.2s;box-shadow:0 2px 16px rgba(91,191,160,0.2)}
.mbanner:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(91,191,160,0.25)}
.mbtop{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mbcrown{font-size:24px}
.mbinfo{flex:1}
.mbtitle{font-size:14px;color:#fff;letter-spacing:0.1em;margin-bottom:2px}
.mbsub{font-size:10px;color:rgba(255,255,255,0.7);letter-spacing:0.06em}
.mbprice{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--gold-light)}
.mbperks{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.mbperk{font-size:9px;padding:3px 8px;background:rgba(255,255,255,0.12);border-radius:10px;color:rgba(255,255,255,0.85);letter-spacing:0.04em}
.mbbtn{display:block;width:100%;padding:10px 0;text-align:center;background:rgba(255,255,255,0.15);border-radius:6px;color:#fff;font-family:'Noto Serif SC',serif;font-size:13px;letter-spacing:0.14em}
.bnav{display:flex;justify-content:center;gap:16px;padding:24px 0 8px;flex-wrap:wrap}
.bnav a{font-size:11px;color:var(--ink-light);text-decoration:none;letter-spacing:0.06em}
.bnav a:hover{color:var(--jade)}
.bfooter{text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11px;color:var(--ink-light);padding:4px 0 2px;letter-spacing:0.1em}
</style>
</head>
